name: Quran Hifz 6h candidate

on:
  push:
    branches:
      - work/quran-hifz-6h-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fetch only pinned KFQC Mushaf inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/quran-svg
          mkdir -p third_party/quran-svg
          git -C third_party/quran-svg init
          git -C third_party/quran-svg remote add origin https://github.com/quranpedia/quran-svg.git
          git -C third_party/quran-svg config core.sparseCheckout true
          printf 'mushafs/hafs/kfqc/svg-br/\nmushafs/hafs/kfqc/json/\n' > third_party/quran-svg/.git/info/sparse-checkout
          git -C third_party/quran-svg fetch --depth=1 origin 1b427fab77aae1403fe7e1f0b8c794a5384d5605
          git -C third_party/quran-svg checkout --detach FETCH_HEAD
          test "$(git -C third_party/quran-svg rev-parse HEAD)" = "1b427fab77aae1403fe7e1f0b8c794a5384d5605"

      - name: Audit Mushaf, geometry and Tafsir with Python
        run: python3 scripts/audit_quran_hifz_inputs.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle :hifz-core:test --stacktrace

      - name: Verify canonical 604-page Mushaf and geometry
        run: gradle :hifz-app:verifyHifzMushafSource --stacktrace

      - name: Compile smoke APK
        run: gradle :hifz-app:assembleDebug -PhifzSmokeMushaf=true --stacktrace

      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-hifz-smoke-apk
          path: hifz-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
