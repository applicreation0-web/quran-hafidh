name: Quran Hifz 6h candidate

on:
  push:
    branches:
      - work/quran-hifz-6h-build
  workflow_dispatch:

concurrency:
  group: quran-hifz-6h-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fetch only pinned KFQC Mushaf inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/quran-svg
          mkdir -p third_party/quran-svg
          git -C third_party/quran-svg init
          git -C third_party/quran-svg remote add origin https://github.com/quranpedia/quran-svg.git
          git -C third_party/quran-svg sparse-checkout init --cone
          git -C third_party/quran-svg sparse-checkout set mushafs/hafs/kfqc/svg-br mushafs/hafs/kfqc/json
          git -C third_party/quran-svg fetch --depth=1 --filter=blob:none origin 1b427fab77aae1403fe7e1f0b8c794a5384d5605
          git -C third_party/quran-svg checkout --detach FETCH_HEAD
          test "$(git -C third_party/quran-svg rev-parse HEAD)" = "1b427fab77aae1403fe7e1f0b8c794a5384d5605"

      - name: Audit Mushaf, geometry and Tafsir with Python
        run: python3 scripts/audit_quran_hifz_inputs.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle :hifz-core:test --stacktrace

      - name: Verify canonical 604-page Mushaf and geometry
        run: gradle :hifz-app:verifyHifzMushafSource --stacktrace

      - name: Compile smoke APK
        run: gradle :hifz-app:assembleDebug -PhifzSmokeMushaf=true --stacktrace

      - name: Compile full 604-page candidate APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hifz-app/build/generated/hifzAssets hifz-app/build/outputs/apk/debug
          gradle :hifz-app:prepareHifzAssets --rerun-tasks --stacktrace
          gradle :hifz-app:assembleDebug --stacktrace
          cp hifz-app/build/outputs/apk/debug/hifz-app-debug.apk Quran-Hifz-0.10.10-candidate.apk
          sha256sum Quran-Hifz-0.10.10-candidate.apk | tee Quran-Hifz-0.10.10-candidate.sha256

      - name: Upload full candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-hifz-0.10.10-candidate
          path: |
            Quran-Hifz-0.10.10-candidate.apk
            Quran-Hifz-0.10.10-candidate.sha256
          if-no-files-found: error
