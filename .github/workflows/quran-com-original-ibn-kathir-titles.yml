name: Quran.com Ibn Kathir English h2 headings export NO APK
on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
    paths:
      - scripts/export_quran_com_ibn_kathir_titles.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-quran-com-headings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original Ibn Kathir h2 headings from Quran.com API 169
        run: |
          python3 scripts/export_quran_com_ibn_kathir_titles.py --output "$RUNNER_TEMP/quran-com-ibn-kathir-titles"
      - uses: actions/upload-artifact@v4
        with:
          name: Quran-com-original-Ibn-Kathir-headings-${{ github.sha }}
          path: ${{ runner.temp }}/quran-com-ibn-kathir-titles/
          if-no-files-found: error
          retention-days: 1
