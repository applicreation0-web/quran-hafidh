name: Haafidh 1.17.10 independent audit (NO APK)
on:
  push:
    branches: [audit/haafidh-11710-independent-20261102]
    # Full production campaign; test-only fixture corrections have a focused workflow.
    paths:
      - 'hifz-app/src/main/**'
      - 'hifz-app/src/private114/**'
      - 'hifz-core/src/**'
      - 'hifz-app/build.gradle.kts'
      - 'app/src/main/assets/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-11710-independent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalogue-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Refuse release input and verify frozen official-base engines
        run: |
          test -z "${HIFZ_PRIVATE_RELEASE_UPGRADE:-}"
          test -z "${HIFZ_KEYSTORE_PATH:-}"
          python scripts/verify_11710_invariants.py
      - name: Private candidate delivery guard — synthetic tests only, NO APK
        run: |
          python3 -m py_compile scripts/build_1179_private_offline.py
          python3 scripts/test_build_1179_private_offline.py
          python3 scripts/build_1179_private_offline.py --help >/dev/null
      - name: Authentic 604 QCF pages, full admitted catalogue and both offline Tafsirs
        run: |
          python -m pip install brotli
          bash scripts/fetch_mushaf_pages.sh
          python scripts/materialize_mutash_catalogue.py --check
          python scripts/verify_mutash_catalogue.py
          python scripts/verify_mutash_pivot_review_v2.py
      - name: JVM behavioral, source, long horizon and restoration contracts
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          gradle --no-daemon --continue :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest
      - name: Export public classes for local private-backup replay
        run: gradle --no-daemon -I scripts/export_jvm_audit_runtime.init.gradle :hifz-app:exportJvmAuditRuntime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11710-finalisation-JVM-NO-APK
          path: |
            hifz-app/build/jvm-audit-runtime/
            hifz-core/build/test-results/
            hifz-app/build/test-results/
            hifz-app/build/reports/tests/
          retention-days: 14
  android:
    needs: catalogue-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox
            size: 1404x1872
            density: 226
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual masks, recovery, general screens and Android reboot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            bash scripts/run_1179_finalisation_android_audit.sh ${{ matrix.surface }} ${{ matrix.size }} ${{ matrix.density }} quick
            cp -a hifz-app/build/outputs/androidTest-results hifz-app/build/independent-quick-results
            bash scripts/run_11710_independent_surfaces.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11710-finalisation-${{ matrix.surface }}-NO-APK
          path: |
            hifz-app/build/independent-surfaces/
            hifz-app/build/independent-quick-results/
            hifz-app/build/atlas-comparison-audit/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14

  preserved-regression:
    needs: catalogue-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preserved schema, finals, migration and recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_1179_preserved_android_audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11710-isolated-preserved-NO-APK
          path: |
            hifz-app/build/boox-audit/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14

  independent-endurance:
    needs: catalogue-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        surface: [phone, boox]
        phase: [navigation, tafsir]
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox
            size: 1404x1872
            density: 226
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual masks, recovery, general screens and Android reboot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_1179_endurance_audit.sh ${{ matrix.surface }} ${{ matrix.size }} ${{ matrix.density }} ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11710-independent-endurance-${{ matrix.surface }}-${{ matrix.phase }}-NO-APK
          path: hifz-app/build/endurance-*/
          retention-days: 14

