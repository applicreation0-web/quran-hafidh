name: Haafidh 1.17.24 — fragility flow qualification
on:
  push:
    branches:
      - work/haafidh-11724-fragility-flow
  pull_request:
    branches:
      - work/haafidh-11723-active-review-fragilities
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify no private corpus or signing material
        id: confidentiality
        run: |
          set -euo pipefail
          test ! -d hifz-app/src/private114/assets
          test -z "${HIFZ_KEYSTORE_PATH:-}"
          test -z "${HIFZ_KEYSTORE_BASE64:-}"
      - name: Unit tests and existing source contracts
        run: gradle --no-daemon --init-script scripts/no_apk.init.gradle :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
      - name: Compile private release sources without packaging
        if: ${{ !cancelled() && steps.confidentiality.outcome == 'success' }}
        env:
          AYAH_THEMES_PRIVATE_114: '1'
          HIFZ_PRIVATE_RELEASE_UPGRADE: '1'
        run: gradle --no-daemon --init-script scripts/no_apk.init.gradle :hifz-app:compileReleaseJavaWithJavac --stacktrace
      - name: Report executed JVM tests
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree
          for folder in ('hifz-core/build/test-results/test',
                         'hifz-app/build/test-results/testDebugUnitTest',
                         'hifz-app/build/test-results/sourceContractTest'):
              suites = [ElementTree.parse(p).getroot() for p in Path(folder).glob('TEST-*.xml')]
              if not suites:
                  print(folder, 'no completed test report')
                  continue
              print(folder, ', '.join(f'{name}={sum(int(s.get(name, 0)) for s in suites)}'
                                     for name in ('tests', 'failures', 'errors', 'skipped')))
              for suite in suites:
                  for case in suite.findall('testcase'):
                      skipped = case.find('skipped')
                      if skipped is not None:
                          print('SKIPPED', suite.get('name'), case.get('name'),
                                skipped.get('message') or skipped.text or 'No reason in XML; inspect source')
                  if suite.get('name', '').endswith(('ActiveReviewLongRunTest', 'ActiveReviewSlotsTest')):
                      for test in suite.findall('testcase'):
                          verdict = 'FAIL' if test.find('failure') is not None else (
                              'SKIPPED' if test.find('skipped') is not None else 'PASS')
                          print(verdict, suite.get('name').rsplit('.', 1)[-1], test.get('name'))
          PYTHON
      - name: Retain JVM XML for exact skipped-test and stress-test review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haafidh-11724-jvm-evidence
          path: |
            hifz-core/build/test-results/test/TEST-*.xml
            hifz-app/build/test-results/testDebugUnitTest/TEST-*.xml
            hifz-app/build/test-results/sourceContractTest/TEST-*.xml
          if-no-files-found: error
      - name: No APK and no private payload
        if: always()
        run: |
          set -euo pipefail
          test -z "$(find hifz-app -name '*.apk' -type f -print -quit)"
          test ! -d hifz-app/src/private114/assets

  android-runtime:
    name: Android instrumentation and BOOX comparison
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install tools and prepare the 1.17.23 reference checkout
        run: |
          set -euo pipefail
          test ! -d hifz-app/src/private114/assets
          test -z "${HIFZ_KEYSTORE_PATH:-}"
          test -z "${HIFZ_KEYSTORE_BASE64:-}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          git worktree add --detach "$RUNNER_TEMP/haafidh-base" e5d1f00b7f27ed473e8d9bdb25ee5ff71ccc3ca3
      - name: Compile the two isolated debug builds
        run: |
          set -euo pipefail
          gradle --no-daemon :hifz-app:assembleDebug :hifz-app:assembleDebugAndroidTest
          gradle -p "$RUNNER_TEMP/haafidh-base" --no-daemon :hifz-app:assembleDebug
      - name: Run real Android tests and capture the reference and candidate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -skin 1080x2400 -gpu swiftshader_indirect -accel on
          script: bash scripts/run_11723_android_qualification.sh "$RUNNER_TEMP/haafidh-base"
      - name: Retain synthetic captures and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haafidh-11724-android-evidence
          path: |
            haafidh-evidence/**/*.png
            haafidh-evidence/**/build.txt
            haafidh-evidence/**/*result.txt
            haafidh-evidence/**/activity.txt
            hifz-app/build/outputs/androidTest-results/
          if-no-files-found: warn
