name: Haafidh active review — source-only qualification
on:
  push:
    branches:
      - work/haafidh-11723-active-review-fragilities
  pull_request:
    branches:
      - staging/haafidh-11722-unsigned-for-private-local-signing
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify no private corpus or signing material
        run: |
          set -euo pipefail
          test ! -d hifz-app/src/private114/assets
          test -z "${HIFZ_KEYSTORE_PATH:-}"
          test -z "${HIFZ_KEYSTORE_BASE64:-}"
      - name: Unit tests and existing source contracts
        run: gradle --no-daemon --init-script scripts/no_apk.init.gradle :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
      - name: Compile private release sources without packaging
        env:
          AYAH_THEMES_PRIVATE_114: '1'
          HIFZ_PRIVATE_RELEASE_UPGRADE: '1'
        run: gradle --no-daemon --init-script scripts/no_apk.init.gradle :hifz-app:compileReleaseJavaWithJavac --stacktrace
      - name: No APK and no private payload
        if: always()
        run: |
          set -euo pipefail
          test -z "$(find hifz-app -name '*.apk' -type f -print -quit)"
          test ! -d hifz-app/src/private114/assets
