name: Quran Hifz post-BOOX apply core fixes

on:
  push:
    branches:
      - work/hifz-0.7.4-postboox-fixes
    paths:
      - .github/workflows/hifz-postboox-apply-core.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.4-postboox-fixes
      - name: Apply exact post-BOOX runtime fixes
        run: python3 tools/postboox_apply_core.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          git diff --cached --quiet && exit 1
          git commit -m "fix: close post-BOOX structured session bugs"
          git push origin HEAD:work/hifz-0.7.4-postboox-fixes
