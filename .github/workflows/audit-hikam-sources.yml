name: Audit Al-Hikam sources # retry

on:
  push:
    branches:
      - quran-safeguard-hikam-complete-corpus
    paths:
      - ".github/workflows/audit-hikam-sources.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit primary and secondary Al-Hikam sources
        run: python3 scripts/audit_hikam_sources.py
      - name: Commit source audit and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quran-safeguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/hikam/source_audit.json
          git rm .github/workflows/audit-hikam-sources.yml
          git commit -m "Record Al-Hikam source audit"
          git push origin HEAD:quran-safeguard-hikam-complete-corpus
