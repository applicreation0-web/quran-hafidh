name: Quran Safeguard 0.10.8 reader regression

on:
  push:
    branches:
      - "release/0.10.8-reader"
  pull_request:
    branches:
      - "work/0.10.7-visual-finalization"

permissions:
  contents: write

jobs:
  reader-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 0.10.8 reader branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Pin reader cream to the existing 0.10.7 reading-surface token
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/#F4F0E6/#F7F2E8/g' scripts/apply_0108_reader_changes.py

      - name: Apply idempotent 0.10.8 reader migration
        run: python3 scripts/apply_0108_reader_changes.py

      - name: Verify strict 0.10.8 reader contract
        run: python3 scripts/verify_0108_reader_contract.py

      - name: Refuse scope creep outside the approved 0.10.8 reader files
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^($|scripts/apply_0108_reader_changes.py|scripts/verify_0108_reader_contract.py|app/build.gradle.kts|app/src/main/java/com/quranunlock/guard/ReaderComfortPrefs.kt|app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt|app/src/main/java/com/quranunlock/guard/MushafReaderActivity.kt|app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt|app/src/plus/java/com/quranunlock/guard/TafsirRepository.kt|app/src/plus/java/com/quranunlock/guard/JalalaynHonorificPresentation.kt|app/src/test/java/com/quranunlock/guard/ReaderComfortPrefsTest.kt|app/src/testPlus/java/com/quranunlock/guard/JalalaynHonorificPresentationTest.kt)$' || true)"
          if [ -n "${unexpected}" ]; then
            echo "Unexpected 0.10.8 migration changes:"
            echo "${unexpected}"
            exit 1
          fi

      - name: Fetch and verify all 604 Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Existing full release audit
        run: gradle --no-daemon :app:verifyReleaseAudit --stacktrace

      - name: Light and Plus unit regression suites
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest --stacktrace

      - name: Compile both editions
        run: gradle --no-daemon :app:assembleLightDebug :app:assemblePlusDebug --stacktrace

      - name: Prove edition boundaries on compiled APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/debug/app-light-debug.apk
          python3 scripts/verify_plus_apk_multitafsir_0106.py app/build/outputs/apk/plus/debug/app-plus-debug.apk
          python3 scripts/verify_0105_runtime_clean.py \
            --apk app/build/outputs/apk/light/debug/app-light-debug.apk \
            --apk app/build/outputs/apk/plus/debug/app-plus-debug.apk

      - name: Preserve generated 0.10.8 source only after all gates pass
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/apply_0108_reader_changes.py \
            scripts/verify_0108_reader_contract.py \
            app/build.gradle.kts \
            app/src/main/java/com/quranunlock/guard/ReaderComfortPrefs.kt \
            app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt \
            app/src/main/java/com/quranunlock/guard/MushafReaderActivity.kt \
            app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt \
            app/src/plus/java/com/quranunlock/guard/TafsirRepository.kt \
            app/src/plus/java/com/quranunlock/guard/JalalaynHonorificPresentation.kt \
            app/src/test/java/com/quranunlock/guard/ReaderComfortPrefsTest.kt \
            app/src/testPlus/java/com/quranunlock/guard/JalalaynHonorificPresentationTest.kt
          if git diff --cached --quiet; then
            echo "0.10.8 reader source already committed."
          else
            git commit -m "Implement Quran Safeguard 0.10.8 reader contract [generated]"
            git push origin HEAD:release/0.10.8-reader
          fi
