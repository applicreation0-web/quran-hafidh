          history_test = '''    @Test public void schemaFiveDashboardHistorySurvivesUpgradeByteForByte() {
        seedRepresentativeSchemaFive(true, 7.25f);
        assertTrue(dashboardHistory.edit()
            .putString("started", "2026-08-01")
