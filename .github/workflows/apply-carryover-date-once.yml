name: Apply carryover scheduled date once

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/apply-carryover-date-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
          fetch-depth: 0

      - name: Apply minimal scheduled-date product change
        run: python3 scripts/apply_carryover_date_patch.py

      - name: Commit product change
        run: |
          set -euo pipefail
          git config user.name "quran-hifz-tdd-bot"
          git config user.email "quran-hifz-tdd-bot@users.noreply.github.com"
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java
          git diff --cached --check
          git commit -m "feat: honor carryover scheduled date"
          git push origin HEAD:work/hifz-0.7.5-retention-j10
