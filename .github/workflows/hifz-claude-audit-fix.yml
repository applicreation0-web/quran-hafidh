name: Quran Hifz Claude audit fix contracts

on:
  push:
    branches:
      - fix/hifz-0.7.3-claude-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  claude-audit-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal Claude audit fixes
        run: python3 scripts/apply_hifz_claude_audit_fixes.py
      - name: Run Claude audit regression contracts
        run: python3 scripts/test_hifz_claude_audit_regressions.py
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No production fix diff to commit."
            exit 0
          fi
          git config user.name "applicreation0-web"
          git config user.email "applicreation0@gmail.com"
          git add hifz-app hifz-core
          git commit -m "fix(hifz): address Claude audit findings"
          git push origin HEAD:fix/hifz-0.7.3-claude-audit
