name: Apply Hifz 0.7.5 consolidation persistence

on:
  push:
    branches: [ "work/hifz-0.7.5-retention-j10" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staged parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7d75432601ce4bd3549c070d15897da48df5a4b6"
          test "$(git branch --show-current)" = "work/hifz-0.7.5-retention-j10"

      - name: Apply minimal product GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_hifz_075_consolidation_persistence.py
          grep -q 'persistConsolidationSession' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          grep -q 'restoreConsolidationSession' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java

      - name: Commit product patch and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-hifz-075-consolidation-persistence.yml
          rm scripts/apply_hifz_075_consolidation_persistence.py
          git config user.name "applicreation0-web"
          git config user.email "applicreation0@gmail.com"
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java .github/workflows/apply-hifz-075-consolidation-persistence.yml scripts/apply_hifz_075_consolidation_persistence.py
          git commit -m "feat: persist open consolidation sessions"
          git push origin HEAD:work/hifz-0.7.5-retention-j10
