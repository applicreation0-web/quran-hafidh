name: Quran Haafidh 1.17.8 PRIVATE OFFLINE CANDIDATE — UNSIGNED, NEVER INSTALL
on:
  push:
    branches:
      - fix/haafidh-1178-family-postfinal-20261026
    paths:
      - '.github/workflows/haafidh-1178-private-unsigned-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-1178-unsigned-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-code-only-offline-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: SDK plus 604 original QCF pages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Enforce frozen Hifz contracts and private boundary
        run: |
          set -euo pipefail
          python3 scripts/verify_1178_family_invariants.py
          python3 scripts/audit_haafidh_1176.py --strict
          python3 scripts/verify_atlas_only_purity.py
          python3 scripts/verify_contractual_ui_icons.py
          python3 scripts/verify_j6_icon_roles.py
          test ! -e hifz-app/src/private114/assets/atlas/atlas_display_catalog_v1.json
          test ! -e hifz-app/src/private114/assets/atlas_private/atlas_approved_unit_titles_366_v1.json
      - name: Compile ONLY incomplete UNSIGNED offline input, bypass missing-private-input gate only
        env:
          AYAH_THEMES_PRIVATE_114: '1'
          HIFZ_PRIVATE_RELEASE_UPGRADE: '1'
        run: |
          set -euo pipefail
          gradle --no-daemon :hifz-app:assembleRelease -x :hifz-app:verifyPrivateReleaseInputs
          mkdir -p artifact
          apk="$(find hifz-app/build-private114/outputs/apk/release -name '*.apk' -type f -print -quit)"
          test -n "$apk"
          test -s "$apk"
          "$ANDROID_HOME"/build-tools/36.0.0/aapt dump badging "$apk" > artifact/badging.txt
          grep -q "package: name='com.quransafeguard.hifz' versionCode='46' versionName='1.17.8'" artifact/badging.txt
          if "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify "$apk" >/dev/null 2>&1; then
            echo 'NO-GO: staging was unexpectedly signed'
            exit 1
          fi
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=set(z.namelist())
          private=[
              'assets/atlas_private/atlas_366_comments_offline_reference_v1.json',
              'assets/atlas_private/atlas_approved_unit_titles_366_v1.json',
              'assets/atlas_private/maududi_original.pdf',
              'assets/ayah_themes_private/macros_114.json',
              'assets/ayah_themes_private/special_27.json',
              'assets/ayah_themes_private/titles_114.json',
              'assets/atlas/atlas_display_catalog_v1.json',
          ]
          assert all(p not in names for p in private), "Private resources leaked into public staging"
          assert not any(n.startswith('assets/atlas_private/') for n in names), "Private Atlas leak"
          print('PASS: no private files inside unfinalized build')
          PY
          cp "$apk" artifact/QURAN_HAAFIDH_1178_PUBLIC_CODE_ONLY_UNSIGNED_NEVER_INSTALL.apk
          git rev-parse HEAD > artifact/SOURCE_SHA.txt
          cat > artifact/READ_ME_FIRST.txt <<'TXT'
          DO NOT INSTALL OR DISTRIBUTE THIS APK AS AN APPLICATION.
          THIS IS AN INCOMPLETE PUBLIC-CODE BUILD WITH THE PRIVATE ATLAS FILES MISSING.
          The complete private build MUST happen offline with 7/7 SHA-256-verified private assets.
          Use the historical official signing certificate:
          66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14
          Check appId=com.quransafeguard.hifz; versionName=1.17.8; versionCode=46;
          APK v2 signature; in-place upgrade; backup; and BOOX physical acceptance.
          NEVER commit/upload private assets, keystore, passwords, user backup or a signed private APK.
          TXT
          (cd artifact && sha256sum QURAN_HAAFIDH_1178_PUBLIC_CODE_ONLY_UNSIGNED_NEVER_INSTALL.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quran-haafidh-1178-PUBLIC-UNSIGNED-OFFLINE-NEVER-INSTALL
          path: artifact/
          retention-days: 7
          if-no-files-found: error
