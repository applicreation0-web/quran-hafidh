name: Quran Hifz 0.7.5 UI closeout runner

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply guarded staged patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4173f1e2fa16f9b8538303ea4d6387ba4d25c2ff"
          python3 - <<'PY'
          from pathlib import Path

          staged = Path('.github/workflows/hifz-075-ui-closeout-patch.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = staged.index(marker) + len(marker)
          end = staged.index("\n          PY\n", start)
          raw = staged[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(compile(script, 'hifz-075-ui-closeout-inline.py', 'exec'), {'__name__': '__main__'})
          PY
          git rm .github/workflows/hifz-075-ui-closeout-patch.yml .github/workflows/hifz-075-ui-closeout-runner.yml
          git config user.name "quran-hifz-work"
          git config user.email "actions@users.noreply.github.com"
          git add hifz-app/src/main hifz-app/src/test hifz-app/src/androidTest .github/workflows
          git diff --cached --check
          git commit -m "fix: close 0.7.5 schema UI and migration history"
          git push origin HEAD:work/hifz-0.7.5-retention-j10
