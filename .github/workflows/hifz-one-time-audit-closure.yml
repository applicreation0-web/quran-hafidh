name: Hifz one-time audit closure

on:
  push:
    branches: [work/hifz-0.7.3-spec-update]
    paths:
      - '.github/workflows/hifz-one-time-audit-closure.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.3-spec-update
          fetch-depth: 0
      - name: Apply guarded production closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def between(text, start, end, new, label):
              a = text.find(start)
              if a < 0: raise SystemExit(f'{label}: start marker absent')
              b = text.find(end, a)
              if b < 0: raise SystemExit(f'{label}: end marker absent')
              return text[:a] + new + text[b:]

          # ---- HifzPrefs ----
          path = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java')
          s = path.read_text()
          s = rep(s,
              '                .putString("legacyMurajaahPromotedRanges", "[]")\n                .putString("anchoringQueue", "[]")',
              '                .putString("legacyMurajaahPromotedRanges", "[]")\n                .putString("forcedPromotedRanges", "[]")\n                .putString("anchoringQueue", "[]")',
              'fresh forced promotions')
          s = rep(s,
              '                .putInt("anchoringQueueIndex", 0)\n                .putString("itqanRotationStart", "49:1")',
              '                .putInt("anchoringQueueIndex", 0)\n                .putString("anchoringRetryAfterDate", "")\n                .putString("itqanRotationStart", "49:1")',
              'fresh retry date')
          s = rep(s,
              '                .putString("recentConsolidationActivatedOn", "")\n                .putLong("sabqiElapsedMs", 0L)',
              '                .putString("recentConsolidationActivatedOn", "")\n                .putString("consolidationAttendanceDates", "[]")\n                .putLong("sabqiElapsedMs", 0L)',
              'fresh attendance')
          s = rep(s,
              '            .putString("legacyMurajaahPromotedRanges", rangesJson(normalizeRanges(legacy)))\n            .putString("recentSabqi", recent)',
              '            .putString("legacyMurajaahPromotedRanges", rangesJson(normalizeRanges(legacy)))\n            .putString("forcedPromotedRanges", "[]")\n            .putString("recentSabqi", recent)',
              'migration forced promotions')
          s = rep(s,
              '            .putString("recentConsolidationActivatedOn", activation == null ? "" : activation)\n            .putString("murajaahCursor", murajaah.toString())',
              '            .putString("recentConsolidationActivatedOn", activation == null ? "" : activation)\n            .putString("consolidationAttendanceDates", "[]")\n            .putString("murajaahCursor", murajaah.toString())',
              'migration attendance')
          s = rep(s,
              '            .putInt("anchoringQueueIndex", Math.max(0, p.getInt("anchoringQueueIndex", 0)))\n            .putInt("itqanFinalReveals", Math.max(0, p.getInt("itqanFinalReveals", 0)))',
              '            .putInt("anchoringQueueIndex", Math.max(0, p.getInt("anchoringQueueIndex", 0)))\n            .putString("anchoringRetryAfterDate", "")\n            .putInt("itqanFinalReveals", Math.max(0, p.getInt("itqanFinalReveals", 0)))',
              'migration retry')
          old_repair = '''        if (p.contains("stableRecentLines")
                  && !p.edit().remove("stableRecentLines").commit()) {
              throw new IllegalStateException("Unable to clean obsolete Hifz stable-line state");
          }
'''
          new_repair = '''        boolean repairV4 = p.contains("stableRecentLines")
              || !p.contains("consolidationAttendanceDates")
              || !p.contains("forcedPromotedRanges")
              || !p.contains("anchoringRetryAfterDate");
          if (repairV4) {
