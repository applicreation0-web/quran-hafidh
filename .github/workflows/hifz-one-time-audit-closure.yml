name: Hifz one-time audit closure

on:
  push:
    branches:
      - work/hifz-0.7.3-spec-update
    paths:
      - .github/workflows/hifz-one-time-audit-closure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.3-spec-update
          fetch-depth: 0
      - name: Apply guarded production closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/one_time_audit_closure.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hifz-one-time-audit-closure.yml scripts/one_time_audit_closure.py
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java
          git diff --cached --check
          git commit -m 'fix(hifz): close persistence and runtime audit gaps'
          git push origin HEAD:work/hifz-0.7.3-spec-update
