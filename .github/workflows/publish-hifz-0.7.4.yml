name: Publish Quran Hifz 0.7.4 BOOX

on:
  push:
    branches: [ops/publish-hifz-0.7.4]
    paths: [release-trigger/hifz-0.7.4.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-quran-hifz-0.7.4
  cancel-in-progress: false

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: 75d35aaf3f46877b4f6b65fe1c276cc7b3fba1a6
      SOURCE_RUN: '34894587724'
      SOURCE_ARTIFACT: quran-hifz-0.7.4-preboox-unsigned-75d35aaf3f46877b4f6b65fe1c276cc7b3fba1a6
      UNSIGNED_SHA256: 7f499c75a313232ea2c400d9efb0139af1eca36da0d3b8e3326e1b4c4b3a6416
      SIGNED_SHA256: 205aa34a1fd8d4799b3a7a61db1d624a2c8492aae69f1bafe48472f1f310df7b
      CERT_SHA256: 6843751077a6f26f1b99648d1b17b6eb1c577fd67ee55573f27b326c60e752b8
      TAG: v0.7.4-boox
      OUT_APK: Quran-Hifz-0.7.4-boox-release.apk
      SHA_FILE: Quran-Hifz-0.7.4-boox-release.sha256
      REPORT: Quran-Hifz-0.7.4-boox-FINAL-RELEASE-REPORT.txt

    steps:
      - name: Require signing secrets
        env:
          JKS_B64: ${{ secrets.QURAN_HIFZ_JKS_B64 }}
          JKS_PASSWORD: ${{ secrets.QURAN_HIFZ_JKS_PASSWORD }}
        run: |
          test -n "$JKS_B64" || { echo 'Missing QURAN_HIFZ_JKS_B64'; exit 1; }
          test -n "$JKS_PASSWORD" || { echo 'Missing QURAN_HIFZ_JKS_PASSWORD'; exit 1; }

      - name: Download exact validated unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: ci-artifact

      - name: Verify exact unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find ci-artifact -type f -name '*.apk' -print)
          test "${#apks[@]}" = 1
          printf '%s  %s\n' "$UNSIGNED_SHA256" "${apks[0]}" | sha256sum -c -
          cp "${apks[0]}" unsigned.apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android Build Tools 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0" "platform-tools"

      - name: Sign with durable Quran Hifz key
        shell: bash
        env:
          JKS_B64: ${{ secrets.QURAN_HIFZ_JKS_B64 }}
          KS_PASS: ${{ secrets.QURAN_HIFZ_JKS_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          printf '%s' "$JKS_B64" | base64 -d > signing.jks
          chmod 600 signing.jks
          keytool -list -keystore signing.jks -storepass "$KS_PASS" -alias quran-hifz >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks signing.jks \
            --ks-key-alias quran-hifz \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT_APK" unsigned.apk

      - name: Verify signature and exact final hash
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$OUT_APK" | tee apksigner-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner-verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' apksigner-verify.txt
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner-verify.txt | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test "$actual_cert" = "$CERT_SHA256"
          actual_sha="$(sha256sum "$OUT_APK" | awk '{print $1}')"
          test "$actual_sha" = "$SIGNED_SHA256" || { echo "SIGNED HASH MISMATCH: $actual_sha"; exit 1; }
          printf '%s  %s\n' "$SIGNED_SHA256" "$OUT_APK" > "$SHA_FILE"

      - name: Prepare release evidence
        shell: bash
        run: |
          cat > "$REPORT" <<EOF
          Quran Hifz 0.7.4 BOOX — FINAL GITHUB RELEASE REPORT
          Repository: ${GITHUB_REPOSITORY}
          Target SHA: ${TARGET_SHA}
          Source CI run: ${SOURCE_RUN}
          Source artifact: ${SOURCE_ARTIFACT}
          Unsigned SHA-256: ${UNSIGNED_SHA256}
          Package: com.quransafeguard.hifz
          versionCode: 11
          versionName: 0.7.4-boox
          Signing certificate SHA-256: ${CERT_SHA256}
          APK Signature Scheme v2: verified
          APK Signature Scheme v3: verified
          Final APK: ${OUT_APK}
          Final SHA-256: ${SIGNED_SHA256}
          CI: 104/104 JVM, 49/49 source contracts, 61/61 instrumentation, process-death PASS
          Publication workflow commit: ${GITHUB_SHA}
          Release tag targets ${TARGET_SHA}, not the publication-ops commit.
          EOF
          cat > RELEASE_NOTES.md <<EOF
          ## Quran Hifz 0.7.4 — BOOX
          Candidat final validé après audit indépendant et CI complet.

          - candidat final : \`${TARGET_SHA}\`
          - CI officiel final : \`${SOURCE_RUN}\`
          - tests JVM : 104/104
          - contrats source : 49/49
          - instrumentation Android : 61/61
          - force-stop / relance : PASS
          - package : \`com.quransafeguard.hifz\`
          - versionName : \`0.7.4-boox\`
          - versionCode : \`11\`
          - signatures APK v2/v3 : vérifiées
          - SHA-256 APK signé : \`${SIGNED_SHA256}\`

          Version destinée au test physique BOOX final. Le pack audio reste séparé et local.
          EOF

      - name: Refuse overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then echo "Tag exists"; exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release exists"; exit 1; fi

      - name: Create final release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$OUT_APK" "$SHA_FILE" "$REPORT" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title 'Quran Hifz 0.7.4 — BOOX' \
            --notes-file RELEASE_NOTES.md

      - name: Re-download and verify published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$OUT_APK" --dir published
          printf '%s  %s\n' "$SIGNED_SHA256" "published/$OUT_APK" | sha256sum -c -
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url > release.json
          jq -e --arg tag "$TAG" --arg target "$TARGET_SHA" '.tagName==$tag and .targetCommitish==$target and .isDraft==false and .isPrerelease==false' release.json >/dev/null
          cat release.json

      - name: Remove signing material
        if: always()
        run: rm -f signing.jks unsigned.apk
