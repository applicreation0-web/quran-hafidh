name: Quran Hifz 0.7.5 PHONE feedback apply

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - scripts/apply_hifz_075_phone_feedback.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/apply_hifz_075_phone_feedback.py
      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzAudioPack.java
          git status --short
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/SettingsActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/WeeklyDashboardPlanner.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java
          git commit -m 'feat: align phone UI with schema6 progression'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
