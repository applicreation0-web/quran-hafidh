name: Freeze curated verified reminder snapshot

on:
  push:
    branches:
      - quran-safeguard-v0.8.1-reminder-curation
    paths:
      - ".github/workflows/freeze-curated-reminder-snapshot.yml"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout curation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate verified thematic snapshot
        run: python3 scripts/generate_verified_reminders.py
      - name: Verify curated snapshot
        run: python3 scripts/verify_frozen_reminders.py
      - name: Commit curated snapshot and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quran-safeguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/reminders/hadeethenc_snapshot.json
          git rm .github/workflows/freeze-curated-reminder-snapshot.yml
          git commit -m "Refine thematically curated reminder snapshot"
          git push origin HEAD:quran-safeguard-v0.8.1-reminder-curation
