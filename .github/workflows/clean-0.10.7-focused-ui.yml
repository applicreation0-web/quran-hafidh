name: Clean 0.10.7 focused Tafsir and neutral UI

on:
  push:
    branches:
      - "release/0.10.7-clean"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: release/0.10.7-clean
          fetch-depth: 0

      - name: Apply only the approved 0.10.7 focus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: expected at least {minimum} matches, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Global visual language: cream, muted neutral tones, no ornamental button drawing.
          replace_once(
              'app/src/main/java/com/quranunlock/guard/MainActivity.kt',
              '''    val colors = lightColorScheme(\n        primary = Color(0xFF214B3B),\n        onPrimary = Color.White,\n        secondary = Color(0xFFB0823F),\n        tertiary = Color(0xFF694936),\n        background = Color(0xFFFBF7EF),\n        surface = Color(0xFFFFFDF8),\n        surfaceVariant = Color(0xFFF0E6D5),\n        onSurface = Color(0xFF2A241F),\n        onSurfaceVariant = Color(0xFF675B50),\n        outline = Color(0xFFB89A68)\n    )''',
              '''    val colors = lightColorScheme(\n        primary = Color(0xFF3F4943),\n        onPrimary = Color(0xFFFFFBF3),\n        secondary = Color(0xFF6F665B),\n        tertiary = Color(0xFF5C5148),\n        background = Color(0xFFF5F0E6),\n        surface = Color(0xFFF8F3EA),\n        surfaceVariant = Color(0xFFE8E0D5),\n        onSurface = Color(0xFF292622),\n        onSurfaceVariant = Color(0xFF625D56),\n        outline = Color(0xFF9B9185),\n        error = Color(0xFF7A4D46),\n        onError = Color(0xFFFFFBF3)\n    )'''
          )

          replace_all(
              'app/src/main/java/com/quranunlock/guard/SafeguardDesign.kt',
              '''        modifier = modifier\n            .heightIn(min = 52.dp)\n            .sahelianButtonOrnament(gold, enabled),''',
              '''        modifier = modifier\n            .heightIn(min = 46.dp),''',
              minimum=2
          )
          replace_once(
              'app/src/main/java/com/quranunlock/guard/SafeguardDesign.kt',
              '''        border = BorderStroke(1.dp, gold.copy(alpha = if (enabled) 0.95f else 0.35f)),''',
              '''        border = BorderStroke(\n            1.dp,\n            MaterialTheme.colorScheme.outline.copy(alpha = if (enabled) 0.62f else 0.30f)\n        ),'''
          )
          replace_once(
              'app/src/main/java/com/quranunlock/guard/SafeguardDesign.kt',
              '''        border = BorderStroke(1.dp, gold.copy(alpha = if (enabled) 0.8f else 0.28f)),''',
              '''        border = BorderStroke(\n            1.dp,\n            MaterialTheme.colorScheme.outline.copy(alpha = if (enabled) 0.58f else 0.26f)\n        ),'''
          )

          # Source-backed English Tafsir stays untouched; only presentation whitespace is tightened.
          replace_all(
              'app/src/plus/java/com/quranunlock/guard/TafsirSourceRendering.kt',
              'TafsirRun(TafsirRunStyle.REGULAR, "\\n\\n")',
              'TafsirRun(TafsirRunStyle.REGULAR, "\\n")',
              minimum=2
          )
          replace_all(
              'app/src/plus/java/com/quranunlock/guard/MultiTafsirRepository.kt',
              'TafsirRun(TafsirRunStyle.REGULAR, "\\n\\n")',
              'TafsirRun(TafsirRunStyle.REGULAR, "\\n")',
              minimum=2
          )

          # Tafsir panel: smaller neutral chrome, no heavy elevated block, tighter prose,
          # source-identifiable poetry, and a wider invisible tap target for Quran references.
          panel = 'app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt'
          replace_once(panel, 'private const val COMMENTARY_LINE_HEIGHT_RATIO = 1.50f', 'private const val COMMENTARY_LINE_HEIGHT_RATIO = 1.36f')
          replace_once(panel, 'private const val NOTE_LINE_HEIGHT_RATIO = 1.45f', 'private const val NOTE_LINE_HEIGHT_RATIO = 1.34f')
          replace_once(panel, 'private const val POETRY_LINE_HEIGHT_RATIO = 1.55f', 'private const val POETRY_LINE_HEIGHT_RATIO = 1.46f')
          replace_once(
              panel,
              '''        color = SafeguardReadingSurface,\n        tonalElevation = 6.dp,\n        shadowElevation = 8.dp''',
              '''        color = SafeguardReadingSurface,\n        tonalElevation = 0.dp,\n        shadowElevation = 0.dp'''
          )
          replace_once(panel, '.padding(horizontal = 18.dp, vertical = 8.dp)', '.padding(horizontal = 14.dp, vertical = 4.dp)')
          replace_once(panel, 'style = MaterialTheme.typography.titleMedium,\n                        color = MaterialTheme.colorScheme.primary,\n                        fontWeight = FontWeight.Bold', 'style = MaterialTheme.typography.bodyMedium,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant,\n                        fontWeight = FontWeight.SemiBold')
          replace_once(panel, '.padding(horizontal = 20.dp, vertical = 14.dp),\n                verticalArrangement = Arrangement.spacedBy(12.dp)', '.padding(horizontal = 16.dp, vertical = 8.dp),\n                verticalArrangement = Arrangement.spacedBy(4.dp)')

          old_block = '''            val isPoetry = block.kind == TafsirBlockKind.POETRY\n            ClickableText(\n                text = annotated,\n                style = TextStyle(\n                    color = color,\n                    fontSize = fontSize.sp,\n                    lineHeight = (\n                        fontSize * if (isPoetry) POETRY_LINE_HEIGHT_RATIO else lineHeightRatio\n                    ).sp,\n                    textAlign = if (isPoetry) TextAlign.Start else TextAlign.Justify\n                ),'''
          new_block = '''            val isPoetry = block.kind == TafsirBlockKind.POETRY\n            if (isPoetry) {\n                Text(\n                    text = "Poésie · disposition de l’édition source",\n                    modifier = Modifier.padding(start = 12.dp, top = 3.dp, bottom = 1.dp),\n                    style = MaterialTheme.typography.labelSmall,\n                    color = MaterialTheme.colorScheme.onSurfaceVariant,\n                    fontWeight = FontWeight.SemiBold\n                )\n            }\n            ClickableText(\n                modifier = if (isPoetry) {\n                    Modifier.padding(start = 12.dp, end = 4.dp, bottom = 3.dp)\n                } else {\n                    Modifier\n                },\n                text = annotated,\n                style = TextStyle(\n                    color = color,\n                    fontSize = fontSize.sp,\n                    lineHeight = (\n                        fontSize * if (isPoetry) POETRY_LINE_HEIGHT_RATIO else lineHeightRatio\n                    ).sp,\n                    textAlign = if (isPoetry) TextAlign.Start else TextAlign.Justify\n                ),'''
          replace_once(panel, old_block, new_block)

          old_append = '''        val start = length\n        append(run.text)\n        val end = length'''
          new_append = '''        val displayText = if (run.style == TafsirRunStyle.POETRY) {\n            run.text\n        } else {\n            run.text.replace(Regex("\\\\n{2,}"), "\\n")\n        }\n        val start = length\n        append(displayText)\n        val end = length'''
          replace_once(panel, old_append, new_append)
          replace_once(panel, 'TafsirReferenceParser.find(run.text).forEach { match ->', 'TafsirReferenceParser.find(displayText).forEach { match ->')
          old_link = '''                addStringAnnotation(\n                    tag = QURAN_LINK_TAG,\n                    annotation = encodeQuranReference(match.reference),\n                    start = linkStart,\n                    end = linkEnd\n                )'''
          new_link = '''                val tapStart = (linkStart - 2).coerceAtLeast(start)\n                val tapEnd = (linkEnd + 2).coerceAtMost(end)\n                addStringAnnotation(\n                    tag = QURAN_LINK_TAG,\n                    annotation = encodeQuranReference(match.reference),\n                    start = tapStart,\n                    end = tapEnd\n                )'''
          replace_once(panel, old_link, new_link)

          # Reader chrome: smaller, neutral, retractable through the existing pure-reading state.
          reader = 'app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt'
          replace_once(reader, '.padding(vertical = if (chromeHidden) 0.dp else 6.dp)', '.padding(vertical = if (chromeHidden) 0.dp else 2.dp)')
          replace_once(reader, 'style = MaterialTheme.typography.titleLarge,\n                                        color = shellPrimary,', 'style = MaterialTheme.typography.titleMedium,\n                                        color = shellPrimary,')
          replace_all(reader, 'tonalElevation = 2.dp', 'tonalElevation = 0.dp', minimum=2)
          replace_once(reader, 'Text("Lecture pure")', 'Text("Masquer les commandes")')
          replace_once(reader, 'maxPanelHeight = maxHeight * 0.5f', 'maxPanelHeight = maxHeight * 0.42f')
          replace_once(reader, 'Spacer(Modifier.height(7.dp))', 'Spacer(Modifier.height(2.dp))')
          replace_all(reader, 'Spacer(Modifier.height(4.dp))', 'Spacer(Modifier.height(2.dp))', minimum=3)
          replace_once(reader, '"🔖 Retirer le marque-page • p. $page"', '"Retirer le signet • p. $page"')
          replace_once(reader, '"🔖 Ajouter un marque-page • p. $page"', '"Ajouter un signet • p. $page"')

          # Bottom menu keeps the same information architecture but becomes visually quieter.
          dashboard = 'app/src/main/java/com/quranunlock/guard/DashboardActivity.kt'
          replace_once(dashboard, 'containerColor = MaterialTheme.colorScheme.surface,\n                    tonalElevation = 0.dp', 'containerColor = MaterialTheme.colorScheme.background,\n                    tonalElevation = 0.dp')
          replace_once(dashboard, 'indicatorColor = MaterialTheme.colorScheme.surfaceVariant', 'indicatorColor = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.72f)')

          # Guardrails: no French Tafsir transformation, no fabricated note layer.
          p = Path(panel).read_text(encoding='utf-8')
          repo = Path('app/src/plus/java/com/quranunlock/guard/MultiTafsirRepository.kt').read_text(encoding='utf-8')
          source = Path('app/src/plus/java/com/quranunlock/guard/TafsirSourceRendering.kt').read_text(encoding='utf-8')
          assert 'Poésie · disposition de l’édition source' in p
          assert 'tapStart = (linkStart - 2)' in p and 'tapEnd = (linkEnd + 2)' in p
          assert 'notes = emptyList()' in repo
          assert '"\\n\\n"' not in source
          print('Focused 0.10.7 patch applied')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile and unit-test Light and Plus
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest

      - name: Commit focused cleanup only after tests pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/quranunlock/guard/MainActivity.kt \
                  app/src/main/java/com/quranunlock/guard/SafeguardDesign.kt \
                  app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt \
                  app/src/main/java/com/quranunlock/guard/DashboardActivity.kt \
                  app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt \
                  app/src/plus/java/com/quranunlock/guard/TafsirSourceRendering.kt \
                  app/src/plus/java/com/quranunlock/guard/MultiTafsirRepository.kt
          if git diff --cached --quiet; then
            echo "No focused changes to commit"
            exit 0
          fi
          git commit -m "Clean 0.10.7 Tafsir presentation and neutral UI [skip ci]"
          git push origin HEAD:release/0.10.7-clean
