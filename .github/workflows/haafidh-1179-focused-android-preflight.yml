name: Haafidh 1.17.9 orientation-aware QCF and paused clock Android preflight (NO APK)
on:
  push:
    branches: [debug/haafidh-1179-p0-orientation-20261031]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox
            size: 1404x1872
            density: 226
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Pin Android inputs and fetch authentic local QCF
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Only the two remaining P0 tests — never assembly or release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            gradle --no-daemon :hifz-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.quransafeguard.hifz.preview.AtlasDiscriminantInstrumentedTest#mushafTapOpensContextualTafsirAndSwitchPreservesBothQcfPages,com.quransafeguard.hifz.preview.RevisionAtlasInstrumentedTest#passiveNestedComparisonPausesClockAndRestoresExactSessionAndBackup
            adb pull /sdcard/Pictures/HaafidhAudit hifz-app/build/focused-audit/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-1179-focused-${{ matrix.surface }}-NO-APK
          path: |
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
            hifz-app/build/focused-audit/
          retention-days: 7
