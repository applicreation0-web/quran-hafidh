name: Quran Haafidh 1.17.5 BOOX home source regression
on:
  push:
    branches:
      - work/haafidh-1175-boox-ux-hifz-atlas
    paths:
      - 'hifz-app/src/**'
      - '.github/workflows/haafidh-1175-boox-home-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-1175-boox-home-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home-and-hifz:
    name: Source, JVM and frozen Hifz contracts (no release APK)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Provide offline 604-page reference assets
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Enforce frozen engines, correct icons and private-corpus exclusion
        run: |
          bash scripts/guard_frozen_hifz_engines.sh
          python3 scripts/verify_contractual_ui_icons.py
          python3 scripts/verify_atlas_only_purity.py
      - name: JVM and Android source contracts — no APK publication
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-1175-home-test-evidence
          path: |
            hifz-core/build/test-results/
            hifz-app/build/test-results/
            hifz-app/build/reports/
          retention-days: 14
