name: Haafidh 1.17.15 — official APK v2 metadata signature ONLY
on:
  push:
    branches: [delivery/haafidh-11715-offline-v2-20261108]
    paths: [signing-input/signed_data_11715.b64]
permissions:
  contents: read
jobs:
  sign-v2-digest-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore official signing key inside ephemeral runner only
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HIFZ_KEYSTORE_BASE64"
          printf '%s' "$HIFZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/official.jks"
          chmod 600 "$RUNNER_TEMP/official.jks"
      - name: Sign only opaque APK-v2 signedData, never any APK or private source
        env:
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/SignOfficialMetadata11715.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.Base64;
          public class SignOfficialMetadata11715 {
            static String hex(byte[] v) {
              StringBuilder b=new StringBuilder();
              for(byte q:v)b.append(String.format("%02x",q & 255));
              return b.toString();
            }
            public static void main(String[] args) throws Exception {
              byte[] data=Base64.getMimeDecoder().decode(Files.readString(Path.of(args[0])).trim());
              if(data.length < 1300 || data.length > 3000)
                throw new SecurityException("Unexpected 11715 signedData envelope size");
              KeyStore ks=KeyStore.getInstance(Path.of(args[1]).toFile(),System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
              String alias=System.getenv("HIFZ_KEY_ALIAS");
              Certificate c=ks.getCertificate(alias);
              if(c==null)throw new SecurityException("Missing key alias");
              String fp=hex(MessageDigest.getInstance("SHA-256").digest(c.getEncoded()));
              if(!fp.equals("66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14"))
                throw new SecurityException("Official signing certificate mismatch");
              PrivateKey key=(PrivateKey)ks.getKey(alias,System.getenv("HIFZ_KEY_PASSWORD").toCharArray());
              Signature s=Signature.getInstance("SHA256withRSA");
              s.initSign(key);s.update(data);byte[] sig=s.sign();
              Signature v=Signature.getInstance("SHA256withRSA");
              v.initVerify(c);v.update(data);
              if(!v.verify(sig)||sig.length!=512)throw new SecurityException("Signature verification failed");
              Files.writeString(Path.of(args[2]),Base64.getEncoder().encodeToString(sig)+"\n");
              System.out.println("OFFICIAL_SIGNED_DATA_ONLY_PASS sha256="+hex(MessageDigest.getInstance("SHA-256").digest(data)));
            }
          }
          JAVA
          javac "$RUNNER_TEMP/SignOfficialMetadata11715.java"
          java -cp "$RUNNER_TEMP" SignOfficialMetadata11715 signing-input/signed_data_11715.b64 "$RUNNER_TEMP/official.jks" "$RUNNER_TEMP/offline_signature_11715.b64"
          shred -fu "$RUNNER_TEMP/official.jks" || rm -f "$RUNNER_TEMP/official.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-11715-official-v2-signature-only-no-apk
          path: ${{ runner.temp }}/offline_signature_11715.b64
          retention-days: 1
          if-no-files-found: error
