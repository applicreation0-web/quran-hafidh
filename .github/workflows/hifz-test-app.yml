name: Quran Hifz isolated test app

on:
  push:
    branches:
      - integration/hifz-test-app
      - integration/hifz-boox-final-convergence
      - integration/hifz-boox-polish-0.7
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-hifz-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated Mushaf and Tafsir baseline
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.9-astra-re-audit
          run-id: 34336797351
          github-token: ${{ github.token }}
          path: baseline109
      - name: Verify and inject canonical 604-page Mushaf and approved Tafsir
        shell: bash
        run: |
          set -euo pipefail
          src="baseline109/astra-re-audit/source-work-tree"
          test -d "$src/app/src/main/assets/mushaf/hafs/kfqc/svg-br"
          test -f "$src/app/src/plus/assets/tafsir/al_jalalayn_en.sqlite.gz.part00"
          rm -rf app/src/main/assets/mushaf app/src/plus/assets/tafsir
          mkdir -p app/src/main/assets app/src/plus/assets
          cp -a "$src/app/src/main/assets/mushaf" app/src/main/assets/
          cp -a "$src/app/src/plus/assets/tafsir" app/src/plus/assets/
          test "$(find app/src/main/assets/mushaf/hafs/kfqc/svg-br -type f -name '*.svg.br' | wc -l | tr -d ' ')" = 604
          test -s app/src/plus/assets/tafsir/al_jalalayn_en.sqlite.gz.part00
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all three Tafsir corpora and tested verse availability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, sqlite3, tempfile
          from pathlib import Path

          root = Path('app/src/plus/assets/tafsir')
          checks = [
              ('jalalayn', 'al_jalalayn_en.sqlite.gz.part*', 6236, None, None),
              ('qurtubi', 'qurtubi_en.sqlite.gz.b64.part*', 432, '0106-qurtubi-hide-verse-labels-v1', 'qurtubi'),
              ('qushayri', 'qushayri_en.sqlite.gz.b64.part*', 720, '0106-qushayri-source-semantics-v1', 'qushayri'),
          ]
          for name, pattern, expected, revision, edition_id in checks:
              parts = sorted(root.glob(pattern))
              assert parts, f'{name}: no parts'
              payload = b''.join(p.read_bytes() for p in parts)
              if name != 'jalalayn':
                  payload = base64.b64decode(payload)
              raw = gzip.decompress(payload)
              with tempfile.NamedTemporaryFile(suffix='.sqlite') as tmp:
                  tmp.write(raw); tmp.flush()
                  db = sqlite3.connect(tmp.name)
                  meta = dict(db.execute('select key,value from source_metadata'))
                  if name == 'jalalayn':
                      assert int(meta['verse_count']) == expected
                      assert db.execute('select count(*) from verse_commentary').fetchone()[0] == expected
                      assert db.execute('select count(*) from verse_commentary where surah=2 and ayah=27').fetchone()[0] == 1
                  else:
                      assert int(meta['entry_count']) == expected
                      assert meta['presentation_revision'] == revision
                      assert meta['edition_id'] == edition_id
                      assert db.execute('select count(*) from tafsir_entry').fetchone()[0] == expected
                      assert db.execute('select count(*) from tafsir_entry where surah=2 and verse_start<=27 and verse_end>=27').fetchone()[0] >= 1
                  db.close()
          print('TAFSIR_3_CORPORA_OK verse=2:27')
          PY
      - name: Generate exact Hifz geometry
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check pymupdf==1.26.7 numpy scipy
          python3 scripts/build_reader109_geometry.py
          python3 scripts/verify_hifz_geometry_edges.py
          test -s app/src/main/assets/reader109/geometry.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run Hifz oracle and product-boundary gate
        run: gradle --no-daemon :hifz-core:test :hifz-app:verifyHifzProductBoundary --stacktrace
      - name: Assemble isolated Quran Hifz TEST APK
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace
      - name: Inspect packaged APK boundary corpus and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee hifz-app-signature.txt
          grep -q 'Verified' hifz-app-signature.txt
          apkanalyzer manifest print "$apk" > hifz-app-manifest.xml
          grep -q 'package="com.quransafeguard.hifz.installtest1"' hifz-app-manifest.xml
          grep -q 'Quran Hifz' hifz-app-manifest.xml
          if grep -Eqi 'AccessibilityService|BIND_ACCESSIBILITY_SERVICE|QUERY_ALL_PACKAGES|QuranAccessibilityService' hifz-app-manifest.xml; then exit 1; fi
          unzip -l "$apk" > hifz-app-apk-list.txt
          grep -q 'assets/reader109/geometry.json' hifz-app-apk-list.txt
          page_count="$(grep -E 'assets/mushaf/hafs/kfqc/svg-br/[0-9]{3}\.svg\.br' hifz-app-apk-list.txt | wc -l | tr -d ' ')"
          test "$page_count" = 604
          jalalayn_count="$(grep -E 'assets/tafsir/al_jalalayn_en\.sqlite\.gz\.part[0-9]{2}' hifz-app-apk-list.txt | wc -l | tr -d ' ')"
          qurtubi_count="$(grep -E 'assets/tafsir/qurtubi_en\.sqlite\.gz\.b64\.part[0-9]{2}' hifz-app-apk-list.txt | wc -l | tr -d ' ')"
          qushayri_count="$(grep -E 'assets/tafsir/qushayri_en\.sqlite\.gz\.b64\.part[0-9]{2}' hifz-app-apk-list.txt | wc -l | tr -d ' ')"
          test "$jalalayn_count" = 4
          test "$qurtubi_count" = 4
          test "$qushayri_count" = 2
          sha256sum "$apk" | tee hifz-app-sha256.txt
          echo "APK=$apk" | tee hifz-app-build-info.txt
          echo "HEAD=${GITHUB_SHA}" | tee -a hifz-app-build-info.txt
      - name: Upload Hifz TEST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-hifz-test-${{ github.sha }}
          path: |
            hifz-app/build/outputs/apk/debug/*.apk
            hifz-core/build/test-results/
            hifz-core/build/reports/tests/
            hifz-app-manifest.xml
            hifz-app-apk-list.txt
            hifz-app-signature.txt
            hifz-app-sha256.txt
            hifz-app-build-info.txt
            geometry-report.json
          if-no-files-found: warn
          retention-days: 14

# Physical phone and BOOX validation replaces the brittle UiAutomator harness for this candidate.
# No automatic emulator job: avoids spending Actions on a known harness failure unrelated to app launch.
