name: Apply Hifz 0.7.5 version once

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/apply-hifz-075-version-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
          fetch-depth: 0
      - name: Bump only Hifz candidate version
        shell: bash
        run: |
          set -euo pipefail
          file=hifz-app/build.gradle.kts
          grep -Fxq '        versionCode = 11' "$file"
          grep -Fxq '        versionName = "0.7.4-boox"' "$file"
          sed -i 's/^        versionCode = 11$/        versionCode = 12/' "$file"
          sed -i 's/^        versionName = "0.7.4-boox"$/        versionName = "0.7.5-boox"/' "$file"
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = 1
          test "$(git diff --name-only)" = 'hifz-app/build.gradle.kts'
      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quran-hifz-tdd-bot'
          git config user.email 'quran-hifz-tdd-bot@users.noreply.github.com'
          git add hifz-app/build.gradle.kts
          git diff --cached --check
          git commit -m 'chore: bump Quran Hifz to 0.7.5'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
