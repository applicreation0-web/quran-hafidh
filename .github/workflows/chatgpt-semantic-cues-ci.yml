name: ChatGPT semantic cues isolated CI

on:
  push:
    branches:
      - work/chatgpt-semantic-cues
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-semantic-cues-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: chatgpt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify semantic branch scope
        run: |
          set -euo pipefail
          test -d hifz-app
          test -d hifz-core
          test -s app/src/main/assets/reader109/geometry.json
          test "$(find app/src/main/assets/mushaf/hafs/kfqc/svg-br -maxdepth 1 -type f -name '[0-9][0-9][0-9].svg.br' | wc -l | tr -d ' ')" = 604

      - name: Run focused JS/Python anti-regression checks
        run: |
          set -euo pipefail
          python3 scripts/test_hifz_claude_audit_regressions.py
          python3 scripts/verify_hifz_mask_hotfix.py
          node scripts/test_hifz_mask_segments.js
          node scripts/test_hifz_vertical_fit.js
          node scripts/verify_quran_mushaf_word_pages.js

      - name: Run post-Work Al-Munir and exact-geometry audit
        run: |
          set -euo pipefail
          mkdir -p build/postwork-audit
          python3 scripts/materialize_semantic_v2_1.py \
            hifz-app/src/main/semantic-source/v2_1 \
            build/postwork-audit/semantic_passages_v2_1.json
          python3 scripts/audit_quran_haafidh_postwork.py \
            build/postwork-audit/semantic_passages_v2_1.json
          python3 scripts/verify_quran_word_boxes.py \
            hifz-app/src/main/word-source/quran-ws-v1.1.2

      - name: Run Hifz JVM tests and contracts
        run: >-
          gradle --no-daemon
          :hifz-core:test
          :hifz-app:testDebugUnitTest
          :hifz-app:sourceContractTest
          :hifz-app:compileDebugAndroidTestSources
          :hifz-app:verifyHifzProductBoundary
          :hifz-app:verifyHifzCosmeticContract
          :hifz-app:verifyHifzConvergenceRules
          --stacktrace

      - name: Compile debug APK
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace

      - name: Verify debug APK payload and SHA-256
        id: apk
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          python3 - "$apk" <<'PY'
          import hashlib, json, re, sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              required = {
                  "assets/semantic/semantic_passages_v2_1.json",
                  "assets/semantic/semantic_titles_v2_3.json",
                  "assets/reader109/word-boxes/word-boxes-001-150.json",
                  "assets/reader109/word-boxes/word-boxes-151-300.json",
                  "assets/reader109/word-boxes/word-boxes-301-450.json",
                  "assets/reader109/word-boxes/word-boxes-451-604.json",
              }
              missing = sorted(required - set(names))
              if missing:
                  raise SystemExit("APK missing required embedded assets: " + repr(missing))
              forbidden_names = [n for n in names if re.search(r"spatial.?quiz|quiz.?spatial", n, re.I)]
              if forbidden_names:
                  raise SystemExit("Spatial quiz artifact still packaged: " + repr(forbidden_names))
              semantic = json.loads(z.read("assets/semantic/semantic_passages_v2_1.json"))
              if semantic.get("global_passage_count") != 1256:
                  raise SystemExit("APK semantic corpus count mismatch")
              dex = b"".join(z.read(n) for n in names if re.fullmatch(r"classes\d*\.dex", n))
              for marker in (b"SpatialQuiz", b"quizTargetLine", b"quizVisibleLines", b"quizGuideLayer"):
                  if marker in dex:
                      raise SystemExit("Spatial quiz code marker still present in DEX: " + marker.decode())
          digest = hashlib.sha256(open(apk, "rb").read()).hexdigest()
          print("APK_PAYLOAD_OK semantic=1256 word_geometry=4_chunks spatial_quiz=absent")
          print("APK_SHA256=" + digest)
          PY
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-haafidh-debug-${{ github.sha }}
          path: chatgpt/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-semantic-cues-ci-${{ github.sha }}
          path: |
            chatgpt/hifz-app/build/test-results/
            chatgpt/hifz-app/build/reports/tests/
            chatgpt/hifz-core/build/test-results/
            chatgpt/hifz-core/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
