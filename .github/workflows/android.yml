name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify total release audit
        run: gradle --no-daemon :app:verifyReleaseAudit

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-test.log

      - name: Upload unit-test reports
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            unit-test.log
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-unlock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload unsigned release APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          if-no-files-found: error

      - name: Transfer release payload for local signing
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          transfer_file() {
            local label="$1"
            local source_path="$2"
            local part_prefix="$3"
            local transfer_dir
            transfer_dir="$(mktemp -d)"
            local file_size file_sha part_count
            file_size="$(stat -c %s "$source_path")"
            file_sha="$(sha256sum "$source_path" | cut -d ' ' -f 1)"
            split -b 4m -d -a 3 "$source_path" "$transfer_dir/$part_prefix."
            part_count="$(find "$transfer_dir" -maxdepth 1 -type f -name "$part_prefix.*" | wc -l)"
            echo "::notice::TRANSFER|$label|$file_size|$file_sha|$part_count"

            local index=0
            for part_path in "$transfer_dir"/"$part_prefix".*; do
              local payload_path response_path blob_sha part_size
              payload_path="$transfer_dir/payload.json"
              response_path="$transfer_dir/response.json"
              base64 -w0 "$part_path" | jq -Rs '{content: ., encoding: "base64"}' > "$payload_path"
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "@$payload_path" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" > "$response_path"
              blob_sha="$(jq -er '.sha' "$response_path")"
              part_size="$(stat -c %s "$part_path")"
              printf '::notice::BLOB|%s|%03d|%s|%s\n' "$label" "$index" "$blob_sha" "$part_size"
              index=$((index + 1))
            done
            rm -rf "$transfer_dir"
          }

          transfer_file \
            "APK" \
            "app/build/outputs/apk/release/app-release-unsigned.apk" \
            "apk-part"
          transfer_file \
            "APKSIGNER" \
            "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" \
            "apksigner-part"
