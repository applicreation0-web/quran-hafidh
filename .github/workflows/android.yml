name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "release/0.10.7-clean" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify total release audit
        run: gradle --no-daemon :app:verifyReleaseAudit --stacktrace

      - name: Verify 0.10.3 contradictory update audit
        run: python3 scripts/verify_0103_update.py

      - name: Verify 0.10.7 visual contract
        run: python3 scripts/verify_0107_visual_contract.py

      - name: Verify 0.10.7 Tafsir reading contract
        run: python3 scripts/verify_0107_tafsir_reading_contract.py

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest 2>&1 | tee unit-test.log

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleLightDebug :app:assemblePlusDebug

      - name: Build unsigned release APKs
        run: gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease

      - name: Prove Light contains no Plus tafsir material
        run: >-
          python3 scripts/verify_light_apk_no_tafsir.py
          app/build/outputs/apk/light/release/app-light-release-unsigned.apk

      - name: Verify private Plus release corpus
        run: >-
          python3 scripts/verify_plus_apk_tafsir.py
          app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk
