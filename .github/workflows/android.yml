name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify total release audit
        run: gradle --no-daemon :app:verifyReleaseAudit

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testLightDebugUnitTest 2>&1 | tee unit-test.log

      - name: Upload unit-test reports
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            unit-test.log
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleLightDebug

      - name: Compile private Plus APK (not uploaded)
        run: gradle --no-daemon :app:assemblePlusDebug

      - name: Upload debug APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-light-debug
          path: app/build/outputs/apk/light/debug/app-light-debug.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleLightRelease

      - name: Prove Light contains no Plus tafsir material
        run: >-
          python3 scripts/verify_light_apk_no_tafsir.py
          app/build/outputs/apk/light/release/app-light-release-unsigned.apk

      - name: Build private Plus unsigned release APK
        run: gradle --no-daemon :app:assemblePlusRelease

      - name: Verify private Plus release corpus
        run: >-
          python3 scripts/verify_plus_apk_tafsir.py
          app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk

      - name: Upload private Plus unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-plus-release-unsigned
          path: app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-light-release-unsigned
          path: app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          if-no-files-found: error
