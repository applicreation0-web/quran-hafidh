name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Research exact source diacritics
        if: github.head_ref == 'research/hikam-commentaries-264' || github.ref_name == 'research/hikam-commentaries-264'
        run: python3 scripts/research_extract_hikam_diacritics.py

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify total release audit
        run: gradle --no-daemon :app:verifyReleaseAudit

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-unlock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload unsigned release APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          if-no-files-found: error
