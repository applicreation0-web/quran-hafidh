name: Android CI

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify total release audit
        run: gradle --no-daemon :app:verifyReleaseAudit

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-test.log

      - name: Upload unit-test reports
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            unit-test.log
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-unlock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Create temporary private APK transfer blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base64 -w0 app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/quran-safeguard-release.b64
          split -b 20000000 -d -a 2 /tmp/quran-safeguard-release.b64 /tmp/quran-safeguard-part-
          for part in /tmp/quran-safeguard-part-*; do
            part_name="${part##*-}"
            sha="$(jq -Rs '{content: ., encoding: "utf-8"}' "$part" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
            echo "APK_TRANSFER_${part_name}=${sha}"
          done

      - name: Upload unsigned release APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          if-no-files-found: error
