name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify total release audit
        run: gradle --no-daemon :app:verifyReleaseAudit

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee unit-test.log

      - name: Upload unit-test reports
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            unit-test.log
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-unlock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload unsigned release APK
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        continue-on-error: true
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36
          path: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          if-no-files-found: error


  screenshots:
    name: Capture real Android UI
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/0.9.2-roadmap-final-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build and capture authentic application screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:assembleDebug
            bash scripts/capture_app_screenshots.sh app/build/outputs/apk/debug/app-debug.apk build/screenshots/ui

      - name: Emit screenshots for quota-independent retrieval
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for path in sorted(Path("build/screenshots/ui").glob("*.png")):
              encoded=base64.b64encode(path.read_bytes()).decode("ascii")
              print("SCREENSHOT_BEGIN:" + path.name)
              for offset in range(0, len(encoded), 32000):
                  print(encoded[offset:offset + 32000])
              print("SCREENSHOT_END:" + path.name)
          PY
