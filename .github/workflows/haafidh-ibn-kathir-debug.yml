name: Quran Haafidh CP06 — intermediate APK only, no private titles
# CP-06 staging trigger receipt: 2026-10-15, frozen source 6db0e342.

on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
    paths:
      - .github/workflows/haafidh-ibn-kathir-debug.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: haafidh-1171-cp06-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verified-debug:
    # The workflow definition may evolve after CP-05, but the public intermediate
    # is always compiled from the exact frozen CP-05 source commit below.
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact frozen CP-05 source
        uses: actions/checkout@v4
        with:
          ref: 6db0e342684344634892d7da4b3c695a3138a232
          fetch-depth: 0
      - name: Require exact CP-05 commit and frozen application tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6db0e342684344634892d7da4b3c695a3138a232"
          test "$(git rev-parse HEAD:hifz-app)" = "92cb64b26c43d61db4e4605139fb6a725781fec6"
          bash -n scripts/ci_android_runtime_visual.sh
      - name: Enforce official 1.17.1 Hifz freeze and exact Quiz-removal exceptions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/guard_frozen_hifz_engines.sh
          bash scripts/audit_hifz_quiz_against_1171.sh
          python3 scripts/verify_authorized_quiz_reader_delta.py
      - name: Second contradictory audit, exact 23 icons and BOOX screen inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_j5_j7_contradictory.py
          python3 scripts/verify_contractual_ui_icons.py
          python3 scripts/verify_j6_icon_roles.py
          python3 scripts/audit_all_screen_icons.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android compileSdk 37 and build-tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run source contracts without replaying the frozen M8 matrix
        run: gradle --no-daemon :hifz-app:sourceContractTest --stacktrace
      - name: Assemble exactly ONE isolated DEBUG APK (never release)
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace
      - name: Export CP-06 build intermediate and Android signing tools (NO PRIVATE TITLES)
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "6db0e342684344634892d7da4b3c695a3138a232"
          out="$RUNNER_TEMP/haafidh-cp06-intermediate"
          mkdir -p "$out"
          mapfile -t apks < <(find hifz-app/build/outputs/apk/debug -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "$out/public-build-UNFINALIZED-debug.apk"
          python3 - "$out/public-build-UNFINALIZED-debug.apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              private=[name for name in archive.namelist()
                       if name.startswith('assets/ibn_kathir_qurancom_private/')]
          assert not private, private
          print('PASS: public intermediate contains zero private title assets')
          PY
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          test -f "$sdk/lib/apksigner.jar"
          test -f "$sdk/lib64/libc++.so"
          test -x "$sdk/zipalign"
          test -x "$sdk/aapt"
          cp "$sdk/lib/apksigner.jar" "$out/apksigner.jar"
          cp "$sdk/lib64/libc++.so" "$out/libc++.so"
          cp "$sdk/zipalign" "$out/zipalign"
          cp "$sdk/aapt" "$out/aapt"
          printf 'STAGING ONLY: this APK contains no private Ibn Kathir M7-B titles.\nDo not install or distribute as a final debug.\nCP-05 source SHA: %s\nApplication tree: %s\nPrivate titles will be inserted and signed only in a local private container.\n' "$source_sha" "$(git rev-parse HEAD:hifz-app)" > "$out/README_STAGING_ONLY.txt"
          sha256sum "$out/public-build-UNFINALIZED-debug.apk" "$out/apksigner.jar" "$out/libc++.so" "$out/zipalign" "$out/aapt" > "$out/staging.sha256"
          echo 'PASS: code-only build intermediate exported; no private assets in public CI.'
      - name: Keep temporary intermediate for private offline injection (24 hours only)
        uses: actions/upload-artifact@v4
        with:
          name: CP06-STAGING-NO-PRIVATE-TITLES-${{ github.sha }}
          path: ${{ runner.temp }}/haafidh-cp06-intermediate/
          retention-days: 1
          if-no-files-found: error
