name: Quran Haafidh M9 — intermediate APK only, no private titles

on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
    paths:
      - .github/workflows/haafidh-ibn-kathir-debug.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: haafidh-1171-itqan-4dates-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verified-debug:
    # Seven runtime tests include one live Itqan tap/recreate in the established
    # ReaderSevenDayRuntimeInstrumentedTest; publish only after exact-SHA proof.
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout EXACT tested branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint runtime proof scripts before checking independent evidence
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci_android_runtime_visual.sh
          python3 -m py_compile scripts/require_same_sha_ci.py
      - name: Require independent Hifz/source and seven-day Android pixel tests on SAME SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/haafidh-1171-ibn-kathir-integration-independent"
          python3 scripts/require_same_sha_ci.py
      - name: Enforce official 1.17.1 Hifz freeze and exact Quiz-removal exceptions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/guard_frozen_hifz_engines.sh
          bash scripts/audit_hifz_quiz_against_1171.sh
          python3 scripts/verify_authorized_quiz_reader_delta.py
      - name: Second contradictory audit, exact 23 icons and BOOX screen inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_j5_j7_contradictory.py
          python3 scripts/verify_contractual_ui_icons.py
          python3 scripts/verify_j6_icon_roles.py
          python3 scripts/audit_all_screen_icons.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android compileSdk 37 and build-tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run full Hifz behavioural tests and seven-day BOOX source contracts
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
      - name: Assemble exactly ONE isolated DEBUG APK (never release)
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace
      - name: Export M9 build intermediate and Android signing tools (NO PRIVATE TITLES)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          out="$RUNNER_TEMP/haafidh-m9-intermediate"
          mkdir -p "$out"
          mapfile -t apks < <(find hifz-app/build/outputs/apk/debug -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" "$out/public-build-UNFINALIZED-debug.apk"
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          test -f "$sdk/lib/apksigner.jar"
          test -x "$sdk/zipalign"
          cp "$sdk/lib/apksigner.jar" "$out/apksigner.jar"
          cp "$sdk/zipalign" "$out/zipalign"
          printf 'STAGING ONLY: this APK contains no private Ibn Kathir M7-B titles.\nDo not install or distribute as a final M9 debug.\nSource SHA: %s\nPrivate titles will be inserted and signed only in a local private container.\n' "$GITHUB_SHA" > "$out/README_STAGING_ONLY.txt"
          sha256sum "$out/public-build-UNFINALIZED-debug.apk" "$out/apksigner.jar" "$out/zipalign" > "$out/staging.sha256"
          echo 'PASS: code-only build intermediate exported; no private assets in public CI.'
      - name: Keep temporary intermediate for private offline injection (24 hours only)
        uses: actions/upload-artifact@v4
        with:
          name: M9-STAGING-NO-PRIVATE-TITLES-${{ github.sha }}
          path: ${{ runner.temp }}/haafidh-m9-intermediate/
          retention-days: 1
          if-no-files-found: error
