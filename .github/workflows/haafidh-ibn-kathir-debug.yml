name: Quran Haafidh 1.17.1 - AMORCES 7J unique final DEBUG APK

on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
    paths:
      - .github/workflows/haafidh-ibn-kathir-debug.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: haafidh-1171-ik-audit2-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verified-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout EXACT tested branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint runtime proof scripts before checking independent evidence
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci_android_runtime_visual.sh
          python3 -m py_compile scripts/require_same_sha_ci.py
      - name: Require independent Hifz/source and seven-day Android pixel tests on SAME SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/work/haafidh-1171-ibn-kathir-integration-independent"
          python3 scripts/require_same_sha_ci.py
      - name: Enforce official 1.17.1 Hifz freeze and exact Quiz-removal exceptions
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/guard_frozen_hifz_engines.sh
          bash scripts/audit_hifz_quiz_against_1171.sh
          python3 scripts/verify_authorized_quiz_reader_delta.py
      - name: Second contradictory audit, exact 23 icons and BOOX screen inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_j5_j7_contradictory.py
          python3 scripts/verify_contractual_ui_icons.py
          python3 scripts/verify_j6_icon_roles.py
          python3 scripts/audit_all_screen_icons.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android compileSdk 37 and build-tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run full Hifz behavioural tests and all revised BOOX source contracts
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
      - name: Assemble exactly ONE isolated DEBUG APK (never release)
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace
      - name: Verify identity, signature, packed corpus and cryptographic checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find hifz-app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          test -s "$apk"
          test "$(stat -c %s "$apk")" -gt 1000000
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "name='com.quransafeguard.hifz.ibnkathirtest'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "versionName='1.17.1-IbnKathir-DEBUG'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fxq 'assets/reader109/geometry.json' "$RUNNER_TEMP/apk-files.txt"
          grep -Eq '^assets/reader109/word-boxes/' "$RUNNER_TEMP/apk-files.txt"
          mkdir -p "$RUNNER_TEMP/haafidh-audit-critique-debug"
          output="Quran-Haafidh-1.17.1-AMORCES-7J-SANS-QUIZ-DEBUG.apk"
          cp "$apk" "$RUNNER_TEMP/haafidh-audit-critique-debug/$output"
          cp docs/AUDIT_CRITIQUE_7J_AMORCES_SANS_LISTES_2026-10-11.md "$RUNNER_TEMP/haafidh-audit-critique-debug/AUDIT_7J_AMORCES.md"
          printf "Official baseline: 7fd45bbe3d2e67a2e21c6f8ca1d5ae935d1f0d21\\nGitHub tested HEAD: %s\\nAndroid: six instrumented checks and 14 PNGs (Hifz, offline Amorces, no Quiz, seven days)\\nEnglish headings: 16 verified groups only; 1903 documentary starts; BOOX physical NOT certified.\\nNo production release. Independent test-only APK.\\n" "$GITHUB_SHA" > "$RUNNER_TEMP/haafidh-audit-critique-debug/BUILD_PROVENANCE.txt"
          (cd "$RUNNER_TEMP/haafidh-audit-critique-debug" && sha256sum "$output" > "$output.sha256")
          echo "SHA256 and signed package:"
          cat "$RUNNER_TEMP/haafidh-audit-critique-debug/$output.sha256"
          grep '^package:' "$RUNNER_TEMP/apk-badging.txt"
          echo "verified_debug_apk=$RUNNER_TEMP/haafidh-audit-critique-debug/$output" >> "$GITHUB_OUTPUT"
      - name: Publish ONLY the final APK debug + SHA256, no release
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Haafidh-1.17.1-AMORCES-7J-FINAL-DEBUG-${{ github.sha }}
          path: ${{ runner.temp }}/haafidh-audit-critique-debug/
          retention-days: 30
          if-no-files-found: error
      - name: Failure logs (never an APK)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Haafidh-7J-BLOCKERS-${{ github.sha }}
          path: |
            hifz-app/build/reports/tests/
            hifz-app/build/test-results/
            hifz-core/build/reports/tests/
          retention-days: 14
          if-no-files-found: warn
