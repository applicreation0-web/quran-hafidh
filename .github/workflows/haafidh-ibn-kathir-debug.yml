name: Quran Haafidh 1.17.1 Ibn Kathir DEBUG

on:
  push:
    branches:
      - work/haafidh-v3-ibn-kathir-from-1-17-1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haafidh-ibn-kathir-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test Hifz logic and documentary index
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest --stacktrace
      - name: Verify original source contracts
        run: gradle --no-daemon :hifz-app:sourceContractTest --stacktrace
      - name: Assemble isolated test APK
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace
      - name: Verify package and stage APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME"/build-tools/36.0.0/aapt dump badging "$apk" > /tmp/ibn-kathir-badging.txt
          grep -q "name='com.quransafeguard.hifz.ibnkathirtest'" /tmp/ibn-kathir-badging.txt
          grep -q "versionName='1.17.1-IbnKathir-DEBUG'" /tmp/ibn-kathir-badging.txt
          cp "$apk" "$RUNNER_TEMP/Quran-Haafidh-1.17.1-IbnKathir-DEBUG.apk"
          echo "path=$RUNNER_TEMP/Quran-Haafidh-1.17.1-IbnKathir-DEBUG.apk" >> "$GITHUB_OUTPUT"
          sha256sum "$RUNNER_TEMP/Quran-Haafidh-1.17.1-IbnKathir-DEBUG.apk"
      - name: Upload private debug test artifact only
        uses: actions/upload-artifact@v4
        with:
          name: quran-haafidh-1-17-1-ibn-kathir-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test reports if blocked
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ibn-kathir-test-failures-${{ github.sha }}
          path: |
            hifz-core/build/reports/tests/
            hifz-app/build/reports/tests/
            hifz-app/build/test-results/
          if-no-files-found: warn
