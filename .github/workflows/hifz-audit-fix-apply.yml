name: Apply Hifz Claude audit fixes

on:
  push:
    branches:
      - work/hifz-0.7.3-spec-update
    paths:
      - .github/workflows/hifz-audit-fix-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.3-spec-update
          fetch-depth: 0

      - name: Apply guarded P0 and P1 fixes
        shell: python
        run: |
          from pathlib import Path

          session_path = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java')
          session = session_path.read_text()
          session = session.replace('import com.quransafeguard.hifz.core.DailyPlan;\n', '', 1)

          start = session.find('    private int scheduledTargetMinutes(SessionKind kind) {')
          end = session.find('    private String displayModeName(){', start)
          if start < 0 or end < 0:
              raise SystemExit('P0 target-duration block not found')
          old_block = session[start:end]
          if 'absent du planning' not in old_block or 'planFor(' not in old_block:
              raise SystemExit('P0 audited throw/plan dependency not found in target block')
          new_block = '''    private int targetMinutes(){
              SessionKind kind;
              if (SABQI.equals(mode)) kind = SessionKind.SABQI_NEW;
              else if (SABQI_TODAY_REVIEW.equals(mode)) kind = SessionKind.SABQI_TODAY_REVIEW;
              else if (ITQAN.equals(mode)) kind = SessionKind.ITQAN;
              else if (RECENT_SABQI_REVIEW.equals(mode)) kind = SessionKind.RECENT_SABQI_REVIEW;
              else kind = SessionKind.OLD_ITQAN_MURAJAAH;
              return HifzSchedule.INSTANCE.targetMinutesFor(kind);
          }
'''
          session = session[:start] + new_block + session[end:]
          if 'scheduledTargetMinutes(' in session or 'absent du planning' in session:
              raise SystemExit('P0 stale schedule-dependent duration path remains')
          if 'HifzSchedule.INSTANCE.targetMinutesFor' not in session:
              raise SystemExit('P0 direct duration API missing after patch')

          prefs_path = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java')
          prefs = prefs_path.read_text()
          marker = '    static int indexAfterDeferral(int index, int size) {'
          pos = prefs.find(marker)
          if pos < 0:
              raise SystemExit('P1 insertion marker missing')
          if 'canonicalRecentOrder(' in prefs or 'withoutRecentBlocks(' in prefs:
              raise SystemExit('P1 canonical helpers unexpectedly already present')
          helpers = '''    static List<RecentSabqi> canonicalRecentOrder(List<RecentSabqi> source) {
              ArrayList<RecentSabqi> out = new ArrayList<>(source == null ? Collections.emptyList() : source);
              out.sort(Comparator.comparingInt((RecentSabqi item) -> item.startLine)
                  .thenComparingInt(item -> item.endLine));
              return out;
          }

          private static boolean sameRecentBlock(RecentSabqi left, RecentSabqi right) {
              return left.startLine == right.startLine && left.endLine == right.endLine;
          }

          static List<RecentSabqi> withoutRecentBlocks(List<RecentSabqi> source, List<RecentSabqi> removed) {
              ArrayList<RecentSabqi> out = new ArrayList<>();
              List<RecentSabqi> safeRemoved = removed == null ? Collections.emptyList() : removed;
              for (RecentSabqi item : source == null ? Collections.<RecentSabqi>emptyList() : source) {
                  boolean drop = false;
                  for (RecentSabqi candidate : safeRemoved) {
                      if (sameRecentBlock(item, candidate)) { drop = true; break; }
                  }
                  if (!drop) out.add(item);
              }
              return out;
          }

          public boolean removeRecentBlocks(List<RecentSabqi> removed) {
              List<RecentSabqi> source = recentSabqi();
              if (source.isEmpty()) return true;
              int currentAt = Math.floorMod(p.getInt("recentSabqiReviewIndex", 0), source.size());
              RecentSabqi displayed = source.get(currentAt);
              List<RecentSabqi> next = withoutRecentBlocks(source, removed);
              int nextIndex = 0;
              for (int i = 0; i < next.size(); i++) {
                  if (sameRecentBlock(next.get(i), displayed)) { nextIndex = i; break; }
              }
              return p.edit()
                  .putString("recentSabqi", recentJson(next))
                  .putInt("recentSabqiReviewIndex", next.isEmpty() ? 0 : nextIndex)
                  .commit();
          }

'''
          prefs = prefs[:pos] + helpers + prefs[pos:]
          prefs_path.write_text(prefs)

          rebalance_start = session.find('    /** Calendar/attendance promotion; speed never determines when a recent block leaves the queue. */')
          rebalance_end = session.find('    private RecentPromotionPolicy.Decision promotionStatus(', rebalance_start)
          if rebalance_start < 0 or rebalance_end < 0:
              raise SystemExit('P1 rebalance block boundaries missing')
          old_rebalance = session[rebalance_start:rebalance_end]
          if 'recent.get(0).startLine' not in old_rebalance or 'removeFirstRecentSabqi()' not in old_rebalance:
              raise SystemExit('P1 audited ordering assumption not found')
          new_rebalance = '''    /** Calendar/attendance promotion; display order never determines mastery order. */
          private void rebalanceRecentWindow() {
              List<HifzPrefs.RecentSabqi> recent = prefs.recentSabqi();
              if (recent.isEmpty()) return;
              List<HifzPrefs.RecentSabqi> canonical = HifzPrefs.canonicalRecentOrder(recent);
              LocalDate today = LocalDate.now();
              LocalDate activation = prefs.recentConsolidationActivatedOn();
              if (activation == null && recent.size() <= RecentPromotionPolicy.MAX_RECENT_BLOCKS) return;
              LocalDate plannedStart = activation == null ? today.plusDays(1) : activation;
              DashboardLedger ledger = new DashboardLedger(this);
              List<LocalDate> completed = activation == null
                  ? Collections.emptyList()
                  : ledger.completedDates(RECENT_SABQI_REVIEW, plannedStart, today);

              int oldestStart = canonical.get(0).startLine;
              int safeEnd = -1;
              int safeBlocks = 0;
              boolean forceOldest = canonical.size() > RecentPromotionPolicy.MAX_RECENT_BLOCKS;
              for (int i = 0; i < canonical.size(); i++) {
                  HifzPrefs.RecentSabqi item = canonical.get(i);
                  if (i > 0 && item.startLine != canonical.get(i - 1).endLine + 1) break;
                  RecentPromotionPolicy.Decision decision = RecentPromotionPolicy.evaluate(
                      item.addedOn, today, plannedStart, completed, canonical.size(), i == 0);
                  boolean include = decision.promote || (forceOldest && safeEnd < 0);
                  if (!include) break;
                  GeometryRepository.FiveLineBlock block = geometry.fiveLineBlock(item.startLine);
                  if (!block.endsInsideVerse) {
                      safeEnd = item.endLine;
                      safeBlocks = i + 1;
                      if (forceOldest) break;
                  }
              }
              if (safeEnd < oldestStart || safeBlocks <= 0) return;

              ArrayList<VerseRef> complete = new ArrayList<>(geometry.versesFullyCoveredByLines(oldestStart, safeEnd));
              if (complete.isEmpty()) return;
              if (!prefs.addPromotedVerses(complete)) {
                  onError("Impossible d’enregistrer la promotion de la Consolidation.");
                  return;
              }
              List<HifzPrefs.RecentSabqi> promotedBlocks = new ArrayList<>(canonical.subList(0, safeBlocks));
              if (!prefs.removeRecentBlocks(promotedBlocks)) {
                  onError("Impossible de retirer les blocs promus de la Consolidation.");
                  return;
              }
              recentReviewIndex = prefs.recentSabqiReviewIndex();
          }

'''
          session = session[:rebalance_start] + new_rebalance + session[rebalance_end:]
          if 'recent.get(0).startLine' in session[rebalance_start:rebalance_start + len(new_rebalance) + 200]:
              raise SystemExit('P1 stale display-order promotion dependency remains')
          if 'canonicalRecentOrder(recent)' not in session or 'removeRecentBlocks(promotedBlocks)' not in session:
              raise SystemExit('P1 canonical promotion path missing after patch')
          session_path.write_text(session)

          config = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/PreviewConfig.java').read_text()
          for required in ('ITQAN_LIGHT_VISIBLE_REPS = 20','ITQAN_LIGHT_25_REPS = 0','ITQAN_LIGHT_50_REPS = 5','ITQAN_LIGHT_75_REPS = 5','ITQAN_LIGHT_100_REPS = 5','ITQAN_LIGHT_TOTAL_REPS = 35','ITQAN_TOTAL_REPS = 40'):
              if required not in config:
                  raise SystemExit(f'Anchoring protocol changed unexpectedly: {required}')
          if 'itqanValidationPassed(int finalStageReveals)' not in config or 'finalStageReveals < 2' not in config:
              raise SystemExit('Approved 0-or-1 reveal validation rule changed unexpectedly')

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hifz-audit-fix-apply.yml
          git config user.name "applicreation0-web"
          git config user.email "applicreation0@gmail.com"
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java \
                  .github/workflows/hifz-audit-fix-apply.yml
          git diff --cached --check
          git commit -m "fix(hifz): close Claude audit P0 and promotion ordering"
          git push origin HEAD:work/hifz-0.7.3-spec-update
