name: Reader-like 0.10.7 refinement

on:
  push:
    branches:
      - "release/0.10.7-clean"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-reader-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.10.7-clean
          fetch-depth: 0

      - name: Apply calm reader-like refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Complete the global palette with explicit neutral Material containers.
          theme = 'app/src/main/java/com/quranunlock/guard/MainActivity.kt'
          replace_once(
              theme,
              '''    val colors = lightColorScheme(\n        primary = Color(0xFF3F4943),\n        onPrimary = Color(0xFFFFFBF3),\n        secondary = Color(0xFF6F665B),\n        tertiary = Color(0xFF5C5148),\n        background = Color(0xFFF5F0E6),\n        surface = Color(0xFFF8F3EA),\n        surfaceVariant = Color(0xFFE8E0D5),\n        onSurface = Color(0xFF292622),\n        onSurfaceVariant = Color(0xFF625D56),\n        outline = Color(0xFF9B9185),\n        error = Color(0xFF7A4D46),\n        onError = Color(0xFFFFFBF3)\n    )''',
              '''    val colors = lightColorScheme(\n        primary = Color(0xFF3F4943),\n        onPrimary = Color(0xFFFFFBF3),\n        primaryContainer = Color(0xFFE1E5E1),\n        onPrimaryContainer = Color(0xFF303732),\n        secondary = Color(0xFF6F665B),\n        onSecondary = Color(0xFFFFFBF3),\n        secondaryContainer = Color(0xFFE8E0D5),\n        onSecondaryContainer = Color(0xFF3A352F),\n        tertiary = Color(0xFF5C5148),\n        onTertiary = Color(0xFFFFFBF3),\n        tertiaryContainer = Color(0xFFE9E0D8),\n        onTertiaryContainer = Color(0xFF3E352F),\n        background = Color(0xFFF5F0E6),\n        onBackground = Color(0xFF292622),\n        surface = Color(0xFFF8F3EA),\n        surfaceVariant = Color(0xFFE8E0D5),\n        onSurface = Color(0xFF292622),\n        onSurfaceVariant = Color(0xFF625D56),\n        outline = Color(0xFF9B9185),\n        outlineVariant = Color(0xFFCFC5B8),\n        error = Color(0xFF7A4D46),\n        onError = Color(0xFFFFFBF3),\n        errorContainer = Color(0xFFF0E2DF),\n        onErrorContainer = Color(0xFF5B3934)\n    )'''
          )

          # 2) Tafsir: preserve established reading metrics; compact only chrome and false blank rows.
          panel = 'app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt'
          replace_once(panel, 'private const val COMMENTARY_LINE_HEIGHT_RATIO = 1.36f', 'private const val COMMENTARY_LINE_HEIGHT_RATIO = 1.50f')
          replace_once(panel, 'private const val NOTE_LINE_HEIGHT_RATIO = 1.34f', 'private const val NOTE_LINE_HEIGHT_RATIO = 1.45f')
          replace_once(panel, 'private const val POETRY_LINE_HEIGHT_RATIO = 1.46f', 'private const val POETRY_LINE_HEIGHT_RATIO = 1.55f')

          p = Path(panel)
          text = p.read_text(encoding='utf-8')
          start_anchor = '''            Column(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = 14.dp, vertical = 4.dp),\n                verticalArrangement = Arrangement.spacedBy(2.dp)\n            ) {'''
          start = text.find(start_anchor)
          end = text.find('\n\n            HorizontalDivider()', start)
          if start < 0 or end < 0:
              raise SystemExit('TafsirPanel compact-header anchors not found')
          compact_header = '''            Row(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = 8.dp, vertical = 1.dp),\n                horizontalArrangement = Arrangement.SpaceBetween\n            ) {\n                Box(modifier = Modifier.weight(1f)) {\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription =\n                                "Tafsîr ${selectedEdition.displayName}, sourate ${verse.surah}, verset ${verse.ayah}"\n                            stateDescription = selectedEdition.displayName\n                            heading()\n                        },\n                        enabled = availableEditions.size > 1,\n                        onClick = { menuExpanded = true }\n                    ) {\n                        Text(\n                            if (availableEditions.size > 1) {\n                                "${selectedEdition.displayName} ▾ · ${verse.surah}:${verse.ayah}"\n                            } else {\n                                "${selectedEdition.displayName} · ${verse.surah}:${verse.ayah}"\n                            },\n                            color = MaterialTheme.colorScheme.onSurface,\n                            fontWeight = FontWeight.SemiBold\n                        )\n                    }\n                    DropdownMenu(\n                        expanded = menuExpanded && availableEditions.size > 1,\n                        onDismissRequest = { menuExpanded = false }\n                    ) {\n                        availableEditions.forEach { edition ->\n                            DropdownMenuItem(\n                                text = { Text(edition.displayName) },\n                                onClick = {\n                                    menuExpanded = false\n                                    onEditionSelected(edition)\n                                }\n                            )\n                        }\n                    }\n                }\n                Row {\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription = "Réduire la taille du commentaire"\n                        },\n                        enabled = fontSize > MIN_FONT_SIZE,\n                        onClick = { changeFont(-2f) }\n                    ) { Text("A−") }\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription = "Agrandir la taille du commentaire"\n                        },\n                        enabled = fontSize < MAX_FONT_SIZE,\n                        onClick = { changeFont(2f) }\n                    ) { Text("A+") }\n                }\n            }'''
          p.write_text(text[:start] + compact_header + text[end:], encoding='utf-8')
          replace_once(panel, 'Poésie · disposition de l’édition source', 'Poésie · lignes conservées selon l’édition source')

          # 3) Reader: safe areas + obvious retractable chrome + smaller lower command area.
          reader = 'app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt'
          replace_once(reader, 'import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.navigationBarsPadding\nimport androidx.compose.foundation.layout.statusBarsPadding\n')
          replace_once(reader, 'import androidx.compose.material3.Text\n', 'import androidx.compose.material3.Text\nimport androidx.compose.material3.TextButton\n')
          replace_once(reader, 'val shellSecondary = if (darkShell) Color(0xFFD2AE6C) else MaterialTheme.colorScheme.secondary', 'val shellSecondary = if (darkShell) Color(0xFFBDB5A9) else MaterialTheme.colorScheme.secondary')
          replace_once(
              reader,
              '''                            modifier = Modifier\n                                .fillMaxSize()\n                                .padding(vertical = if (chromeHidden) 0.dp else 2.dp)''',
              '''                            modifier = Modifier\n                                .fillMaxSize()\n                                .statusBarsPadding()\n                                .navigationBarsPadding()\n                                .padding(vertical = if (chromeHidden) 0.dp else 2.dp)'''
          )
          replace_once(
              reader,
              '''                                    if (!referenceMode && selectedTafsirVerse == null) {\n                                        Text(\n                                            "Aa / ☼",\n                                            modifier = Modifier\n                                                .clickable {\n                                                    comfortOpen = !comfortOpen\n                                                    if (comfortOpen) quickNavOpen = false\n                                                }\n                                                .padding(horizontal = 8.dp, vertical = 6.dp),\n                                            style = MaterialTheme.typography.bodyMedium,\n                                            color = shellSecondary,\n                                            fontWeight = FontWeight.Bold\n                                        )\n                                    }''',
              '''                                    if (!referenceMode && selectedTafsirVerse == null) {\n                                        Text(\n                                            "Aa / ☼",\n                                            modifier = Modifier\n                                                .clickable {\n                                                    comfortOpen = !comfortOpen\n                                                    if (comfortOpen) quickNavOpen = false\n                                                }\n                                                .padding(horizontal = 7.dp, vertical = 5.dp),\n                                            style = MaterialTheme.typography.bodyMedium,\n                                            color = shellSecondary,\n                                            fontWeight = FontWeight.SemiBold\n                                        )\n                                        Text(\n                                            "Masquer",\n                                            modifier = Modifier\n                                                .clickable {\n                                                    pureReading = true\n                                                    comfortOpen = false\n                                                    quickNavOpen = false\n                                                }\n                                                .padding(horizontal = 7.dp, vertical = 5.dp),\n                                            style = MaterialTheme.typography.bodySmall,\n                                            color = shellMuted,\n                                            fontWeight = FontWeight.SemiBold\n                                        )\n                                    }'''
          )
          replace_once(
              reader,
              '''                                                SafeguardButton(\n                                                    modifier = Modifier.weight(1f),\n                                                    onClick = {\n                                                        pureReading = true\n                                                        comfortOpen = false\n                                                    }\n                                                ) { Text("Masquer les commandes") }''',
              '''                                                SafeguardOutlinedButton(\n                                                    modifier = Modifier.weight(1f),\n                                                    onClick = { comfortOpen = false }\n                                                ) { Text("Fermer") }'''
          )
          replace_once(
              reader,
              '''                                    Row(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        horizontalArrangement = Arrangement.spacedBy(8.dp)\n                                    ) {\n                                        SafeguardOutlinedButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null && page > FIRST_PAGE,\n                                            onClick = { showPage(page - 1) }\n                                        ) {\n                                            Text("Précédente")\n                                        }\n                                        SafeguardButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null && page < LAST_PAGE,\n                                            onClick = { showPage(page + 1) }\n                                        ) {\n                                            Text("Suivante")\n                                        }\n                                    }\n                                    Spacer(Modifier.height(2.dp))\n                                    SafeguardOutlinedButton(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        enabled = selectedTafsirVerse == null,\n                                        onClick = { toggleBookmark() }\n                                    ) {\n                                        Text(\n                                            if (page in bookmarkPages) {\n                                                "Retirer le signet • p. $page"\n                                            } else {\n                                                "Ajouter un signet • p. $page"\n                                            }\n                                        )\n                                    }''',
              '''                                    Row(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        horizontalArrangement = Arrangement.spacedBy(6.dp)\n                                    ) {\n                                        SafeguardOutlinedButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null && page > FIRST_PAGE,\n                                            onClick = { showPage(page - 1) }\n                                        ) { Text("Préc.") }\n                                        SafeguardOutlinedButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null,\n                                            onClick = { toggleBookmark() }\n                                        ) { Text(if (page in bookmarkPages) "Signet ✓" else "Signet") }\n                                        SafeguardOutlinedButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null && page < LAST_PAGE,\n                                            onClick = { showPage(page + 1) }\n                                        ) { Text("Suiv.") }\n                                    }'''
          )
          replace_once(
              reader,
              '''                                    Spacer(Modifier.height(2.dp))\n                                    SafeguardOutlinedButton(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        enabled = selectedTafsirVerse == null,\n                                        onClick = { finish() }\n                                    ) {\n                                        Text("Fermer la lecture")\n                                    }''',
              '''                                    TextButton(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        enabled = selectedTafsirVerse == null,\n                                        onClick = { finish() }\n                                    ) { Text("Fermer") }'''
          )
          replace_once(
              reader,
              '''                        if (chromeHidden && !referenceMode && selectedTafsirVerse == null) {\n                            Text(\n                                "Aa / ☼",\n                                modifier = Modifier\n                                    .align(Alignment.TopEnd)\n                                    .padding(8.dp)\n                                    .clickable { comfortOpen = true }\n                                    .padding(horizontal = 9.dp, vertical = 7.dp),\n                                style = MaterialTheme.typography.bodyMedium,\n                                color = Color(0xFFD2AE6C),\n                                fontWeight = FontWeight.Bold\n                            )\n                        }''',
              '''                        if (chromeHidden && !referenceMode && selectedTafsirVerse == null) {\n                            Text(\n                                "Afficher",\n                                modifier = Modifier\n                                    .align(Alignment.TopEnd)\n                                    .padding(6.dp)\n                                    .clickable { pureReading = false }\n                                    .padding(horizontal = 8.dp, vertical = 5.dp),\n                                style = MaterialTheme.typography.bodySmall,\n                                color = shellMuted,\n                                fontWeight = FontWeight.SemiBold\n                            )\n                        }'''
          )
          # Two expandable tools: same page color, no raised-card feeling.
          rp = Path(reader)
          rt = rp.read_text(encoding='utf-8')
          needle = '''                                        shape = MaterialTheme.shapes.medium,\n                                        tonalElevation = 0.dp'''
          if rt.count(needle) != 2:
              raise SystemExit(f'expected 2 reader tool surfaces, got {rt.count(needle)}')
          rp.write_text(rt.replace(needle, '''                                        shape = MaterialTheme.shapes.small,\n                                        color = shellColor,\n                                        tonalElevation = 0.dp'''), encoding='utf-8')

          # 4) Dashboard: status should be clear without a saturated block.
          dash = 'app/src/main/java/com/quranunlock/guard/DashboardActivity.kt'
          replace_once(
              dash,
              '''                    colors = CardDefaults.elevatedCardColors(\n                        containerColor = if (serviceEnabled) {\n                            MaterialTheme.colorScheme.primary\n                        } else {\n                            MaterialTheme.colorScheme.surfaceVariant\n                        }\n                    ),\n                    elevation = CardDefaults.elevatedCardElevation(defaultElevation = 1.dp)''',
              '''                    colors = CardDefaults.elevatedCardColors(\n                        containerColor = MaterialTheme.colorScheme.surfaceVariant\n                    ),\n                    elevation = CardDefaults.elevatedCardElevation(defaultElevation = 0.dp)'''
          )
          replace_once(
              dash,
              '''                            color = if (serviceEnabled) {\n                                MaterialTheme.colorScheme.onPrimary\n                            } else {\n                                MaterialTheme.colorScheme.error\n                            },''',
              '''                            color = if (serviceEnabled) {\n                                MaterialTheme.colorScheme.primary\n                            } else {\n                                MaterialTheme.colorScheme.error\n                            },'''
          )
          replace_once(
              dash,
              '''                            color = if (serviceEnabled) {\n                                MaterialTheme.colorScheme.onPrimary.copy(alpha = 0.84f)\n                            } else {\n                                MaterialTheme.colorScheme.onSurfaceVariant\n                            }''',
              '''                            color = MaterialTheme.colorScheme.onSurfaceVariant'''
          )

          # Minimal non-brittle invariants.
          assert 'Qushayri' in Path('app/src/plus/java/com/quranunlock/guard/MultiTafsirRepository.kt').read_text(encoding='utf-8')
          assert 'statusBarsPadding()' in Path(reader).read_text(encoding='utf-8')
          assert 'COMMENTARY_LINE_HEIGHT_RATIO = 1.50f' in Path(panel).read_text(encoding='utf-8')
          print('calm reader-like refinement applied')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Fetch canonical Mushaf
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Unit tests Light and Plus
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest

      - name: Commit tested refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/quranunlock/guard/MainActivity.kt \
                  app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt \
                  app/src/main/java/com/quranunlock/guard/DashboardActivity.kt \
                  app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt
          git diff --cached --quiet && exit 0
          git commit -m "Refine 0.10.7 for calm reader-like UI [skip ci]"
          git push origin HEAD:release/0.10.7-clean
