name: Reader-like 0.10.7 refinement

on:
  push:
    branches:
      - "release/0.10.7-clean"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-reader-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.10.7-clean
          fetch-depth: 0

      - name: Apply reader-like refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def all_(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, got {count}: {old[:100]!r}')
              if count == 0:
                  raise SystemExit(f'{path}: no occurrence: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Complete the neutral cream palette so Material defaults never reintroduce bright accents.
          theme = 'app/src/main/java/com/quranunlock/guard/MainActivity.kt'
          one(
              theme,
              '''    val colors = lightColorScheme(\n        primary = Color(0xFF3F4943),\n        onPrimary = Color(0xFFFFFBF3),\n        secondary = Color(0xFF6F665B),\n        tertiary = Color(0xFF5C5148),\n        background = Color(0xFFF5F0E6),\n        surface = Color(0xFFF8F3EA),\n        surfaceVariant = Color(0xFFE8E0D5),\n        onSurface = Color(0xFF292622),\n        onSurfaceVariant = Color(0xFF625D56),\n        outline = Color(0xFF9B9185),\n        error = Color(0xFF7A4D46),\n        onError = Color(0xFFFFFBF3)\n    )''',
              '''    val colors = lightColorScheme(\n        primary = Color(0xFF3F4943),\n        onPrimary = Color(0xFFFFFBF3),\n        primaryContainer = Color(0xFFE1E5E1),\n        onPrimaryContainer = Color(0xFF303732),\n        secondary = Color(0xFF6F665B),\n        onSecondary = Color(0xFFFFFBF3),\n        secondaryContainer = Color(0xFFE8E0D5),\n        onSecondaryContainer = Color(0xFF3A352F),\n        tertiary = Color(0xFF5C5148),\n        onTertiary = Color(0xFFFFFBF3),\n        tertiaryContainer = Color(0xFFE9E0D8),\n        onTertiaryContainer = Color(0xFF3E352F),\n        background = Color(0xFFF5F0E6),\n        onBackground = Color(0xFF292622),\n        surface = Color(0xFFF8F3EA),\n        surfaceVariant = Color(0xFFE8E0D5),\n        onSurface = Color(0xFF292622),\n        onSurfaceVariant = Color(0xFF625D56),\n        outline = Color(0xFF9B9185),\n        outlineVariant = Color(0xFFCFC5B8),\n        error = Color(0xFF7A4D46),\n        onError = Color(0xFFFFFBF3),\n        errorContainer = Color(0xFFF0E2DF),\n        onErrorContainer = Color(0xFF5B3934)\n    )'''
          )

          # Tafsir: established reading typography stays intact. False blank rows are handled separately.
          panel = 'app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt'
          one(panel, 'private const val COMMENTARY_LINE_HEIGHT_RATIO = 1.36f', 'private const val COMMENTARY_LINE_HEIGHT_RATIO = 1.50f')
          one(panel, 'private const val NOTE_LINE_HEIGHT_RATIO = 1.34f', 'private const val NOTE_LINE_HEIGHT_RATIO = 1.45f')
          one(panel, 'private const val POETRY_LINE_HEIGHT_RATIO = 1.46f', 'private const val POETRY_LINE_HEIGHT_RATIO = 1.55f')

          old_header = '''            Column(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = 14.dp, vertical = 4.dp),\n                verticalArrangement = Arrangement.spacedBy(2.dp)\n            ) {\n                Row(\n                    modifier = Modifier.fillMaxWidth(),\n                    horizontalArrangement = Arrangement.SpaceBetween\n                ) {\n                    Text(\n                        text = "Sourate ${verse.surah}, verset ${verse.ayah}",\n                        modifier = Modifier.semantics { heading() },\n                        style = MaterialTheme.typography.bodyMedium,\n                        color = MaterialTheme.colorScheme.onSurfaceVariant,\n                        fontWeight = FontWeight.SemiBold\n                    )\n                    Row {\n                        TextButton(\n                            modifier = Modifier.semantics {\n                                contentDescription = "Réduire la taille du commentaire"\n                            },\n                            enabled = fontSize > MIN_FONT_SIZE,\n                            onClick = { changeFont(-2f) }\n                        ) {\n                            Text("A−")\n                        }\n                        TextButton(\n                            modifier = Modifier.semantics {\n                                contentDescription = "Agrandir la taille du commentaire"\n                            },\n                            enabled = fontSize < MAX_FONT_SIZE,\n                            onClick = { changeFont(2f) }\n                        ) {\n                            Text("A+")\n                        }\n                    }\n                }\n\n                Box {\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription = "Choisir le Tafsîr"\n                            stateDescription = selectedEdition.displayName\n                        },\n                        enabled = availableEditions.size > 1,\n                        onClick = { menuExpanded = true }\n                    ) {\n                        Text(\n                            if (availableEditions.size > 1) {\n                                "${selectedEdition.displayName} ▾"\n                            } else {\n                                selectedEdition.displayName\n                            },\n                            fontWeight = FontWeight.SemiBold\n                        )\n                    }\n                    DropdownMenu(\n                        expanded = menuExpanded && availableEditions.size > 1,\n                        onDismissRequest = { menuExpanded = false }\n                    ) {\n                        availableEditions.forEach { edition ->\n                            DropdownMenuItem(\n                                text = { Text(edition.displayName) },\n                                onClick = {\n                                    menuExpanded = false\n                                    onEditionSelected(edition)\n                                }\n                            )\n                        }\n                    }\n                }\n            }'''
          new_header = '''            Row(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .padding(horizontal = 8.dp, vertical = 1.dp),\n                horizontalArrangement = Arrangement.SpaceBetween\n            ) {\n                Box(modifier = Modifier.weight(1f)) {\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription =\n                                "Tafsîr ${selectedEdition.displayName}, sourate ${verse.surah}, verset ${verse.ayah}"\n                            stateDescription = selectedEdition.displayName\n                            heading()\n                        },\n                        enabled = availableEditions.size > 1,\n                        onClick = { menuExpanded = true }\n                    ) {\n                        Text(\n                            if (availableEditions.size > 1) {\n                                "${selectedEdition.displayName} ▾ · ${verse.surah}:${verse.ayah}"\n                            } else {\n                                "${selectedEdition.displayName} · ${verse.surah}:${verse.ayah}"\n                            },\n                            color = MaterialTheme.colorScheme.onSurface,\n                            fontWeight = FontWeight.SemiBold\n                        )\n                    }\n                    DropdownMenu(\n                        expanded = menuExpanded && availableEditions.size > 1,\n                        onDismissRequest = { menuExpanded = false }\n                    ) {\n                        availableEditions.forEach { edition ->\n                            DropdownMenuItem(\n                                text = { Text(edition.displayName) },\n                                onClick = {\n                                    menuExpanded = false\n                                    onEditionSelected(edition)\n                                }\n                            )\n                        }\n                    }\n                }\n                Row {\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription = "Réduire la taille du commentaire"\n                        },\n                        enabled = fontSize > MIN_FONT_SIZE,\n                        onClick = { changeFont(-2f) }\n                    ) {\n                        Text("A−")\n                    }\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription = "Agrandir la taille du commentaire"\n                        },\n                        enabled = fontSize < MAX_FONT_SIZE,\n                        onClick = { changeFont(2f) }\n                    ) {\n                        Text("A+")\n                    }\n                }\n            }'''
          one(panel, old_header, new_header)
          one(panel, 'Poésie · disposition de l’édition source', 'Poésie · lignes conservées selon l’édition source')

          # Reader: system-safe, retractable, fewer persistent controls, neutral shells.
          reader = 'app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt'
          one(reader, 'import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.navigationBarsPadding\nimport androidx.compose.foundation.layout.statusBarsPadding\n')
          one(reader, 'import androidx.compose.material3.Text\n', 'import androidx.compose.material3.Text\nimport androidx.compose.material3.TextButton\n')
          one(reader, 'val shellSecondary = if (darkShell) Color(0xFFD2AE6C) else MaterialTheme.colorScheme.secondary', 'val shellSecondary = if (darkShell) Color(0xFFBDB5A9) else MaterialTheme.colorScheme.secondary')
          one(
              reader,
              '''                            modifier = Modifier\n                                .fillMaxSize()\n                                .padding(vertical = if (chromeHidden) 0.dp else 2.dp)''',
              '''                            modifier = Modifier\n                                .fillMaxSize()\n                                .statusBarsPadding()\n                                .navigationBarsPadding()\n                                .padding(vertical = if (chromeHidden) 0.dp else 2.dp)'''
          )

          old_top_control = '''                                    if (!referenceMode && selectedTafsirVerse == null) {\n                                        Text(\n                                            "Aa / ☼",\n                                            modifier = Modifier\n                                                .clickable {\n                                                    comfortOpen = !comfortOpen\n                                                    if (comfortOpen) quickNavOpen = false\n                                                }\n                                                .padding(horizontal = 8.dp, vertical = 6.dp),\n                                            style = MaterialTheme.typography.bodyMedium,\n                                            color = shellSecondary,\n                                            fontWeight = FontWeight.Bold\n                                        )\n                                    }'''
          new_top_control = '''                                    if (!referenceMode && selectedTafsirVerse == null) {\n                                        Text(\n                                            "Aa / ☼",\n                                            modifier = Modifier\n                                                .clickable {\n                                                    comfortOpen = !comfortOpen\n                                                    if (comfortOpen) quickNavOpen = false\n                                                }\n                                                .padding(horizontal = 7.dp, vertical = 5.dp),\n                                            style = MaterialTheme.typography.bodyMedium,\n                                            color = shellSecondary,\n                                            fontWeight = FontWeight.SemiBold\n                                        )\n                                        Text(\n                                            "Masquer",\n                                            modifier = Modifier\n                                                .clickable {\n                                                    pureReading = true\n                                                    comfortOpen = false\n                                                    quickNavOpen = false\n                                                }\n                                                .padding(horizontal = 7.dp, vertical = 5.dp),\n                                            style = MaterialTheme.typography.bodySmall,\n                                            color = shellMuted,\n                                            fontWeight = FontWeight.SemiBold\n                                        )\n                                    }'''
          one(reader, old_top_control, new_top_control)

          old_comfort_hide = '''                                                SafeguardButton(\n                                                    modifier = Modifier.weight(1f),\n                                                    onClick = {\n                                                        pureReading = true\n                                                        comfortOpen = false\n                                                    }\n                                                ) { Text("Masquer les commandes") }'''
          new_comfort_hide = '''                                                SafeguardOutlinedButton(\n                                                    modifier = Modifier.weight(1f),\n                                                    onClick = { comfortOpen = false }\n                                                ) { Text("Fermer") }'''
          one(reader, old_comfort_hide, new_comfort_hide)

          old_bottom = '''                                    Row(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        horizontalArrangement = Arrangement.spacedBy(8.dp)\n                                    ) {\n                                        SafeguardOutlinedButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null && page > FIRST_PAGE,\n                                            onClick = { showPage(page - 1) }\n                                        ) {\n                                            Text("Précédente")\n                                        }\n                                        SafeguardButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null && page < LAST_PAGE,\n                                            onClick = { showPage(page + 1) }\n                                        ) {\n                                            Text("Suivante")\n                                        }\n                                    }\n                                    Spacer(Modifier.height(2.dp))\n                                    SafeguardOutlinedButton(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        enabled = selectedTafsirVerse == null,\n                                        onClick = { toggleBookmark() }\n                                    ) {\n                                        Text(\n                                            if (page in bookmarkPages) {\n                                                "Retirer le signet • p. $page"\n                                            } else {\n                                                "Ajouter un signet • p. $page"\n                                            }\n                                        )\n                                    }'''
          new_bottom = '''                                    Row(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        horizontalArrangement = Arrangement.spacedBy(6.dp)\n                                    ) {\n                                        SafeguardOutlinedButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null && page > FIRST_PAGE,\n                                            onClick = { showPage(page - 1) }\n                                        ) {\n                                            Text("Préc.")\n                                        }\n                                        SafeguardOutlinedButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null,\n                                            onClick = { toggleBookmark() }\n                                        ) {\n                                            Text(if (page in bookmarkPages) "Signet ✓" else "Signet")\n                                        }\n                                        SafeguardOutlinedButton(\n                                            modifier = Modifier.weight(1f),\n                                            enabled = selectedTafsirVerse == null && page < LAST_PAGE,\n                                            onClick = { showPage(page + 1) }\n                                        ) {\n                                            Text("Suiv.")\n                                        }\n                                    }'''
          one(reader, old_bottom, new_bottom)

          old_close = '''                                    Spacer(Modifier.height(2.dp))\n                                    SafeguardOutlinedButton(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        enabled = selectedTafsirVerse == null,\n                                        onClick = { finish() }\n                                    ) {\n                                        Text("Fermer la lecture")\n                                    }'''
          new_close = '''                                    TextButton(\n                                        modifier = Modifier\n                                            .fillMaxWidth()\n                                            .padding(horizontal = 10.dp),\n                                        enabled = selectedTafsirVerse == null,\n                                        onClick = { finish() }\n                                    ) {\n                                        Text("Fermer")\n                                    }'''
          one(reader, old_close, new_close)

          old_hidden = '''                        if (chromeHidden && !referenceMode && selectedTafsirVerse == null) {\n                            Text(\n                                "Aa / ☼",\n                                modifier = Modifier\n                                    .align(Alignment.TopEnd)\n                                    .padding(8.dp)\n                                    .clickable { comfortOpen = true }\n                                    .padding(horizontal = 9.dp, vertical = 7.dp),\n                                style = MaterialTheme.typography.bodyMedium,\n                                color = Color(0xFFD2AE6C),\n                                fontWeight = FontWeight.Bold\n                            )\n                        }'''
          new_hidden = '''                        if (chromeHidden && !referenceMode && selectedTafsirVerse == null) {\n                            Text(\n                                "Afficher",\n                                modifier = Modifier\n                                    .align(Alignment.TopEnd)\n                                    .padding(6.dp)\n                                    .clickable { pureReading = false }\n                                    .padding(horizontal = 8.dp, vertical = 5.dp),\n                                style = MaterialTheme.typography.bodySmall,\n                                color = shellMuted,\n                                fontWeight = FontWeight.SemiBold\n                            )\n                        }'''
          one(reader, old_hidden, new_hidden)

          # The two optional tool panels visually merge into the page rather than form raised cards.
          all_(
              reader,
              '''                                        shape = MaterialTheme.shapes.medium,\n                                        tonalElevation = 0.dp''',
              '''                                        shape = MaterialTheme.shapes.small,\n                                        color = shellColor,\n                                        tonalElevation = 0.dp''',
              expected=2
          )

          # Dashboard: remove the large saturated status card; status remains clear through text and iconography.
          dash = 'app/src/main/java/com/quranunlock/guard/DashboardActivity.kt'
          one(
              dash,
              '''                    colors = CardDefaults.elevatedCardColors(\n                        containerColor = if (serviceEnabled) {\n                            MaterialTheme.colorScheme.primary\n                        } else {\n                            MaterialTheme.colorScheme.surfaceVariant\n                        }\n                    ),\n                    elevation = CardDefaults.elevatedCardElevation(defaultElevation = 1.dp)''',
              '''                    colors = CardDefaults.elevatedCardColors(\n                        containerColor = MaterialTheme.colorScheme.surfaceVariant\n                    ),\n                    elevation = CardDefaults.elevatedCardElevation(defaultElevation = 0.dp)'''
          )
          one(
              dash,
              '''                            color = if (serviceEnabled) {\n                                MaterialTheme.colorScheme.onPrimary\n                            } else {\n                                MaterialTheme.colorScheme.error\n                            },''',
              '''                            color = if (serviceEnabled) {\n                                MaterialTheme.colorScheme.primary\n                            } else {\n                                MaterialTheme.colorScheme.error\n                            },'''
          )
          one(
              dash,
              '''                            color = if (serviceEnabled) {\n                                MaterialTheme.colorScheme.onPrimary.copy(alpha = 0.84f)\n                            } else {\n                                MaterialTheme.colorScheme.onSurfaceVariant\n                            }''',
              '''                            color = MaterialTheme.colorScheme.onSurfaceVariant'''
          )

          # Guardrails: author labels remain the primary Tafsir names.
          repo = Path('app/src/plus/java/com/quranunlock/guard/MultiTafsirRepository.kt').read_text(encoding='utf-8')
          panel_text = Path(panel).read_text(encoding='utf-8')
          reader_text = Path(reader).read_text(encoding='utf-8')
          assert 'JALALAYN("jalalayn", "Jalalayn")' in repo
          assert 'QURTUBI("qurtubi", "Qurtubi")' in repo
          assert 'QUSHAYRI("qushayri", "Qushayri")' in repo
          assert 'Laṭāʾif al-ishārāt' not in panel_text
          assert 'COMMENTARY_LINE_HEIGHT_RATIO = 1.50f' in panel_text
          assert 'Regex("\\\\n{2,}")' in panel_text
          assert 'statusBarsPadding()' in reader_text
          assert 'Text("Afficher")' in reader_text
          print('Reader-like 0.10.7 refinement applied')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Fetch canonical Mushaf
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Unit tests Light and Plus
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest

      - name: Commit tested reader-like refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/quranunlock/guard/MainActivity.kt \
                  app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt \
                  app/src/main/java/com/quranunlock/guard/DashboardActivity.kt \
                  app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine 0.10.7 for calm reader-like UI [skip ci]"
          git push origin HEAD:release/0.10.7-clean
