name: Quran Hifz one-shot final port

on:
  push:
    branches:
      - release/hifz-0.7.3-final

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/hifz-0.7.3-final
          fetch-depth: 0

      - name: Apply reviewed evening Murajaah patch only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}')
              p.write_text(text.replace(old,new,1))

          session='hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java'
          replace_once(session,
          '''        long elapsed=clock.elapsedMs();\n        if(recent.isEmpty() || elapsed>=PreviewConfig.MURAJAAH_RECENT_SABQI_MINUTES_WORKING*60_000L){\n''',
          '''        long elapsed=clock.elapsedMs();\n        int totalRecentLines=recentLineCount(recent);\n        if(recent.isEmpty() || PreviewConfig.recentMurajaahComplete(recentLinesDone,totalRecentLines,elapsed)){\n''')
          replace_once(session,
          '''        if (!takeRepLock()) return;\n        if (prefs.recentSabqi().isEmpty()) { transitionToBlockB(clock.elapsedMs()); return; }\n        recentLinesDone+=PreviewConfig.SABQI_LINES;\n        long elapsed=clock.elapsedMs();\n        prefs.setMurajaahRuntime("A",null,recentLinesDone,elapsed,0L);\n        if (elapsed>=PreviewConfig.MURAJAAH_RECENT_SABQI_MINUTES_WORKING*60_000L) transitionToBlockB(elapsed);\n        else renderMode();\n    }\n\n    private void transitionToBlockB(long elapsed) {\n''',
          '''        if (!takeRepLock()) return;\n        List<HifzPrefs.RecentSabqi> recent=prefs.recentSabqi();\n        if (recent.isEmpty()) { transitionToBlockB(clock.elapsedMs()); return; }\n        recentLinesDone+=PreviewConfig.SABQI_LINES;\n        long elapsed=clock.elapsedMs();\n        prefs.setMurajaahRuntime("A",null,recentLinesDone,elapsed,0L);\n        if (PreviewConfig.recentMurajaahComplete(recentLinesDone,recentLineCount(recent),elapsed)) transitionToBlockB(elapsed);\n        else renderMode();\n    }\n\n    private int recentLineCount(List<HifzPrefs.RecentSabqi> recent) {\n        int total=0;\n        for(HifzPrefs.RecentSabqi item:recent) total+=Math.max(0,item.endLine-item.startLine+1);\n        return total;\n    }\n\n    private void transitionToBlockB(long elapsed) {\n''')

          main='hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java'
          replace_once(main,
          '''        ScheduledSession scheduled = HifzSchedule.INSTANCE.scheduled(date, prefs.programStartDate(), date);\n        if (scheduled == null) return;\n        switch (scheduled.getType()) {\n''',
          '''        ScheduledSession scheduled = HifzSchedule.INSTANCE.scheduled(date, prefs.programStartDate(), date);\n        if (scheduled == null) return;\n        String todayKey = date.toString();\n        boolean eveningMurajaah = HifzSchedule.INSTANCE.hasEveningMurajaah(date.getDayOfWeek());\n        if (eveningMurajaah && todayKey.equals(prefs.lastItqanDate()) && !todayKey.equals(prefs.lastMurajaahDate())) {\n            openMode(HifzSessionActivity.MURAJAAH);\n            return;\n        }\n        switch (scheduled.getType()) {\n''')
          replace_once(main,
          '''        String detail;\n        try {\n            SessionType kind = scheduled.getType();\n''',
          '''        String detail;\n        try {\n            String todayKey = date.toString();\n            boolean eveningMurajaah = HifzSchedule.INSTANCE.hasEveningMurajaah(date.getDayOfWeek());\n            if (eveningMurajaah && todayKey.equals(prefs.lastItqanDate())) {\n                detail = todayKey.equals(prefs.lastMurajaahDate())\n                    ? "Itqān ✓ · Murājaʿah ✓"\n                    : "Soir · Murājaʿah · Bloc " + prefs.murajaahPhase();\n                today.setText(detail);\n                todayAction.setEnabled(true);\n                return;\n            }\n            SessionType kind = scheduled.getType();\n''')
          PY

          rm .github/workflows/hifz-final-port.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java \
                  .github/workflows/hifz-final-port.yml
          git commit -m 'feat(hifz): integrate evening Murajaah runtime routing'
          git push origin HEAD:release/hifz-0.7.3-final
