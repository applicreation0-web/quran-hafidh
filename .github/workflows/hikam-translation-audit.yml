name: Hikam translation cross-audit

on:
  push:
    branches:
      - plus-rtl-free-reader-hikam-reference
  pull_request:
    branches:
      - main

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Audit 264 French translations against English reference
        run: python scripts/audit_hikam_translation_against_islamicpearls.py
