name: Haafidh 1.17.5 Android emulator audit — no publication
on:
  push:
    branches:
      - work/haafidh-1175-boox-ux-hifz-atlas
    paths:
      - '.github/workflows/haafidh-1175-android-audit.yml'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzBacklog.java'
      - 'hifz-app/src/main/res/drawable/ic_palace_*.xml'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/BooxFlowStroke.java'
      - 'hifz-app/src/test/java/com/quransafeguard/hifz/preview/WeeklyProgramPolicyTest.java'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-1175-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: SDK and 604 original QCF pages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Frozen Hifz, Atlas and icon contracts
        run: |
          bash scripts/guard_frozen_hifz_engines.sh
          python3 scripts/verify_atlas_only_purity.py
          python3 scripts/verify_contractual_ui_icons.py
      - name: KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android mask, QCF, migration, persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon :hifz-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.quransafeguard.hifz.preview.BackupSchemaRejectedInstrumentedTest,com.quransafeguard.hifz.preview.MushafPendingCommandsInstrumentedTest,com.quransafeguard.hifz.preview.AyahThemesReviewDisplayInstrumentedTest#independentTitlesLeaveFullMaskAndHistoricalHolesExactlyUnchanged,com.quransafeguard.hifz.preview.HifzV6PersistentStateInstrumentedTest,com.quransafeguard.hifz.preview.HifzV6StateTransitionsInstrumentedTest,com.quransafeguard.hifz.preview.ProcessDeathPersistenceInstrumentedTest,com.quransafeguard.hifz.preview.HifzPrefsV6MigrationInstrumentedTest
            mkdir -p hifz-app/build/boox-audit
            adb shell am start -n com.quransafeguard.hifz.ibnkathirtest/com.quransafeguard.hifz.preview.MainActivity
            sleep 3
            adb exec-out screencap -p > hifz-app/build/boox-audit/home-portrait-android-emulator.png
            test -s hifz-app/build/boox-audit/home-portrait-android-emulator.png
            # Dynamic target: the BOOX icon rail now scales with available width.
            # Never use obsolete hard-coded coordinates for visual evidence.
            adb shell uiautomator dump /sdcard/haafidh-ui.xml >/dev/null
            adb pull /sdcard/haafidh-ui.xml "$RUNNER_TEMP/haafidh-ui.xml" >/dev/null
            python3 - "$RUNNER_TEMP/haafidh-ui.xml" "$RUNNER_TEMP/parcours-tap.txt" <<'PY'
            import pathlib, re, sys, xml.etree.ElementTree as ET
            ui = ET.parse(sys.argv[1]).getroot()
            candidates = [n for n in ui.iter("node") if n.attrib.get("content-desc") == "Parcours Hifz"]
            if len(candidates) != 1:
                raise SystemExit(f"Expected one real Parcours Hifz navigation tile; got {len(candidates)}")
            bounds = candidates[0].attrib.get("bounds", "")
            xy = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
            if not xy: raise SystemExit("Parcours has no reliable visible bounds: " + bounds)
            x1, y1, x2, y2 = map(int, xy.groups())
            if x2 <= x1 or y2 <= y1: raise SystemExit("Parcours bounds are empty")
            pathlib.Path(sys.argv[2]).write_text(f"{(x1+x2)//2} {(y1+y2)//2}")
            PY
            read -r TAP_X TAP_Y < "$RUNNER_TEMP/parcours-tap.txt"
            adb shell input tap "$TAP_X" "$TAP_Y"
            sleep 2
            adb exec-out screencap -p > hifz-app/build/boox-audit/parcours-portrait-android-emulator.png
            test -s hifz-app/build/boox-audit/parcours-portrait-android-emulator.png
            # Confirm the screenshot is really Parcours and not a stale coordinate target.
            adb shell uiautomator dump /sdcard/haafidh-parcours.xml >/dev/null
            adb pull /sdcard/haafidh-parcours.xml "$RUNNER_TEMP/haafidh-parcours.xml" >/dev/null
            python3 - "$RUNNER_TEMP/haafidh-parcours.xml" <<'PY'
            import sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            names = [node.attrib.get("text", "") for node in root.iter("node")]
            assert "Parcours Hifz" in names, "Parcours screenshot did not open the true screen"
            PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-1175-android-instrumented-audit
          path: |
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
            hifz-app/build/reports/
            hifz-app/build/boox-audit/
          retention-days: 14
