name: Apply Quran Hifz 0.7.5 Claude fixes

on:
  push:
    branches:
      - work/hifz-0.7.5-claude-no-go-fixes

permissions:
  contents: write

jobs:
  apply:
    if: "${{ contains(github.event.head_commit.message, 'apply: Claude NO-GO production fixes') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-claude-no-go-fixes
          fetch-depth: 0

      - name: Apply assertive production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_hifz_075_claude_no_go_fixes.py
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"

      - name: Commit exact corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java \
            hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java \
            hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java \
            hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/HifzPrefsV6MigrationInstrumentedTest.java
          git diff --cached --check
          git commit -m "fix: close Claude 0.7.5 no-go findings"
          git push origin HEAD:work/hifz-0.7.5-claude-no-go-fixes
