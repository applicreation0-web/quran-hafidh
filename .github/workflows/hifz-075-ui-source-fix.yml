name: Quran Hifz 0.7.5 UI source fix

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact source-contract fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5ece85f62070ccab2da4a586b67a51f786fc3d24"
          echo '' | base64 -d | python3
          git rm .github/workflows/hifz-075-ui-source-fix.yml
          git config user.name "quran-hifz-work"
          git config user.email "actions@users.noreply.github.com"
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java hifz-app/src/test/java/com/quransafeguard/hifz/preview/FinalUiPolishSourceContractTest.java
          git diff --cached --check
          git commit -m "fix: align 0.7.5 schema source contracts"
          git push origin HEAD:work/hifz-0.7.5-retention-j10
