name: Clean Al-Hikam extraction boundaries

on:
  push:
    branches:
      - quran-safeguard-hikam-complete-corpus
    paths:
      - ".github/workflows/clean-hikam-extraction.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean embedded next-number markers
        run: python3 scripts/clean_hikam_extraction.py
      - name: Commit cleaned extraction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quran-safeguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/hikam/primary_extraction.json
          git rm .github/workflows/clean-hikam-extraction.yml
          git commit -m "Clean Al-Hikam extraction boundaries"
          git push origin HEAD:quran-safeguard-hikam-complete-corpus
