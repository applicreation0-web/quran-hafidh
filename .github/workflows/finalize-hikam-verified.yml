name: Finalize verified translated Al-Hikam corpus

on:
  push:
    branches:
      - quran-safeguard-hikam-complete-corpus
    paths:
      - ".github/workflows/finalize-hikam-verified.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize only fully sourced and translated entries
        run: python3 scripts/finalize_hikam_verified.py
      - name: Verify final active corpus
        run: python3 scripts/verify_hikam_corpus.py
      - name: Commit final corpus and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quran-safeguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/hikam/al_hikam_verified.json
          git add app/src/main/assets/hikam/pending_verification.json
          git add app/src/main/assets/hikam/verification_report.json
          git rm .github/workflows/finalize-hikam-verified.yml
          git commit -m "Finalize verified translated Al-Hikam corpus"
          git push origin HEAD:quran-safeguard-hikam-complete-corpus
