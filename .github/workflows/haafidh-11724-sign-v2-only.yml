name: Haafidh 1.17.24 — historical APK v2 signature metadata only
on:
  push:
    branches: [sign/haafidh-11724-offline-v2]
    paths: [.github/workflows/haafidh-11724-sign-v2-only.yml]
permissions:
  contents: read
jobs:
  sign-v2-data:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign only fixed Android v2 metadata using verified historical key
        shell: bash
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/haafidh-sign.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          test -n "$HIFZ_KEYSTORE_BASE64"
          test -n "$HIFZ_KEYSTORE_PASSWORD"
          test -n "$HIFZ_KEY_PASSWORD"
          test -n "$HIFZ_KEY_ALIAS"
          printf '%s' "$HIFZ_KEYSTORE_BASE64" | base64 -d > "$work/official.jks"
          printf '%s' '' | base64 -d > "$work/signed_data.bin"
          echo '57081cae8341d6a8794c9374ac84fc38b7670962b9eba2cd92894f316aa2f678  '"$work/signed_data.bin" | sha256sum -c -
          cat > "$work/SignOfflineApkV2.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.HexFormat;
          import java.util.Base64;
          import java.nio.*;
          import java.util.Arrays;
          public class SignOfflineApkV2 {
              static final String CERT = "66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14";
              static final String DATA = "57081cae8341d6a8794c9374ac84fc38b7670962b9eba2cd92894f316aa2f678";
              static String sha(byte[] b) throws Exception { return HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(b)); }
              static ByteBuffer lp(ByteBuffer b) {
                  int n=b.getInt();
                  if(n<0 || n>b.remaining()) throw new SecurityException("invalid length");
                  ByteBuffer r=b.slice().order(ByteOrder.LITTLE_ENDIAN);r.limit(n);b.position(b.position()+n);return r;
              }
              public static void main(String[] args) throws Exception {
                  byte[] input=Files.readAllBytes(Path.of(args[0]));
                  if(input.length!=1449 || !sha(input).equals(DATA))throw new SecurityException("wrong transaction");
                  KeyStore ks=KeyStore.getInstance(Path.of(args[1]).toFile(),System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
                  String alias=System.getenv("HIFZ_KEY_ALIAS");
                  Certificate cert=ks.getCertificate(alias);
                  if(cert==null || !sha(cert.getEncoded()).equals(CERT))throw new SecurityException("wrong certificate");
                  ByteBuffer d=ByteBuffer.wrap(input).order(ByteOrder.LITTLE_ENDIAN);
                  ByteBuffer digests=lp(d), digest=lp(digests);
                  if(digest.getInt()!=0x0103 || lp(digest).remaining()!=32 || digest.hasRemaining() || digests.hasRemaining())throw new SecurityException("wrong digest format");
                  ByteBuffer certs=lp(d), leaf=lp(certs);byte[] c=new byte[leaf.remaining()];leaf.get(c);
                  if(!Arrays.equals(c,cert.getEncoded()) || certs.hasRemaining() || lp(d).hasRemaining() || d.hasRemaining())throw new SecurityException("wrong metadata");
                  PrivateKey key=(PrivateKey)ks.getKey(alias,System.getenv("HIFZ_KEY_PASSWORD").toCharArray());
                  Signature signer=Signature.getInstance("SHA256withRSA");signer.initSign(key);signer.update(input);byte[] sig=signer.sign();
                  Signature verifier=Signature.getInstance("SHA256withRSA");verifier.initVerify(cert);verifier.update(input);
                  if(!verifier.verify(sig)||sig.length!=512)throw new SecurityException("signature verification failed");
                  Files.writeString(Path.of(args[2]),Base64.getEncoder().encodeToString(sig)+"\n");
                  System.out.println("PASS: historical certificate; signature verified; signedData="+sha(input)+"; signature="+sha(sig));
              }
          }
          JAVA
          java "$work/SignOfflineApkV2.java" "$work/signed_data.bin" "$work/official.jks" "$work/signature.b64"
          install -m 0644 "$work/signature.b64" signature-11724.b64
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-11724-official-v2-signature-only
          path: signature-11724.b64
          if-no-files-found: error
          retention-days: 1
