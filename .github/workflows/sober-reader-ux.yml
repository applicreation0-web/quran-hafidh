name: Sober reader UX checks

on:
  push:
    branches: ["work/0.10.8-sober-reader-ux"]

permissions:
  contents: read

jobs:
  reader-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen source and protected-only boundary
        run: python3 scripts/verify_sober_ux_boundary.py
      - name: Test actual WebView verse gestures
        run: node scripts/test_reader_verse_gestures.cjs
      - name: Fetch and verify all 604 Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up Python corpus tools
        run: python3 -m pip install --disable-pip-version-check pymupdf==1.26.7 beautifulsoup4

      - name: Fetch pinned Qushayri and Qurtubi source PDFs
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/tafsir-src"
          mkdir -p "${src}"
          curl --fail --location --retry 3 -o "${src}/lataif.pdf" "https://www.altafsir.com/Books/lataif.pdf"
          base="https://archive.org/download/tafsir-al-qurtubi-4.-Volumes/Tafseer%20Al-Qurtubi"
          for n in 1 2 3 4; do
            curl --fail --location --retry 3 -o "${src}/qurtubi-v${n}.pdf" "${base}/Tafsir%20al-Qurtubi%20Vol.%20${n}.pdf"
          done

      - name: Rebuild Plus Tafsir assets from pinned sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_multitafsir_assets_0106.py \
            --source-dir "${RUNNER_TEMP}/tafsir-src" \
            --assets-dir app/src/plus/assets/tafsir \
            --work-dir "${RUNNER_TEMP}/tafsir-work"

      - name: Contradictory Tafsir corpus gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_0106_tafsir_honorifics.py app/src/plus/assets/tafsir
          python3 scripts/audit_0106_tafsir_presentation.py app/src/plus/assets/tafsir
          python3 scripts/audit_0106_qurtubi_unicode_labels.py app/src/plus/assets/tafsir
          python3 scripts/verify_0107_tafsir_reading_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Existing full release audit
        run: gradle --no-daemon :app:verifyReleaseAudit --stacktrace

      - name: Light and Plus unit regression suites
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest --stacktrace

      - name: Compile both editions
        run: gradle --no-daemon :app:assembleLightDebug :app:assemblePlusDebug --stacktrace

      - name: Prove edition boundaries on compiled APKs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/debug/app-light-debug.apk
          python3 scripts/verify_plus_apk_multitafsir_0106.py app/build/outputs/apk/plus/debug/app-plus-debug.apk
          python3 scripts/verify_0105_runtime_clean.py \
            --apk app/build/outputs/apk/light/debug/app-light-debug.apk \
            --apk app/build/outputs/apk/plus/debug/app-plus-debug.apk

      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sober-reader-ux-checks
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
