name: Quran Haafidh 1.17.4 sign APK v2 digest ONLY — no private assets
on:
  push:
    branches:
      - work/haafidh-1174-local-stage-and-digest-sign-20261023
    paths:
      - signing-input/signed_data_1174.b64
permissions:
  contents: read
jobs:
  sign-v2-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore original 1.17.1 signing key in temporary runner ONLY
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HIFZ_KEYSTORE_BASE64"
          printf '%s' "$HIFZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/official.jks"
          chmod 600 "$RUNNER_TEMP/official.jks"
      - name: Sign locally produced APK-v2 signedData, NOT the app files
        env:
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/SignOfflineApkV2.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.Base64;
          public class SignOfflineApkV2 {
            static String hex(byte[] v) {
              StringBuilder b=new StringBuilder();
              for(byte q:v)b.append(String.format("%02x",q & 255));
              return b.toString();
            }
            public static void main(String[] args) throws Exception {
              byte[] input=Base64.getMimeDecoder().decode(Files.readString(Path.of(args[0])).trim());
              // Public signature transaction only: 1.5kb of signable APK-v2 metadata.
              if (input.length<300 || input.length>4096)throw new SecurityException("Invalid signed-data size");
              KeyStore ks=KeyStore.getInstance(Path.of(args[1]).toFile(),System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
              String alias=System.getenv("HIFZ_KEY_ALIAS");
              Certificate certificate=ks.getCertificate(alias);
              if(certificate==null)throw new SecurityException("Missing official release cert");
              String sha=hex(MessageDigest.getInstance("SHA-256").digest(certificate.getEncoded()));
              if(!sha.equals("66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14"))
                throw new SecurityException("Wrong signing key; must match 1.17.1 release");
              PrivateKey privateKey=(PrivateKey)ks.getKey(alias,System.getenv("HIFZ_KEY_PASSWORD").toCharArray());
              Signature signer=Signature.getInstance("SHA256withRSA");
              signer.initSign(privateKey);
              signer.update(input);
              byte[] sig=signer.sign();
              Signature verify=Signature.getInstance("SHA256withRSA");
              verify.initVerify(certificate);
              verify.update(input);
              if(!verify.verify(sig))throw new SecurityException("Remote signature self-check failed");
              Files.writeString(Path.of(args[2]),Base64.getEncoder().encodeToString(sig)+"\n");
              System.out.println("PASS: certified official 1.17.1 signer; 512-byte RSA signature only; no APK or Atlas content ever uploaded");
              System.out.println("signedData_SHA256="+hex(MessageDigest.getInstance("SHA-256").digest(input)));
              System.out.println("signature_SHA256="+hex(MessageDigest.getInstance("SHA-256").digest(sig)));
            }
          }
          JAVA
          javac "$RUNNER_TEMP/SignOfflineApkV2.java"
          java -cp "$RUNNER_TEMP" SignOfflineApkV2 signing-input/signed_data_1174.b64 "$RUNNER_TEMP/official.jks" "$RUNNER_TEMP/offline_signature_1174.b64"
          install -m 0644 "$RUNNER_TEMP/offline_signature_1174.b64" offline_signature_1174.b64
          shred -fu "$RUNNER_TEMP/official.jks" || rm -f "$RUNNER_TEMP/official.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-1174-official-v2-digest-signature-only
          path: offline_signature_1174.b64
          retention-days: 1
