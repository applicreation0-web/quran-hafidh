name: Quran Hifz 0.7.5 physical runtime correction

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - '.github/workflows/hifz-075-physical-runtime-correction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
          fetch-depth: 0
      - name: Apply guarded runtime correction
        run: python3 .github/scripts/patch_hifz_075_physical_runtime.py
      - name: Verify patch shape and commit cleanly
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'Schema-6 manual ranges are ordered but deliberately NOT coalesced' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          grep -q 'fifteenPhysicalLinesInOneAyahProduceSevenPlusEightAndTwoConsolidationUnits' hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/PhysicalConsolidationRuntimeInstrumentedTest.java
          ! grep -q 'Stabilisation boundary may never split a verse' hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/StabilizationHalfPageInstrumentedTest.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java \
                  hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/StabilizationHalfPageInstrumentedTest.java \
                  hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/PhysicalConsolidationRuntimeInstrumentedTest.java
          git rm .github/scripts/patch_hifz_075_physical_runtime.py \
                 .github/workflows/hifz-075-physical-runtime-correction.yml
          git commit -m 'fix: preserve surah-separated physical consolidation runtime'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
