name: Quran Hifz J10 TDD

on:
  push:
    branches:
      - work/hifz-0.7.3-j10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  j10-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run J10 integration contract
        run: python3 scripts/test_hifz_j10_integration.py
