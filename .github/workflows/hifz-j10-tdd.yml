name: Quran Hifz 0.7.3 J10 final candidate

on:
  push:
    branches:
      - work/hifz-0.7.3-j10
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-hifz-j10:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated Mushaf and Tafsir baseline
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.9-astra-re-audit
          run-id: 34336797351
          github-token: ${{ github.token }}
          path: baseline109

      - name: Inject canonical Mushaf and audited Tafsir sources
        shell: bash
        run: |
          set -euo pipefail
          old_plus="$(find baseline109 -type f -name 'app-plus-release-unsigned.apk' -print -quit)"
          test -n "$old_plus" && test -s "$old_plus"
          echo 'f826d06da88ee9411d275a34a2fa17d7d7686c6cef4151ce4d15b433848c1e66  '"$old_plus" | sha256sum -c -
          rm -rf baseline109/extracted && mkdir -p baseline109/extracted
          unzip -q "$old_plus" 'assets/mushaf/hafs/kfqc/svg-br/*.svg.br' 'assets/tafsir/*' -d baseline109/extracted

          mushaf_dst="app/src/main/assets/mushaf/hafs/kfqc/svg-br"
          rm -rf "$mushaf_dst" && mkdir -p "$mushaf_dst"
          cp baseline109/extracted/assets/mushaf/hafs/kfqc/svg-br/*.svg.br "$mushaf_dst/"
          test "$(find "$mushaf_dst" -maxdepth 1 -type f -name '[0-9][0-9][0-9].svg.br' | wc -l | tr -d ' ')" = 604

          tafsir_dst="app/src/plus/assets/tafsir"
          rm -rf "$tafsir_dst" && mkdir -p "$tafsir_dst"
          cp baseline109/extracted/assets/tafsir/* "$tafsir_dst/"
          test "$(find "$tafsir_dst" -maxdepth 1 -type f -name 'al_jalalayn_en.sqlite.gz.part*' | wc -l | tr -d ' ')" = 4
          test "$(find "$tafsir_dst" -maxdepth 1 -type f -name 'qurtubi_en.sqlite.gz.b64.part*' | wc -l | tr -d ' ')" = 4
          test "$(find "$tafsir_dst" -maxdepth 1 -type f -name 'qushayri_en.sqlite.gz.b64.part*' | wc -l | tr -d ' ')" = 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify exact Hifz geometry
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check pymupdf==1.26.7 numpy scipy
          python3 scripts/build_reader109_geometry.py
          python3 scripts/verify_hifz_geometry_edges.py
          test -s app/src/main/assets/reader109/geometry.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-35;default;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify J10 wiring and existing product contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_hifz_j10_integration.py
          python3 scripts/test_hifz_claude_audit_regressions.py
          python3 scripts/verify_hifz_mask_hotfix.py
          node scripts/test_hifz_mask_segments.js
          node scripts/test_hifz_vertical_fit.js

      - name: Run unit, contract and Android-test compile suites
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:compileDebugAndroidTestSources :hifz-app:verifyHifzProductBoundary :hifz-app:verifyHifzCosmeticContract :hifz-app:verifyHifzConvergenceRules --stacktrace

      - name: Run real Android instrumented tests
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd --force --name hifz-ci --package "system-images;android-35;default;x86_64"
          sudo chmod 666 /dev/kvm || true
          "$ANDROID_HOME/emulator/emulator" -avd hifz-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          booted=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 2
          done
          if [ "$booted" != "1" ]; then cat emulator.log >&2; exit 1; fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          gradle --no-daemon :hifz-app:connectedDebugAndroidTest --stacktrace

      - name: Assemble unsigned audit APK
        run: gradle --no-daemon :hifz-app:assembleRelease --stacktrace

      - name: Inspect audit APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          cp "$apk" quran-hifz-0.7.3-j10-release-unsigned.apk
          apkanalyzer manifest print "$apk" > hifz-app-manifest.xml
          test "$(apkanalyzer manifest application-id "$apk")" = "com.quransafeguard.hifz"
          test "$(apkanalyzer manifest version-code "$apk")" = "10"
          test "$(apkanalyzer manifest version-name "$apk")" = "0.7.3-boox"
          if grep -q 'android:debuggable="true"' hifz-app-manifest.xml; then exit 1; fi
          if grep -Eqi 'AccessibilityService|BIND_ACCESSIBILITY_SERVICE|QUERY_ALL_PACKAGES|QuranAccessibilityService' hifz-app-manifest.xml; then exit 1; fi
          unzip -l "$apk" > hifz-app-apk-list.txt
          test "$(grep -E 'assets/mushaf/hafs/kfqc/svg-br/[0-9]{3}\.svg\.br' hifz-app-apk-list.txt | wc -l | tr -d ' ')" = 604
          if grep -Eq 'assets/audio/husary-muallim/[0-9]{6}\.mp3' hifz-app-apk-list.txt; then exit 1; fi
          sha256sum quran-hifz-0.7.3-j10-release-unsigned.apk | tee quran-hifz-0.7.3-j10-release-unsigned.apk.sha256

      - name: Upload J10 contradictory-audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-hifz-0.7.3-j10-audit-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            quran-hifz-0.7.3-j10-release-unsigned.apk
            quran-hifz-0.7.3-j10-release-unsigned.apk.sha256
            hifz-app-manifest.xml
            hifz-app-apk-list.txt
