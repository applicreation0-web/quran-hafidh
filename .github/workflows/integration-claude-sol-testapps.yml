name: Claude + Sol test apps convergence

on:
  push:
    branches:
      - integration/claude-sol-testapps
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  domain-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run independent Hifz and Safeguard domain tests
        run: gradle --no-daemon :hifz-core:test :safeguard-core:test --stacktrace
