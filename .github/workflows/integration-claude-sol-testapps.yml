name: Claude + Sol test apps convergence

on:
  push:
    branches:
      - integration/claude-sol-testapps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hifz-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Hifz core tests
        run: ./gradlew :hifz-core:test --stacktrace
