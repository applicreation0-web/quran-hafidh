name: Publish Quran Safeguard 0.10.4 Light and Plus

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Release Quran Safeguard 0.10.4')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LIGHT_KEYSTORE_B64: ${{ secrets.LIGHT_KEYSTORE_B64 }}
      LIGHT_KEYSTORE_PASSWORD: ${{ secrets.LIGHT_KEYSTORE_PASSWORD }}
      PLUS_KEYSTORE_B64: ${{ secrets.PLUS_KEYSTORE_B64 }}
      PLUS_KEYSTORE_PASSWORD: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare 0.10.4 Android version metadata
        run: python3 scripts/prepare_0104_version.py

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up Python audit and corpus tools
        run: python3 -m pip install --disable-pip-version-check pymupdf beautifulsoup4

      - name: Fetch pinned private tafsir sources
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/tafsir-src"
          mkdir -p "${src}"
          curl --fail --location --retry 3 -o "${src}/lataif.pdf" "https://www.altafsir.com/Books/lataif.pdf"
          base="https://archive.org/download/tafsir-al-qurtubi-4.-Volumes/Tafseer%20Al-Qurtubi"
          for n in 1 2 3 4; do
            curl --fail --location --retry 3 -o "${src}/qurtubi-v${n}.pdf" "${base}/Tafsir%20al-Qurtubi%20Vol.%20${n}.pdf"
          done
          python3 scripts/prepare_multitafsir_assets.py --source-dir "${src}" --assets-dir app/src/plus/assets/tafsir --work-dir "${RUNNER_TEMP}/tafsir-work"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Audit, test and build both editions
        run: |
          set -euo pipefail
          python3 scripts/verify_0104_hikam_freeze.py
          python3 scripts/verify_0104_update.py
          python3 scripts/verify_0104_taddabur.py
          gradle --no-daemon :app:verifyReleaseAudit :app:testLightDebugUnitTest :app:testPlusDebugUnitTest
          python3 scripts/audit_hikam_translation_against_islamicpearls.py
          gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease
          python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_light_apk_no_taddabur.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_plus_apk_multitafsir.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk
          python3 scripts/verify_plus_apk_taddabur.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk

      - name: Sign and verify Light and Plus
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LIGHT_KEYSTORE_B64}"
          test -n "${LIGHT_KEYSTORE_PASSWORD}"
          test -n "${PLUS_KEYSTORE_B64}"
          test -n "${PLUS_KEYSTORE_PASSWORD}"
          release_dir="${RUNNER_TEMP}/quran-safeguard-0.10.4"
          mkdir -p "${release_dir}"
          printf '%s' "${LIGHT_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/light.p12"
          printf '%s' "${PLUS_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/plus.p12"
          tools="${ANDROID_HOME}/build-tools/36.0.0"
          light_unsigned="app/build/outputs/apk/light/release/app-light-release-unsigned.apk"
          plus_unsigned="app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk"
          light_aligned="${RUNNER_TEMP}/light-aligned.apk"
          plus_aligned="${RUNNER_TEMP}/plus-aligned.apk"
          light_apk="${release_dir}/Quran-Safeguard-0.10.4-Light-release.apk"
          plus_apk="${release_dir}/Quran-Safeguard-Plus-0.10.4-release.apk"
          "${tools}/zipalign" -p -f 4 "${light_unsigned}" "${light_aligned}"
          "${tools}/zipalign" -p -f 4 "${plus_unsigned}" "${plus_aligned}"
          "${tools}/apksigner" sign --ks "${RUNNER_TEMP}/light.p12" --ks-type PKCS12 --ks-key-alias quran-safeguard --ks-pass env:LIGHT_KEYSTORE_PASSWORD --key-pass env:LIGHT_KEYSTORE_PASSWORD --out "${light_apk}" "${light_aligned}"
          "${tools}/apksigner" sign --ks "${RUNNER_TEMP}/plus.p12" --ks-type PKCS12 --ks-key-alias quran-safeguard-plus --ks-pass env:PLUS_KEYSTORE_PASSWORD --key-pass env:PLUS_KEYSTORE_PASSWORD --out "${plus_apk}" "${plus_aligned}"
          "${tools}/zipalign" -c -p 4 "${light_apk}"
          "${tools}/zipalign" -c -p 4 "${plus_apk}"
          "${tools}/apksigner" verify --verbose --print-certs "${light_apk}" | tee "${release_dir}/light-signature.txt"
          "${tools}/apksigner" verify --verbose --print-certs "${plus_apk}" | tee "${release_dir}/plus-signature.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "${release_dir}/light-signature.txt"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" "${release_dir}/light-signature.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: 6c706f4ea44ef667d0b9698c07a39e929b1e286d2397665504411dedb37457ac" "${release_dir}/light-signature.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: 1843d245832549afc6333ab77a587649a14fedb1f4acc9c08f367c3f0301d989" "${release_dir}/plus-signature.txt"
          test "$(apkanalyzer manifest application-id "${light_apk}")" = "com.applicreation0.quransafeguard"
          test "$(apkanalyzer manifest application-id "${plus_apk}")" = "com.applicreation0.quransafeguard.plus"
          test "$(apkanalyzer manifest version-code "${light_apk}")" = "23"
          test "$(apkanalyzer manifest version-code "${plus_apk}")" = "23"
          test "$(apkanalyzer manifest version-name "${light_apk}")" = "0.10.4"
          test "$(apkanalyzer manifest version-name "${plus_apk}")" = "0.10.4-plus.1"
          python3 scripts/verify_light_apk_no_tafsir.py "${light_apk}"
          python3 scripts/verify_light_apk_no_taddabur.py "${light_apk}"
          python3 scripts/verify_plus_apk_multitafsir.py "${plus_apk}"
          python3 scripts/verify_plus_apk_taddabur.py "${plus_apk}"
          sha256sum "${light_apk}" "${plus_apk}" > "${release_dir}/Quran-Safeguard-0.10.4-SHA256.txt"

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-0.10.4-signed
          path: ${{ runner.temp }}/quran-safeguard-0.10.4/
          if-no-files-found: error
          retention-days: 30

      - name: Freeze exact release version in source history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          existing="$(git log origin/main --format='%H' --grep='^Finalize Quran Safeguard 0.10.4 version metadata$' -1 || true)"
          if [ -n "${existing}" ] && [ "$(git rev-parse "${existing}^")" = "${GITHUB_SHA}" ]; then
            release_source_sha="${existing}"
          else
            git add app/build.gradle.kts
            if git diff --cached --quiet; then
              echo "Prepared 0.10.4 version metadata was not captured in source history."
              exit 1
            fi
            git commit -m "Finalize Quran Safeguard 0.10.4 version metadata"
            git push origin HEAD:main
            release_source_sha="$(git rev-parse HEAD)"
          fi
          echo "RELEASE_SOURCE_SHA=${release_source_sha}" >> "${GITHUB_ENV}"

      - name: Publish private GitHub release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/quran-safeguard-0.10.4"
          if gh release view v0.10.4 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.10.4 already exists; refusing to overwrite it."
            exit 1
          fi
          cat > "${release_dir}/release-notes.md" <<'NOTES'
          ## Quran Safeguard 0.10.4

          Mise à jour auditée de **Light** et de la version strictement personnelle **Plus**.

          ### Tafsīr Plus
          - Jalālayn conservé byte-for-byte avec ses contrôles historiques ;
          - Qushayrī ajouté pour les sourates 1–4 : traduction anglaise du verset conservée, texte arabe du livre retiré, commentaire anglais conservé dans l’ordre de la source ;
          - Qurṭubī ajouté depuis les volumes anglais 1–4, jusqu’à Qur'an 4:22 ; 4:23 reste explicitement indisponible ;
          - plages de versets et segments multiples pris en charge sans duplication artificielle ;
          - sélecteur compact Jalalayn / Qurtubi / Qushayri dans le panneau Tafsīr existant ;
          - aucun PDF source, aucune page tierce Sunniconnect et aucun texte arabe des scans dans les nouveaux corpus.

          ### Taddabur — Plus uniquement
          - objectif quotidien : un Hizb, pool fixe 1–60 sans sélection ni exclusion utilisateur ;
          - lecture cumulative au fil de la journée à partir de 07:00, minimum 90 secondes actives par page ;
          - Tafsīr disponible dans le lecteur Taddabur ;
          - marque-page persistant et suivi quotidien de progression ;
          - à 20:00, si le Hizb du jour n’est pas terminé, les seules applications protégées restent bloquées jusqu’à minuit ;
          - terminer après 20:00 n’écourte pas ce blocage ; aucun joker ou challenge de déblocage ne le contourne ;
          - Light ne contient ni activité, ni stockage, ni alarme, ni interface Taddabur.

          ### Al-Ḥikam
          - le corpus et les composants Hikam critiques de la 0.10.3 sont gelés byte-for-byte dans cette mise à jour ;
          - la 0.10.4 ne revendique pas l’achèvement d’un nouveau ré-audit textuel 264/264 distinct.

          ### Vérifications
          - audit contradictoire 0.10.4 des corpus, du mapping et de Taddabur ;
          - Qushayrī : 806 segments authentiques de mise en page source, couverture 1–4 complète, cas 2:68 et 4:167–169 contrôlés ; faux ancrages de renvoi, introductions de sourate et glyphes privés du PDF exclus ;
          - Qurṭubī : 432 blocs, couverture continue Fātiḥa → 4:22, bloc 4:11–14 contrôlé ;
          - tests Light + Plus ;
          - audit global de release ;
          - isolation Light/Plus ;
          - vérification des trois corpus et de Taddabur directement dans les APK ;
          - signatures APK v2/v3, identités Android, versionCode 23 et SHA-256 vérifiés ;
          - le tag v0.10.4 cible le commit exact contenant les métadonnées de version 0.10.4 utilisées pour construire les APK.

          **Quran Safeguard Plus et ses corpus sont réservés à l’usage strictement personnel du propriétaire du dépôt.**
          NOTES
          test -n "${RELEASE_SOURCE_SHA}"
          gh release create v0.10.4 "${release_dir}/Quran-Safeguard-0.10.4-Light-release.apk" "${release_dir}/Quran-Safeguard-Plus-0.10.4-release.apk" "${release_dir}/Quran-Safeguard-0.10.4-SHA256.txt" --repo "${GITHUB_REPOSITORY}" --target "${RELEASE_SOURCE_SHA}" --title "Quran Safeguard 0.10.4 — Light & Plus" --notes-file "${release_dir}/release-notes.md"
