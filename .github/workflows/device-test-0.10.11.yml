name: Quran Safeguard 0.10.11 private device test

on:
  push:
    branches: ["test/0.10.11-device"]

permissions:
  contents: read
  actions: read

jobs:
  device-test-export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test carrier commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply reviewed 0.10.11 device-test corrections
        shell: bash
        run: |
          set -euo pipefail
          cat .github/device-test/patch.part* > "${RUNNER_TEMP}/qsg-0.10.11-device-test.patch"
          echo 'f3dc097d4595da13dc022dafb1fdebd4e453ecd51e4b54f7bfbbbb639dcc67d3  '"${RUNNER_TEMP}/qsg-0.10.11-device-test.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/qsg-0.10.11-device-test.patch"
          git apply "${RUNNER_TEMP}/qsg-0.10.11-device-test.patch"
          node --check app/src/main/assets/reader109/reader.js
          node --check app/src/main/assets/reader109/runtime_guard.js
          node --check app/src/main/assets/reader109/hifz_guard.js
          printf 'carrier_commit=%s\ncarrier_tree=%s\npatch_sha256=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            'f3dc097d4595da13dc022dafb1fdebd4e453ecd51e4b54f7bfbbbb639dcc67d3' \
            > "${RUNNER_TEMP}/DEVICE-TEST-PROVENANCE.txt"

      - name: Restore validated 0.10.9 build-time corpus
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.9-astra-re-audit
          run-id: 34336797351
          github-token: ${{ github.token }}
          path: baseline109

      - name: Verify and inject immutable Mushaf and Tafsir corpus
        shell: bash
        run: |
          set -euo pipefail
          old_plus="$(find baseline109 -type f -name 'app-plus-release-unsigned.apk' -print -quit)"
          test -n "$old_plus" && test -s "$old_plus"
          echo 'f826d06da88ee9411d275a34a2fa17d7d7686c6cef4151ce4d15b433848c1e66  '"$old_plus" | sha256sum -c -
          reuse="${RUNNER_TEMP}/reuse109"
          mkdir -p "$reuse"
          unzip -q "$old_plus" 'assets/mushaf/hafs/kfqc/svg-br/*.svg.br' 'assets/tafsir/qurtubi_en.sqlite.gz.b64.part*' 'assets/tafsir/qushayri_en.sqlite.gz.b64.part*' -d "$reuse"
          mushaf_dst="app/src/main/assets/mushaf/hafs/kfqc/svg-br"
          rm -rf "$mushaf_dst" && mkdir -p "$mushaf_dst"
          cp "$reuse/assets/mushaf/hafs/kfqc/svg-br"/*.svg.br "$mushaf_dst/"
          test "$(find "$mushaf_dst" -maxdepth 1 -type f -name '[0-9][0-9][0-9].svg.br' | wc -l | tr -d ' ')" = 604
          { for i in $(seq 1 604); do cat "$mushaf_dst/$(printf '%03d' "$i").svg.br"; done; } | sha256sum | grep -F '30b7435f86693f0c311c666ffa996b667be37f23a7cdfce519275f9b85a9e406'
          tafsir_dst="app/src/plus/assets/tafsir"
          cp "$reuse/assets/tafsir"/qurtubi_en.sqlite.gz.b64.part* "$tafsir_dst/"
          cp "$reuse/assets/tafsir"/qushayri_en.sqlite.gz.b64.part* "$tafsir_dst/"
          { for f in qurtubi_en.sqlite.gz.b64.part00 qurtubi_en.sqlite.gz.b64.part01 qurtubi_en.sqlite.gz.b64.part02 qurtubi_en.sqlite.gz.b64.part03 qushayri_en.sqlite.gz.b64.part00 qushayri_en.sqlite.gz.b64.part01; do cat "$tafsir_dst/$f"; done; } | sha256sum | grep -F 'aef2eb1af69a90a186e74c0411c6c37a951770a928c8c3b5e20dba6ce70dd020'

      - name: Set up Python and geometry tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify reader geometry
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check pymupdf==1.26.7 numpy scipy
          python3 scripts/build_reader109_geometry.py
          node scripts/test_reader109_protocol.js
          python3 scripts/verify_reader109.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Light and Plus unit tests
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest --stacktrace

      - name: Assemble private device-test releases
        run: gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease --stacktrace

      - name: Audit, align and package unsigned device-test APKs
        shell: bash
        run: |
          set -euo pipefail
          light_u="app/build/outputs/apk/light/release/app-light-release-unsigned.apk"
          plus_u="app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk"
          test -s "$light_u" && test -s "$plus_u"
          python3 scripts/verify_light_apk_no_tafsir.py "$light_u"
          python3 scripts/verify_plus_apk_multitafsir_0106.py "$plus_u"
          out="${RUNNER_TEMP}/quran-safeguard-0.10.11-device-test"
          mkdir -p "$out/tools36/lib" "$out/tools36/lib64"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          light="$out/Quran-Safeguard-0.10.11-TEST-Light-aligned-unsigned.apk"
          plus="$out/Quran-Safeguard-Plus-0.10.11-TEST-aligned-unsigned.apk"
          "$tools/zipalign" -p -f 4 "$light_u" "$light"
          "$tools/zipalign" -p -f 4 "$plus_u" "$plus"
          "$tools/zipalign" -c -p 4 "$light"
          "$tools/zipalign" -c -p 4 "$plus"
          cp "$tools/apksigner" "$out/tools36/apksigner"
          cp "$tools/lib/apksigner.jar" "$out/tools36/lib/apksigner.jar"
          cp "$tools/zipalign" "$out/tools36/zipalign"
          cp "$tools/aapt2" "$out/tools36/aapt2"
          if [ -f "$tools/lib64/libc++.so" ]; then cp "$tools/lib64/libc++.so" "$out/tools36/lib64/libc++.so"; fi
          chmod +x "$out/tools36/apksigner" "$out/tools36/zipalign" "$out/tools36/aapt2"
          sha256sum "$light" "$plus" > "$out/UNSIGNED-SHA256.txt"
          cp "${RUNNER_TEMP}/DEVICE-TEST-PROVENANCE.txt" "$out/"
          printf 'PRIVATE DEVICE TEST ONLY — NOT A RELEASE\nDo not publish these unsigned APKs. Sign only with the historical local keys.\n' > "$out/TEST-ONLY.txt"

      - name: Upload private device-test bundle
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-0.10.11-device-test
          path: ${{ runner.temp }}/quran-safeguard-0.10.11-device-test/
          if-no-files-found: error
          retention-days: 1
