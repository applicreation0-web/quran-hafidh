name: Quran Hifz 0.7.4 post-BOOX fast gate

on:
  push:
    branches:
      - work/hifz-0.7.4-postboox-fixes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quran-hifz-postboox-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run focused JVM and source-contract tests
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
