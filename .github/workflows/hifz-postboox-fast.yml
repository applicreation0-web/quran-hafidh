name: Quran Hifz 0.7.4 post-BOOX fast gate

on:
  push:
    branches:
      - work/hifz-0.7.4-postboox-fixes
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quran-hifz-postboox-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore audited Tafsir source parts
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.9-astra-re-audit
          run-id: 34336797351
          github-token: ${{ github.token }}
          path: baseline109

      - name: Inject audited Tafsir sources required by Gradle tests
        shell: bash
        run: |
          set -euo pipefail
          old_plus="$(find baseline109 -type f -name 'app-plus-release-unsigned.apk' -print -quit)"
          test -n "$old_plus" && test -s "$old_plus"
          echo 'f826d06da88ee9411d275a34a2fa17d7d7686c6cef4151ce4d15b433848c1e66  '"$old_plus" | sha256sum -c -
          rm -rf baseline109/extracted
          mkdir -p baseline109/extracted
          unzip -q "$old_plus" 'assets/tafsir/*' -d baseline109/extracted
          tafsir_dst="app/src/plus/assets/tafsir"
          rm -rf "$tafsir_dst"
          mkdir -p "$tafsir_dst"
          cp baseline109/extracted/assets/tafsir/* "$tafsir_dst/"
          test "$(find "$tafsir_dst" -maxdepth 1 -type f -name 'qurtubi_en.sqlite.gz.b64.part*' | wc -l | tr -d ' ')" = 4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run focused JVM and source-contract tests
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
