name: Haafidh 1.17.7 temporary Android SDK APK verifier export (public binaries only)
on:
  push:
    branches:
      - fix/haafidh-1177-boox-week-itqan-20261026
    paths:
      - '.github/workflows/haafidh-1177-apk-verify-binaries.yml'
permissions:
  contents: read
jobs:
  sdk-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: SDK build-tools 36 and integrity preflight
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0"
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$sdk/lib/apksigner.jar"
          test -x "$sdk/aapt"
          test -x "$sdk/zipalign"
          mkdir -p "$RUNNER_TEMP/haafidh-verifier-toolbox"
          cp "$sdk/lib/apksigner.jar" "$RUNNER_TEMP/haafidh-verifier-toolbox/apksigner.jar"
          cp "$sdk/aapt" "$RUNNER_TEMP/haafidh-verifier-toolbox/aapt"
          cp "$sdk/zipalign" "$RUNNER_TEMP/haafidh-verifier-toolbox/zipalign"
          cp "$sdk/lib64/libc++.so" "$RUNNER_TEMP/haafidh-verifier-toolbox/libc++.so"
          sha256sum "$RUNNER_TEMP"/haafidh-verifier-toolbox/* > "$RUNNER_TEMP/haafidh-verifier-toolbox/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-1177-temp-android-apk-verifier-sdk36
          path: ${{ runner.temp }}/haafidh-verifier-toolbox/
          retention-days: 1
          if-no-files-found: error
