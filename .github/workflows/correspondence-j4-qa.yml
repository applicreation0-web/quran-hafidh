name: J4 QCF Refrain QA (No APK)
on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
    paths:
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/Correspondence*.java'
      - 'hifz-app/src/test/java/com/quransafeguard/hifz/preview/Correspondence*.java'
      - 'scripts/test_correspondence*.py'
      - '.github/workflows/correspondence-j4-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Eight icons and read-only UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check correspondence icon sources and Android bindings
        run: |
          python3 scripts/test_correspondence_type_icon_wiring.py
          python3 scripts/test_correspondence_icon_contract.py
          python3 scripts/test_correspondence_session_ui_delta.py
  java-unit:
    name: Refrain neighbors and QCF geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android compilation SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Fetch authentic public mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh
      - name: Run Android JVM unit tests, NO APK, NO signing
        run: gradle --no-daemon :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
