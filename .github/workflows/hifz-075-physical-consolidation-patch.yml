name: Quran Hifz 0.7.5 physical consolidation patch

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/hifz-075-physical-consolidation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
      - name: Patch exact physical Consolidation runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, pattern, replacement, flags=re.S):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'guard failed: {path} pattern count={count}')
              p.write_text(new)

          # Geometry: exact physical ids, canonical order, plus exact verses touching them.
          path = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/GeometryRepository.java')
          text = path.read_text()
          marker = '    /** Exact per-page geometry already parsed by the singleton; avoids a second full JSON parse in the renderer. */'
          if marker not in text:
              raise SystemExit('guard failed: geometry insertion marker')
          helper = '''    /** Resolve exact physical line ids in canonical order; missing, duplicate or reordered ids fail closed. */
    List<LineMeta> linesForExactIds(List<String> lineIds) {
        if (lineIds == null || lineIds.isEmpty()) throw new IllegalArgumentException("line ids required");
        LinkedHashSet<String> wanted = new LinkedHashSet<>(lineIds);
        if (wanted.size() != lineIds.size()) throw new IllegalStateException("Duplicate physical line id");
        ArrayList<LineMeta> result = new ArrayList<>();
        for (LineMeta line : lines) if (wanted.contains(line.id)) result.add(line);
        if (result.size() != wanted.size()) throw new IllegalStateException("Unknown physical Mushaf line id");
        for (int i = 0; i < result.size(); i++) {
            if (!result.get(i).id.equals(lineIds.get(i)))
                throw new IllegalStateException("Physical line ids are not in canonical order");
        }
        return Collections.unmodifiableList(result);
    }

    /** Ordered Quran verses touching exactly these physical lines. */
    List<VerseRef> versesOnLines(List<String> lineIds) {
        LinkedHashSet<VerseRef> selected = new LinkedHashSet<>();
        for (LineMeta line : linesForExactIds(lineIds)) selected.addAll(line.verses);
        ArrayList<VerseRef> result = new ArrayList<>(selected);
        result.sort(Comparator.comparingInt(GeometryRepository::ordinal));
        return Collections.unmodifiableList(result);
    }

'''
          if 'List<LineMeta> linesForExactIds(List<String> lineIds)' in text:
              raise SystemExit('guard failed: geometry helper already exists')
          path.write_text(text.replace(marker, helper + marker, 1))

          # HifzPrefs: Consolidation candidates are the exact physical Stabilisation units.
          prefs = 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java'
          replace_once(
              prefs,
              r'    /\*\* Frozen candidates for one grouped Consolidation session: stabilized, never already acquired\. \*/\n    List<AnchoringQueue\.Entry> stabilizedAnchoringEntries\(GeometryRepository geometry, int maxUnits\) \{.*?\n    \}\n\n    /\*\* Fail and defer the exact page displayed',
              '''    /** Frozen candidates for one grouped Consolidation session: exact physical Stabilisation units. */
    List<ConsolidationCycleEngine.Unit> stabilizedConsolidationUnits(GeometryRepository geometry, int maxUnits) {
        if (geometry == null) throw new IllegalArgumentException("Consolidation geometry required");
        if (maxUnits < 1 || maxUnits > 3) throw new IllegalArgumentException("Consolidation group size must be 1..3");
        LinkedHashSet<String> stabilized = v6LineIdSet("v6StabilizedLineIds");
        LinkedHashSet<String> acquired = v6LineIdSet("v6AcquiredCreditLineIds");
        ArrayList<ConsolidationCycleEngine.Unit> out = new ArrayList<>();
        for (AnchoringQueue.Entry entry : AnchoringQueue.visitOrder(anchoringQueue(), anchoringQueueIndex())) {
            VerseRef start = GeometryRepository.parseVerse(entry.start);
            VerseRef end = GeometryRepository.parseVerse(entry.end);
            List<String> entryIds = geometry.lineIdsForVerseRange(start, end);
            List<GeometryRepository.LineMeta> physicalLines = geometry.linesForExactIds(entryIds);
            List<StabilizationHalfPagePolicy.Unit> planned = StabilizationHalfPagePolicy.planPage(physicalLines);
            List<StabilizationHalfPagePolicy.Unit> ready = ConsolidationPhysicalUnitPolicy.readyUnits(
                planned, stabilized, acquired, maxUnits - out.size());
            ConsolidationCycleEngine.Protocol protocol = entry.protocol == AnchoringQueue.Protocol.LIGHT
                ? ConsolidationCycleEngine.Protocol.LIGHT : ConsolidationCycleEngine.Protocol.FULL;
            for (StabilizationHalfPagePolicy.Unit unit : ready) {
                out.add(new ConsolidationCycleEngine.Unit(
                    ConsolidationPhysicalUnitPolicy.encodeLineUnit(unit.lineIds), protocol));
                if (out.size() >= maxUnits) return Collections.unmodifiableList(out);
            }
        }
        return Collections.unmodifiableList(out);
    }

    /** Fail and defer the exact page displayed''')

          # HifzPrefs: completion advances only encoded physical lines; remove parent queue entry only when fully Acquired.
          replace_once(
              prefs,
              r'    /\*\* Atomically closes a frozen 1\.\.3 unit Consolidation group and makes its lines Acquired\. \*/\n    boolean completeConsolidationSessionV6\(ConsolidationCycleEngine\.Session session, GeometryRepository geometry,\n                                           String date, String label\) \{.*?\n    \}\n\n    public String lastSabqiDate\(\)',
              '''    /** Atomically closes a frozen 1..3 unit Consolidation group and makes its exact physical lines Acquired. */
    boolean completeConsolidationSessionV6(ConsolidationCycleEngine.Session session, GeometryRepository geometry,
                                           String date, String label) {
        if (session == null || !session.open() || !session.readyToClose())
            throw new IllegalStateException("Consolidation session must be OPEN and complete");
        if (geometry == null) throw new IllegalArgumentException("Consolidation geometry required");
        synchronized (V6_STATE_LOCK) {
            requireSchema6ProgressionState();
            LinkedHashSet<String> learned = v6LineIdSet("v6LearnedLineIds");
            LinkedHashSet<String> stabilized = v6LineIdSet("v6StabilizedLineIds");
            LinkedHashSet<String> acquired = v6LineIdSet("v6AcquiredCreditLineIds");

            for (String unitId : session.unitIds()) {
                List<String> ids = ConsolidationPhysicalUnitPolicy.decodeLineUnit(unitId);
                List<GeometryRepository.LineMeta> physical = geometry.linesForExactIds(ids);
                List<StabilizationHalfPagePolicy.Unit> verified = StabilizationHalfPagePolicy.planPage(physical);
                if (verified.size() != 1 || !verified.get(0).lineIds.equals(ids))
                    throw new IllegalStateException("Invalid frozen physical Consolidation unit");
                for (String lineId : ids) {
                    ProgressState state = progressStateFromSets(lineId, learned, stabilized, acquired);
                    if (state == ProgressState.STABILIZED) {
                        stabilized.remove(lineId);
                        acquired.add(lineId);
                    } else if (state != ProgressState.ACQUIRED) {
                        throw new IllegalStateException("Consolidation requires Stabilisé lines: " + lineId);
                    }
                }
            }

            ArrayList<VerseRange> pending = new ArrayList<>(unconsolidatedPromotedRanges());
            ArrayList<VerseRange> forced = new ArrayList<>(forcedPromotedRanges());
            ArrayList<AnchoringQueue.Entry> originalQueue = new ArrayList<>(anchoringQueue());
            int oldIndex = anchoringQueueIndex(originalQueue.size());
            ArrayList<AnchoringQueue.Entry> keptQueue = new ArrayList<>();
            for (AnchoringQueue.Entry entry : originalQueue) {
                List<String> parentIds = geometry.lineIdsForVerseRange(
                    GeometryRepository.parseVerse(entry.start), GeometryRepository.parseVerse(entry.end));
                boolean allAcquired = !parentIds.isEmpty() && acquired.containsAll(parentIds);
                if (allAcquired) {
                    VerseRef start = GeometryRepository.parseVerse(entry.start);
                    VerseRef end = GeometryRepository.parseVerse(entry.end);
                    pending = new ArrayList<>(subtractCoverage(pending, start, end));
                    forced = new ArrayList<>(subtractCoverage(forced, start, end));
                } else {
                    keptQueue.add(entry);
                }
            }

            int nextIndex = 0;
            if (!keptQueue.isEmpty() && !originalQueue.isEmpty()) {
                outer:
                for (AnchoringQueue.Entry visit : AnchoringQueue.visitOrder(originalQueue, oldIndex)) {
                    for (int i = 0; i < keptQueue.size(); i++) {
                        AnchoringQueue.Entry kept = keptQueue.get(i);
                        if (kept.start.equals(visit.start) && kept.end.equals(visit.end)) {
                            nextIndex = i;
                            break outer;
                        }
                    }
                }
            }

            LocalDate completed = safeDate(date, HifzClock.today());
            List<LocalDate> attendance = ConsolidationAttendance.add(consolidationAttendanceDates(), completed);
            return p.edit()
                .putString("v6LearnedLineIds", lineIdsJson(learned))
                .putString("v6StabilizedLineIds", lineIdsJson(stabilized))
                .putString("v6AcquiredCreditLineIds", lineIdsJson(acquired))
                .putString("unconsolidatedPromotedRanges", rangesJson(normalizeRanges(pending)))
                .putString("forcedPromotedRanges", rangesJson(normalizeRanges(forced)))
                .putString("anchoringQueue", anchoringQueueJson(keptQueue))
                .putBoolean("anchoringQueueInitialized", true).putInt("anchoringQueueIndex", nextIndex)
                .putString("lastRecentSabqiReviewDate", date).putString("lastRecentSabqiReviewLabel", label)
                .putString("consolidationAttendanceDates", attendanceJson(attendance))
                .remove(consolidationStateKey(ConsolidationCycleEngine.Family.STABILIZATION))
                .commit();
        }
    }

    public String lastSabqiDate()''')

          # Session: remove verse-range identity and render the exact encoded physical lines.
          session = 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java'
          replace_once(
              session,
              r'    private static String consolidationUnitId\(AnchoringQueue\.Entry entry\) \{.*?\n    \}\n\n    private void completeConsolidationRep\(\)',
              '''    private void renderConsolidationCycle() {
        String today = sessionDate.toString();
        if (today.equals(prefs.lastRecentSabqiReviewDate())) {
            sessionCompleted = true;
            program.setText("Consolidation · séance validée");
            progress.setText(prefs.lastRecentSabqiReviewLabel().isEmpty() ? "Acquis" : prefs.lastRecentSabqiReviewLabel());
            return;
        }
        consolidationSession = prefs.restoreConsolidationSession(
            consolidationEngine, ConsolidationCycleEngine.Family.STABILIZATION);
        if (consolidationSession == null) {
            List<ConsolidationCycleEngine.Unit> units = prefs.stabilizedConsolidationUnits(geometry, 3);
            if (units.isEmpty()) {
                sessionCompleted = true;
                program.setText("Consolidation · rien à consolider");
                progress.setText("Aucune unité Stabilisée en attente.");
                return;
            }
            ConsolidationCycleEngine.Cycle cycle = null;
            for (int i = 0; i < units.size(); i++) {
                ConsolidationCycleEngine.Unit unit = units.get(i);
                cycle = i == 0
                    ? consolidationEngine.startCycle("stabilization-" + today, ConsolidationCycleEngine.Family.STABILIZATION, unit)
                    : consolidationEngine.addUnit(cycle, unit);
            }
            consolidationSession = consolidationEngine.openSession(cycle, "session-" + today);
            if (!prefs.persistConsolidationSession(consolidationSession))
                throw new IllegalStateException("Impossible d’enregistrer la Consolidation ouverte");
        }
        if (consolidationSession.readyToClose()) {
            sessionCompleted = true;
            program.setText("Consolidation · prête à valider");
            progress.setText("Toutes les répétitions du groupe sont terminées.");
            addRoundAction("✓", "Valider", v -> validateConsolidationCycle());
            return;
        }
        int position = consolidationSession.nextUnitIndex();
        List<String> exactLineIds = ConsolidationPhysicalUnitPolicy.decodeLineUnit(
            consolidationSession.unitIds().get(position));
        List<GeometryRepository.LineMeta> physicalLines = geometry.linesForExactIds(exactLineIds);
        List<StabilizationHalfPagePolicy.Unit> verified = StabilizationHalfPagePolicy.planPage(physicalLines);
        if (verified.size() != 1 || !verified.get(0).lineIds.equals(exactLineIds))
            throw new IllegalStateException("Unité physique de Consolidation invalide");
        currentPage = physicalLines.get(0).page;
        unitFirstPage = unitLastPage = currentPage;
        currentLineIds = new ArrayList<>(exactLineIds);
        currentSelection = geometry.versesOnLines(currentLineIds);
        currentMask = 0;
        sessionCompleted = false;
        int[] vector = consolidationSession.stageVectorAt(position);
        int target = vector[consolidationSession.stage()];
        program.setText("Consolidation · " + currentLineIds.size() + " lignes · unité "
            + (position + 1) + "/" + consolidationSession.sessionGroupSize());
        progress.setText("Étape " + (consolidationSession.stage() + 1) + "/5 · "
            + consolidationSession.donePerStage() + "/" + target);
        showCurrent();
        addRoundAction("↻", "Répétition", v -> completeConsolidationRep());
    }

    private void completeConsolidationRep()''')

          # C23: assert the actual strict-surah invariant without requiring old literal calls in the session.
          preboox = 'hifz-app/src/test/java/com/quransafeguard/hifz/preview/PreBoox074SourceContractTest.java'
          replace_once(
              preboox,
              r'    @Test public void c23AllProductionFractionationUsesSurahSegments\(\) throws Exception \{.*?\n    \}\n\n    @Test public void c22EveryLiteralUiActionLabelIsPinnedByTheMappingTest',
              '''    @Test public void c23AllProductionFractionationUsesStrictSurahSegments() throws Exception {
        String geometry = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/GeometryRepository.java");
        String stabilization = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/StabilizationHalfPagePolicy.java");
        String session = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java");
        String planner = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/J10ReviewPlanner.java");
        String observer = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/J10ReviewObserver.java");
        String main = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java");
        String weekly = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/WeeklyDashboardPlanner.java");
        assertTrue(geometry.contains("surahSegmentLineCounts(VerseRef start, VerseRef end)"));
        assertTrue(stabilization.contains("singleSurah(line)"));
        assertTrue(stabilization.contains("line.page != page"));
        assertTrue(stabilization.contains("Physical Mushaf line crosses surah boundary"));
        assertTrue(session.contains("StabilizationHalfPagePolicy.planPage"));
        for (String text : new String[]{main, weekly, planner, observer}) {
            assertTrue(text.contains("surahSegmentLineCounts"));
            assertFalse(text.contains("fractionatedBlockLength(unit.size()"));
            assertFalse(text.contains("fractionatedBlockStart(unit.size()"));
        }
        assertFalse(session.contains("fractionatedBlockLength(unit.size()"));
        assertFalse(session.contains("fractionatedBlockStart(unit.size()"));
    }

    @Test public void c22EveryLiteralUiActionLabelIsPinnedByTheMappingTest''')

      - name: Verify patch invariants and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'stabilizedConsolidationUnits' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          grep -q 'ConsolidationPhysicalUnitPolicy.decodeLineUnit' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java
          ! grep -q 'private AnchoringQueue.Entry consolidationEntry' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java
          ! grep -q 'private static String consolidationUnitId' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java
          grep -q 'linesForExactIds' hifz-app/src/main/java/com/quransafeguard/hifz/preview/GeometryRepository.java
          grep -q 'c23AllProductionFractionationUsesStrictSurahSegments' hifz-app/src/test/java/com/quransafeguard/hifz/preview/PreBoox074SourceContractTest.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/GeometryRepository.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java \
                  hifz-app/src/test/java/com/quransafeguard/hifz/preview/PreBoox074SourceContractTest.java
          git commit -m 'fix: preserve physical stabilization units through consolidation'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
