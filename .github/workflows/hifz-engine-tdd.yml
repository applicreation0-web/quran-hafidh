name: Quran Hifz engine TDD gate

on:
  push:
    branches:
      - release/hifz-0.7.3-final

permissions:
  contents: read
  actions: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Tafsir sources required by app unit-test configuration
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.9-astra-re-audit
          run-id: 34336797351
          github-token: ${{ github.token }}
          path: baseline109
      - name: Inject Tafsir source parts only
        shell: bash
        run: |
          set -euo pipefail
          old_plus="$(find baseline109 -type f -name 'app-plus-release-unsigned.apk' -print -quit)"
          test -n "$old_plus" && test -s "$old_plus"
          rm -rf baseline109/tafsir app/src/plus/assets/tafsir
          mkdir -p baseline109/tafsir app/src/plus/assets/tafsir
          unzip -q "$old_plus" 'assets/tafsir/*' -d baseline109/tafsir
          cp baseline109/tafsir/assets/tafsir/* app/src/plus/assets/tafsir/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest --stacktrace
