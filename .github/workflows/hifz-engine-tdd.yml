name: Quran Hifz engine TDD gate

on:
  push:
    branches:
      - release/hifz-0.7.3-final

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: gradle --no-daemon :hifz-core:test --stacktrace
