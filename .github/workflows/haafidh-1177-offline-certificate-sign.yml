name: Quran Haafidh 1.17.7 temporary official certificate / APKv2 metadata-only signer
on:
  push:
    branches:
      - fix/haafidh-1177-boox-week-itqan-20261026
    paths:
      - '.github/workflows/haafidh-1177-offline-certificate-sign.yml'
      - 'signing-input/haafidh_1177_signed_data.b64'
permissions:
  contents: read
jobs:
  public-cert-and-metadata-sign-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore official historical signing key transiently
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${HIFZ_KEYSTORE_BASE64:-}"
          printf '%s' "$HIFZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/haafidh-official-1177.jks"
          chmod 600 "$RUNNER_TEMP/haafidh-official-1177.jks"
      - name: Export public cert and sign ONLY supplied APKv2 metadata if present
        env:
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Haafidh1177CertificateOnly.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.Base64;
          class Haafidh1177CertificateOnly {
            static String hex(byte[] b) {
              StringBuilder s=new StringBuilder();for(byte x:b)s.append(String.format("%02x",x&255));return s.toString();
            }
            public static void main(String[] args)throws Exception {
              KeyStore k=KeyStore.getInstance(Path.of(args[0]).toFile(),System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
              String alias=System.getenv("HIFZ_KEY_ALIAS");
              Certificate c=k.getCertificate(alias);
              if(c==null)throw new SecurityException("Official signer certificate missing");
              byte[] der=c.getEncoded();
              String fingerprint=hex(MessageDigest.getInstance("SHA-256").digest(der));
              if(!fingerprint.equals("66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14"))
                throw new SecurityException("Historical BOOX certificate mismatch");
              Files.write(Path.of(args[1],"official-cert-1177.der"),der);
              Path request=Path.of("signing-input/haafidh_1177_signed_data.b64");
              if(Files.exists(request)) {
                byte[] signedData=Base64.getMimeDecoder().decode(Files.readString(request).trim());
                if(signedData.length<1200||signedData.length>3500)
                  throw new SecurityException("Only size-bounded APKv2 metadata accepted");
                PrivateKey key=(PrivateKey)k.getKey(alias,System.getenv("HIFZ_KEY_PASSWORD").toCharArray());
                Signature sig=Signature.getInstance("SHA256withRSA");
                sig.initSign(key);sig.update(signedData);
                byte[] value=sig.sign();
                Signature verify=Signature.getInstance("SHA256withRSA");
                verify.initVerify(c);verify.update(signedData);
                if(!verify.verify(value))throw new SecurityException("Signing self-verification failed");
                Files.writeString(Path.of(args[1],"metadata-signature-1177.b64"),Base64.getEncoder().encodeToString(value)+"\n");
                System.out.println("PASS: exact historical cert, metadata signed without any APK or private Atlas assets on runner");
                System.out.println("SIGNED_DATA_SHA256="+hex(MessageDigest.getInstance("SHA-256").digest(signedData)));
              } else System.out.println("PASS: public certificate exported; no signature requested");
              System.out.println("CERT_SHA256="+fingerprint);
            }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/haafidh-1177-public-output"
          javac "$RUNNER_TEMP/Haafidh1177CertificateOnly.java"
          java -cp "$RUNNER_TEMP" Haafidh1177CertificateOnly             "$RUNNER_TEMP/haafidh-official-1177.jks" "$RUNNER_TEMP/haafidh-1177-public-output"
          shred -fu "$RUNNER_TEMP/haafidh-official-1177.jks" || rm -f "$RUNNER_TEMP/haafidh-official-1177.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-1177-official-public-cert-and-detached-signature-only
          path: ${{ runner.temp }}/haafidh-1177-public-output/
          retention-days: 1
          if-no-files-found: error
