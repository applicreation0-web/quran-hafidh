name: Quran Haafidh 1.17.8 ONE-SHOT official v2 signature, metadata only
on:
  push:
    branches:
      - fix/haafidh-1178-family-postfinal-20261026
    paths:
      - 'signing-input/signed_data_1178.b64'
permissions:
  contents: read
jobs:
  one-shot-v2-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify request fixed to the audited OFFLINE 1.17.8 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f signing-input/signed_data_1178.b64
          # Whitelist the exact 1,449-byte public v2 signedData, not an arbitrary signing oracle.
          echo 'd4e0b680f5020deda33f495f42010057f86ed8a48a6b656641e84d205f48ed31  signing-input/signed_data_1178.bin' > "$RUNNER_TEMP/request.sha256"
          base64 -d signing-input/signed_data_1178.b64 > signing-input/signed_data_1178.bin
          sha256sum -c "$RUNNER_TEMP/request.sha256"
          test "$(wc -c < signing-input/signed_data_1178.bin)" -eq 1449
          shred -fu signing-input/signed_data_1178.bin || rm -f signing-input/signed_data_1178.bin
      - name: Restore historical official key in runner temporary storage only
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HIFZ_KEYSTORE_BASE64:-}"
          printf '%s' "$HIFZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/official.jks"
          chmod 600 "$RUNNER_TEMP/official.jks"
          test -s "$RUNNER_TEMP/official.jks"
      - name: Sign ONLY authenticated public signedData (never an APK or private Atlas resource)
        env:
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'shred -fu "$RUNNER_TEMP/official.jks" || rm -f "$RUNNER_TEMP/official.jks"' EXIT
          cat > "$RUNNER_TEMP/Sign1178V2Data.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.Base64;
          public class Sign1178V2Data {
            static String hex(byte[] b) {
              StringBuilder s=new StringBuilder();
              for(byte v:b) s.append(String.format("%02x",v & 255));
              return s.toString();
            }
            public static void main(String[] args) throws Exception {
              byte[] input=Base64.getMimeDecoder().decode(Files.readString(Path.of(args[0])).trim());
              if(input.length!=1449)throw new SecurityException("Unexpected signedData length");
              String request=hex(MessageDigest.getInstance("SHA-256").digest(input));
              if(!request.equals("d4e0b680f5020deda33f495f42010057f86ed8a48a6b656641e84d205f48ed31"))
                throw new SecurityException("Request SHA not explicitly authorized");
              KeyStore store=KeyStore.getInstance(Path.of(args[1]).toFile(),
                System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
              Certificate cert=store.getCertificate(System.getenv("HIFZ_KEY_ALIAS"));
              if(cert==null)throw new SecurityException("Official signer certificate missing");
              String actual=hex(MessageDigest.getInstance("SHA-256").digest(cert.getEncoded()));
              if(!actual.equals("66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14"))
                throw new SecurityException("Wrong release certificate");
              Signature signer=Signature.getInstance("SHA256withRSA");
              signer.initSign((PrivateKey)store.getKey(System.getenv("HIFZ_KEY_ALIAS"),
                System.getenv("HIFZ_KEY_PASSWORD").toCharArray()));
              signer.update(input);
              byte[] signature=signer.sign();
              Signature verifier=Signature.getInstance("SHA256withRSA");
              verifier.initVerify(cert);
              verifier.update(input);
              if(!verifier.verify(signature))throw new SecurityException("Signature self-check failed");
              Files.writeString(Path.of(args[2]),Base64.getEncoder().encodeToString(signature)+"\n");
              System.out.println("PASS: historical certificate="+actual);
              System.out.println("PASS: fixed digest="+request);
              System.out.println("PASS: signature only; no private Atlas resources, APK or user backup in CI");
            }
          }
          JAVA
          javac "$RUNNER_TEMP/Sign1178V2Data.java"
          java -cp "$RUNNER_TEMP" Sign1178V2Data \
            signing-input/signed_data_1178.b64 "$RUNNER_TEMP/official.jks" "$RUNNER_TEMP/official_signature_1178.b64"
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-1178-official-v2-signature-only
          path: ${{ runner.temp }}/official_signature_1178.b64
          retention-days: 1
          if-no-files-found: error
