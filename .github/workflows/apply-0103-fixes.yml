name: Apply 0.10.3 audited fixes

on:
  push:
    branches:
      - plus-rtl-free-reader-hikam-reference

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plus-rtl-free-reader-hikam-reference
      - name: Apply audited fixes
        run: python3 scripts/apply_0103_release_fixes.py
      - name: Commit audited fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/hikam/al_hikam_verified.json \
                  app/src/main/java/com/quranunlock/guard/HikamDetailActivity.kt \
                  app/src/main/java/com/quranunlock/guard/DashboardActivity.kt \
                  app/build.gradle.kts
          git commit -m "Apply audited Hikam and UX corrections for 0.10.3"
          git push origin HEAD:plus-rtl-free-reader-hikam-reference
