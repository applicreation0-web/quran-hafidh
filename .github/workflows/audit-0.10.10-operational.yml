name: 0.10.10 Audit A - Operational contradictory

on:
  push:
    branches: ["work/0.10.10-runtime-hifz-final"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  operational-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Apply 0.10.10 hardening idempotently
        run: python3 scripts/apply_01010_runtime_hardening.py
      - name: Restore audited Mushaf and Plus corpus
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.8-unsigned
          run-id: 34096699893
          github-token: ${{ github.token }}
          path: baseline108
      - name: Restore immutable corpus bytes only — never overwrite reader109
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          light=next(Path('baseline108').rglob('*light*unsigned.apk'))
          plus=next(Path('baseline108').rglob('*plus*unsigned.apk'))
          with zipfile.ZipFile(light) as z:
              for n in z.namelist():
                  if n.startswith('assets/mushaf/') and not n.endswith('/'):
                      p=Path('app/src/main')/n
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(n))
          with zipfile.ZipFile(plus) as z:
              for n in z.namelist():
                  if n.startswith('assets/tafsir/') and not n.endswith('/'):
                      p=Path('app/src/plus')/n
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(n))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact reader geometry and static 10.10 contract
        run: |
          pip install pymupdf==1.26.7 numpy scipy
          python3 scripts/build_reader109_geometry.py
          python3 scripts/verify_hifz_geometry_edges.py
          python3 scripts/verify_reader109.py
          node scripts/test_reader109_protocol.js
          python3 scripts/audit_01010_release_contract.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install stable build SDK and emulator image
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "system-images;android-35;google_apis;x86_64" "emulator"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Full unit suites - both editions
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest --stacktrace
      - name: Build Light and Plus candidates
        run: gradle --no-daemon :app:assembleLightDebug :app:assemblePlusDebug :app:assembleLightRelease :app:assemblePlusRelease --stacktrace
      - name: Edition isolation
        run: |
          gradle --no-daemon :app:verifyEditionIsolation --stacktrace
          python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_plus_apk_tafsir.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk
      - name: Runtime zone-of-activity audit - Light
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: gradle --no-daemon :app:connectedLightDebugAndroidTest --stacktrace
      - name: Runtime zone-of-activity audit - Plus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: gradle --no-daemon :app:connectedPlusDebugAndroidTest --stacktrace
      - name: Upload independent operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-a-operational-evidence
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/
            geometry-report.json
          retention-days: 14
