name: Haafidh 1.17.15 — unsigned private-runtime staging ONLY
on:
  push:
    branches: [delivery/haafidh-11715-offline-v2-20261108]
    paths: [.github/workflows/haafidh-11715-unsigned-private-runtime-stage.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AYAH_THEMES_PRIVATE_114: '1'
      HIFZ_PRIVATE_RELEASE_UPGRADE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce exact certified product source and no payload in public repo
        run: |
          set -euo pipefail
          base=53debe3d1b39d80460dae3c5505f775c0079eed7
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD)"
          test "$changed" = '.github/workflows/haafidh-11715-unsigned-private-runtime-stage.yml'
          ! find hifz-app/src/private114/assets -type f 2>/dev/null | grep -q .
          echo 'PRODUCT_SOURCE_IDENTICAL_TO_GREEN_CI__NO_PRIVATE_ASSETS'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: SDK and authentic QCF pages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Compile and stage unsigned APK only (private check deferred until offline asset injection and official digest signature)
        run: |
          # NEVER sign or publish this incomplete staging binary.
          gradle --no-daemon :hifz-app:assembleRelease -x :hifz-app:verifyPrivateReleaseInputs
      - name: Verify unsigned app ID, version 53, absence of Atlas secrets and private sources
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(hifz-app/build-private114/outputs/apk/release/*.apk)
          test "${#files[@]}" -eq 1
          apk="${files[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.quransafeguard.hifz' versionCode='53' versionName='1.17.15'"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'STAGING_MUST_BE_UNSIGNED'; exit 1
          fi
          ! unzip -Z1 "$apk" | grep -Eq '^assets/(atlas_private|ayah_themes_private)/'
          test "$(unzip -Z1 "$apk" | grep -c '^assets/mushaf/hafs/kfqc/svg-br/' || true)" -ge 604 || {
            echo 'QCF_604_PAGES_MISSING'; exit 1; }
          mkdir -p unsigned-stage
          cp "$apk" unsigned-stage/Quran_Haafidh_11715_UNSIGN_PRIVATE_RUNTIME_NO_ATLAS.apk
          sha256sum unsigned-stage/*.apk > unsigned-stage/SHA256SUMS.txt
          echo 'STAGING_PASS__UNSIGNED__NO_PRIVATE_ASSETS__NOT_INSTALLABLE'
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-11715-unsigned-private-runtime-no-private-assets
          path: unsigned-stage/
          retention-days: 2
          if-no-files-found: error
