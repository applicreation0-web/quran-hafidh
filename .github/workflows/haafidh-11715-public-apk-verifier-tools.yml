name: Haafidh 1.17.15 — public Android APK verification tools only
on:
  push:
    branches: [delivery/haafidh-11715-offline-v2-20261108]
    paths: [.github/workflows/haafidh-11715-public-apk-verifier-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Retrieve official Android Build Tools 36 verification binaries (no APK or corpus)
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0"
          tool="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$tool/lib/apksigner.jar"
          test -x "$tool/aapt"
          test -x "$tool/zipalign"
          mkdir -p public-verifier-tools
          cp "$tool/lib/apksigner.jar" public-verifier-tools/
          cp "$tool/aapt" public-verifier-tools/
          cp "$tool/zipalign" public-verifier-tools/
          chmod +x public-verifier-tools/aapt public-verifier-tools/zipalign
          java -jar public-verifier-tools/apksigner.jar --version
          echo "PUBLIC_TOOLING_ONLY_NO_APK_NO_PRIVATE_ASSETS"
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-11715-public-apksigner-aapt-zipalign
          path: public-verifier-tools/
          retention-days: 1
          if-no-files-found: error
