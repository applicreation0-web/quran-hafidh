name: Quran Hifz final UI polish TDD

on:
  push:
    branches:
      - fix/hifz-0.7.3-final-ui-polish
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  unit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated Mushaf and Tafsir baseline
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.9-astra-re-audit
          run-id: 34336797351
          github-token: ${{ github.token }}
          path: baseline109

      - name: Inject canonical Mushaf and Tafsir test inputs
        shell: bash
        run: |
          set -euo pipefail
          old_plus="$(find baseline109 -type f -name 'app-plus-release-unsigned.apk' -print -quit)"
          test -n "$old_plus" && test -s "$old_plus"
          echo 'f826d06da88ee9411d275a34a2fa17d7d7686c6cef4151ce4d15b433848c1e66  '"$old_plus" | sha256sum -c -
          rm -rf baseline109/extracted && mkdir -p baseline109/extracted
          unzip -q "$old_plus" 'assets/mushaf/hafs/kfqc/svg-br/*.svg.br' 'assets/tafsir/*' -d baseline109/extracted

          mushaf_dst="app/src/main/assets/mushaf/hafs/kfqc/svg-br"
          rm -rf "$mushaf_dst" && mkdir -p "$mushaf_dst"
          cp baseline109/extracted/assets/mushaf/hafs/kfqc/svg-br/*.svg.br "$mushaf_dst/"
          test "$(find "$mushaf_dst" -maxdepth 1 -type f -name '[0-9][0-9][0-9].svg.br' | wc -l | tr -d ' ')" = 604

          tafsir_dst="app/src/plus/assets/tafsir"
          rm -rf "$tafsir_dst" && mkdir -p "$tafsir_dst"
          cp baseline109/extracted/assets/tafsir/* "$tafsir_dst/"
          test "$(find "$tafsir_dst" -maxdepth 1 -type f -name 'al_jalalayn_en.sqlite.gz.part*' | wc -l | tr -d ' ')" = 4
          test "$(find "$tafsir_dst" -maxdepth 1 -type f -name 'qurtubi_en.sqlite.gz.b64.part*' | wc -l | tr -d ' ')" = 4
          test "$(find "$tafsir_dst" -maxdepth 1 -type f -name 'qushayri_en.sqlite.gz.b64.part*' | wc -l | tr -d ' ')" = 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run Hifz unit contracts
        run: gradle :hifz-app:testDebugUnitTest --stacktrace
