name: 0.10.7 reading focus

on:
  push:
    branches:
      - "release/0.10.7-clean"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reading-focus:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.10.7-clean
          fetch-depth: 0

      - name: Apply 0.10.7 reading refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Tafsir prose: left/start alignment prevents large inter-word gaps on narrow screens.
          panel = 'app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt'
          one(
              panel,
              'textAlign = if (isPoetry) TextAlign.Start else TextAlign.Justify',
              'textAlign = TextAlign.Start'
          )
          one(
              panel,
              '''    maxPanelHeight: Dp,\n    onPanelTopInWindow: (Int) -> Unit\n) {''',
              '''    maxPanelHeight: Dp,\n    expanded: Boolean,\n    onExpandedChange: (Boolean) -> Unit,\n    onPanelTopInWindow: (Int) -> Unit\n) {'''
          )
          one(
              panel,
              '''                Row {\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription = "Réduire la taille du commentaire"\n                        },''',
              '''                Row {\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription = if (expanded) {\n                                "Réduire le panneau du Tafsîr"\n                            } else {\n                                "Agrandir le panneau du Tafsîr"\n                            }\n                            stateDescription = if (expanded) "Tafsîr agrandi" else "Tafsîr compact"\n                        },\n                        onClick = { onExpandedChange(!expanded) }\n                    ) {\n                        Text(\n                            if (expanded) "⤡" else "⤢",\n                            color = MaterialTheme.colorScheme.onSurfaceVariant\n                        )\n                    }\n                    TextButton(\n                        modifier = Modifier.semantics {\n                            contentDescription = "Réduire la taille du commentaire"\n                        },'''
          )

          # Thread the compact/expanded state through the Plus controller.
          multi = 'app/src/plus/java/com/quranunlock/guard/MultiTafsirPanel.kt'
          one(
              multi,
              '''    maxPanelHeight: Dp,\n    onPanelTopInWindow: (Int) -> Unit,\n    onQuranReferenceSelected: ((QuranReferenceRef) -> Unit)? = null''',
              '''    maxPanelHeight: Dp,\n    expanded: Boolean,\n    onExpandedChange: (Boolean) -> Unit,\n    onPanelTopInWindow: (Int) -> Unit,\n    onQuranReferenceSelected: ((QuranReferenceRef) -> Unit)? = null'''
          )
          one(
              multi,
              '''        modifier = modifier,\n        maxPanelHeight = maxPanelHeight,\n        onPanelTopInWindow = onPanelTopInWindow''',
              '''        modifier = modifier,\n        maxPanelHeight = maxPanelHeight,\n        expanded = expanded,\n        onExpandedChange = onExpandedChange,\n        onPanelTopInWindow = onPanelTopInWindow'''
          )

          edition = 'app/src/plus/java/com/quranunlock/guard/TafsirEdition.kt'
          one(
              edition,
              '''        maxPanelHeight: Dp,\n        onPanelTopInWindow: (Int) -> Unit,\n        onQuranReferenceSelected: ((QuranReferenceRef) -> Unit)? = null''',
              '''        maxPanelHeight: Dp,\n        expanded: Boolean,\n        onExpandedChange: (Boolean) -> Unit,\n        onPanelTopInWindow: (Int) -> Unit,\n        onQuranReferenceSelected: ((QuranReferenceRef) -> Unit)? = null'''
          )
          one(
              edition,
              '''            modifier = modifier,\n            maxPanelHeight = maxPanelHeight,\n            onPanelTopInWindow = onPanelTopInWindow,''',
              '''            modifier = modifier,\n            maxPanelHeight = maxPanelHeight,\n            expanded = expanded,\n            onExpandedChange = onExpandedChange,\n            onPanelTopInWindow = onPanelTopInWindow,'''
          )

          # Reader: compact Tafsir for consultation, expanded Tafsir for sustained reading.
          reader = 'app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt'
          one(
              reader,
              '''                var pureReading by remember { mutableStateOf(false) }\n                var visualMode by remember {''',
              '''                var pureReading by remember { mutableStateOf(false) }\n                var tafsirExpanded by remember { mutableStateOf(false) }\n                var visualMode by remember {'''
          )
          one(
              reader,
              '''                LaunchedEffect(selectedTafsirVerse) {\n                    val requestedVerse = selectedTafsirVerse ?: return@LaunchedEffect''',
              '''                LaunchedEffect(selectedTafsirVerse) {\n                    tafsirExpanded = false\n                    val requestedVerse = selectedTafsirVerse ?: return@LaunchedEffect'''
          )
          one(
              reader,
              '''                                    maxPanelHeight = maxHeight * 0.42f,\n                                    onPanelTopInWindow = { top ->''',
              '''                                    maxPanelHeight = maxHeight * if (tafsirExpanded) 0.84f else 0.42f,\n                                    expanded = tafsirExpanded,\n                                    onExpandedChange = { tafsirExpanded = it },\n                                    onPanelTopInWindow = { top ->'''
          )

          # Verse selection: explicit no-stroke neutral highlight, suitable for cream and grayscale screens.
          tafsir_edition = Path(edition)
          et = tafsir_edition.read_text(encoding='utf-8')
          old_css = '''                  .ayahPolygon.qsg-selected {\n                    fill: #BFE8C8 !important;\n                    fill-opacity: .48 !important;\n                  }'''
          new_css = '''                  .ayahPolygon.qsg-selected {\n                    fill: #C8CEC8 !important;\n                    fill-opacity: .44 !important;\n                    stroke: none !important;\n                  }'''
          if et.count(old_css) != 1:
              raise SystemExit('selected-verse CSS block not found exactly once')
          tafsir_edition.write_text(et.replace(old_css, new_css, 1), encoding='utf-8')

          # 0.10.7 contract: this intentionally supersedes the 0.10.5 justification choice.
          Path('docs/TAFSIR_READING_CONTRACT_0.10.7.md').write_text('''# Quran Safeguard 0.10.7 — Tafsîr reading contract\n\nStatus: blocking 0.10.7 presentation contract.\n\n- The displayed Tafsîr remains source-backed English. No generated translation or paraphrase is inserted.\n- Primary edition labels remain the author names: **Jalalayn**, **Qurtubi**, **Qushayri**.\n- Commentary, source translation, notes and metadata use logical Start/left alignment on Latin text. Full justification is disabled to avoid stretched word spacing on narrow screens.\n- Established sizes remain: 18sp default commentary, 16–26sp user range; commentary 1.50×, notes 1.45×, poetry 1.55×.\n- Poetry is source-semantic only, never inferred from italics. Source line breaks and stanza breaks are preserved. False PDF/OCR blank lines outside source poetry/stanzas are removed.\n- Qushayri source-note calls are removed only when source verification establishes them as unexposed footnote calls. Arbitrary numbers must never be stripped.\n- Explicit canonical Qur’an cross-references remain interactive with a tap target larger than the visible underlined reference. Back returns to the originating Tafsîr state.\n- The Tafsîr panel has compact and expanded reading states; expansion must not duplicate controls or alter source text.\n- Selected Mushaf verses use a muted neutral highlight with no enclosing outline. Selection must not imply neighboring verse fragments.\n- Reading surfaces use cream/neutral colors and remain understandable in grayscale; color is not the only carrier of meaning.\n''', encoding='utf-8')

          Path('scripts/verify_0107_tafsir_reading_contract.py').write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\ndef read(p):\n    return (ROOT / p).read_text(encoding="utf-8")\n\ndef require(ok, msg):\n    if not ok:\n        raise SystemExit("0.10.7 TAFSIR READING AUDIT FAILURE: " + msg)\n\npanel = read("app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt")\nreader = read("app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt")\nedition = read("app/src/plus/java/com/quranunlock/guard/TafsirEdition.kt")\nrepo = read("app/src/plus/java/com/quranunlock/guard/MultiTafsirRepository.kt")\ncontract = read("docs/TAFSIR_READING_CONTRACT_0.10.7.md")\n\nrequire("textAlign = TextAlign.Start" in panel, "Latin Tafsir text must use Start alignment")\nrequire("TextAlign.Justify" not in panel, "full justification must not survive in the 0.10.7 renderer")\nrequire("COMMENTARY_LINE_HEIGHT_RATIO = 1.50f" in panel, "commentary line height changed")\nrequire("NOTE_LINE_HEIGHT_RATIO = 1.45f" in panel, "note line height changed")\nrequire("POETRY_LINE_HEIGHT_RATIO = 1.55f" in panel, "poetry line height changed")\nrequire("run.text.replace(Regex(\\\"\\\\\\\\n{2,}\\\"), \\\"\\\\n\\\")" in panel, "false blank-line collapse missing")\nrequire("tapStart = (linkStart - 2)" in panel and "tapEnd = (linkEnd + 2)" in panel, "expanded Quran reference tap target missing")\nrequire("onExpandedChange(!expanded)" in panel, "Tafsir expand/collapse control missing")\nrequire("0.84f" in reader and "0.42f" in reader, "compact/expanded Tafsir heights missing")\nrequire("stroke: none !important" in edition and "#C8CEC8" in edition, "neutral no-outline verse highlight missing")\nfor marker in ('JALALAYN("jalalayn", "Jalalayn")', 'QURTUBI("qurtubi", "Qurtubi")', 'QUSHAYRI("qushayri", "Qushayri")'):\n    require(marker in repo, "author label changed: " + marker)\nfor marker in ("source-backed English", "Full justification is disabled", "compact and expanded", "grayscale"):\n    require(marker in contract, "contract marker missing: " + marker)\nprint("0.10.7 Tafsir reading contract: PASS")\n''', encoding='utf-8')

          # Final static invariants before compilation.
          assert 'TextAlign.Justify' not in Path(panel).read_text(encoding='utf-8')
          assert 'Qushayri' in Path(multi).read_text(encoding='utf-8')
          assert 'stroke: none !important' in Path(edition).read_text(encoding='utf-8')
          print('0.10.7 reading refinements applied')
          PY

      - name: Verify 0.10.7 reading contract
        run: python3 scripts/verify_0107_tafsir_reading_contract.py

      - name: Verify packaged Qushayri notes and poetry
        run: python3 scripts/audit_0106_tafsir_presentation.py app/src/plus/assets/tafsir

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Fetch canonical Mushaf
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Test Light and Plus
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest

      - name: Commit tested reading focus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt \
                  app/src/plus/java/com/quranunlock/guard/TafsirEdition.kt \
                  app/src/plus/java/com/quranunlock/guard/TafsirPanel.kt \
                  app/src/plus/java/com/quranunlock/guard/MultiTafsirPanel.kt \
                  docs/TAFSIR_READING_CONTRACT_0.10.7.md \
                  scripts/verify_0107_tafsir_reading_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix 0.10.7 Tafsir reading ergonomics [skip ci]"
          git push origin HEAD:release/0.10.7-clean
