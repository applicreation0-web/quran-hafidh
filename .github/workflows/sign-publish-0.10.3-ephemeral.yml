name: Ephemeral sign and publish Quran Safeguard 0.10.3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sign-publish:
    if: github.event.head_commit.message == 'Start ephemeral signing handshake for Quran Safeguard 0.10.3'
    runs-on: ubuntu-latest
    env:
      RELEASE_SOURCE_SHA: 1118119c4b4ac5f306cb10870935499659414d62
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Verify app source has not changed since audited merge
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${RELEASE_SOURCE_SHA}" HEAD -- . ':(exclude).github/**'

      - name: Publish one-time public encryption certificate
        shell: bash
        run: |
          set -euo pipefail
          private_key="${RUNNER_TEMP}/qsg-signing-private.pem"
          certificate="${RUNNER_TEMP}/qsg-signing-recipient.crt"
          openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
            -keyout "${private_key}" \
            -out "${certificate}" \
            -days 1 \
            -subj '/CN=Quran-Safeguard-0.10.3-Ephemeral-Signing/' \
            >/dev/null 2>&1
          chmod 600 "${private_key}"
          mkdir -p .github/signing-handshake
          cp "${certificate}" .github/signing-handshake/recipient.crt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/signing-handshake/recipient.crt
          git commit -m 'Publish ephemeral signing certificate for 0.10.3'
          git push origin HEAD:main

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up Python audit parser
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Re-audit and build 0.10.3
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:verifyReleaseAudit :app:testLightDebugUnitTest
          python3 scripts/verify_0103_update.py
          python3 scripts/audit_hikam_translation_against_islamicpearls.py
          gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease
          python3 scripts/verify_light_apk_no_tafsir.py \
            app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_plus_apk_tafsir.py \
            app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk

      - name: Wait for encrypted signing package
        shell: bash
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/signing-response.b64"
          : > "${response}"
          for attempt in $(seq 1 240); do
            git fetch -q origin main
            if git show origin/main:.github/signing-handshake/response.b64 \
              > "${response}" 2>/dev/null && test -s "${response}"; then
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for encrypted signing package.' >&2
          exit 1

      - name: Decrypt, sign, verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          private_key="${RUNNER_TEMP}/qsg-signing-private.pem"
          certificate="${RUNNER_TEMP}/qsg-signing-recipient.crt"
          encrypted="${RUNNER_TEMP}/signing-response.cms"
          bundle="${RUNNER_TEMP}/signing-bundle.tar.gz"
          signing_dir="${RUNNER_TEMP}/signing-material"
          release_dir="${RUNNER_TEMP}/quran-safeguard-0.10.3"
          mkdir -p "${signing_dir}" "${release_dir}"

          base64 --decode "${RUNNER_TEMP}/signing-response.b64" > "${encrypted}"
          openssl cms -decrypt -binary -inform DER \
            -in "${encrypted}" \
            -recip "${certificate}" \
            -inkey "${private_key}" \
            -out "${bundle}"
          tar -xzf "${bundle}" -C "${signing_dir}"
          test -s "${signing_dir}/light.p12"
          test -s "${signing_dir}/plus.p12"
          test -s "${signing_dir}/light.pass"
          test -s "${signing_dir}/plus.pass"
          chmod 600 "${signing_dir}"/*

          export LIGHT_KEYSTORE_PASSWORD="$(cat "${signing_dir}/light.pass")"
          export PLUS_KEYSTORE_PASSWORD="$(cat "${signing_dir}/plus.pass")"

          tools="${ANDROID_HOME}/build-tools/36.0.0"
          light_unsigned="app/build/outputs/apk/light/release/app-light-release-unsigned.apk"
          plus_unsigned="app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk"
          light_aligned="${RUNNER_TEMP}/light-aligned.apk"
          plus_aligned="${RUNNER_TEMP}/plus-aligned.apk"
          light_apk="${release_dir}/Quran-Safeguard-0.10.3-Light-release.apk"
          plus_apk="${release_dir}/Quran-Safeguard-Plus-0.10.3-release.apk"

          "${tools}/zipalign" -p -f 4 "${light_unsigned}" "${light_aligned}"
          "${tools}/zipalign" -p -f 4 "${plus_unsigned}" "${plus_aligned}"
          "${tools}/apksigner" sign \
            --ks "${signing_dir}/light.p12" \
            --ks-type PKCS12 \
            --ks-key-alias quran-safeguard \
            --ks-pass env:LIGHT_KEYSTORE_PASSWORD \
            --key-pass env:LIGHT_KEYSTORE_PASSWORD \
            --out "${light_apk}" "${light_aligned}"
          "${tools}/apksigner" sign \
            --ks "${signing_dir}/plus.p12" \
            --ks-type PKCS12 \
            --ks-key-alias quran-safeguard-plus \
            --ks-pass env:PLUS_KEYSTORE_PASSWORD \
            --key-pass env:PLUS_KEYSTORE_PASSWORD \
            --out "${plus_apk}" "${plus_aligned}"

          unset LIGHT_KEYSTORE_PASSWORD PLUS_KEYSTORE_PASSWORD

          "${tools}/zipalign" -c -p 4 "${light_apk}"
          "${tools}/zipalign" -c -p 4 "${plus_apk}"
          "${tools}/apksigner" verify --verbose --print-certs "${light_apk}" \
            | tee "${release_dir}/light-signature.txt"
          "${tools}/apksigner" verify --verbose --print-certs "${plus_apk}" \
            | tee "${release_dir}/plus-signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            "${release_dir}/light-signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' \
            "${release_dir}/light-signature.txt"
          grep -Fq 'Signer #1 certificate SHA-256 digest: 6c706f4ea44ef667d0b9698c07a39e929b1e286d2397665504411dedb37457ac' \
            "${release_dir}/light-signature.txt"
          grep -Fq 'Signer #1 certificate SHA-256 digest: 1843d245832549afc6333ab77a587649a14fedb1f4acc9c08f367c3f0301d989' \
            "${release_dir}/plus-signature.txt"

          test "$(apkanalyzer manifest application-id "${light_apk}")" = \
            'com.applicreation0.quransafeguard'
          test "$(apkanalyzer manifest application-id "${plus_apk}")" = \
            'com.applicreation0.quransafeguard.plus'
          test "$(apkanalyzer manifest version-code "${light_apk}")" = '22'
          test "$(apkanalyzer manifest version-code "${plus_apk}")" = '22'
          test "$(apkanalyzer manifest version-name "${light_apk}")" = '0.10.3'
          test "$(apkanalyzer manifest version-name "${plus_apk}")" = '0.10.3-plus.1'

          python3 scripts/verify_light_apk_no_tafsir.py "${light_apk}"
          python3 scripts/verify_plus_apk_tafsir.py "${plus_apk}"
          sha256sum "${light_apk}" "${plus_apk}" \
            > "${release_dir}/Quran-Safeguard-0.10.3-SHA256.txt"

          if gh release view v0.10.3 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Release v0.10.3 already exists; refusing to overwrite it.' >&2
            exit 1
          fi

          cat > "${release_dir}/release-notes.md" <<'NOTES'
          ## Quran Safeguard 0.10.3

          Mise à jour auditée de **Light** et de la version personnelle **Plus**.

          ### Changements
          - sens du Mushaf corrigé comme un livre arabe : droite = page suivante, gauche = précédente ;
          - Qur’an & Tafsîr accessible volontairement hors événement Safeguard dans Plus, sans créditer les quotas ;
          - traduction française des 264 Hikam recroisée avec l’anglais Islamic Pearls, l’arabe restant l’autorité ;
          - corrections confirmées des Hikam 174–176 ;
          - infrastructure Plus pour deux commentaires distincts par Hikma : al-Sharnūbī / Ibn ʿAbbād al-Rundī ;
          - aucun commentaire absent ou non vérifié n’est fabriqué.

          ### Vérifications
          Audit contradictoire global, garde-fou 0.10.3, contrôle 264/264, tests unitaires, builds Release Light/Plus, isolation du Tafsîr, intégrité du corpus Plus, signatures APK v2/v3, identités Android et SHA-256 vérifiés.

          **Plus reste strictement personnelle et n’est pas destinée à la redistribution.**
          **Laṭāʾif al-Ishārāt est reporté à une mise à jour ultérieure.**
          NOTES

          gh release create v0.10.3 \
            "${light_apk}" \
            "${plus_apk}" \
            "${release_dir}/Quran-Safeguard-0.10.3-SHA256.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SOURCE_SHA}" \
            --title 'Quran Safeguard 0.10.3 — Light & Plus' \
            --notes-file "${release_dir}/release-notes.md"

          shred -u "${signing_dir}/light.p12" "${signing_dir}/plus.p12" \
            "${signing_dir}/light.pass" "${signing_dir}/plus.pass" \
            "${private_key}" "${bundle}" "${encrypted}" || true

      - name: Remove handshake files from main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          git checkout -B cleanup origin/main
          git rm -f .github/signing-handshake/recipient.crt \
            .github/signing-handshake/response.b64 \
            .github/workflows/sign-publish-0.10.3-ephemeral.yml \
            .github/workflows/export-unsigned-0.10.3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clean ephemeral 0.10.3 signing transport'
          git push origin HEAD:main
