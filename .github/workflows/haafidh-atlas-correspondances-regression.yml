name: Quran Haafidh — Hifz, Atlas and Correspondances integrity
on:
  push:
    branches:
      - work/haafidh-1171-atlas-correspondances
    paths:
      - 'hifz-app/**'
      - 'hifz-core/**'
      - 'scripts/guard_frozen_hifz_engines.sh'
      - 'scripts/audit_hifz_quiz_against_1171.sh'
      - 'scripts/verify_contractual_ui_icons.py'
      - '.github/workflows/haafidh-atlas-correspondances-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-atlas-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-guards:
    name: Hifz frozen engine and 23 legacy icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen Hifz core, persistence and allowed deltas
        run: |
          set -euo pipefail
          bash scripts/guard_frozen_hifz_engines.sh
          bash scripts/audit_hifz_quiz_against_1171.sh
      - name: Verify original and correspondence icon contracts
        run: |
          set -euo pipefail
          python3 scripts/verify_contractual_ui_icons.py
          python3 scripts/test_correspondence_icon_contract.py
          python3 scripts/test_correspondence_type_icon_wiring.py
      - name: Ensure superseded headings cannot be bundled
        run: python3 scripts/verify_no_legacy_title_packaging.py
  jvm:
    name: Hifz, Atlas and QCF JVM regressions (no APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Provision SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Verify exact 604 KFQC Mushaf assets
        run: bash scripts/fetch_mushaf_pages.sh
      - name: Run all core, QCF and source-contract tests
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
