name: Quran Safeguard 0.10.10 Hifz foundation

on:
  push:
    branches:
      - "work/0.10.10-hifz"
      - "work/0.10.10-runtime-hifz-final"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hifz-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact audited 0.10.8 corpus
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.8-unsigned
          run-id: 34096699893
          github-token: ${{ github.token }}
          path: baseline108
      - name: Restore unchanged corpus bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for ed,pat in [('main','*light*unsigned.apk'),('plus','*plus*unsigned.apk')]:
              apk=next(Path('baseline108').rglob(pat))
              with zipfile.ZipFile(apk) as z:
                  for n in z.namelist():
                      if (n.startswith('assets/') and not n.startswith('assets/dexopt/')
                              and (ed=='main' or n.startswith('assets/tafsir/'))):
                          p=Path('app/src')/ed/n
                          p.parent.mkdir(parents=True,exist_ok=True)
                          p.write_bytes(z.read(n))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact reader/Hifz Mushaf geometry
        run: |
          pip install pymupdf==1.26.7 numpy scipy
          python3 scripts/build_reader109_geometry.py
          python3 scripts/verify_hifz_geometry_edges.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run both edition unit suites
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest --stacktrace
      - name: Build both debug editions
        run: gradle --no-daemon :app:assembleLightDebug :app:assemblePlusDebug --stacktrace
      - name: Upload Hifz unit reports and geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifz-0.10.10-unit-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            geometry-report.json
          retention-days: 7
