name: 0.10.7 final visual contract

on:
  push:
    branches:
      - "release/0.10.7-clean"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.10.7-clean
          fetch-depth: 0

      - name: Apply final visual contract
        run: python3 scripts/apply_0107_final_visual_contract.py

      - name: Verify final visual contract
        run: python3 scripts/verify_0107_visual_contract.py

      - name: Verify Tafsir reading contract
        run: python3 scripts/verify_0107_tafsir_reading_contract.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Fetch canonical Mushaf
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Full release audit
        run: gradle --no-daemon :app:verifyReleaseAudit

      - name: Test Light and Plus
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest

      - name: Commit tested visual contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt \
                  docs/VISUAL_CONTRACT_0.10.7.md \
                  scripts/verify_0107_visual_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "Lock 0.10.7 visual publication contract [skip ci]"
          git push origin HEAD:release/0.10.7-clean
