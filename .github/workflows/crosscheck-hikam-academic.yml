name: Cross-check Al-Hikam academic appendix

on:
  push:
    branches:
      - quran-safeguard-hikam-complete-corpus
    paths:
      - ".github/workflows/crosscheck-hikam-academic.yml"

permissions:
  contents: write

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF parser
        run: python3 -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Extract academic appendix
        run: python3 scripts/crosscheck_hikam_academic_pdf.py
      - name: Commit academic cross-check and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quran-safeguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/hikam/academic_crosscheck.json
          git rm .github/workflows/crosscheck-hikam-academic.yml
          git commit -m "Record academic Al-Hikam cross-check"
          git push origin HEAD:quran-safeguard-hikam-complete-corpus
