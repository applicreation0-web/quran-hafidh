name: Export Android APK signing tools 36

on:
  push:
    branches:
      - tools/android-apk-signing-36

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build tools 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"
      - name: Stage signing tools
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/android-build-tools-36"
          mkdir -p "${out}"
          cp "${ANDROID_HOME}/build-tools/36.0.0/apksigner" "${out}/"
          cp "${ANDROID_HOME}/build-tools/36.0.0/zipalign" "${out}/"
          cp -R "${ANDROID_HOME}/build-tools/36.0.0/lib" "${out}/"
          ldd "${ANDROID_HOME}/build-tools/36.0.0/zipalign" > "${out}/zipalign-ldd.txt" || true
          sha256sum "${out}/apksigner" "${out}/zipalign" "${out}/lib/apksigner.jar" > "${out}/SHA256SUMS.txt"
      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-tools-36
          path: ${{ runner.temp }}/android-build-tools-36/
          if-no-files-found: error
          retention-days: 1
