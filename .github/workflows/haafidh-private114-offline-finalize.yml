name: Quran Haafidh 114 — private-flag compilation ONLY — no APK

on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
    paths:
      - .github/workflows/haafidh-private114-offline-finalize.yml
      - scripts/guard_frozen_hifz_engines.sh
      - scripts/audit_hifz_quiz_against_1171.sh
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/AtlasPrivateV2.java
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/AtlasSourcePdfActivity.java
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/MawdudiMapData.java
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/MawdudiMapScreen.java
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/MapQcfThumbnails.java
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/StudyReaderActivity.java
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/Ui.java
      - hifz-app/src/main/AndroidManifest.xml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haafidh-private114-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      AYAH_THEMES_PRIVATE_114: "1"
    steps:
      - name: Checkout exact branch code only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce frozen Hifz, QCF, source and BOOX guardrails
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/guard_frozen_hifz_engines.sh
          bash scripts/audit_hifz_quiz_against_1171.sh
          python3 scripts/verify_j6_icon_roles.py
      - name: Generate only public-safe private-build Android label and provenance
        shell: bash
        run: |
          set -euo pipefail
          # No title, macro, special-node or commentary text is ever available here.
          mkdir -p hifz-app/src/private114/assets
          cat > hifz-app/src/private114/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"><application android:label="Quran Haafidh Privé 114" tools:replace="android:label"><meta-data android:name="quran.haafidh.source_sha" android:value="$(git rev-parse HEAD)" /></application></manifest>
          EOF
          test ! -e hifz-app/src/private114/assets/ayah_themes_private
          git check-ignore -q hifz-app/src/private114/AndroidManifest.xml
          test -z "$(git status --porcelain)" || { echo "Source unexpectedly modified"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install pinned Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile private-flag Android code and test without assembling a package
        shell: bash
        run: gradle --no-daemon :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest :hifz-app:compileDebugJavaWithJavac --stacktrace
      - name: Assert compilation produced no APK
        shell: bash
        run: |
          set -euo pipefail
          apk_outputs="$(find hifz-app -type f -name '*.apk' -print)"
          test -z "$apk_outputs" || { echo 'Unexpected APK output'; exit 1; }
