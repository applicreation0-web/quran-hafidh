name: Clean removed runtime from 0.10.5

on:
  push:
    branches:
      - "release/0.10.5-stability-core"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stability branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply clean runtime migration with exact residual diagnostic
        shell: bash
        run: |
          set +e
          python3 scripts/clean_taddabur_runtime_0105.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "--- Residual references after in-memory cleanup was written to workspace ---"
            grep -Rni --include='*.kt' --include='*.java' --include='*.xml' --include='*.kts' 'taddabur' app/src/main app/src/light app/src/plus app/src/test app/src/testPlus 2>/dev/null || true
            exit "$rc"
          fi

      - name: Commit cleaned runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Runtime already clean."
            exit 0
          fi
          git commit -m "0.10.5: remove Taddabur runtime and stale hooks"
          git push origin HEAD:release/0.10.5-stability-core
