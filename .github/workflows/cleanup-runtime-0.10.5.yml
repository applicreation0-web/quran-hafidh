name: Clean removed runtime from 0.10.5

on:
  push:
    branches:
      - "release/0.10.5-stability-core"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stability branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize final IME recovery condition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/java/com/quranunlock/guard/QuranAccessibilityService.kt')
          text = path.read_text()
          pattern = re.compile(
              r'(if \(GuardPrefs\.isUnlocked\(this, recovery\.packageName\) &&\s*\n\s*!callFreezeActive) &&\s*\n\s*!TaddaburEdition\.shouldBlockNow\(this\)(\s*\n\s*\) \{)'
          )
          text, count = pattern.subn(r'\1\2', text, count=1)
          if count == 1:
              path.write_text(text)
          elif 'TaddaburEdition.shouldBlockNow(this)' in text:
              raise SystemExit('FAIL: unexpected residual Taddabur recovery condition')
          else:
              print('IME recovery condition already normalized.')
          PY

      - name: Apply clean runtime migration with exact residual diagnostic
        shell: bash
        run: |
          set +e
          python3 scripts/clean_taddabur_runtime_0105.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "--- Residual references after cleanup was written to workspace ---"
            grep -Rni --include='*.kt' --include='*.java' --include='*.xml' --include='*.kts' 'taddabur' app/src/main app/src/light app/src/plus app/src/test app/src/testPlus 2>/dev/null || true
            exit "$rc"
          fi

      - name: Commit application cleanup only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The migration can identify stale workflow hooks, but this Actions token
          # is intentionally not allowed to rewrite workflow files. Keep workflow
          # cleanup separate and commit only application/source/audit changes here.
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -A
          if git diff --cached --quiet; then
            echo "Application runtime already clean."
            exit 0
          fi
          git commit -m "0.10.5: remove Taddabur runtime and stale source hooks"
          git push origin HEAD:release/0.10.5-stability-core
