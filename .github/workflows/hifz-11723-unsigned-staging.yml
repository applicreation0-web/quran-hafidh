name: Quran Haafidh 1.17.23 unsigned public-asset staging — NO PRIVATE APK
on:
  push:
    branches:
      - staging/haafidh-11723-private-signing
    paths:
      - .github/workflows/hifz-11723-unsigned-staging.yml
      - hifz-app/build.gradle.kts
  pull_request:
    branches:
      - work/haafidh-11723-active-review-fragilities
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AYAH_THEMES_PRIVATE_114: '1'
      HIFZ_PRIVATE_RELEASE_UPGRADE: '1'
      HIFZ_UNSIGNED_PRIVATE_STAGING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'e5d1f00b7f27ed473e8d9bdb25ee5ff71ccc3ca3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: SDK 37 + build tools 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build unsigned 1.17.23 private-feature skeleton with ZERO private licensed assets
        shell: bash
        run: |
          set -euo pipefail
          test -z "${HIFZ_KEYSTORE_PATH:-}"
          test -z "${HIFZ_KEYSTORE_BASE64:-}"
          test -z "${HIFZ_KEYSTORE_PASSWORD:-}"
          gradle --no-daemon :hifz-app:assembleRelease -x :hifz-app:verifyPrivateReleaseInputs
      - name: Enforce unsigned skeleton, exact identity, no historical key and zero private corpora
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build-private114/outputs/apk/release -name '*release*.apk' -type f | head -1)"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.quransafeguard.hifz' versionCode='61' versionName='1.17.23'"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::Signed APK is forbidden in unsigned staging"; exit 1
          fi
          python3 - "$apk" <<'PY'
          import sys,zipfile
          p=sys.argv[1]
          private=("assets/atlas_private/","assets/ayah_themes_private/",
                   "assets/atlas/atlas_display_catalog_v1.json")
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert not any(any(n.startswith(pre) for pre in private) for n in names), "PRIVATE MATERIAL IN STAGING!"
              print("PASS: unsigned 1.17.23/code61; NO keystore; no private assets.")
          PY
      - name: Collect public Android build tools for offline signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" "$ANDROID_HOME/build-tools/36.0.0/zipalign" offline-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" offline-tools/
          sha256sum offline-tools/* > offline-tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: public-offline-android-tools-11723
          path: offline-tools/
          if-no-files-found: error
          retention-days: 1
      - name: Upload ONLY unsigned public-asset staging skeleton
        uses: actions/upload-artifact@v4
        with:
          name: 11723-unsigned-public-assets-only-${{ github.sha }}
          path: hifz-app/build-private114/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  official-certificate-preflight:
    name: Verify existing official key without exporting it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify official certificate in isolated temporary runner
        shell: bash
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp "$RUNNER_TEMP/haafidh-key.XXXXXXXX")"
          trap 'rm -f "$key"' EXIT
          test -n "$HIFZ_KEYSTORE_BASE64"
          test -n "$HIFZ_KEYSTORE_PASSWORD"
          test -n "$HIFZ_KEY_ALIAS"
          printf '%s' "$HIFZ_KEYSTORE_BASE64" | base64 -d > "$key"
          mkdir public-certificate
          keytool -exportcert -keystore "$key" -alias "$HIFZ_KEY_ALIAS" -storepass:env HIFZ_KEYSTORE_PASSWORD -file public-certificate/official.der >/dev/null 2>&1
          echo '66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14  public-certificate/official.der' | sha256sum -c -
          echo 'PASS: official certificate matches, no private key exported.'
      - uses: actions/upload-artifact@v4
        with:
          name: official-public-certificate-only-11723
          path: public-certificate/official.der
          if-no-files-found: error
          retention-days: 1
