name: Quran Hifz Astra RED gate

on:
  push:
    branches:
      - work/hifz-0.7.3-astra-fix-all
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run JVM regression tests
        run: gradle --no-daemon :hifz-app:testDebugUnitTest --stacktrace
