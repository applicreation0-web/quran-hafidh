name: Haafidh Correspondances contextual pilot (NO APK)
on:
  push:
    branches:
      - work/haafidh-correspondances-context-qcf-20261104
  pull_request:
    branches:
      - fix/haafidh-11711-itqan-overdue-receipts-20261103
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-correspondances-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm-and-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HAAFIDH_CORRESPONDENCES_PILOT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Fetch original 604 QCF folios and platform
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Compile actual Android sources and check icon/revision invariants
        run: |
          gradle --no-daemon :hifz-app:compileDebugJavaWithJavac :hifz-app:testDebugUnitTest --tests com.quransafeguard.hifz.preview.CorrespondenceContextContractTest --tests com.quransafeguard.hifz.preview.GeometryEligiblePlannerBooxRegressionTest
          gradle --no-daemon :hifz-app:sourceContractTest
          node scripts/test-correspondence-gutter-density.cjs hifz-app/src/main/java/com/quransafeguard/hifz/preview/CorrespondenceGutterMarkers.java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correspondances-jvm-NO-APK
          path: |
            hifz-app/build/test-results/
            hifz-app/build/reports/tests/
          retention-days: 14
  actual-qcf-on-android:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox-portrait-emulation
            size: 1404x1872
            density: 226
    env:
      HAAFIDH_CORRESPONDENCES_PILOT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install QCF corpus and SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      # sdkmanager occasionally returns a truncated Google APIs image archive
      # on GitHub-hosted runners. A boot failure is infrastructure, not Hifz.
      - name: Verify Android 35 emulator image with bounded clean retries
        run: |
          set -euo pipefail
          image_dir="$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          for attempt in 1 2 3; do
            if sdkmanager --install "system-images;android-35;google_apis;x86_64" --channel=0 \
                && test -s "$image_dir/system.img" \
                && test -s "$image_dir/source.properties"; then
              echo "ANDROID_AVD_IMAGE_VERIFIED on attempt $attempt"
              exit 0
            fi
            echo "Transient AVD image fetch failure (attempt $attempt/3), purging incomplete download" >&2
            rm -rf "$image_dir"
            sleep "$((attempt * 5))"
          done
          echo "ANDROID_AVD_IMAGE_UNAVAILABLE: fail closed, not an application regression" >&2
          exit 1
      - name: Enable disposable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual two-foil QCF on ${{ matrix.surface }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            # Always collect real screenshot evidence, even when instrumentation
            # fails. Never convert a failed Android test into a green result.
            set +e
            gradle --no-daemon :hifz-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.quransafeguard.hifz.preview.CorrespondenceContextInstrumentedTest
            test_status=$?
            mkdir -p hifz-app/build/android-proof
            for capture in progression repetition agrandissement lecture-reperes retour-lecture; do
              adb pull "/data/local/tmp/haafidh-$capture.png" hifz-app/build/android-proof/ \
                >/dev/null 2>&1 || echo "NO_VERIFIED_CAPTURE: $capture"
            done
            if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
            set -e
            bash scripts/run_11711_hifz_parcours_isolated.sh "$(awk -v surface='${{ matrix.surface }}' '$1 == "-" && $2 == "surface:" { match_surface = ($3 == surface) } match_surface && $1 == "classes:" { print $2; exit }' .github/workflows/haafidh-11711-hifz-parcours-exhaustive.yml | tr -d "'")" "${{ matrix.surface }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correspondances-${{ matrix.surface }}-NO-APK
          path: |
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
            hifz-app/build/android-proof/
            hifz-app/build/parcours-android-logs/
          retention-days: 14
