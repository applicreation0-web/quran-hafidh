name: Hifz one-time maintenance ambiguity guard

on:
  push:
    branches:
      - work/hifz-0.7.3-spec-update
    paths:
      - .github/workflows/hifz-one-time-murajaah-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.3-spec-update
          fetch-depth: 0
      - name: Apply guarded maintenance patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/one_time_murajaah_guard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hifz-one-time-murajaah-guard.yml scripts/one_time_murajaah_guard.py
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java
          git diff --cached --check
          git commit -m 'fix(hifz): avoid ambiguous maintenance recalibration'
          git push origin HEAD:work/hifz-0.7.3-spec-update
