name: Haafidh 1.17.11 Android QCF At-Tur Recovery (NO APK)
on:
  push:
    branches: [fix/haafidh-11711-itqan-overdue-receipts-20261103]
    paths:
      - 'hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/AtTur11711RecoveryInstrumentedTest.java'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java'
      - '.github/workflows/haafidh-11711-android-recovery-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-11711-android-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-physical-qcf-simulator:
    name: "Android QCF: ${{ matrix.surface }}"
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox-portrait-emulation
            size: 1404x1872
            density: 226
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Fetch authentic public 604-page QCF and build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Grant disposable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real Android preferences, Sunday page geometry and active corpus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            gradle --no-daemon :hifz-app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.quransafeguard.hifz.preview.AtTur11711RecoveryInstrumentedTest,com.quransafeguard.hifz.preview.Independent11710RecoveryInstrumentedTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11711-android-${{ matrix.surface }}-TEST-ONLY
          path: |
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14
