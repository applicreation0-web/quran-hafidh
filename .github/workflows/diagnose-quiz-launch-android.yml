name: Quiz launch Android runtime regression ONLY - no APK
on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
    paths:
      - .github/workflows/diagnose-quiz-launch-android.yml
      - .github/workflows/haafidh-ibn-kathir-debug.yml
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java
      - scripts/ci_android_runtime_visual.sh
      - hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/QuizLaunchRegressionInstrumentedTest.java
      - hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/HifzAndMapRuntimeSmokeInstrumentedTest.java
      - hifz-app/src/main/java/com/quransafeguard/hifz/preview/IbnKathirMapActivity.java
      - hifz-app/src/main/res/drawable/ic_ui_play.xml
      - hifz-app/src/main/res/drawable/ic_ui_close.xml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Android SDK and platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Isolate the new Quiz runtime regression from pre-existing obsolete Android tests
        shell: bash
        run: |
          set -euo pipefail
          # The full legacy androidTest source set does not compile on 1.17.1 (obsolete
          # HifzPrefs APIs). Do not change/delete those tests in the repository:
          # isolate only this diagnostic test in the ephemeral CI checkout.
          find hifz-app/src/androidTest/java -type f -name '*.java' ! -name 'QuizLaunchRegressionInstrumentedTest.java' ! -name 'HifzAndMapRuntimeSmokeInstrumentedTest.java' -delete
          test "$(find hifz-app/src/androidTest/java -type f -name '*.java' | wc -l)" -eq 2
      - name: Enable KVM for genuine Android execution
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Quiz in Android emulator (instrumented, never JVM-only)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci_android_runtime_visual.sh
      - name: Keep instrumented failures and context only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-launch-android-runtime-${{ github.sha }}
          path: |
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
            audit-runtime-screens/
            audit-runtime-instrumentation.txt
          retention-days: 14
          if-no-files-found: warn
