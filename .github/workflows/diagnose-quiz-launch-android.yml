name: Hifz + Amorces + sept jours Android regression ONLY - no APK
on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haafidh-1171-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    # The CP-06 marker changes only its public staging workflow; the frozen
    # application tree already owns the 100/100 Android evidence.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[cp06-staging-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Android SDK and platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Require the complete 100-test Android source set
        shell: bash
        run: |
          set -euo pipefail
          files="$(find hifz-app/src/androidTest/java -type f -name '*.java' | wc -l)"
          tests="$(grep -R --include='*.java' -E '^[[:space:]]*@Test' hifz-app/src/androidTest/java | wc -l)"
          printf 'Android instrumented inventory: %s files / %s tests\n' "$files" "$tests"
          test "$files" -eq 26
          test "$tests" -eq 100
      - name: Enable KVM for genuine Android execution
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/100-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run all 100 Hifz Android tests and collect authorized pixels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci_android_runtime_visual.sh
      - name: Keep instrumented failures and context only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haafidh-android-runtime-${{ github.sha }}
          path: |
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
            audit-runtime-screens/
            audit-runtime-instrumentation.txt
            audit-process-death-prepare.txt
            audit-process-death-launch.txt
            audit-process-death-verify.txt
          retention-days: 14
          if-no-files-found: warn
