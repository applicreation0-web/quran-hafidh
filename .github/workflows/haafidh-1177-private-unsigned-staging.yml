name: Quran Haafidh 1.17.7 OFFLINE PRIVATE SIGNING STAGE (UNSIGNED, DO NOT INSTALL)
on:
  push:
    branches:
      - fix/haafidh-1177-boox-week-itqan-20261026
    paths:
      - '.github/workflows/haafidh-1177-private-unsigned-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  incomplete-public-code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: SDK and authentic QCF pages
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Inspect public source and immutable Hifz credits
        run: |
          python3 scripts/verify_1176_invariants.py
          python3 scripts/audit_haafidh_1176.py --strict
          python3 scripts/verify_atlas_only_purity.py
          python3 scripts/verify_contractual_ui_icons.py
          python3 scripts/verify_j6_icon_roles.py
      - name: Build UNSIGNED, INCOMPLETE staging only, without original private assets
        env:
          AYAH_THEMES_PRIVATE_114: '1'
          HIFZ_PRIVATE_RELEASE_UPGRADE: '1'
        run: |
          set -euo pipefail
          test ! -e hifz-app/src/private114/assets/atlas/atlas_display_catalog_v1.json
          gradle --no-daemon :hifz-app:assembleRelease -x :hifz-app:verifyPrivateReleaseInputs
          mkdir -p artifact
          apk="$(find hifz-app/build-private114/outputs/apk/release -name '*.apk' -type f -print -quit)"
          test -s "$apk"
          "$ANDROID_HOME"/build-tools/36.0.0/aapt dump badging "$apk" > artifact/badging.txt
          grep -q "package: name='com.quransafeguard.hifz' versionCode='45' versionName='1.17.7'" artifact/badging.txt
          if "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify "$apk" >/dev/null 2>&1; then
            echo 'NO-GO: this staging must be unsigned'; exit 1
          fi
          if unzip -Z1 "$apk" | grep -qE '^assets/(atlas/atlas_display_catalog_v1.json|ayah_themes_private/titles_114.json)$'; then
            echo 'NO-GO: private material leaked into public CI'; exit 1
          fi
          cp "$apk" artifact/QURAN_HAAFIDH_1177_PRIVATE_ASSETS_MISSING_UNSIGNED_NEVER_INSTALL.apk
          sha256sum artifact/*.apk > artifact/SHA256SUMS.txt
          printf '%s\n' 'DO NOT INSTALL: missing 7 private Atlas files and official signature. Only for trusted OFFLINE assembly; expected cert SHA256: 66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14' > artifact/DO_NOT_INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quran-haafidh-1177-public-unsigned-offline-input-NEVER-INSTALL
          path: artifact/
          retention-days: 3
          if-no-files-found: error
