name: Export Quran Safeguard 0.10.3 direct chat

on:
  push:
    paths:
      - '.github/workflows/export-0103-direct-chat.yml'

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Free Actions artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .id' || true)
          if [ -n "${ids}" ]; then
            while read -r id; do
              [ -n "${id}" ] || continue
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
            done <<< "${ids}"
          fi

      - name: Download signed 0.10.3 release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p direct-chat
          gh release download v0.10.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'Quran-Safeguard-0.10.3-Light-release.apk' \
            --pattern 'Quran-Safeguard-Plus-0.10.3-release.apk' \
            --pattern 'Quran-Safeguard-0.10.3-SHA256.txt' \
            --dir direct-chat
          test -s direct-chat/Quran-Safeguard-0.10.3-Light-release.apk
          test -s direct-chat/Quran-Safeguard-Plus-0.10.3-release.apk
          test -s direct-chat/Quran-Safeguard-0.10.3-SHA256.txt

      - name: Upload temporary direct-chat bundle
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-0.10.3-direct-chat
          path: direct-chat/
          if-no-files-found: error
          retention-days: 1
