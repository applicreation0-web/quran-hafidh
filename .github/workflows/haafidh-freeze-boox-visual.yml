name: Haafidh F1/F2 — REAL BOOX screenshots (NO APK RELEASE)
on:
  push:
    branches:
      - integrate/haafidh-11714-p0-hifz-progression-20261107
      - 'freeze/haafidh-11713-f1-20261107'
      - 'freeze/haafidh-11714-f2-20261107'
    paths:
      - 'hifz-app/src/**'
      - 'scripts/run_freeze_boox_visual.sh'
      - '.github/workflows/haafidh-freeze-boox-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boox-portrait-real:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      HAAFIDH_CORRESPONDENCES_PILOT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install authentic public QCF and Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
          sdkmanager --install "system-images;android-35;google_apis;x86_64"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real BOOX Android instrumented captures (1404x1872 / 226)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1404x1872
            adb shell wm density 226
            bash scripts/run_freeze_boox_visual.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-real-boox-${{ github.sha }}
          path: |
            hifz-app/build/freeze-boox-proof/
            hifz-app/build/parcours-android-logs/
          retention-days: 14
