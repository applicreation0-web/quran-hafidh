name: Haafidh Freeze 2 1.17.14 — source+QCF+offline guard (NO RELEASE)
on:
  push:
    branches: ['freeze/haafidh-11714-f2-20261107']
    paths:
      - 'hifz-app/**'
      - 'scripts/test_freeze2_gutter_context.cjs'
      - 'scripts/test_build_11714_private_offline.py'
      - 'scripts/build_11714_private_offline.py'
      - '.github/workflows/haafidh-freeze2-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-f2-jvm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Original 604 QCF and Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Full Android source/JVM checks (no user state)
        run: |
          gradle --no-daemon :hifz-app:compileDebugJavaWithJavac :hifz-core:test :hifz-app:testDebugUnitTest
          gradle --no-daemon :hifz-app:sourceContractTest
      - name: Exactly one or two safe QCF icon lanes
        run: |
          node scripts/test-correspondence-gutter-density.cjs hifz-app/src/main/java/com/quransafeguard/hifz/preview/CorrespondenceGutterMarkers.java
          node scripts/test_freeze2_gutter_context.cjs
      - name: Offline official version guard, synthetic only
        run: |
          python3 scripts/test_build_11714_private_offline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11714-freeze2-contract-results
          path: |
            hifz-app/build/test-results/
            hifz-core/build/test-results/
            hifz-app/build/reports/tests/
          retention-days: 14
