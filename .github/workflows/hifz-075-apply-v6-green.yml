name: Quran Hifz 0.7.5 apply v6 migration green

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/hifz-075-apply-v6-green.yml

permissions:
  contents: write

jobs:
  apply-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
          fetch-depth: 1

      - name: Apply deterministic schema 6 migration persistence patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply_hifz_v6.py
          python3 /tmp/apply_hifz_v6.py
          git diff --check
          grep -n -A140 -B12 'migrateV5ToV6' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java

      - name: Commit production patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'applicreation0-web'
          git config user.email 'applicreation0@gmail.com'
          git rm .github/workflows/hifz-075-apply-v6-green.yml
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          git commit -m 'feat: persist schema 6 migration state'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
