name: Haafidh 1.17.10 exact QCF touch probe NO APK
on:
  push:
    branches: [audit/haafidh-11710-qcf-touch-probe-20261102]
permissions:
  contents: read
jobs:
  independent-screens-recovery-reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual masks, recovery, general screens and Android reboot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_11710_qcf_touch_probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11710-exact-touch-probe-NO-APK
          path: |
            hifz-app/build/qcf-touch-probe/
            hifz-app/build/independent-surfaces/
            hifz-app/build/independent-quick-results/
            hifz-app/build/atlas-comparison-audit/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14

