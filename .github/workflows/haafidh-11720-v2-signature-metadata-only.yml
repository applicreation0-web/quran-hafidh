name: Quran Haafidh 1.17.20 — official APK v2 signature metadata ONLY
on:
  push:
    branches:
      - release-candidate/haafidh-11720-private-20261115
    paths:
      - signing-input/signed_data_11720.b64
permissions:
  contents: read
jobs:
  official-exact-signed-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign strictly pinned SHA-256 of opaque APK v2 metadata, NO private APK or Atlas assets
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${HIFZ_KEYSTORE_BASE64:-}"
          test -n "${HIFZ_KEYSTORE_PASSWORD:-}"
          test -n "${HIFZ_KEY_ALIAS:-}"
          test -n "${HIFZ_KEY_PASSWORD:-}"
          cat > "$RUNNER_TEMP/SignHaafidh11720.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.Base64;
          public class SignHaafidh11720 {
            static String hex(byte[] v) {
              StringBuilder b=new StringBuilder();
              for(byte q:v)b.append(String.format("%02x",q&255));
              return b.toString();
            }
            public static void main(String[] args) throws Exception {
              final String CERT="66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14";
              final String SIGNED_DATA="230ba6f2e04a040b841f3b8c1ba2a5792a4fdd6c4fc87be8a6e9c33f0b714672";
              byte[] data=Base64.getMimeDecoder().decode(Files.readString(Path.of("signing-input/signed_data_11720.b64")));
              if(data.length!=1449 || !hex(MessageDigest.getInstance("SHA-256").digest(data)).equals(SIGNED_DATA))
                throw new SecurityException("Refusing unapproved APK metadata input");
              Path keyfile=Path.of(args[0],"official-signing-key.jks");
              try {
                Files.write(keyfile,Base64.getMimeDecoder().decode(System.getenv("HIFZ_KEYSTORE_BASE64")));
                KeyStore ks=KeyStore.getInstance(keyfile.toFile(), System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
                Certificate cert=ks.getCertificate(System.getenv("HIFZ_KEY_ALIAS"));
                if(cert==null || !hex(MessageDigest.getInstance("SHA-256").digest(cert.getEncoded())).equals(CERT))
                  throw new SecurityException("Historical official certificate mismatch");
                PrivateKey key=(PrivateKey)ks.getKey(System.getenv("HIFZ_KEY_ALIAS"),System.getenv("HIFZ_KEY_PASSWORD").toCharArray());
                Signature sign=Signature.getInstance("SHA256withRSA");
                sign.initSign(key); sign.update(data); byte[] signature=sign.sign();
                Signature verify=Signature.getInstance("SHA256withRSA");
                verify.initVerify(cert);verify.update(data);
                if(signature.length!=512 || !verify.verify(signature))
                  throw new SecurityException("RSA-4096 output invalid");
                Files.writeString(Path.of(args[0],"signature_11720.b64"),Base64.getEncoder().encodeToString(signature)+"\n");
                Files.writeString(Path.of(args[0],"attestation.txt"),
                  "CERT_SHA256="+CERT+"\nSIGNED_DATA_SHA256="+SIGNED_DATA+"\n"+
                  "SIGNATURE_SHA256="+hex(MessageDigest.getInstance("SHA-256").digest(signature))+"\n");
                System.out.println("PASS: official certificate, signedData 1449 bytes, RSA4096 signature ONLY");
              } finally {
                Files.deleteIfExists(keyfile);
              }
            }
          }
          JAVA
          java "$RUNNER_TEMP/SignHaafidh11720.java" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-11720-official-v2-signature-only-no-apk-no-assets
          path: |
            ${{ runner.temp }}/signature_11720.b64
            ${{ runner.temp }}/attestation.txt
          if-no-files-found: error
          retention-days: 1
