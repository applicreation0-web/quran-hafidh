name: Haafidh 1.17.9 — once-only verified catalogue-280 materialization (NO APK)
on:
  push:
    branches: [work/haafidh-1179-mutash-280-20261101]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-reviewed-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable QCF SVG assets and source chapter proofs
        run: |
          python -m pip install beautifulsoup4 brotli
          bash scripts/fetch_mushaf_pages.sh
          mkdir -p /tmp/alabbad-20261101
          for n in $(seq 1 14); do
            curl --fail --location --retry 3 --retry-all-errors --max-time 35 \
              --silent --show-error "https://quranpedia.app/books/b10901/s${n}.html" \
              -o "/tmp/alabbad-20261101/s${n}.html"
          done
      - name: Rebuild authenticated 295 decisions into 280 exact QCF catalogue entries
        run: |
          python scripts/build_alabbad_catalogue.py --book-cache /tmp/alabbad-20261101
          python scripts/materialize_mutash_catalogue.py
          python scripts/verify_mutash_catalogue.py
          python scripts/verify_mutash_pivot_review_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('research/alabbad_audit_294.json').read_text())
          c=json.loads(Path('research/alabbad_catalogue_approved.json').read_text())
          assert len(a['entries'])==295
          assert len(c['entries'])==c['approvedCount']==280
          assert c['entries'][-1]['auditId']==295
          assert c['verification']['sourceProvenanceChecked']
          assert a['entries'][-1]['printedPagesFirst']==[124]
          assert a['entries'][-1]['printedPagesSecond']==[124]
          PY
      - name: Commit generated and verified catalogue data only
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add research/alabbad_audit_294.json research/alabbad_audit_294.csv research/alabbad_catalogue_approved.json
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/AtlasDiscriminantCases.java
          if git diff --cached --quiet; then echo "No generated delta: unexpected"; exit 1; fi
          git diff --cached --stat
          git commit -m "Materialize source-verified 280-case catalogue including only case 295"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: haafidh-1179-280-source-verified-NO-APK
          path: |
            research/alabbad_audit_294.json
            research/alabbad_audit_294.csv
            research/alabbad_catalogue_approved.json
            hifz-app/src/main/java/com/quransafeguard/hifz/preview/AtlasDiscriminantCases.java
          retention-days: 5
