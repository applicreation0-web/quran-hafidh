name: Quran Hifz 0.7.5 runtime wiring

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/hifz-075-runtime-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
      - name: Wire canonical schema6 sessions
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          # Geometry helper: feed the frozen Stabilisation policy with exact physical lines.
          p = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/GeometryRepository.java')
          s = p.read_text()
          old = '    public int lineCount() { return lines.size(); }\n    public LineMeta line(int index) { return lines.get(index); }\n'
          new = '''    public int lineCount() { return lines.size(); }\n    public LineMeta line(int index) { return lines.get(index); }\n\n    /** Ordered physical lines on one page, restricted to the supplied canonical line ids. */\n    List<LineMeta> linesForIdsOnPage(int page, List<String> lineIds) {\n        if (page < 1 || page > 604) throw new IllegalArgumentException("page outside 1..604");\n        if (lineIds == null || lineIds.isEmpty()) throw new IllegalArgumentException("line ids required");\n        LinkedHashSet<String> wanted = new LinkedHashSet<>(lineIds);\n        ArrayList<LineMeta> result = new ArrayList<>();\n        for (LineMeta line : lines) {\n            if (line.page == page && wanted.contains(line.id)) result.add(line);\n        }\n        if (result.isEmpty()) throw new IllegalStateException("No canonical physical lines for page " + page);\n        return Collections.unmodifiableList(result);\n    }\n'''
          s = replace_once(s, old, new, 'GeometryRepository helper')
          p.write_text(s)

          # Persistence: atomic schema6 completion APIs and stabilized queue projection.
          p = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java')
          s = p.read_text()
          anchor = '''    /** Compatibility overload: promotion is handled by the calendar/attendance rebalance. */\n    public boolean completeSabqiBlock(int startLine, int endLine, VerseRef ignoredPromotion,\n                                      int nextLineCursor, String date, String label) {\n        return completeSabqiBlock(startLine, endLine, nextLineCursor, date, label);\n    }\n\n'''
          addition = anchor + '''    /** Atomically closes Apprentissage and advances exactly these physical lines to Appris. */\n    public boolean completeSabqiBlockV6(int startLine, int endLine, int nextLineCursor,\n                                        List<String> lineIds, String date, String label) {\n        if (lineIds == null || lineIds.isEmpty()) throw new IllegalArgumentException("Apprentissage line ids required");\n        synchronized (V6_STATE_LOCK) {\n            requireSchema6ProgressionState();\n            LinkedHashSet<String> learned = v6LineIdSet("v6LearnedLineIds");\n            LinkedHashSet<String> stabilized = v6LineIdSet("v6StabilizedLineIds");\n            LinkedHashSet<String> acquired = v6LineIdSet("v6AcquiredCreditLineIds");\n            LinkedHashSet<String> quarantine = v6LineIdSet("v6QuarantineLineIds");\n            LinkedHashSet<String> legacyPartial = v6LineIdSet("v6LegacyPartialAcquiredLineIds");\n            for (String lineId : new LinkedHashSet<>(lineIds)) {\n                if (quarantine.contains(lineId) || legacyPartial.contains(lineId))\n                    throw new IllegalStateException("Unresolved schema6 progression state for line " + lineId);\n                ProgressState state = progressStateFromSets(lineId, learned, stabilized, acquired);\n                if (state == ProgressState.NONE) learned.add(lineId);\n            }\n            List<RecentSabqi> queue = recentSabqi();\n            LocalDate blockDate = safeDate(date, null);\n            if (blockDate == null) blockDate = HifzClock.today();\n            queue.add(new RecentSabqi(startLine, endLine, blockDate, 0));\n            String activation = p.getString("recentConsolidationActivatedOn", "");\n            if ((activation == null || activation.isEmpty())\n                    && queue.size() >= HifzSchedule.RECENT_BLOCKS_FOR_SUNDAY_CONSOLIDATION) activation = blockDate.toString();\n            return p.edit()\n                .putString("v6LearnedLineIds", lineIdsJson(learned))\n                .putString("v6StabilizedLineIds", lineIdsJson(stabilized))\n                .putString("v6AcquiredCreditLineIds", lineIdsJson(acquired))\n                .putString("recentSabqi", recentJson(queue))\n                .putString("recentConsolidationActivatedOn", activation == null ? "" : activation)\n                .putInt("sabqiLineCursor", nextLineCursor)\n                .putInt("sabqiRep", 0).putInt("sabqiAssisted", 0).putLong("sabqiElapsedMs", 0L)\n                .putString("sabqiTodayReviewDate", date).putInt("sabqiTodayReviewStartLine", startLine)\n                .putInt("sabqiTodayReviewEndLine", endLine).putLong("sabqi_today_reviewElapsedMs", 0L)\n                .putString("lastSabqiDate", date).putString("lastSabqiLabel", label)\n                .commit();\n        }\n    }\n\n'''
          s = replace_once(s, anchor, addition, 'HifzPrefs Apprentissage V6')

          anchor = '''    public AnchoringQueue.Entry currentAnchoringEntry(GeometryRepository geometry) {\n        if (!p.getBoolean("anchoringQueueInitialized", false)\n                && !reconcileAnchoringQueue(geometry)) {\n            throw new IllegalStateException("Unable to persist anchoring queue");\n        }\n        String retryText = p.getString("anchoringRetryAfterDate", "");\n        LocalDate retry = safeDate(retryText, null);\n        if (retry != null) {\n            if (!HifzClock.today().isAfter(retry)) return null;\n            if (!p.edit().putString("anchoringRetryAfterDate", "").commit()) {\n                throw new IllegalStateException("Unable to clear Ancrage retry deferral");\n            }\n        }\n        List<AnchoringQueue.Entry> queue = anchoringQueue();\n        if (!p.getBoolean("anchoringQueueInitialized", false)) {\n            if (!reconcileAnchoringQueue(geometry)) {\n                throw new IllegalStateException("Unable to repair anchoring queue");\n            }\n            queue = anchoringQueue();\n        }\n        AnchoringQueue.Entry inProgress = inProgressAnchoringEntry();\n        if (inProgress != null) return inProgress;\n        return queue.isEmpty() ? null : queue.get(anchoringQueueIndex(queue.size()));\n    }\n\n'''
          replacement = '''    private boolean entryIsFullyStabilizedOrAcquired(AnchoringQueue.Entry entry, GeometryRepository geometry) {\n        if (entry == null) return false;\n        LinkedHashSet<String> stabilized = v6LineIdSet("v6StabilizedLineIds");\n        LinkedHashSet<String> acquired = v6LineIdSet("v6AcquiredCreditLineIds");\n        List<String> ids = geometry.lineIdsForVerseRange(\n            GeometryRepository.parseVerse(entry.start), GeometryRepository.parseVerse(entry.end));\n        if (ids.isEmpty()) return false;\n        for (String id : ids) if (!stabilized.contains(id) && !acquired.contains(id)) return false;\n        return true;\n    }\n\n    public AnchoringQueue.Entry currentAnchoringEntry(GeometryRepository geometry) {\n        if (!p.getBoolean("anchoringQueueInitialized", false)\n                && !reconcileAnchoringQueue(geometry)) {\n            throw new IllegalStateException("Unable to persist anchoring queue");\n        }\n        String retryText = p.getString("anchoringRetryAfterDate", "");\n        LocalDate retry = safeDate(retryText, null);\n        if (retry != null) {\n            if (!HifzClock.today().isAfter(retry)) return null;\n            if (!p.edit().putString("anchoringRetryAfterDate", "").commit())\n                throw new IllegalStateException("Unable to clear Stabilisation retry deferral");\n        }\n        List<AnchoringQueue.Entry> queue = anchoringQueue();\n        if (!p.getBoolean("anchoringQueueInitialized", false)) {\n            if (!reconcileAnchoringQueue(geometry)) throw new IllegalStateException("Unable to repair Stabilisation queue");\n            queue = anchoringQueue();\n        }\n        AnchoringQueue.Entry inProgress = inProgressAnchoringEntry();\n        if (inProgress != null) return inProgress;\n        if (queue.isEmpty()) return null;\n        int start = anchoringQueueIndex(queue.size());\n        for (int step = 0; step < queue.size(); step++) {\n            int index = (start + step) % queue.size();\n            AnchoringQueue.Entry candidate = queue.get(index);\n            if (!entryIsFullyStabilizedOrAcquired(candidate, geometry)) {\n                if (index != start && !p.edit().putInt("anchoringQueueIndex", index).commit())\n                    throw new IllegalStateException("Unable to advance Stabilisation queue");\n                return candidate;\n            }\n        }\n        return null;\n    }\n\n    /** Frozen candidates for one grouped Consolidation session: stabilized, never already acquired. */\n    List<AnchoringQueue.Entry> stabilizedAnchoringEntries(GeometryRepository geometry, int maxUnits) {\n        if (maxUnits < 1 || maxUnits > 3) throw new IllegalArgumentException("Consolidation group size must be 1..3");\n        LinkedHashSet<String> stabilized = v6LineIdSet("v6StabilizedLineIds");\n        LinkedHashSet<String> acquired = v6LineIdSet("v6AcquiredCreditLineIds");\n        ArrayList<AnchoringQueue.Entry> out = new ArrayList<>();\n        for (AnchoringQueue.Entry entry : AnchoringQueue.visitOrder(anchoringQueue(), anchoringQueueIndex())) {\n            List<String> ids = geometry.lineIdsForVerseRange(GeometryRepository.parseVerse(entry.start), GeometryRepository.parseVerse(entry.end));\n            boolean ready = !ids.isEmpty();\n            for (String id : ids) if (!stabilized.contains(id) || acquired.contains(id)) { ready = false; break; }\n            if (ready) out.add(entry);\n            if (out.size() >= maxUnits) break;\n        }\n        return Collections.unmodifiableList(out);\n    }\n\n'''
          s = replace_once(s, anchor, replacement, 'HifzPrefs queue projection')

          anchor = '''    public boolean setItqanProgress(int rep, int assisted, int finalReveals,\n                                     VerseRef unitStart, VerseRef unitEnd) {\n        return p.edit()\n            .putInt("itqanRep", rep)\n            .putInt("itqanAssisted", assisted)\n            .putInt("itqanFinalReveals", Math.max(0, finalReveals))\n            .putString("itqanUnitStart", unitStart == null ? "" : unitStart.toString())\n            .putString("itqanUnitEnd", unitEnd == null ? "" : unitEnd.toString())\n            .commit();\n    }\n\n'''
          addition = anchor + '''    /** Atomically advances one frozen Stabilisation half-page and its schema6 line state. */\n    boolean completeStabilizationBlockV6(List<String> lineIds, int nextBlockIndex, boolean finalBlock,\n                                         VerseRef unitStart, VerseRef unitEnd, VerseRef nextCursor,\n                                         String date, String label) {\n        if (lineIds == null || lineIds.isEmpty() || unitStart == null || unitEnd == null)\n            throw new IllegalArgumentException("Stabilisation unit required");\n        synchronized (V6_STATE_LOCK) {\n            requireSchema6ProgressionState();\n            LinkedHashSet<String> learned = v6LineIdSet("v6LearnedLineIds");\n            LinkedHashSet<String> stabilized = v6LineIdSet("v6StabilizedLineIds");\n            LinkedHashSet<String> acquired = v6LineIdSet("v6AcquiredCreditLineIds");\n            LinkedHashSet<String> quarantine = v6LineIdSet("v6QuarantineLineIds");\n            LinkedHashSet<String> legacyPartial = v6LineIdSet("v6LegacyPartialAcquiredLineIds");\n            for (String lineId : new LinkedHashSet<>(lineIds)) {\n                if (quarantine.contains(lineId) || legacyPartial.contains(lineId))\n                    throw new IllegalStateException("Unresolved schema6 progression state for line " + lineId);\n                ProgressState state = progressStateFromSets(lineId, learned, stabilized, acquired);\n                if (state == ProgressState.NONE) throw new IllegalStateException("Cannot Stabilise a line before Apprentissage: " + lineId);\n                if (state == ProgressState.LEARNED) { learned.remove(lineId); stabilized.add(lineId); }\n            }\n            SharedPreferences.Editor e = p.edit()\n                .putString("v6LearnedLineIds", lineIdsJson(learned))\n                .putString("v6StabilizedLineIds", lineIdsJson(stabilized))\n                .putString("v6AcquiredCreditLineIds", lineIdsJson(acquired))\n                .putInt("itqanRep", 0).putInt("itqanAssisted", 0).putInt("itqanFinalReveals", 0)\n                .putInt("itqanBlockIndex", finalBlock ? 0 : Math.max(0, nextBlockIndex))\n                .putString("itqanUnitStart", finalBlock ? "" : unitStart.toString())\n                .putString("itqanUnitEnd", finalBlock ? "" : unitEnd.toString())\n                .putLong("itqanElapsedMs", 0L)\n                .putString("lastItqanDate", date).putString("lastItqanLabel", label)\n                .putString("lastItqanCreditStart", unitStart.toString())\n                .putString("lastItqanCreditEnd", unitEnd.toString());\n            if (finalBlock && nextCursor != null) e.putString("itqanCursor", nextCursor.toString());\n            return e.commit();\n        }\n    }\n\n'''
          s = replace_once(s, anchor, addition, 'HifzPrefs Stabilisation V6')

          anchor = '''    public String lastSabqiDate() { return p.getString("lastSabqiDate", ""); }\n'''
          addition = '''    /** Atomically closes a frozen 1..3 unit Consolidation group and makes its lines Acquired. */\n    boolean completeConsolidationSessionV6(ConsolidationCycleEngine.Session session, GeometryRepository geometry,\n                                           String date, String label) {\n        if (session == null || !session.open() || !session.readyToClose())\n            throw new IllegalStateException("Consolidation session must be OPEN and complete");\n        synchronized (V6_STATE_LOCK) {\n            requireSchema6ProgressionState();\n            LinkedHashSet<String> learned = v6LineIdSet("v6LearnedLineIds");\n            LinkedHashSet<String> stabilized = v6LineIdSet("v6StabilizedLineIds");\n            LinkedHashSet<String> acquired = v6LineIdSet("v6AcquiredCreditLineIds");\n            ArrayList<VerseRange> pending = new ArrayList<>(unconsolidatedPromotedRanges());\n            ArrayList<VerseRange> forced = new ArrayList<>(forcedPromotedRanges());\n            ArrayList<AnchoringQueue.Entry> queue = new ArrayList<>(anchoringQueue());\n            for (String unitId : session.unitIds()) {\n                String[] bounds = unitId.split("\\\\|", -1);\n                if (bounds.length != 2) throw new IllegalStateException("Invalid frozen Consolidation unit id: " + unitId);\n                VerseRef start = GeometryRepository.parseVerse(bounds[0]);\n                VerseRef end = GeometryRepository.parseVerse(bounds[1]);\n                List<String> ids = geometry.lineIdsForVerseRange(start, end);\n                for (String lineId : ids) {\n                    ProgressState state = progressStateFromSets(lineId, learned, stabilized, acquired);\n                    if (state == ProgressState.STABILIZED) { stabilized.remove(lineId); acquired.add(lineId); }\n                    else if (state != ProgressState.ACQUIRED)\n                        throw new IllegalStateException("Consolidation requires Stabilisé lines: " + lineId);\n                }\n                pending = new ArrayList<>(subtractCoverage(pending, start, end));\n                forced = new ArrayList<>(subtractCoverage(forced, start, end));\n                queue.removeIf(entry -> entry.start.equals(bounds[0]) && entry.end.equals(bounds[1]));\n            }\n            LocalDate completed = safeDate(date, HifzClock.today());\n            List<LocalDate> attendance = ConsolidationAttendance.add(consolidationAttendanceDates(), completed);\n            return p.edit()\n                .putString("v6LearnedLineIds", lineIdsJson(learned))\n                .putString("v6StabilizedLineIds", lineIdsJson(stabilized))\n                .putString("v6AcquiredCreditLineIds", lineIdsJson(acquired))\n                .putString("unconsolidatedPromotedRanges", rangesJson(normalizeRanges(pending)))\n                .putString("forcedPromotedRanges", rangesJson(normalizeRanges(forced)))\n                .putString("anchoringQueue", anchoringQueueJson(queue))\n                .putBoolean("anchoringQueueInitialized", true).putInt("anchoringQueueIndex", 0)\n                .putString("lastRecentSabqiReviewDate", date).putString("lastRecentSabqiReviewLabel", label)\n                .putString("consolidationAttendanceDates", attendanceJson(attendance))\n                .remove(consolidationStateKey(ConsolidationCycleEngine.Family.STABILIZATION))\n                .commit();\n        }\n    }\n\n''' + anchor
          s = replace_once(s, anchor, addition, 'HifzPrefs Consolidation V6')
          p.write_text(s)

          # Runtime wiring.
          p = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java')
          s = p.read_text()
          old = '''    private int recentReviewIndex;\n    private LocalDate sessionDate;\n'''
          new = '''    private int recentReviewIndex;\n    private LocalDate sessionDate;\n    private final ConsolidationCycleEngine consolidationEngine = new ConsolidationCycleEngine();\n    private ConsolidationCycleEngine.Session consolidationSession;\n'''
          s = replace_once(s, old, new, 'session fields')

          old = '''            else if (ITQAN.equals(mode)) renderItqan();\n            else if (RECENT_SABQI_REVIEW.equals(mode)) renderRecentSabqiReview();\n            else renderMurajaah();\n'''
          new = '''            else if (ITQAN.equals(mode)) renderItqan();\n            else if (RECENT_SABQI_REVIEW.equals(mode)) renderConsolidationCycle();\n            else renderMurajaah();\n'''
          s = replace_once(s, old, new, 'render switch')

          old = '''        boolean ok = prefs.completeSabqiBlock(\n            sabqiBlock.startLineIndex,\n            sabqiBlock.endLineIndex,\n            sabqiBlock.endLineIndex+1,\n            sessionDate.toString(),\n            label\n        );\n'''
          new = '''        boolean ok = prefs.completeSabqiBlockV6(\n            sabqiBlock.startLineIndex,\n            sabqiBlock.endLineIndex,\n            sabqiBlock.endLineIndex+1,\n            sabqiBlock.lineIds,\n            sessionDate.toString(),\n            label\n        );\n'''
          s = replace_once(s, old, new, 'Apprentissage completion')

          # Replace the old timed recent-review renderer with grouped Consolidation runtime.
          start = s.index('    private void renderRecentSabqiReview() {')
          end = s.index('    /** Commit a timed session whose foreground clock reached its limit before process death. */', start)
          grouped = '''    private static String consolidationUnitId(AnchoringQueue.Entry entry) {\n        return entry.start + "|" + entry.end;\n    }\n\n    private static ConsolidationCycleEngine.Protocol consolidationProtocol(AnchoringQueue.Entry entry) {\n        return entry.protocol == AnchoringQueue.Protocol.LIGHT\n            ? ConsolidationCycleEngine.Protocol.LIGHT : ConsolidationCycleEngine.Protocol.FULL;\n    }\n\n    private AnchoringQueue.Entry consolidationEntry(String unitId) {\n        String[] bounds = unitId.split("\\\\|", -1);\n        if (bounds.length != 2) throw new IllegalStateException("Unité de Consolidation invalide : " + unitId);\n        AnchoringQueue.Entry entry = prefs.anchoringEntryFor(\n            GeometryRepository.parseVerse(bounds[0]), GeometryRepository.parseVerse(bounds[1]));\n        if (entry == null) throw new IllegalStateException("Unité de Consolidation absente : " + unitId);\n        return entry;\n    }\n\n    private void renderConsolidationCycle() {\n        String today = sessionDate.toString();\n        if (today.equals(prefs.lastRecentSabqiReviewDate())) {\n            sessionCompleted = true;\n            program.setText("Consolidation · séance validée");\n            progress.setText(prefs.lastRecentSabqiReviewLabel().isEmpty() ? "Acquis" : prefs.lastRecentSabqiReviewLabel());\n            return;\n        }\n        consolidationSession = prefs.restoreConsolidationSession(\n            consolidationEngine, ConsolidationCycleEngine.Family.STABILIZATION);\n        if (consolidationSession == null) {\n            List<AnchoringQueue.Entry> entries = prefs.stabilizedAnchoringEntries(geometry, 3);\n            if (entries.isEmpty()) {\n                sessionCompleted = true;\n                program.setText("Consolidation · rien à consolider");\n                progress.setText("Aucune unité Stabilisée en attente.");\n                return;\n            }\n            ConsolidationCycleEngine.Cycle cycle = null;\n            for (int i = 0; i < entries.size(); i++) {\n                AnchoringQueue.Entry entry = entries.get(i);\n                ConsolidationCycleEngine.Unit unit = new ConsolidationCycleEngine.Unit(\n                    consolidationUnitId(entry), consolidationProtocol(entry));\n                cycle = i == 0\n                    ? consolidationEngine.startCycle("stabilization-" + today, ConsolidationCycleEngine.Family.STABILIZATION, unit)\n                    : consolidationEngine.addUnit(cycle, unit);\n            }\n            consolidationSession = consolidationEngine.openSession(cycle, "session-" + today);\n            if (!prefs.persistConsolidationSession(consolidationSession))\n                throw new IllegalStateException("Impossible d’enregistrer la Consolidation ouverte");\n        }\n        if (consolidationSession.readyToClose()) {\n            sessionCompleted = true;\n            program.setText("Consolidation · prête à valider");\n            progress.setText("Toutes les répétitions du groupe sont terminées.");\n            addRoundAction("✓", "Valider", v -> validateConsolidationCycle());\n            return;\n        }\n        int position = consolidationSession.nextUnitIndex();\n        AnchoringQueue.Entry entry = consolidationEntry(consolidationSession.unitIds().get(position));\n        VerseRef start = GeometryRepository.parseVerse(entry.start);\n        VerseRef end = GeometryRepository.parseVerse(entry.end);\n        currentPage = geometry.pageForVerse(start);\n        unitFirstPage = unitLastPage = currentPage;\n        currentSelection = geometry.versesForRange(start, end);\n        currentLineIds = geometry.lineIdsForVerseRange(start, end);\n        currentMask = 0;\n        sessionCompleted = false;\n        int[] vector = consolidationSession.stageVectorAt(position);\n        int target = vector[consolidationSession.stage()];\n        program.setText("Consolidation · " + start + " → " + end + " · unité "\n            + (position + 1) + "/" + consolidationSession.sessionGroupSize());\n        progress.setText("Étape " + (consolidationSession.stage() + 1) + "/5 · "\n            + consolidationSession.donePerStage() + "/" + target);\n        showCurrent();\n        addRoundAction("↻", "Répétition", v -> completeConsolidationRep());\n    }\n\n    private void completeConsolidationRep() {\n        if (!takeRepLock() || consolidationSession == null || consolidationSession.readyToClose()) return;\n        consolidationSession = consolidationEngine.recordRepetition(consolidationSession);\n        if (!prefs.persistConsolidationSession(consolidationSession)) {\n            onError("Impossible d’enregistrer la répétition de Consolidation.");\n            return;\n        }\n        renderMode();\n    }\n\n    private void validateConsolidationCycle() {\n        if (consolidationSession == null || !consolidationSession.readyToClose()) return;\n        String label = "Consolidation · " + consolidationSession.sessionGroupSize() + " unité(s) · Acquis";\n        if (!prefs.completeConsolidationSessionV6(consolidationSession, geometry, sessionDate.toString(), label)) {\n            onError("Impossible d’enregistrer la Consolidation.");\n            return;\n        }\n        consolidationSession = consolidationEngine.closeSession(consolidationSession);\n        closeClockForCompletedSession();\n        mushaf.cycleCompleted();\n        renderMode();\n    }\n\n'''
          s = s[:start] + grouped + s[end:]

          # Timed logic: Consolidation is quota-driven, not a weekday/minute cadence.
          old = '''        if (RECENT_SABQI_REVIEW.equals(mode)\n                && !today.equals(prefs.lastRecentSabqiReviewDate())) {\n            timedSessionLimitReached = true;\n            if (!completeConsolidation(today, clock.elapsedMs())) return false;\n            closeClockForCompletedSession();\n            return true;\n        }\n'''
          s = replace_once(s, old, '', 'expired old consolidation')
          old = '''        } else if (RECENT_SABQI_REVIEW.equals(mode)) {\n            if (!completeConsolidation(today, effectiveElapsed)) return;\n            closeClockForCompletedSession();\n            renderMode();\n        }\n'''
          s = replace_once(s, old, '        }\n', 'timed old consolidation')

          # Replace legacy hard-surah block projection by the frozen half-page policy.
          old = '''        fractionatedItqan = prefs.isFractionatedUnit(itqanUnit.verses);\n        itqanSessionProtocol = anchoringEntry.protocol;\n        itqanTargetReps = PreviewConfig.itqanTotalReps(itqanSessionProtocol);\n        if (fractionatedItqan) {\n            int[] segments = geometry.surahSegmentLineCounts(itqanUnit.start, itqanUnit.end);\n            itqanBlockCount = PreviewConfig.fractionatedBlockCount(segments);\n            itqanBlockIndex = Math.max(0, Math.min(prefs.itqanBlockIndex(), itqanBlockCount - 1));\n            int from = PreviewConfig.fractionatedBlockStart(segments, itqanBlockIndex);\n            int len = PreviewConfig.fractionatedBlockLength(segments, itqanBlockIndex);\n            currentLineIds = new ArrayList<>(itqanUnit.lineIds.subList(from, from + len));\n            currentSelection = geometry.versesOnLines(currentLineIds, itqanUnit.verses);\n        } else {\n            itqanBlockCount = 1;\n            itqanBlockIndex = 0;\n            currentSelection=itqanUnit.verses;currentLineIds=itqanUnit.lineIds;\n        }\n'''
          new = '''        itqanSessionProtocol = anchoringEntry.protocol;\n        itqanTargetReps = PreviewConfig.itqanTotalReps(itqanSessionProtocol);\n        List<StabilizationHalfPagePolicy.Unit> plannedUnits = StabilizationHalfPagePolicy.planPage(\n            geometry.linesForIdsOnPage(itqanUnit.page, itqanUnit.lineIds));\n        itqanBlockCount = plannedUnits.size();\n        itqanBlockIndex = Math.max(0, Math.min(prefs.itqanBlockIndex(), itqanBlockCount - 1));\n        StabilizationHalfPagePolicy.Unit workingUnit = plannedUnits.get(itqanBlockIndex);\n        currentLineIds = new ArrayList<>(workingUnit.lineIds);\n        currentSelection = geometry.versesOnLines(currentLineIds, itqanUnit.verses);\n        fractionatedItqan = itqanBlockCount > 1;\n'''
          s = replace_once(s, old, new, 'Stabilisation planner')

          old = '''        if (fractionatedItqan) {\n            int nextBlock = itqanBlockIndex + 1;\n            if (nextBlock < itqanBlockCount) {\n                String label="Stabilisation · bloc "+(itqanBlockIndex+1)+"/"+itqanBlockCount\n                    +" validé · révélations "+prefs.itqanAssisted()+" · "+metrics;\n                metricsStore.recordAnchoring("bloc fractionné réussi · "+itqanUnit.start+" → "+itqanUnit.end\n                    +" · "+(itqanBlockIndex+1)+"/"+itqanBlockCount+" · "+metrics);\n                if (!prefs.advanceItqanBlock(nextBlock, itqanUnit.start, itqanUnit.end,\n                        sessionDate.toString(), label)) {\n                    onError("Impossible d’enregistrer le sous-bloc d’Stabilisation.");\n                    return;\n                }\n                awaitingValidation=false;\n                closeClockForCompletedSession();\n                mushaf.cycleCompleted();\n                renderMode();\n                return;\n            }\n        }\n        EligibleCorpus corpus = prefs.itqanWorkCorpus();\n        VerseRef next = corpus.nextAnchored(itqanUnit.end, prefs.itqanRotationStart());\n        String label=(fractionatedItqan ? "Stabilisation" : "Stabilisation")+" · "+itqanUnit.start+" → "+itqanUnit.end+" · ×"+itqanTargetReps\n            +" · révélations "+prefs.itqanAssisted()+" · "+metrics;\n        metricsStore.recordAnchoring((fractionatedItqan ? "réussite fractionnée" : "réussite")+" · "+itqanUnit.start+" → "+itqanUnit.end+" · "+metrics);\n        int creditBlockIndex = fractionatedItqan ? itqanBlockIndex : -1;\n        boolean ok=prefs.completeItqanUnitAndConsolidate(itqanUnit.start,itqanUnit.end,next,sessionDate.toString(),label,creditBlockIndex);\n        if(!ok){onError("Impossible d’enregistrer la validation de l’Stabilisation.");return;}\n        awaitingValidation=false;closeClockForCompletedSession();mushaf.cycleCompleted();renderMode();\n'''
          new = '''        int nextBlock = itqanBlockIndex + 1;\n        boolean finalBlock = nextBlock >= itqanBlockCount;\n        EligibleCorpus corpus = prefs.itqanWorkCorpus();\n        VerseRef next = corpus.nextAnchored(itqanUnit.end, prefs.itqanRotationStart());\n        String label="Stabilisation · bloc "+(itqanBlockIndex+1)+"/"+itqanBlockCount\n            +" validé · révélations "+prefs.itqanAssisted()+" · "+metrics;\n        metricsStore.recordAnchoring("Stabilisation réussie · "+itqanUnit.start+" → "+itqanUnit.end\n            +" · "+(itqanBlockIndex+1)+"/"+itqanBlockCount+" · "+metrics);\n        boolean ok = prefs.completeStabilizationBlockV6(\n            currentLineIds, nextBlock, finalBlock, itqanUnit.start, itqanUnit.end, next,\n            sessionDate.toString(), label);\n        if(!ok){onError("Impossible d’enregistrer la validation de la Stabilisation.");return;}\n        awaitingValidation=false;closeClockForCompletedSession();mushaf.cycleCompleted();renderMode();\n'''
          s = replace_once(s, old, new, 'Stabilisation validation')

          old = '''    private boolean isTimedMode() {\n        return SABQI_TODAY_REVIEW.equals(mode) || RECENT_SABQI_REVIEW.equals(mode) || MURAJAAH.equals(mode);\n    }\n'''
          new = '''    private boolean isTimedMode() {\n        return SABQI_TODAY_REVIEW.equals(mode) || MURAJAAH.equals(mode);\n    }\n'''
          s = replace_once(s, old, new, 'timed modes')
          p.write_text(s)

          # Strengthen the source contract around atomic completion APIs instead of non-atomic transition calls.
          p = Path('hifz-app/src/test/java/com/quransafeguard/hifz/preview/CanonicalSessionRuntimeSourceContractTest.java')
          s = p.read_text()
          s = s.replace('''        assertTrue(session.contains("ProgressEvent.LEARNING_COMPLETED"));\n        assertTrue(session.contains("transitionV6Lines"));\n        assertTrue(session.contains("sabqiBlock.lineIds"));''', '''        String prefs = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java");\n        assertTrue(session.contains("completeSabqiBlockV6"));\n        assertTrue(session.contains("sabqiBlock.lineIds"));\n        assertTrue(prefs.contains("v6LearnedLineIds"));''')
          s = s.replace('''        assertTrue(session.contains("ProgressEvent.STABILIZATION_COMPLETED"));\n        assertTrue(session.contains("transitionV6Lines"));''', '''        assertTrue(session.contains("completeStabilizationBlockV6"));\n        assertTrue(session.contains("currentLineIds"));''')
          s = s.replace('''        assertTrue(session.contains("ProgressEvent.CONSOLIDATION_COMPLETED"));''', '''        assertTrue(session.contains("completeConsolidationSessionV6"));''')
          p.write_text(s)

