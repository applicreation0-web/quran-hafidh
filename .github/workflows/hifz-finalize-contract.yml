name: Quran Hifz one-shot finalize build contract

on:
  push:
    branches:
      - release/hifz-0.7.3-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/hifz-0.7.3-final
          fetch-depth: 0
      - name: Finalize build contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hifz-app/build.gradle.kts'); t=p.read_text()
          old='''        check(reader.contains("hiddenSegmentsForLine") && reader.contains("const targetWidth=totalWidth*fraction")\n                && reader.contains("Math.min(cellWidth,remaining)") && reader.contains("segments.forEach")\n                && !reader.contains("function hiddenBandForLine")) {\n            "Mask must use width-accurate source-ink segments and must never paint one solid line slab."\n        }\n'''
          new='''        check(reader.contains("randomOrderKeys") && reader.contains("randomSegmentsForCells")\n                && reader.contains("totalWidth*fraction") && reader.contains("Math.min(cellWidth,remaining)")\n                && reader.contains("markerLayer(svg,polys)") && !reader.contains("line.words")\n                && !reader.contains("function hiddenBandForLine")) {\n            "Mask must randomize existing source-ink groups, preserve cumulative percentages, and keep verse markers above masks."\n        }\n'''
          if t.count(old)!=1: raise SystemExit(f'mask contract count={t.count(old)}')
          t=t.replace(old,new,1)
          oldv='        versionCode = 9\n        versionName = "0.7.2-boox"\n'
          if t.count(oldv)!=1: raise SystemExit(f'version count={t.count(oldv)}')
          p.write_text(t.replace(oldv,'        versionCode = 10\n        versionName = "0.7.3-boox"\n',1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hifz-app/build.gradle.kts
          git commit -m 'release(hifz): set 0.7.3 final runtime contract'
          git push origin HEAD:release/hifz-0.7.3-final
