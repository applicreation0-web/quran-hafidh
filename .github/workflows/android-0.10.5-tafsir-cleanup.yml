name: Android 0.10.5 Tafsir contradictory audit

on:
  push:
    branches:
      - "fix/0.10.5-tafsir-formatting"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tafsir-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source and justified-rendering contract
        run: python3 scripts/verify_0105_tafsir_update.py

      - name: Typography and alignment non-regression contract
        run: python3 scripts/verify_0105_tafsir_typography_contract.py

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up Python corpus tools
        run: python3 -m pip install --disable-pip-version-check pymupdf==1.26.7 beautifulsoup4

      - name: Rebuild Qushayri and Qurtubi from pinned sources
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/tafsir-src"
          mkdir -p "${src}"
          curl --fail --location --retry 3 -o "${src}/lataif.pdf" "https://www.altafsir.com/Books/lataif.pdf"
          base="https://archive.org/download/tafsir-al-qurtubi-4.-Volumes/Tafseer%20Al-Qurtubi"
          for n in 1 2 3 4; do
            curl --fail --location --retry 3 -o "${src}/qurtubi-v${n}.pdf" "${base}/Tafsir%20al-Qurtubi%20Vol.%20${n}.pdf"
          done
          python3 scripts/research_qushayri_notes.py "${src}/lataif.pdf" \
            --report "${RUNNER_TEMP}/qushayri-note-research.json"
          python3 scripts/research_qushayri_note_superscripts.py "${src}/lataif.pdf" \
            --report "${RUNNER_TEMP}/qushayri-note-superscript-crosscheck.json"
          python3 scripts/prepare_multitafsir_assets.py \
            --source-dir "${src}" \
            --assets-dir app/src/plus/assets/tafsir \
            --work-dir "${RUNNER_TEMP}/tafsir-work" \
            2>&1 | tee "${RUNNER_TEMP}/tafsir-0105-rebuild.log"

      - name: Upload Qushayri note research inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qushayri-note-research
          path: |
            ${{ runner.temp }}/qushayri-note-research.json
            ${{ runner.temp }}/qushayri-note-superscript-crosscheck.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Tafsir rebuild diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tafsir-0105-rebuild-diagnostic
          path: ${{ runner.temp }}/tafsir-0105-rebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain rebuilt databases for contradictory diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: tafsir-0105-rebuilt-databases
          path: ${{ runner.temp }}/tafsir-work/*.sqlite
          if-no-files-found: error
          retention-days: 7

      - name: Exhaustive Qushayri note-call relation audit
        run: >-
          python3 scripts/verify_qushayri_note_crosscheck.py
          "${RUNNER_TEMP}/qushayri-note-superscript-crosscheck.json"

      - name: Exhaustive 0.10.5 corpus-cleanliness audit
        id: tafsir_cleanup_audit
        shell: bash
        run: |
          set +e
          report="${RUNNER_TEMP}/tafsir-0105-audit.log"
          python3 scripts/audit_0105_tafsir_cleanup_strict.py app/src/plus/assets/tafsir >"${report}" 2>&1
          rc=$?
          cat "${report}"
          if [ "${rc}" -ne 0 ]; then
            {
              echo "### Tafsir 0.10.5 audit failure"
              echo '```text'
              cat "${report}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${rc}"

      - name: Upload Tafsir audit diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tafsir-0105-audit-diagnostic
          path: ${{ runner.temp }}/tafsir-0105-audit.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Re-run source/UI contract after corpus reconstruction
        run: |
          python3 scripts/verify_0105_tafsir_update.py
          python3 scripts/verify_0105_tafsir_typography_contract.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Preserve unrelated canonical Hikam data unchanged
        run: |
          python3 scripts/verify_0104_hikam_freeze.py
          python3 scripts/verify_hikam_translation_separation.py

      - name: Full existing release regression audit
        run: gradle --no-daemon :app:verifyReleaseAudit

      - name: Light and Plus tests
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest

      - name: Build Light and Plus unsigned release
        run: gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease

      - name: Prove Light contains no Tafsir
        run: python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk

      - name: Prove Plus embeds exactly the three approved Tafsir corpora
        run: python3 scripts/verify_plus_apk_multitafsir.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk
