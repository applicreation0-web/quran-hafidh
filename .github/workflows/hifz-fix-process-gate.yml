name: Quran Hifz process-death harness fix
on:
  push:
    branches: [work/hifz-0.7.3-claude-all-fixes]
    paths: [.github/workflows/hifz-fix-process-gate.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.3-claude-all-fixes
          fetch-depth: 0
      - name: Keep debug instrumentation installed for external process-death gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hifz-app/build.gradle.kts')
          text = p.read_text()
          marker = '// CI process-death harness: connectedDebugAndroidTest normally uninstalls both packages.\n'
          if marker not in text:
              text += r'''

// CI process-death harness: connectedDebugAndroidTest normally uninstalls both packages.
// Reinstall only on GitHub Actions so the workflow can execute a second instrumentation
// process around a real `adb shell am force-stop` boundary without weakening normal tests.
tasks.matching { it.name == "connectedDebugAndroidTest" }.configureEach {
    doLast {
        if (System.getenv("GITHUB_ACTIONS") == "true") {
            val appApk = fileTree(layout.buildDirectory.dir("outputs/apk/debug")) {
                include("**/*.apk")
            }.files.firstOrNull { !it.name.contains("androidTest", ignoreCase = true) }
                ?: error("Debug APK missing after connectedDebugAndroidTest")
            val testApk = fileTree(layout.buildDirectory.dir("outputs/apk/androidTest/debug")) {
                include("**/*.apk")
            }.files.firstOrNull()
                ?: error("AndroidTest APK missing after connectedDebugAndroidTest")

            fun adbInstall(apk: java.io.File) {
                val process = ProcessBuilder("adb", "install", "-r", apk.absolutePath)
                    .inheritIO()
                    .start()
                check(process.waitFor() == 0) { "adb install failed for ${apk.name}" }
            }
            adbInstall(appApk)
            adbInstall(testApk)
        }
    }
}
'''
              p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hifz-app/build.gradle.kts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Harness support already present.'
          else
            git commit -m 'fix(ci): retain instrumentation for process-death gate'
            git push origin HEAD:work/hifz-0.7.3-claude-all-fixes
          fi
