name: Apply Quran Hifz 0.7.5 phone feedback patch

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_hifz_075_phone_feedback_patch.py

      - name: Commit product delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- hifz-app/src/main/java/com/quransafeguard/hifz/preview/SettingsActivity.java hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java hifz-app/src/main/java/com/quransafeguard/hifz/preview/Ui.java; then
            echo NO_PRODUCT_DELTA
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/SettingsActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/Ui.java
          git commit -m "feat: align 0.7.5 phone UI with canonical progression"
          git push origin HEAD:work/hifz-0.7.5-retention-j10
