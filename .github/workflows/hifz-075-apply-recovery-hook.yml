name: Apply Hifz 0.7.5 recovery hook

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/scripts/apply_hifz_v6_recovery_hook.py
      - .github/workflows/hifz-075-apply-recovery-hook.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply deterministic patch
        run: python3 .github/scripts/apply_hifz_v6_recovery_hook.py
      - name: Commit application patch and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_hifz_v6_recovery_hook.py
          rm .github/workflows/hifz-075-apply-recovery-hook.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make schema6 migration crash-recoverable'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
