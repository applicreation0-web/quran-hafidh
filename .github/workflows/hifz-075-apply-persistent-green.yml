name: Apply Hifz 0.7.5 schema6 persistence GREEN

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/hifz-075-apply-persistent-green.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
          fetch-depth: 0

      - name: Apply deterministic production patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_hifz_v6_persistent_green.py
          git diff --check
          git diff -- hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java

      - name: Commit production patch and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_hifz_v6_persistent_green.py
          rm .github/workflows/hifz-075-apply-persistent-green.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java .github/scripts/apply_hifz_v6_persistent_green.py .github/workflows/hifz-075-apply-persistent-green.yml
          git commit -m 'feat: persist schema6 conflict resolution atomically'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
