name: Publish Quran Safeguard 0.10.5 Light and Plus

on:
  push:
    branches:
      - "release/0.10.5-final"

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Release Quran Safeguard 0.10.5')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LIGHT_KEYSTORE_B64: ${{ secrets.LIGHT_KEYSTORE_B64 }}
      LIGHT_KEYSTORE_PASSWORD: ${{ secrets.LIGHT_KEYSTORE_PASSWORD }}
      PLUS_KEYSTORE_B64: ${{ secrets.PLUS_KEYSTORE_B64 }}
      PLUS_KEYSTORE_PASSWORD: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout integrated release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare 0.10.5 Android version metadata
        run: python3 scripts/prepare_0105_version.py

      - name: Verify 0.10.5 stability priorities
        run: python3 scripts/verify_0105_stability_priorities.py

      - name: Fetch and verify all 604 Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up Python audit and corpus tools
        run: python3 -m pip install --disable-pip-version-check pymupdf==1.26.7 beautifulsoup4

      - name: Rebuild Qushayri and Qurtubi from pinned sources
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/tafsir-src"
          mkdir -p "${src}"
          curl --fail --location --retry 3 -o "${src}/lataif.pdf" "https://www.altafsir.com/Books/lataif.pdf"
          base="https://archive.org/download/tafsir-al-qurtubi-4.-Volumes/Tafseer%20Al-Qurtubi"
          for n in 1 2 3 4; do
            curl --fail --location --retry 3 -o "${src}/qurtubi-v${n}.pdf" "${base}/Tafsir%20al-Qurtubi%20Vol.%20${n}.pdf"
          done
          python3 scripts/prepare_multitafsir_assets.py \
            --source-dir "${src}" \
            --assets-dir app/src/plus/assets/tafsir \
            --work-dir "${RUNNER_TEMP}/tafsir-work"

      - name: 0.10.5 pre-build contradictory audits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_0105_stability_priorities.py
          python3 scripts/verify_0105_sensitive_scope.py
          python3 scripts/verify_0105_tafsir_update.py
          python3 scripts/verify_0105_tafsir_typography_contract.py
          python3 scripts/audit_0105_tafsir_cleanup_strict.py app/src/plus/assets/tafsir
          python3 scripts/verify_0105_hikam_verified_only.py
          python3 scripts/verify_hikam_translation_separation.py
          python3 scripts/audit_hikam_technical_lexicon_0105.py
          python3 scripts/audit_hikam_translation_against_islamicpearls.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Full release audit and Light/Plus tests
        run: |
          set -euo pipefail
          gradle --no-daemon :app:verifyReleaseAudit
          gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest

      - name: Build Light and Plus release APKs
        run: gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease

      - name: Inspect unsigned APK boundaries and Tafsir payloads
        shell: bash
        run: |
          set -euo pipefail
          light="app/build/outputs/apk/light/release/app-light-release-unsigned.apk"
          plus="app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk"
          python3 scripts/verify_light_apk_no_tafsir.py "${light}"
          python3 scripts/verify_light_apk_no_taddabur.py "${light}"
          python3 scripts/verify_plus_apk_multitafsir.py "${plus}"
          if apkanalyzer manifest print "${plus}" | grep -Fq "TaddaburActivity"; then
            echo "Deferred TaddaburActivity must not be declared in the 0.10.5 Plus runtime."
            exit 1
          fi

      - name: Sign and verify Light and Plus 0.10.5
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LIGHT_KEYSTORE_B64}"
          test -n "${LIGHT_KEYSTORE_PASSWORD}"
          test -n "${PLUS_KEYSTORE_B64}"
          test -n "${PLUS_KEYSTORE_PASSWORD}"
          release_dir="${RUNNER_TEMP}/quran-safeguard-0.10.5"
          mkdir -p "${release_dir}"
          printf '%s' "${LIGHT_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/light.p12"
          printf '%s' "${PLUS_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/plus.p12"
          tools="${ANDROID_HOME}/build-tools/36.0.0"
          light_unsigned="app/build/outputs/apk/light/release/app-light-release-unsigned.apk"
          plus_unsigned="app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk"
          light_aligned="${RUNNER_TEMP}/light-aligned.apk"
          plus_aligned="${RUNNER_TEMP}/plus-aligned.apk"
          light_apk="${release_dir}/Quran-Safeguard-0.10.5-Light-release.apk"
          plus_apk="${release_dir}/Quran-Safeguard-Plus-0.10.5-release.apk"
          "${tools}/zipalign" -p -f 4 "${light_unsigned}" "${light_aligned}"
          "${tools}/zipalign" -p -f 4 "${plus_unsigned}" "${plus_aligned}"
          "${tools}/apksigner" sign --ks "${RUNNER_TEMP}/light.p12" --ks-type PKCS12 --ks-key-alias quran-safeguard --ks-pass env:LIGHT_KEYSTORE_PASSWORD --key-pass env:LIGHT_KEYSTORE_PASSWORD --out "${light_apk}" "${light_aligned}"
          "${tools}/apksigner" sign --ks "${RUNNER_TEMP}/plus.p12" --ks-type PKCS12 --ks-key-alias quran-safeguard-plus --ks-pass env:PLUS_KEYSTORE_PASSWORD --key-pass env:PLUS_KEYSTORE_PASSWORD --out "${plus_apk}" "${plus_aligned}"
          "${tools}/zipalign" -c -p 4 "${light_apk}"
          "${tools}/zipalign" -c -p 4 "${plus_apk}"
          "${tools}/apksigner" verify --verbose --print-certs "${light_apk}" | tee "${release_dir}/light-signature.txt"
          "${tools}/apksigner" verify --verbose --print-certs "${plus_apk}" | tee "${release_dir}/plus-signature.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "${release_dir}/light-signature.txt"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" "${release_dir}/light-signature.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "${release_dir}/plus-signature.txt"
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" "${release_dir}/plus-signature.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: 6c706f4ea44ef667d0b9698c07a39e929b1e286d2397665504411dedb37457ac" "${release_dir}/light-signature.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: 1843d245832549afc6333ab77a587649a14fedb1f4acc9c08f367c3f0301d989" "${release_dir}/plus-signature.txt"
          test "$(apkanalyzer manifest application-id "${light_apk}")" = "com.applicreation0.quransafeguard"
          test "$(apkanalyzer manifest application-id "${plus_apk}")" = "com.applicreation0.quransafeguard.plus"
          test "$(apkanalyzer manifest version-code "${light_apk}")" = "24"
          test "$(apkanalyzer manifest version-code "${plus_apk}")" = "24"
          test "$(apkanalyzer manifest version-name "${light_apk}")" = "0.10.5"
          test "$(apkanalyzer manifest version-name "${plus_apk}")" = "0.10.5-plus.1"
          python3 scripts/verify_light_apk_no_tafsir.py "${light_apk}"
          python3 scripts/verify_light_apk_no_taddabur.py "${light_apk}"
          python3 scripts/verify_plus_apk_multitafsir.py "${plus_apk}"
          if apkanalyzer manifest print "${plus_apk}" | grep -Fq "TaddaburActivity"; then
            echo "Deferred TaddaburActivity must not be declared in the signed 0.10.5 Plus runtime."
            exit 1
          fi
          sha256sum "${light_apk}" "${plus_apk}" > "${release_dir}/Quran-Safeguard-0.10.5-SHA256.txt"

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-0.10.5-signed
          path: ${{ runner.temp }}/quran-safeguard-0.10.5/
          if-no-files-found: error
          retention-days: 30

      - name: Freeze exact 0.10.5 version metadata in release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Prepared 0.10.5 version metadata was not captured in source history."
            exit 1
          fi
          git commit -m "Finalize Quran Safeguard 0.10.5 version metadata [skip ci]"
          git push origin HEAD:release/0.10.5-final
          release_source_sha="$(git rev-parse HEAD)"
          echo "RELEASE_SOURCE_SHA=${release_source_sha}" >> "${GITHUB_ENV}"

      - name: Publish private GitHub release v0.10.5
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/quran-safeguard-0.10.5"
          if gh release view v0.10.5 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.10.5 already exists; refusing to overwrite it."
            exit 1
          fi
          cat > "${release_dir}/release-notes.md" <<'NOTES'
          ## Quran Safeguard 0.10.5 — Light & Plus

          Release privée auditée.

          ### Coran / Muṣḥaf
          - 604/604 pages Hafs/KFQC contrôlées contre la source épinglée ;
          - reprise automatique de la dernière page lue conservée ;
          - marque-page explicite persistant ajouté, avec reprise directe au marque-page ;
          - décompression et structure SVG contrôlées ;
          - page 552 explicitement vérifiée comme contenant sourate aṣ-Ṣaff (61) ;
          - aucune page coranique reconstruite ou éditée manuellement.

          ### Juz / Hizb
          - 30 Juz et 60 Hizb canoniques conservés ;
          - frontières au milieu des pages respectées ;
          - continuité des 6 236 versets testée sans trou ni chevauchement ;
          - les quotas Safeguard sont séparés des divisions canoniques et ne sortent jamais du pool sélectionné.

          ### Tafsīr Plus
          - Tafsīr traité comme fonctionnalité bloquante de release ;
          - Jalalayn inchangé : 6 236 commentaires + 427 notes ;
          - Qushayrī : 806 ancres source préservées, 720 entrées logiques, 76 plages de commentaire partagé, anglais du verset conservé, arabe source exclu ;
          - Qurtubī : volumes anglais 1–4, 432 entrées, jusqu’à 4:22 ;
          - Qurtubī : inventaires séparés des 2 959 glyphes honorifiques de source et des 2 898 marques retenues dans le payload contrôlés ;
          - nettoyage renforcé des césures PDF, soft hyphens, NBSP et artefacts ;
          - commentaire principal et notes affichés en texte justifié ;
          - Light reste sans Tafsīr privé.

          ### Ḥikam
          - 264/264 matn arabes et traductions françaises restent vérifiés ;
          - la traduction française est prioritaire et contre-auditée sur les 264 entrées, l’arabe restant l’autorité ;
          - aucun commentaire n’est requis pour rendre une Ḥikma disponible ;
          - matn, traduction, aide terminologique et commentaire éventuel restent strictement séparés.

          ### Stabilité
          - Taddabur est différé de la 0.10.5 publiée ;
          - aucun blocage, aucune alarme et aucune activité Taddabur ne sont exposés dans le runtime Plus ;
          - son travail interne est conservé dans le dépôt pour une version ultérieure.

          ### Confidentialité / applications sensibles
          - le sentinel Accessibility non filtré est désactivé en permanence ;
          - aucune banque/application sécurité/identité n’est ajoutée au scope ;
          - pas de QUERY_ALL_PACKAGES, UsageStats, READ_PHONE_STATE ou accès au contenu des fenêtres ;
          - priorité donnée à la frontière de confidentialité lorsqu’Android ne permet pas de concilier sortie exacte et zéro événement hors périmètre.

          ### Vérifications release
          - audits contradictoires corpus/source/APK ;
          - tests Light + Plus ;
          - audit général Gradle ;
          - signatures APK v2/v3 et certificats attendus ;
          - application IDs, versionCode 24 et versionName 0.10.5 contrôlés ;
          - SHA-256 des deux APK fourni.

          **Quran Safeguard Plus et ses corpus Tafsīr restent réservés à l’usage privé du propriétaire du dépôt.**
          NOTES
          test -n "${RELEASE_SOURCE_SHA}"
          gh release create v0.10.5 \
            "${release_dir}/Quran-Safeguard-0.10.5-Light-release.apk" \
            "${release_dir}/Quran-Safeguard-Plus-0.10.5-release.apk" \
            "${release_dir}/Quran-Safeguard-0.10.5-SHA256.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SOURCE_SHA}" \
            --title "Quran Safeguard 0.10.5 — Light & Plus" \
            --notes-file "${release_dir}/release-notes.md"
