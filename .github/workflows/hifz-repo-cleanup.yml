name: One-off Hifz repo cleanup (explicit lists, releases + stale branches)

# Every branch and release below was named explicitly by hand from a full
# inventory taken on 2026-09-23 (88 releases, 210 branches). Kept: branch
# main, branch claude/app-dernier-chat-c19bfs, and the 3 most recent signed
# + 3 most recent debug releases (the dcaa84ea/6ff65a25/b2ee02c9 commits).
# Nothing here is computed at run time; this file is the full, reviewable
# scope of the cleanup.

