name: Quran Hifz personal embedded audio

on:
  push:
    branches:
      - integration/hifz-boox-polish-0.7
    paths:
      - '.github/workflows/hifz-audio-embedded.yml'
      - 'scripts/prepare_husary_muallim_embedded.py'
      - 'hifz-app/build.gradle.kts'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzAudioPack.java'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzAudioDialog.java'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/MushafView.java'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/EinkController.java'
      - 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/PreviewConfig.java'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-personal-embedded-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Restore validated Mushaf and Tafsir baseline
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.9-astra-re-audit
          run-id: 34336797351
          github-token: ${{ github.token }}
          path: baseline109

      - name: Inject canonical Mushaf and approved Tafsir
        shell: bash
        run: |
          set -euo pipefail
          old_plus="$(find baseline109 -type f -name 'app-plus-release-unsigned.apk' -print -quit)"
          test -n "$old_plus" && test -s "$old_plus"
          echo 'f826d06da88ee9411d275a34a2fa17d7d7686c6cef4151ce4d15b433848c1e66  '"$old_plus" | sha256sum -c -
          rm -rf baseline109/extracted && mkdir -p baseline109/extracted
          unzip -q "$old_plus" 'assets/mushaf/hafs/kfqc/svg-br/*.svg.br' 'assets/tafsir/*' -d baseline109/extracted
          mushaf_dst='app/src/main/assets/mushaf/hafs/kfqc/svg-br'
          rm -rf "$mushaf_dst" && mkdir -p "$mushaf_dst"
          cp baseline109/extracted/assets/mushaf/hafs/kfqc/svg-br/*.svg.br "$mushaf_dst/"
          test "$(find "$mushaf_dst" -maxdepth 1 -type f -name '[0-9][0-9][0-9].svg.br' | wc -l | tr -d ' ')" = 604
          tafsir_dst='app/src/plus/assets/tafsir'
          rm -rf "$tafsir_dst" && mkdir -p "$tafsir_dst"
          cp baseline109/extracted/assets/tafsir/* "$tafsir_dst/"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and verify personal Al-Husary Muallim corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_husary_muallim_embedded.py --clean
          test "$(find private/hifz-audio/husary-muallim -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9][0-9][0-9].mp3' | wc -l | tr -d ' ')" = 6236
          test -s private/hifz-audio/husary-muallim/001001.mp3
          test -s private/hifz-audio/husary-muallim/002075.mp3
          test -s private/hifz-audio/husary-muallim/114006.mp3
          test -s private/hifz-audio/husary-muallim/source.json
          test -s private/hifz-audio/husary-muallim/sha256.txt
          test -s private/hifz-audio/husary-muallim/upstream_checksum.md5
          grep -q 'https://everyayah.com/data/Husary_Muallim_128kbps/' private/hifz-audio/husary-muallim/source.json
          grep -q '"fileCount": 6236' private/hifz-audio/husary-muallim/source.json
          du -sh private/hifz-audio/husary-muallim | tee audio-corpus-size.txt

      - name: Generate exact Hifz geometry
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check pymupdf==1.26.7 numpy scipy
          python3 scripts/build_reader109_geometry.py
          python3 scripts/verify_hifz_geometry_edges.py
          test -s app/src/main/assets/reader109/geometry.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run Hifz tests and product boundary
        run: gradle --no-daemon :hifz-core:test :hifz-app:verifyHifzProductBoundary :hifz-app:verifyHifzConvergenceRules --stacktrace

      - name: Assemble personal embedded-audio APK
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace

      - name: Inspect embedded audio APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee hifz-audio-signature.txt
          apkanalyzer manifest print "$apk" > hifz-audio-manifest.xml
          grep -q 'package="com.quransafeguard.hifz.installtest1"' hifz-audio-manifest.xml
          if grep -Eqi 'android.permission.INTERNET|AccessibilityService|BIND_ACCESSIBILITY_SERVICE|QUERY_ALL_PACKAGES|QuranAccessibilityService' hifz-audio-manifest.xml; then exit 1; fi
          unzip -l "$apk" > hifz-audio-apk-list.txt
          audio_count="$(grep -E 'assets/audio/husary-muallim/[0-9]{6}\.mp3' hifz-audio-apk-list.txt | wc -l | tr -d ' ')"
          test "$audio_count" = 6236
          grep -q 'assets/audio/husary-muallim/source.json' hifz-audio-apk-list.txt
          grep -q 'assets/audio/husary-muallim/upstream_checksum.md5' hifz-audio-apk-list.txt
          page_count="$(grep -E 'assets/mushaf/hafs/kfqc/svg-br/[0-9]{3}\.svg\.br' hifz-audio-apk-list.txt | wc -l | tr -d ' ')"
          test "$page_count" = 604
          sha256sum "$apk" | tee hifz-audio-apk-sha256.txt
          stat -c '%n %s bytes' "$apk" | tee hifz-audio-build-info.txt
          echo "HEAD=${GITHUB_SHA}" | tee -a hifz-audio-build-info.txt
          echo "AUDIO_COUNT=$audio_count" | tee -a hifz-audio-build-info.txt

      - name: Upload personal embedded-audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-hifz-personal-audio-${{ github.sha }}
          path: |
            hifz-app/build/outputs/apk/debug/*.apk
            hifz-core/build/test-results/
            hifz-core/build/reports/tests/
            hifz-audio-manifest.xml
            hifz-audio-apk-list.txt
            hifz-audio-signature.txt
            hifz-audio-apk-sha256.txt
            hifz-audio-build-info.txt
            audio-corpus-size.txt
            private/hifz-audio/husary-muallim/source.json
            private/hifz-audio/husary-muallim/sha256.txt
            private/hifz-audio/husary-muallim/upstream_checksum.md5
            geometry-report.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
