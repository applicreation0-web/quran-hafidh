name: Independent BOOX portrait home validation

on:
  push:
    branches:
      - work/haafidh-1171-boox-home-independent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boox-portrait-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Hifz engines untouched
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only ea15769ac68f32c59c39aae7088de25ad93717bd...HEAD)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(hifz-core/|hifz-app/src/main/java/com/quransafeguard/hifz/preview/(HifzSessionActivity|HifzPrefs|AnchoringQueue|RevisionSessionEngine|QuizActivity)\.java$)'; then
            echo "::error::Protected Hifz engine modified"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run Hifz engine and UI JVM tests
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest --stacktrace
      - name: Run BOOX visual contract and existing source regressions
        run: gradle --no-daemon :hifz-app:sourceContractTest --stacktrace
      - name: Assemble isolated debug APK
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace
      - name: Inspect package and fingerprint
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME"/build-tools/36.0.0/aapt dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -q "name='com.quransafeguard.hifz.ibnkathirtest'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.17.1-IbnKathir-DEBUG'" "$RUNNER_TEMP/badging.txt"
          cp "$apk" "$RUNNER_TEMP/Quran-Haafidh-1.17.1-BOOX-HOME-ISOLATED-DEBUG.apk"
          sha256sum "$RUNNER_TEMP/Quran-Haafidh-1.17.1-BOOX-HOME-ISOLATED-DEBUG.apk"
          echo "path=$RUNNER_TEMP/Quran-Haafidh-1.17.1-BOOX-HOME-ISOLATED-DEBUG.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: boox-home-isolated-test-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error
      - name: Preserve failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boox-home-errors-${{ github.sha }}
          path: |
            hifz-app/build/reports/tests/
            hifz-app/build/test-results/
          if-no-files-found: warn
