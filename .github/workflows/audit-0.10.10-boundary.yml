name: 0.10.10 Audit B - Boundary adversarial

on:
  push:
    branches: ["work/0.10.10-runtime-hifz-final"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  boundary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Restore audited Mushaf and Plus corpus
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.8-unsigned
          run-id: 34096699893
          github-token: ${{ github.token }}
          path: baseline108
      - name: Restore corpus bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for ed,pat in [('main','*light*unsigned.apk'),('plus','*plus*unsigned.apk')]:
              apk=next(Path('baseline108').rglob(pat))
              with zipfile.ZipFile(apk) as z:
                  for n in z.namelist():
                      if (n.startswith('assets/') and not n.startswith('assets/dexopt/')
                              and (ed=='main' or n.startswith('assets/tafsir/'))):
                          p=Path('app/src')/ed/n
                          p.parent.mkdir(parents=True,exist_ok=True)
                          p.write_bytes(z.read(n))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and attack geometry boundaries
        run: |
          pip install pymupdf==1.26.7 numpy scipy
          python3 scripts/build_reader109_geometry.py
          python3 scripts/verify_hifz_geometry_edges.py
          python3 scripts/verify_reader109.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "platforms;android-35" "system-images;android-35;google_apis;x86_64" "emulator"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Boundary policy suites - both editions
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest --stacktrace
      - name: Static release boundary audit
        run: gradle --no-daemon :app:verifyReleaseAudit :app:verifyEditionIsolation --stacktrace
      - name: Build candidates independently
        run: gradle --no-daemon :app:assembleLightDebug :app:assemblePlusDebug :app:assembleLightRelease :app:assemblePlusRelease --stacktrace
      - name: Prove Light-Plus boundary
        run: |
          python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_plus_apk_tafsir.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk
      - name: Adversarial runtime boundary audit - Light
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :app:connectedLightDebugAndroidTest --stacktrace
      - name: Adversarial runtime boundary audit - Plus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :app:connectedPlusDebugAndroidTest --stacktrace
      - name: Upload independent boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-b-boundary-evidence
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/
            geometry-report.json
          retention-days: 14
