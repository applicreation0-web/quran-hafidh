name: 0.10.10 Audit B - Boundary adversarial

on:
  push:
    branches: ["audit/0.10.10-runtime-harness-fix"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  APP_SOURCE_SHA: "24640a22a828409bb98fcab76dc49eadf967339b"

concurrency:
  group: quran-safeguard-01010-audit-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact application candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE_SHA }}
      - name: Record application provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SOURCE_SHA"
          git show -s --format='%H %s' HEAD
      - name: Apply 0.10.10 hardening idempotently
        run: |
          python3 scripts/apply_01010_runtime_hardening.py
          git diff --exit-code
      - name: Restore audited Mushaf and Plus corpus
        uses: actions/download-artifact@v4
        with:
          name: quran-safeguard-0.10.8-unsigned
          run-id: 34096699893
          github-token: ${{ github.token }}
          path: baseline108
      - name: Restore immutable corpus bytes only — never overwrite reader109
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          light=next(Path('baseline108').rglob('*light*unsigned.apk'))
          plus=next(Path('baseline108').rglob('*plus*unsigned.apk'))
          with zipfile.ZipFile(light) as z:
              for n in z.namelist():
                  if n.startswith('assets/mushaf/') and not n.endswith('/'):
                      p=Path('app/src/main')/n
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(n))
          with zipfile.ZipFile(plus) as z:
              for n in z.namelist():
                  if n.startswith('assets/tafsir/') and not n.endswith('/'):
                      p=Path('app/src/plus')/n
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(n))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and attack geometry boundaries
        run: |
          pip install pymupdf==1.26.7 numpy scipy
          python3 scripts/build_reader109_geometry.py
          python3 scripts/verify_hifz_geometry_edges.py
          python3 scripts/verify_reader109.py
          python3 scripts/audit_01010_release_contract.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install proven build SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Boundary policy suites - both editions
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest --stacktrace
      - name: Static release boundary audit
        run: gradle --no-daemon :app:verifyReleaseAudit :app:verifyEditionIsolation --stacktrace
      - name: Build candidates independently
        run: gradle --no-daemon :app:assembleLightDebug :app:assemblePlusDebug :app:assembleLightRelease :app:assemblePlusRelease --stacktrace
      - name: Prove Light-Plus boundary
        run: |
          python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_plus_apk_tafsir.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk
      - name: Reclaim runner space before emulator
        run: |
          set -euo pipefail
          rm -rf baseline108 ~/.android/avd
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h /
      - name: Adversarial runtime boundary audit - Light
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :app:connectedLightDebugAndroidTest --stacktrace
      - name: Reset AVD before Plus runtime audit
        if: success()
        run: |
          rm -rf ~/.android/avd
          df -h /
      - name: Adversarial runtime boundary audit - Plus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :app:connectedPlusDebugAndroidTest --stacktrace
      - name: Upload independent boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-b-boundary-evidence-${{ env.APP_SOURCE_SHA }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/
            geometry-report.json
          retention-days: 14
