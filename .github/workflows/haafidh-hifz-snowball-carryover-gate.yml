name: Haafidh Hifz carryover and all-parts verification (NO APK)
on:
  push:
    branches:
      - fix/haafidh-hifz-snowball-carryover-fullpass-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-hifz-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Public QCF source and Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Full Android compile and complete JVM regression suite
        run: |
          gradle --no-daemon :hifz-app:compileDebugJavaWithJavac :hifz-core:test :hifz-app:testDebugUnitTest
          gradle --no-daemon :hifz-app:sourceContractTest
      - name: No APK built
        if: always()
        run: |
          if find hifz-app/build -name '*.apk' -type f -print -quit | grep -q .; then
            echo "Audit only: no APK may be assembled"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hifz-carryover-all-parts-jvm-results
          path: |
            hifz-app/build/test-results/
            hifz-app/build/reports/tests/
            hifz-core/build/test-results/
          retention-days: 14
