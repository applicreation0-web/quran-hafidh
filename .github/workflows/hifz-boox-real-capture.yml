name: Hifz BOOX actual emulator capture
on:
  push:
    branches:
      - feature/boox-parcours-one-screen-itqan-frise-20261112
  pull_request:
    branches:
      - feature/haafidh-itqan-30-recovery-maintien-cue-20261112
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu runner already includes the Android command line SDK.
      # setup-android@v3 currently fails on deprecated "tools" package.
      - name: Android 37 build tools and Hifz debug build
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER" || { echo "Android sdkmanager unavailable"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile real Hifz debug APK (not official signed release)
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace
      - name: Run Hifz JVM regression suite on this exact SHA
        run: gradle --no-daemon :hifz-app:testDebugUnitTest --stacktrace
      - name: Enable hardware acceleration for the Android emulator
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Real Android UI at BOOX-like viewport sizes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -accel on
          script: python3 scripts/capture_hifz_boox_ui.py
      - name: Upload screenshots, UI hierarchy and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hifz-boox-android-real-capture
          path: boox-real-renders/
          if-no-files-found: warn
