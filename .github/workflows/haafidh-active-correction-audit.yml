name: Quran Haafidh — private active correction audit (NO APK)
on:
  push:
    branches:
      - work/haafidh-active-correction-mutashabihat-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-active-correction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install offline build dependencies
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: JVM correction policy and contracts
        run: |
          gradle --no-daemon :hifz-app:testDebugUnitTest --tests '*ActiveReviewCorrectionPlanTest' --tests '*RevisionWeakSpotDecaySourceContractTest' --tests '*WeakVersesActivitySourceContractTest' --tests '*RevisionWeakSpotSourceContractTest'
      - name: All JVM Hifz regression and source contracts (no APK)
        run: |
          gradle --no-daemon --continue :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest
      - name: KVM permission for isolated Android tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SharedPreferences correction checkpoint tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon :hifz-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.quransafeguard.hifz.preview.ActiveReviewCorrectionInstrumentedTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-correction-audit-no-apk
          path: |
            hifz-app/build/reports/
            hifz-app/build/test-results/
            hifz-app/build/outputs/androidTest-results/
          retention-days: 14
