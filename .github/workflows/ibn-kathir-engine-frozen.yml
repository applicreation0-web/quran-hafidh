name: Frozen Hifz engines and Ibn Kathir integration

on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-hifz-ibn-kathir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze all Hifz engines, core, persistence and Mushaf renderer
        shell: bash
        run: bash scripts/guard_frozen_hifz_engines.sh
      - name: Extract audited Quranic cue coordinates without editorial text
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_semantic_v2_1.py \
            hifz-app/src/main/semantic-source/v2_1 \
            "$RUNNER_TEMP/legacy-input-v21.json"
          python3 scripts/extract_quranic_cues_v1.py \
            "$RUNNER_TEMP/legacy-input-v21.json" \
            hifz-app/src/main/word-source/quran-ws-v1.1.2 \
            "$RUNNER_TEMP/quranic-cues-v1.json"
          python3 - "$RUNNER_TEMP/quranic-cues-v1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema_version"] == "QURANIC_CUES_COORDINATES_V1"
          assert len(d["cues"]) == 1243
          assert len({c["id"] for c in d["cues"]}) == 1243
          assert sum(len(c["aliases"]) for c in d["cues"]) == 1256
          assert {c["surah"] for c in d["cues"]} == set(range(1,115))
          assert {p["page"] for c in d["cues"] for p in c["page_occurrences"]} == set(range(1,605))
          assert not any(k.startswith("title") or "arabic" in k or "tafsir" in k
                         for c in d["cues"] for k in c.keys())
          print("PASS: full migration rehearsal, no Quran text or editorial titles")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run Hifz engine and UI JVM tests
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest --stacktrace
      - name: Run BOOX visual contract and existing source regressions
        run: gradle --no-daemon :hifz-app:sourceContractTest --stacktrace
      - name: Assemble isolated debug APK
        run: gradle --no-daemon :hifz-app:assembleDebug --stacktrace
      - name: Inspect package and fingerprint
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME"/build-tools/36.0.0/aapt dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -q "name='com.quransafeguard.hifz.ibnkathirtest'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.17.1-IbnKathir-DEBUG'" "$RUNNER_TEMP/badging.txt"
          cp "$apk" "$RUNNER_TEMP/Quran-Haafidh-1.17.1-IBN-KATHIR-ENGINE-FROZEN-DEBUG.apk"
          sha256sum "$RUNNER_TEMP/Quran-Haafidh-1.17.1-IBN-KATHIR-ENGINE-FROZEN-DEBUG.apk"
          echo "path=$RUNNER_TEMP/Quran-Haafidh-1.17.1-IBN-KATHIR-ENGINE-FROZEN-DEBUG.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ibn-kathir-frozen-engine-test-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error
      - name: Preserve failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ibn-kathir-engine-frozen-errors-${{ github.sha }}
          path: |
            hifz-app/build/reports/tests/
            hifz-app/build/test-results/
          if-no-files-found: warn
