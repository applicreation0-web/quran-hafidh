name: Ibn Kathir Hifz + Amorces audit ONLY - no APK

on:
  push:
    branches:
      - work/haafidh-1171-ibn-kathir-integration-independent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-hifz-ibn-kathir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # CP-06 may push a workflow-only staging trigger after this exact source
    # tree has already passed. Do not replay M8 for that marker.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[cp06-staging-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CP02 OCR source-safe metadata regression (no private inputs)
        run: python3 scripts/test_mawdudi_ocr_page_reconcile.py
      - name: CP02 OCR retention regression (synthetic data only)
        run: python3 scripts/test_mawdudi_hocr_epub_retention.py
      - name: Verify default CI cannot build or install emulator APKs
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_no_apk_default_guard.py
      - name: Freeze all Hifz engines, core, persistence and Mushaf renderer
        shell: bash
        run: bash scripts/guard_frozen_hifz_engines.sh
      - name: Prove Hifz source matches official 1.17.1 plus authorized deltas
        shell: bash
        run: bash scripts/audit_hifz_quiz_against_1171.sh
      - name: Verify all 23 contractual BOOX pictogram files and byte integrity
        shell: bash
        run: python3 scripts/verify_contractual_ui_icons.py
      - name: Verify eight additive Correspondences icons against exact user SVG contract
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_correspondence_icon_contract.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/correspondence_icon_vectors.py --check
      - name: Compare approved pictogram geometry, not only hashes
        shell: bash
        run: python3 scripts/verify_approved_icon_silhouettes.py
      - name: Prove superseded title sources cannot enter the application package
        shell: bash
        run: python3 scripts/verify_no_legacy_title_packaging.py
      - name: Extract audited Quranic cue coordinates without editorial text
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_semantic_v2_1.py \
            hifz-app/src/main/semantic-source/v2_1 \
            "$RUNNER_TEMP/legacy-input-v21.json"
          python3 scripts/extract_quranic_cues_v1.py \
            "$RUNNER_TEMP/legacy-input-v21.json" \
            hifz-app/src/main/word-source/quran-ws-v1.1.2 \
            "$RUNNER_TEMP/quranic-cues-v1.json"
          python3 - "$RUNNER_TEMP/quranic-cues-v1.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["schema_version"] == "QURANIC_CUES_COORDINATES_V1"
          assert len(d["cues"]) == 1243
          assert len({c["id"] for c in d["cues"]}) == 1243
          assert sum(len(c["aliases"]) for c in d["cues"]) == 1256
          assert {c["surah"] for c in d["cues"]} == set(range(1,115))
          assert {p["page"] for c in d["cues"] for p in c["page_occurrences"]} == set(range(1,605))
          assert not any(k.startswith("title") or "arabic" in k or "tafsir" in k
                         for c in d["cues"] for k in c.keys())
          print("PASS: full migration rehearsal, no Quran text or editorial titles")
          PY
      - name: Verify all 114 English source chapters verbatim at PINNED source commit
        shell: bash
        run: bash scripts/verify_ibn_kathir_pinned_source_114.sh
      - name: Audit all 114 source-heading packs against canonical 1903 Ibn Kathir intervals
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_ibn_kathir_title_pack.py --out "$RUNNER_TEMP/ibn-kathir-work-title-coverage.csv"
          test -s "$RUNNER_TEMP/ibn-kathir-work-title-coverage.csv"
      - name: Verify all 1903 Ibn Kathir group beginnings against real Mushaf word boxes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_ibn_kathir_amorce_review.py \
            hifz-app/src/main/java/com/quransafeguard/hifz/preview/IbnKathirGroupIndex.java \
            hifz-app/src/main/word-source/quran-ws-v1.1.2 \
            scripts/data/quran-uthmani-tanzil.txt \
            "$RUNNER_TEMP/ik-amorce-review-only.json"
          python3 - "$RUNNER_TEMP/ik-amorce-review-only.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["groups"] == 1903 and d["covered_verses"] == 6236
          assert d["selected_anchors"] == 0 and d["runtime_ready"] is False
          assert d["reference_verse_text_git_blob"] == "fcc214311897921d08bbc56879b82aa38328a5f3"
          assert d["reference_verse_text_is_kfqc_word_aligned"] is False
          assert all(c["full_start_ayah_text_for_review"].strip() for c in d["candidates"])
          by_id={c["id"]:c for c in d["candidates"]}
          assert by_id["IKEN050_001_005"]["full_start_ayah_text_for_review"].startswith("قۤۚ ")
          fatiha=next(c for c in d["candidates"] if c["surah"]==1 and c["start_ayah"]==1)
          assert fatiha["full_start_ayah_text_for_review"].startswith("بِسۡمِ")
          taubah=next(c for c in d["candidates"] if c["surah"]==9 and c["start_ayah"]==1)
          assert not taubah["full_start_ayah_text_for_review"].startswith("بِسۡمِ")
          assert len(d["candidates"]) == 1903
          assert all(x["candidate_anchor_word_count"] is None
                     and x["selection_status"]=="NOT_REVIEWED" for x in d["candidates"])
          print("PASS: exact geometry, no invented mnemonic lengths or runtime activation")
          PY
      - name: Verify Quran.ws Hafs 77432 words align with QCF and draft Ibn Kathir keys
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_ibn_kathir_exact_hafs_qcf.py \
            hifz-app/src/main/java/com/quransafeguard/hifz/preview/IbnKathirGroupIndex.java \
            hifz-app/src/main/word-source/quran-ws-v1.1.2 \
            "$RUNNER_TEMP/ik-1903-verified-draft-only.json" \
            --save-pinned-words "$RUNNER_TEMP/pinned-quran-ws-hafs.json"
          python3 - "$RUNNER_TEMP/ik-1903-verified-draft-only.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["words_exactly_aligned"]==77432 and d["ayahs_exactly_aligned"]==6236
          assert d["pages_exactly_aligned"]==604 and d["ibn_kathir_groups"]==1903
          assert d["approved_semantic_amorces"]==0 and d["runtime_ready"] is False
          print("PASS: source-exact candidate evidence; Hifz frozen, Quiz retired")
          PY
      - name: J1 editorial gate for every Ibn Kathir group (NO RUNTIME ACTIVATION)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gate_ibn_kathir_amorce_approvals.py \
            "$RUNNER_TEMP/ik-amorce-review-only.json" \
            "$RUNNER_TEMP/ik-1903-verified-draft-only.json" \
            "$RUNNER_TEMP/ik-amorce-approval-gate.json"
          python3 - "$RUNNER_TEMP/ik-amorce-approval-gate.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["groups"]==1903 and d["approved"]==0 and d["not_approved"]==1903
          assert len(d["entries"])==1903 and d["runtime_ready"] is False
          assert {x["semantic_amorce_status"] for x in d["entries"]}=={"NOT_APPROVED"}
          PY
      - name: J4 Verify no lists, English titles locally on Mushaf only
        shell: bash
        run: python3 scripts/verify_ibn_kathir_map_contract.py
      - name: J2 Contradictory 1903-group semantic review evidence (never runtime)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_ibn_kathir_j2.py \
            "$RUNNER_TEMP/ik-amorce-review-only.json" \
            "$RUNNER_TEMP/ik-1903-verified-draft-only.json" \
            "$RUNNER_TEMP/ik-amorce-approval-gate.json" \
            "$RUNNER_TEMP" --negative-tests
      - name: J2 Produce complete editorial cards and source-linked 109-case review packet
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_ibn_kathir_editorial_review_queue.py \
            "$RUNNER_TEMP/ik-amorce-review-only.json" \
            "$RUNNER_TEMP/ik-1903-verified-draft-only.json" \
            "$RUNNER_TEMP/ik-amorce-approval-gate.json" \
            "$RUNNER_TEMP/ik-j2-review.json" \
            "$RUNNER_TEMP"
      - name: J2 Quran.com Qaf source-heading and exact QCF review checkpoint
        run: python3 scripts/verify_ibn_kathir_qaf_qurancom.py --negative-tests
      - name: J2 Quran.com An-Najm original-theme and exact QCF review checkpoint
        run: python3 scripts/verify_ibn_kathir_najm_qurancom.py --negative-tests
      - name: J2 Qaf contextual cue preselection and exact contiguous QCF spans
        run: python3 scripts/verify_ibn_kathir_qaf_cue_selection_pass1.py
      - name: J2 Evaluate 30 Qaf and Najm cues against the entire pinned Hafs Quran
        run: |
          python3 scripts/analyze_ibn_kathir_qaf_najm_global_rarity.py \
            "$RUNNER_TEMP/pinned-quran-ws-hafs.json" \
            "$RUNNER_TEMP"
      - name: J2 Verify nine targeted intra-verse alternatives against pinned Hafs and exact QCF
        run: |
          python3 scripts/audit_ibn_kathir_interior_cue_alternatives.py \
            "$RUNNER_TEMP/pinned-quran-ws-hafs.json" \
            "$RUNNER_TEMP"
      - name: J2 Source-grounded semantic preferences for 16 Qaf/Najm groups (30 cue positions)
        run: |
          python3 scripts/verify_ibn_kathir_editorial_preferences_round1.py \
            "$RUNNER_TEMP/pinned-quran-ws-hafs.json" \
            "$RUNNER_TEMP/ik-j2-qaf-najm-global-rarity.json" \
            "$RUNNER_TEMP/ik-j2-interior-cue-rarity.json" \
            "$RUNNER_TEMP"
      - name: J6 Verify all compact icon roles use the frozen 23-vector contract
        run: python3 scripts/verify_j6_icon_roles.py
      - name: Audit icon usage on every Android screen (no Hifz logic changes)
        shell: bash
        run: python3 scripts/audit_all_screen_icons.py
      - name: J7 Contradictory full-functional contract audit (J5-J7, no APK)
        run: python3 scripts/audit_j5_j7_contradictory.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run Hifz engine and UI JVM tests
        env:
          IK_J2_REVIEW_PATH: ${{ runner.temp }}/ik-j2-review.json
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest --stacktrace
      - name: Require real M8R 180/365/548-day JVM results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path("hifz-app/build/test-results/testDebugUnitTest/TEST-com.quransafeguard.hifz.preview.M8TargetedLongitudinalRegressionTest.xml")
          assert p.is_file(), f"M8R JUnit XML not produced: {p}"
          root=ET.parse(p).getroot()
          cases=root.findall("testcase")
          names={x.attrib.get("name","") for x in cases}
          for suffix in ("180DaysWithPurgeAndCatchup","365DaysWithProgrammeTransitions","548DaysWithPostNasAndDurableAttendance"):
              assert any(suffix in name for name in names), f"M8R missing: {suffix}"
          assert len(cases)==3, f"M8R needs exactly 3 distinct tests: {names}"
          assert not root.findall(".//failure") and not root.findall(".//error")
          assert not root.findall(".//skipped")
          output=root.findtext("system-out","")
          for horizon in (180,365,548):
              assert f"M8R_PASS horizon={horizon}" in output, f"Missing dated receipt proof at {horizon}"
          print("PASS: all 3 new dated M8R Hifz scenarios executed 180/365/548 days; full JUnit XML saved")
          PY
      - name: Preserve M8R evidence separately from historical M8
        uses: actions/upload-artifact@v4
        with:
          name: hifz-m8r-dated-180-365-548-${{ github.sha }}
          path: |
            hifz-app/build/test-results/testDebugUnitTest/TEST-com.quransafeguard.hifz.preview.M8TargetedLongitudinalRegressionTest.xml
          retention-days: 30
          if-no-files-found: error
      - name: Run BOOX visual contract and existing source regressions
        run: gradle --no-daemon :hifz-app:sourceContractTest --stacktrace
      - name: Save source-verified Ibn Kathir amorce review corpus (JSON ONLY; no APK)
        uses: actions/upload-artifact@v4
        with:
          name: ibn-kathir-amorce-review-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ik-amorce-review-only.json
            ${{ runner.temp }}/ik-draft-1903-words.json
            ${{ runner.temp }}/ik-1903-verified-draft-only.json
            ${{ runner.temp }}/ik-amorce-approval-gate.json
            ${{ runner.temp }}/ik-j2-review.json
            ${{ runner.temp }}/ik-j2-review.tsv
            ${{ runner.temp }}/ik-j2-summary.md
            ${{ runner.temp }}/ik-j2-editorial-all-1903.json
            ${{ runner.temp }}/ik-j2-editorial-sample-109.json
            ${{ runner.temp }}/ik-j2-editorial-sample-109.tsv
            ${{ runner.temp }}/ik-j2-editorial-review-summary.md
            ${{ runner.temp }}/ik-j2-qaf-najm-global-rarity.json
            ${{ runner.temp }}/ik-j2-qaf-najm-global-rarity.md
            ${{ runner.temp }}/ik-j2-interior-cue-rarity.json
            ${{ runner.temp }}/ik-j2-interior-cue-rarity.md
            ${{ runner.temp }}/ik-j2-contextual-preferences-30.json
            ${{ runner.temp }}/ik-j2-contextual-preferences-30.md
      - name: Audit-only gate confirmed
        shell: bash
        run: |
          echo "PASS: source, corpus and behavioural JVM tests checked."
          echo "Only read-only review JSON files uploaded; no APK may be assembled or published."
          echo "NO APK BUILT OR PUBLISHED before complete Ibn Kathir integration and explicit user approval."
