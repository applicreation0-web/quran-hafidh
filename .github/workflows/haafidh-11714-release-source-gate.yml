name: Haafidh 1.17.14 — release compiler + private offline guard (NO APK)
on:
  push:
    branches: [integrate/haafidh-11714-p0-hifz-progression-20261107]
    paths:
      - '.github/workflows/haafidh-11714-release-source-gate.yml'
      - 'hifz-app/src/main/**'
      - 'hifz-app/build.gradle.kts'
      - 'scripts/build_11714_private_offline.py'
      - 'scripts/test_build_11714_private_offline.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-11714-release-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Download only original public 604 QCF folios and compile SDK
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Compile exact release Java, explicitly prohibit APK tasks
        run: |
          set -euo pipefail
          gradle --no-daemon -I scripts/no_apk.init.gradle :hifz-app:compileReleaseJavaWithJavac
      - name: Compile private release code path with real production flags but NO APK
        env:
          AYAH_THEMES_PRIVATE_114: '1'
          HIFZ_PRIVATE_RELEASE_UPGRADE: '1'
        run: |
          set -euo pipefail
          # Private content is NEVER fetched by public CI. This checks only the
          # production BuildConfig/source variant; packaging has a separate fail-closed gate.
          gradle --no-daemon -I scripts/no_apk.init.gradle :hifz-app:compileReleaseJavaWithJavac
      - name: Check offline trusted-machine signing and installed-upgrade identity policy
        run: |
          set -euo pipefail
          python3 scripts/test_build_11714_private_offline.py
          python3 - <<'PY'
          from pathlib import Path
          build=Path('hifz-app/build.gradle.kts').read_text()
          assert 'applicationId = "com.quransafeguard.hifz"' in build
          assert 'versionCode = 52' in build
          assert 'versionName = "1.17.14"' in build
          script=Path('scripts/build_11714_private_offline.py').read_text()
          assert 'HISTORICAL_CERT' in script and 'check_candidate(' in script
          assert 'check_reference(' in script and 'check_assets(' in script
          assert 'GITHUB_ACTIONS' in script and 'HIFZ_PRIVATE_RELEASE_UPGRADE' in script
          print('RELEASE_SOURCE_AND_PRIVATE_OFFLINE_GUARD_PASS')
          PY
      - name: Require absence of signed or unsigned APK and private source inputs
        if: always()
        run: |
          set -euo pipefail
          if find hifz-app/build hifz-app/build-private114 -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo 'NO-GO: a release source gate generated an APK'
            exit 1
          fi
          test ! -e hifz-app/src/private114/assets/atlas_private/maududi_original.pdf
          test ! -e hifz-app/src/private114/assets/ayah_themes_private/titles_114.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11714-release-source-only-audit
          path: |
            hifz-app/build/reports/
            hifz-app/build/test-results/
          retention-days: 14
