name: Android 0.10.7 final Tafsir contradictory audit

on:
  push:
    branches:
      - "release/0.10.7-clean"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-tafsir-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/0.10.7-clean

      - name: Verify 0.10.7 reading contract
        run: python3 scripts/verify_0107_tafsir_reading_contract.py

      - name: Set up Python corpus tools
        run: python3 -m pip install --disable-pip-version-check pymupdf==1.26.7 beautifulsoup4

      - name: Fetch pinned Qushayri and Qurtubi sources
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/tafsir-src"
          mkdir -p "${src}"
          curl --fail --location --retry 3 -o "${src}/lataif.pdf" "https://www.altafsir.com/Books/lataif.pdf"
          base="https://archive.org/download/tafsir-al-qurtubi-4.-Volumes/Tafseer%20Al-Qurtubi"
          for n in 1 2 3 4; do
            curl --fail --location --retry 3 -o "${src}/qurtubi-v${n}.pdf" "${base}/Tafsir%20al-Qurtubi%20Vol.%20${n}.pdf"
          done

      - name: Independent Qushayri note-call cross-check
        shell: bash
        run: |
          python3 scripts/research_qushayri_note_superscripts.py \
            "${RUNNER_TEMP}/tafsir-src/lataif.pdf" \
            --report "${RUNNER_TEMP}/qushayri-note-crosscheck.json"
          python3 scripts/verify_qushayri_note_crosscheck.py \
            "${RUNNER_TEMP}/qushayri-note-crosscheck.json"

      - name: Source-authoritative Qushayri note and poetry semantics
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, fitz, sys
          sys.path.insert(0, 'scripts')
          import qushayri_source_semantics_0106 as base
          from qushayri_source_semantics_0106_verified import (
              EXPECTED_UNIQUE_POETRY_LINES,
              build_qushayri_source_semantics,
          )
          path='${{ runner.temp }}/tafsir-src/lataif.pdf'
          assert hashlib.sha256(open(path,'rb').read()).hexdigest() == base.EXPECTED_SOURCE_SHA256
          semantics=build_qushayri_source_semantics(fitz.open(path))
          assert semantics.verified_note_relation_count == 928
          assert semantics.poetry_entry_count == 121
          assert semantics.poetry_occurrence_count == 126
          assert semantics.poetry_line_count == EXPECTED_UNIQUE_POETRY_LINES == 542
          known=sorted(
              [v for v in semantics.poetry_lines.values() if v.poem_id.startswith('35:We have not been firm')],
              key=lambda v:v.line_index,
          )
          assert len(known) == 4
          assert [v.stanza_break_before for v in known] == [False, False, True, False]
          print('Qushayri source semantics PASS: 928 verified note relations; 121 poetry entries; 126 occurrences; 542 unique poetry lines')
          PY

      - name: Source-authoritative Qushayri honorific inventory
        run: |
          python3 scripts/research_qushayri_honorific_glyphs_0106.py \
            "${RUNNER_TEMP}/tafsir-src/lataif.pdf" \
            --json "${RUNNER_TEMP}/qushayri-honorific-glyphs.json"

      - name: Rebuild private Tafsir assets from pinned sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_multitafsir_assets_0106.py \
            --source-dir "${RUNNER_TEMP}/tafsir-src" \
            --assets-dir app/src/plus/assets/tafsir \
            --work-dir "${RUNNER_TEMP}/tafsir-work" \
            2>&1 | tee "${RUNNER_TEMP}/tafsir-0107-rebuild.log"

      - name: Corpus honorific gate
        run: python3 scripts/audit_0106_tafsir_honorifics.py app/src/plus/assets/tafsir

      - name: Contradictory presentation gate
        run: python3 scripts/audit_0106_tafsir_presentation.py app/src/plus/assets/tafsir

      - name: Qurtubi Unicode verse-label gate
        run: python3 scripts/audit_0106_qurtubi_unicode_labels.py app/src/plus/assets/tafsir

      - name: Existing typography contract
        run: python3 scripts/verify_0105_tafsir_typography_contract.py

      - name: Fetch canonical Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Preserve Hikam corpus unchanged
        run: |
          python3 scripts/verify_0104_hikam_freeze.py
          python3 scripts/verify_hikam_translation_separation.py

      - name: Full release regression audit
        run: gradle --no-daemon :app:verifyReleaseAudit

      - name: Light and Plus unit tests
        run: gradle --no-daemon :app:testLightDebugUnitTest :app:testPlusDebugUnitTest

      - name: Build Light and Plus unsigned release
        run: gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease

      - name: Prove Light contains no private Tafsir
        run: python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk

      - name: Prove Plus embeds approved Tafsir corpora
        run: python3 scripts/verify_plus_apk_multitafsir_0106.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk

      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tafsir-0107-final-contradictory-audit
          path: |
            ${{ runner.temp }}/tafsir-work/*.sqlite
            ${{ runner.temp }}/tafsir-0107-rebuild.log
            ${{ runner.temp }}/qushayri-note-crosscheck.json
            ${{ runner.temp }}/qushayri-honorific-glyphs.json
          if-no-files-found: warn
          retention-days: 7
