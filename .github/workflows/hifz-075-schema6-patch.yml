name: Quran Hifz 0.7.5 schema6 one-shot patch

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/hifz-075-schema6-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply minimal schema 5 to 6 migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java')
          text = path.read_text(encoding='utf-8')

          old = "        if (schema == 4) {\n            migrateV4ToV5();\n            return;\n        }\n        if (schema != PreviewConfig.SCHEMA_VERSION) {\n            throw new IllegalStateException(\"Unsupported Hifz preview schema: \" + schema);\n        }\n"
          new = "        if (schema == 4) {\n            migrateV4ToV5();\n            schema = 5;\n        }\n        if (schema == 5) {\n            migrateV5ToV6();\n            schema = 6;\n        }\n        if (schema != PreviewConfig.SCHEMA_VERSION) {\n            throw new IllegalStateException(\"Unsupported Hifz preview schema: \" + schema);\n        }\n"
          if text.count(old) != 1:
              raise SystemExit(f'ensureSchema target count={text.count(old)}')
          text = text.replace(old, new, 1)

          marker = "    private void migrateV1ToV2() {\n"
          method = "    private void migrateV5ToV6() {\n        boolean calibrated = p.getBoolean(\"murajaahSpeedCalibrated\", false);\n        double existing = p.getFloat(\n            \"murajaahSecPerLine\",\n            9.0f\n        );\n        double migrated = HifzV6Migration.migratedMaintenanceSecondsPerLine(\n            existing,\n            calibrated\n        );\n        SharedPreferences.Editor e = p.edit()\n            .putInt(\"schema\", 6)\n            .putFloat(\"murajaahSecPerLine\", (float) migrated);\n        if (!e.commit()) {\n            throw new IllegalStateException(\"Unable to migrate Hifz schema v5 to v6\");\n        }\n    }\n\n    private void migrateV1ToV2() {\n"
          if text.count(marker) != 1:
              raise SystemExit(f'method insertion target count={text.count(marker)}')
          text = text.replace(marker, method, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -n -A28 -B8 'migrateV5ToV6' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java

      - name: Commit production patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'applicreation0-web'
          git config user.email 'applicreation0@gmail.com'
          git rm .github/workflows/hifz-075-schema6-patch.yml
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          git commit -m 'feat: migrate installed Hifz schema 5 to 6'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
