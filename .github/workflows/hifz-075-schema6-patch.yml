name: Quran Hifz 0.7.5 schema6 one-shot patch

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/hifz-075-schema6-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply schema 6 migration patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply minimal schema 5 to 6 migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java')
          text = path.read_text(encoding='utf-8')

          old = '''        if (schema == 4) {
              migrateV4ToV5();
              return;
          }
          if (schema != PreviewConfig.SCHEMA_VERSION) {
              throw new IllegalStateException("Unsupported Hifz preview schema: " + schema);
          }
          '''
          new = '''        if (schema == 4) {
              migrateV4ToV5();
              schema = 5;
          }
          if (schema == 5) {
              migrateV5ToV6();
              schema = 6;
          }
          if (schema != PreviewConfig.SCHEMA_VERSION) {
              throw new IllegalStateException("Unsupported Hifz preview schema: " + schema);
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'ensureSchema target count={text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '''    private void migrateV1ToV2() {
          '''
          method = '''    private void migrateV5ToV6() {
              boolean calibrated = p.getBoolean("murajaahSpeedCalibrated", false);
              double existing = p.getFloat(
                  "murajaahSecPerLine",
                  9.0f
              );
              double migrated = HifzV6Migration.migratedMaintenanceSecondsPerLine(
                  existing,
                  calibrated
              );
              SharedPreferences.Editor e = p.edit()
                  .putInt("schema", 6)
                  .putFloat("murajaahSecPerLine", (float) migrated);
              if (!e.commit()) {
                  throw new IllegalStateException("Unable to migrate Hifz schema v5 to v6");
              }
          }

          private void migrateV1ToV2() {
          '''
          if text.count(marker) != 1:
              raise SystemExit(f'method insertion target count={text.count(marker)}')
          text = text.replace(marker, method, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java

      - name: Commit production patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'applicreation0-web'
          git config user.email 'applicreation0@gmail.com'
          git rm .github/workflows/hifz-075-schema6-patch.yml
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          git commit -m 'feat: migrate installed Hifz schema 5 to 6'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
