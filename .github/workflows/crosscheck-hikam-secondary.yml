name: Recheck Al-Hikam against clean secondary Arabic edition # poppler

on:
  push:
    branches:
      - quran-safeguard-hikam-complete-corpus
    paths:
      - ".github/workflows/crosscheck-hikam-secondary.yml"

permissions:
  contents: write

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Poppler text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Cross-check clean independently numbered edition
        run: python3 scripts/crosscheck_hikam_secondary_pdf.py
      - name: Commit cross-check and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quran-safeguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/hikam/secondary_arabic_crosscheck.json
          git rm .github/workflows/crosscheck-hikam-secondary.yml
          git commit -m "Refresh independent Al-Hikam Arabic verification"
          git push origin HEAD:quran-safeguard-hikam-complete-corpus
