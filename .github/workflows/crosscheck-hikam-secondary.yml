name: Cross-check complete Al-Hikam Arabic corpus # retry

on:
  push:
    branches:
      - quran-safeguard-hikam-complete-corpus
    paths:
      - ".github/workflows/crosscheck-hikam-secondary.yml"

permissions:
  contents: write

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Cross-check independent numbered Arabic edition
        run: python3 scripts/crosscheck_hikam_secondary_pdf.py
      - name: Commit cross-check and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quran-safeguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/hikam/secondary_arabic_crosscheck.json
          git rm .github/workflows/crosscheck-hikam-secondary.yml
          git commit -m "Record independent Al-Hikam Arabic cross-check"
          git push origin HEAD:quran-safeguard-hikam-complete-corpus
