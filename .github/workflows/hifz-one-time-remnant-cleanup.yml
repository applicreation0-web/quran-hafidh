name: Hifz one-time remnant cleanup

on:
  push:
    branches:
      - work/hifz-0.7.3-spec-update
    paths:
      - .github/workflows/hifz-one-time-remnant-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.3-spec-update
          fetch-depth: 0

      - name: Remove obsolete consolidation state and refresh plan
        shell: python
        run: |
          from pathlib import Path

          prefs_path = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java')
          prefs = prefs_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          prefs = replace_once(
              prefs,
              '''\n    public static final class LineInterval {\n        public final int startLine;\n        public final int endLine;\n        LineInterval(int startLine, int endLine) {\n            this.startLine = Math.min(startLine, endLine);\n            this.endLine = Math.max(startLine, endLine);\n        }\n    }\n''',
              '\n',
              'LineInterval class')

          prefs = replace_once(
              prefs,
              '                .putString("stableRecentLines", "[]")\n',
              '',
              'fresh stableRecentLines state')

          prefs = replace_once(
              prefs,
              '            .putString("stableRecentLines", p.getString("stableRecentLines", "[]"))\n',
              '',
              'v1-v2 stableRecentLines carry-forward')

          prefs = replace_once(
              prefs,
              '''        if (schema != PreviewConfig.SCHEMA_VERSION) {\n            throw new IllegalStateException("Unsupported Hifz preview schema: " + schema);\n        }\n''',
              '''        if (schema != PreviewConfig.SCHEMA_VERSION) {\n            throw new IllegalStateException("Unsupported Hifz preview schema: " + schema);\n        }\n        if (p.contains("stableRecentLines")\n                && !p.edit().remove("stableRecentLines").commit()) {\n            throw new IllegalStateException("Unable to clean obsolete Hifz stable-line state");\n        }\n''',
              'schema-v4 stale-key cleanup')

          prefs = replace_once(
              prefs,
              '''            .putBoolean("recentSpeedCalibrated", p.getBoolean("recentSpeedCalibrated", false))\n            .putInt("recentSpeedSamples", Math.max(0, p.getInt("recentSpeedSamples", 0)))\n            .putInt("schema", 4);\n''',
              '''            .putBoolean("recentSpeedCalibrated", p.getBoolean("recentSpeedCalibrated", false))\n            .putInt("recentSpeedSamples", Math.max(0, p.getInt("recentSpeedSamples", 0)))\n            .remove("stableRecentLines")\n            .putInt("schema", 4);\n''',
              'v3-v4 atomic stale-key cleanup')

          legacy_methods = '''\n    /** Legacy quality machinery retained until the index-aware replacement is fully verified. */\n    public boolean markFirstRecentStable() {\n        List<RecentSabqi> queue = recentSabqi();\n        if (queue.isEmpty()) return false;\n        RecentSabqi item = queue.remove(0);\n        List<LineInterval> stable = stableRecentLines();\n        stable.add(new LineInterval(item.startLine, item.endLine));\n        stable = mergeIntervals(stable);\n        return p.edit()\n            .putString("recentSabqi", recentJson(queue))\n            .putString("stableRecentLines", intervalsJson(stable))\n            .commit();\n    }\n\n    /** Legacy head-only deferral retained until the index-aware replacement is fully verified. */\n    public boolean deferFirstRecentSabqi() {\n        List<RecentSabqi> queue = recentSabqi();\n        if (queue.isEmpty()) return false;\n        RecentSabqi item = queue.remove(0);\n        queue.add(item);\n        return p.edit().putString("recentSabqi", recentJson(queue)).commit();\n    }\n\n    public List<LineInterval> stableRecentLines() {\n        ArrayList<LineInterval> out = new ArrayList<>();\n        try {\n            JSONArray array = new JSONArray(p.getString("stableRecentLines", "[]"));\n            for (int i = 0; i < array.length(); i++) {\n                JSONObject o = array.getJSONObject(i);\n                out.add(new LineInterval(o.getInt("start"), o.getInt("end")));\n            }\n        } catch (Exception error) {\n            throw new IllegalStateException("Corrupt stable recent-line coverage", error);\n        }\n        return mergeIntervals(out);\n    }\n'''
          prefs = replace_once(prefs, legacy_methods, '\n', 'legacy recent-quality methods')

          start = prefs.find('    private static List<LineInterval> mergeIntervals(')
          if start < 0:
              raise SystemExit('mergeIntervals helper not found')
          end_marker = '    private static String rangesJson(List<VerseRange> ranges) {'
          end = prefs.find(end_marker, start)
          if end < 0:
              raise SystemExit('rangesJson marker not found after interval helpers')
          helper_block = prefs[start:end]
          if 'intervalsJson' not in helper_block:
              raise SystemExit('intervalsJson helper not found in expected helper block')
          prefs = prefs[:start] + prefs[end:]

          for forbidden in ('markFirstRecentStable', 'deferFirstRecentSabqi', 'stableRecentLines()', 'LineInterval'):
              if forbidden in prefs:
                  raise SystemExit(f'obsolete API still present: {forbidden}')
          if '.putString("stableRecentLines"' in prefs or 'p.getString("stableRecentLines"' in prefs:
              raise SystemExit('obsolete stableRecentLines read/write still present')
          if prefs.count('.remove("stableRecentLines")') != 2:
              raise SystemExit('expected schema-v4 migration + existing-v4 cleanup removals')
          prefs_path.write_text(prefs)

          plan_path = Path('docs/superpowers/plans/2026-09-13-hifz-0.7.3-spec-update.md')
          plan = plan_path.read_text()
          anchor = '**Spec:** `quran-hifz-specification-mise-a-jour (1).txt` supplied for this mission, plus the approved audit adjustments dated 2026-09-13.\n'
          if anchor not in plan:
              raise SystemExit('plan spec anchor not found')
          override = ('\n> **2026-09-13 final protocol override:** Reconstruction Ancrage is **35 repetitions = 20 visible + 5 at 50% + 5 at 75% + 5 at 100%**, with **no 25% stage**. This supersedes the earlier 25- and 30-pass reconstruction variants in source notes and prior iterations.\n')
          if 'final protocol override' not in plan:
              plan = plan.replace(anchor, anchor + override, 1)
          plan = plan.replace('25-pass reconstruction protocol and 40-pass new-page protocol', '35-pass reconstruction protocol (20 visible + 5 at 50% + 5 at 75% + 5 at 100%, no 25% stage) and 40-pass new-page protocol')
          plan = plan.replace('Remove replaced dead machinery only after migration and behavior tests pass.', 'Remove replaced dead machinery (`markFirstRecentStable`, `deferFirstRecentSabqi`, `stableRecentLines`, interval serialization) and purge the obsolete `stableRecentLines` preference during schema-v4 migration/load after behavior tests pass.')
          if '25-pass reconstruction protocol' in plan:
              raise SystemExit('stale 25-pass reconstruction wording remains in implementation plan')
          plan_path.write_text(plan)

          test_path = Path('hifz-app/src/test/java/com/quransafeguard/hifz/preview/Lot2SourceContractTest.java')
          test = test_path.read_text()
          insertion = '''\n    @Test public void obsoleteRecentQualityMachineryIsRemoved() throws Exception {\n        String prefs = read("hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java");\n        assertFalse(prefs.contains("markFirstRecentStable"));\n        assertFalse(prefs.contains("deferFirstRecentSabqi"));\n        assertFalse(prefs.contains("stableRecentLines()"));\n        assertFalse(prefs.contains("LineInterval"));\n        assertFalse(prefs.contains(".putString(\\\"stableRecentLines\\\""));\n        assertFalse(prefs.contains("p.getString(\\\"stableRecentLines\\\""));\n        assertTrue(prefs.contains(".remove(\\\"stableRecentLines\\\")"));\n    }\n'''
          if 'obsoleteRecentQualityMachineryIsRemoved' not in test:
              pos = test.rfind('\n}')
              if pos < 0:
                  raise SystemExit('Lot2SourceContractTest closing brace not found')
              test = test[:pos] + insertion + test[pos:]
          test_path.write_text(test)

          # Final safety checks: the new reconstruction rule must remain untouched.
          config = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/PreviewConfig.java').read_text()
          required = [
              'ITQAN_LIGHT_VISIBLE_REPS = 20',
              'ITQAN_LIGHT_25_REPS = 0',
              'ITQAN_LIGHT_50_REPS = 5',
              'ITQAN_LIGHT_75_REPS = 5',
              'ITQAN_LIGHT_100_REPS = 5',
              'ITQAN_LIGHT_TOTAL_REPS = 35',
          ]
          missing = [item for item in required if item not in config]
          if missing:
              raise SystemExit(f'35-rep protocol changed unexpectedly: {missing}')

      - name: Remove one-time workflow and commit cleanup
        shell: bash
        run: |
          rm .github/workflows/hifz-one-time-remnant-cleanup.yml
          git config user.name "applicreation0-web"
          git config user.email "applicreation0@gmail.com"
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java \
                  hifz-app/src/test/java/com/quransafeguard/hifz/preview/Lot2SourceContractTest.java \
                  docs/superpowers/plans/2026-09-13-hifz-0.7.3-spec-update.md \
                  .github/workflows/hifz-one-time-remnant-cleanup.yml
          git diff --cached --check
          git commit -m "chore(hifz): remove obsolete consolidation remnants"
          git push origin HEAD:work/hifz-0.7.3-spec-update
