name: Haafidh 1.17.9 isolated P0-P2 validation (NO APK, NO RELEASE)
on:
  push:
    branches: [fix/haafidh-1179-preserved-test-fixture-20261031]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-1179-isolated-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalogue-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Refuse release input and verify frozen official-base engines
        run: |
          test -z "${HIFZ_PRIVATE_RELEASE_UPGRADE:-}"
          test -z "${HIFZ_KEYSTORE_PATH:-}"
          python scripts/verify_1179_invariants.py
      - name: Authentic 604 QCF pages, full admitted catalogue and both offline Tafsirs
        run: |
          python -m pip install brotli
          bash scripts/fetch_mushaf_pages.sh
          python scripts/materialize_mutash_catalogue.py --check
          python scripts/verify_mutash_catalogue.py
      - name: JVM behavioral, source, long horizon and restoration contracts
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          gradle --no-daemon --continue :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-1179-finalisation-JVM-NO-APK
          path: |
            hifz-core/build/test-results/
            hifz-app/build/test-results/
            hifz-app/build/reports/tests/
          retention-days: 14
  android:
    needs: catalogue-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox
            size: 1404x1872
            density: 226
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full catalogue rendering, actual masks, restoration, force-stop and captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_1179_finalisation_android_audit.sh ${{ matrix.surface }} ${{ matrix.size }} ${{ matrix.density }} quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-1179-finalisation-${{ matrix.surface }}-NO-APK
          path: |
            hifz-app/build/atlas-comparison-audit/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14

  catalogue-android:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        surface: [phone, boox]
        shard: [0, 1, 2, 3]
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox
            size: 1404x1872
            density: 226
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full catalogue rendering, actual masks, restoration, force-stop and captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_1179_finalisation_android_audit.sh ${{ matrix.surface }} ${{ matrix.size }} ${{ matrix.density }} catalogue ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-1179-catalogue-${{ matrix.surface }}-${{ matrix.shard }}-NO-APK
          path: |
            hifz-app/build/atlas-comparison-audit/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14

  preserved-regression:
    needs: catalogue-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preserved schema, finals, migration and recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_1179_preserved_android_audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-1179-isolated-preserved-NO-APK
          path: |
            hifz-app/build/boox-audit/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14
