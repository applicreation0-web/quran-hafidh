name: Haafidh 1.17.9 final endurance (NO APK NO RELEASE)
on:
  push:
    branches: [audit/haafidh-1179-tafsir-polygon-20261031]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haafidh-1179-endurance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        surface: [phone, boox]
        phase: [tafsir]
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox
            size: 1404x1872
            density: 226
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin tested production code to the certified head
        run: |
          git diff --exit-code d08a97cbe307219628125431af701e6cbc40e795 -- hifz-core/src hifz-app/src/main hifz-app/src/private114 hifz-app/build.gradle.kts
          test -z "${HIFZ_PRIVATE_RELEASE_UPGRADE:-}"
          test -z "${HIFZ_KEYSTORE_PATH:-}"
          python3 scripts/verify_1179_invariants.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Endurance with real QCF and strict progress snapshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_1179_endurance_audit.sh ${{ matrix.surface }} ${{ matrix.size }} ${{ matrix.density }} ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endurance-${{ matrix.surface }}-${{ matrix.phase }}-NO-APK
          path: |
            hifz-app/build/endurance-*/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14
