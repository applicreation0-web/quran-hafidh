name: Research Tafsir source glyphs and notes

on:
  push:
    branches:
      - "research/0.10.5-tafsir-glyphs"
  workflow_dispatch:

jobs:
  source-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Fetch pinned Tafsir sources
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/tafsir-src"
          mkdir -p "$src"
          curl --fail --location --retry 3 -o "$src/lataif.pdf" "https://www.altafsir.com/Books/lataif.pdf"
          base="https://archive.org/download/tafsir-al-qurtubi-4.-Volumes/Tafseer%20Al-Qurtubi"
          for n in 1 2 3 4; do
            curl --fail --location --retry 3 -o "$src/qurtubi-v${n}.pdf" "${base}/Tafsir%20al-Qurtubi%20Vol.%20${n}.pdf"
          done
      - name: Inventory Qurtubi source glyph spans
        run: |
          python scripts/research_qurtubi_special_glyphs.py \
            --source-dir "${RUNNER_TEMP}/tafsir-src" \
            --report "${RUNNER_TEMP}/qurtubi-special-glyphs.json"
      - name: Inventory Qushayri PUA/source glyphs
        run: |
          python scripts/research_qushayri_special_glyphs.py \
            "${RUNNER_TEMP}/tafsir-src/lataif.pdf" \
            --report "${RUNNER_TEMP}/qushayri-special-glyphs.json"
      - name: Diagnose residual Qushayri note keys
        run: |
          python scripts/research_qushayri_unmatched_notes.py \
            "${RUNNER_TEMP}/tafsir-src/lataif.pdf" \
            --report "${RUNNER_TEMP}/qushayri-unmatched-notes.json"
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: tafsir-source-diagnostics
          path: |
            ${{ runner.temp }}/qurtubi-special-glyphs.json
            ${{ runner.temp }}/qushayri-special-glyphs.json
            ${{ runner.temp }}/qushayri-unmatched-notes.json
          retention-days: 7
