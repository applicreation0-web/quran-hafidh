name: Quran Hifz 0.7.5 convergence guard fix

on:
  push:
    branches:
      - work/hifz-0.7.5-retention-j10
    paths:
      - .github/workflows/hifz-075-convergence-guard-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.5-retention-j10
      - name: Replace obsolete reinforcement guard
        shell: python
        run: |
          from pathlib import Path
          p = Path('hifz-app/build.gradle.kts')
          s = p.read_text()
          old = '        check(session.contains("À renforcer"))\n'
          new = '''        check(!session.contains("À renforcer")) {\n            "The canonical schema6 flow must not expose the obsolete reinforcement action."\n        }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'guard mismatch: {s.count(old)} matches')
          p.write_text(s.replace(old, new, 1))
      - name: Commit guard correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hifz-app/build.gradle.kts
          git commit -m 'test: align convergence guard with schema6 flow'
          git push origin HEAD:work/hifz-0.7.5-retention-j10
