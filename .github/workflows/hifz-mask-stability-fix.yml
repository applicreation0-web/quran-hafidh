name: Quran Hifz one-shot mask stability fix

on:
  push:
    branches:
      - release/hifz-0.7.3-final

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/hifz-0.7.3-final
          fetch-depth: 0
      - name: Apply minimal session-stable random mask fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); t=p.read_text(); n=t.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old[:80]!r}')
              p.write_text(t.replace(old,new,1))

          r='hifz-app/src/main/assets/hifzreader/reader.js'
          one(r,
              "let mask=Number(boot.mask||0);\nlet eink=!!boot.eink;",
              "let mask=Number(boot.mask||0);\nconst maskEntropy=String(boot.maskEntropy||'hifz-test');\nlet eink=!!boot.eink;")
          one(r,
          '''function randomUnit(){\n  try{\n    const c=(typeof globalThis!=='undefined'&&globalThis.crypto)||null;\n    if(c&&typeof c.getRandomValues==='function'){\n      const a=new Uint32Array(1);c.getRandomValues(a);return a[0]/4294967296;\n    }\n  }catch(_e){}\n  return Math.random();\n}\n\n''',
          '''function hashSeed(value){\n  let h=2166136261>>>0;\n  const s=String(value);\n  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}\n  return h||0x9e3779b9;\n}\n\nfunction seededRandom(seed){\n  let x=hashSeed(seed);\n  return ()=>{\n    x^=(x<<13);x>>>=0;\n    x^=(x>>>17);x>>>=0;\n    x^=(x<<5);x>>>=0;\n    return x/4294967296;\n  };\n}\n\n''')
          one(r,
              "  const draw=typeof rng==='function'?rng:randomUnit;",
              "  const draw=typeof rng==='function'?rng:Math.random;")
          one(r,
              "    maskOrder=randomOrderKeys(cells);",
              "    maskOrder=randomOrderKeys(cells,seededRandom(maskEntropy+'|'+signature));")
          one(r,
              "module.exports={randomOrderKeys,randomSegmentsForCells};",
              "module.exports={randomOrderKeys,randomSegmentsForCells,seededRandom};")

          m='hifz-app/src/main/java/com/quransafeguard/hifz/preview/MushafView.java'
          one(m,
              "    private final HifzPrefs prefs;\n    private final EinkController eink = new EinkController();",
              "    private final HifzPrefs prefs;\n    private final EinkController eink = new EinkController();\n    private final String maskEntropy = java.util.UUID.randomUUID().toString();")
          one(m,
              '''                .put("mask", Math.max(0, Math.min(100, maskPercent)))\n                .put("eink", eink.isEink(prefs))''',
              '''                .put("mask", Math.max(0, Math.min(100, maskPercent)))\n                .put("maskEntropy", maskEntropy)\n                .put("eink", eink.isEink(prefs))''')

          v='scripts/verify_hifz_mask_hotfix.py'
          p=Path(v); t=p.read_text()
          needle="assert 'function randomOrderKeys' in reader, 'missing non-deterministic cell ordering'\n"
          if t.count(needle)!=1: raise SystemExit('verify seed insertion point missing')
          t=t.replace(needle, needle+"assert 'function seededRandom' in reader and 'maskEntropy' in reader, 'random draw must survive WebView page reloads within one session'\n",1)
          p.write_text(t)

          g='hifz-app/build.gradle.kts'
          one(g,
              '''                && reader.contains("markerLayer(svg,polys)") && !reader.contains("line.words")\n                && !reader.contains("function hiddenBandForLine")) {''',
              '''                && reader.contains("markerLayer(svg,polys)") && reader.contains("seededRandom")\n                && reader.contains("maskEntropy") && !reader.contains("line.words")\n                && !reader.contains("function hiddenBandForLine")) {''')

          o='hifz-app/src/test/java/com/quransafeguard/hifz/preview/OfficialReleaseContractTest.java'
          p=Path(o); t=p.read_text()
          needle='        assertTrue("mask must randomize existing source-ink cells", reader.contains("randomOrderKeys") && reader.contains("randomSegmentsForCells"));\n'
          if t.count(needle)!=1: raise SystemExit('official contract seed insertion point missing')
          t=t.replace(needle, needle+'        assertTrue("random mask draw must survive WebView page reloads", reader.contains("seededRandom") && reader.contains("maskEntropy"));\n',1)
          p.write_text(t)
          PY

          node scripts/test_hifz_mask_segments.js
          python3 scripts/verify_hifz_mask_hotfix.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hifz-app/src/main/assets/hifzreader/reader.js \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/MushafView.java \
                  scripts/verify_hifz_mask_hotfix.py \
                  hifz-app/build.gradle.kts \
                  hifz-app/src/test/java/com/quransafeguard/hifz/preview/OfficialReleaseContractTest.java
          git commit -m 'fix(hifz): keep random mask draw stable across page reloads'
          git push origin HEAD:release/hifz-0.7.3-final
