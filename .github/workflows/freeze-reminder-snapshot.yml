name: Freeze verified reminder snapshot

on:
  push:
    branches:
      - quran-safeguard-v0.8-experiment
    paths:
      - ".github/workflows/freeze-reminder-snapshot.yml"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate verified HadeethEnc snapshot
        run: python3 scripts/generate_verified_reminders.py

      - name: Commit frozen snapshot and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/reminders/hadeethenc_snapshot.json
          python3 - <<'PY'
          import json
          path = "app/src/main/assets/reminders/hadeethenc_snapshot.json"
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)
          assert len(data) == 127, len(data)
          assert all(
              ("Sahih al-Bukhari" in item["book"] or "Sahih Muslim" in item["book"])
              for item in data
          )
          assert all(item.get("authenticity") for item in data)
          print("verified snapshot entries:", len(data))
          PY
          git config user.name "quran-safeguard-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/reminders/hadeethenc_snapshot.json
          git rm .github/workflows/freeze-reminder-snapshot.yml
          git commit -m "Freeze verified HadeethEnc reminder snapshot"
          git push origin HEAD:quran-safeguard-v0.8-experiment
