name: Quran Hifz autonomous final patch

on:
  push:
    branches:
      - work/hifz-0.7.3-claude-all-fixes
    paths:
      - .github/workflows/hifz-finalize-autopatch.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hifz-0.7.3-claude-all-fixes
          fetch-depth: 0

      - name: Apply validated final patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {count}')
              p.write_text(text.replace(old, new, 1))

          study = Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/StudyReaderActivity.java')
          text = study.read_text()
          for old, new in [
              ('topControls.setVisibility(View.INVISIBLE);', 'topControls.setVisibility(View.GONE);'),
              ('readerActions.setVisibility(View.INVISIBLE);', 'readerActions.setVisibility(View.GONE);'),
              ('pageRail.setVisibility(View.INVISIBLE);', 'pageRail.setVisibility(View.GONE);'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'{study}: expected one {old!r}')
              text = text.replace(old, new, 1)
          study.write_text(text)

          replace_once(
              'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java',
              'program.setMaxLines(1);',
              'program.setMaxLines(2);')

          j10 = Path('hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/J10ReviewPlannerInstrumentedTest.java')
          text = j10.read_text()
          count = text.count('LocalDate.of(2026, 9, 13)')
          if count < 4:
              raise SystemExit(f'{j10}: expected at least four fixed-date test fixtures, got {count}')
          j10.write_text(text.replace('LocalDate.of(2026, 9, 13)', 'LocalDate.now()'))

          workflow = Path('.github/workflows/hifz-test-app.yml')
          text = workflow.read_text()
          needle = '          gradle --no-daemon :hifz-app:connectedDebugAndroidTest --stacktrace\n'
          if text.count(needle) != 1:
              raise SystemExit('official workflow: connectedDebugAndroidTest insertion point not unique')
          gate = needle + '''\n          # Real process-death proof: prepare persisted Hifz state, kill the target process,\n          # relaunch a fresh process, then verify the exact structured state in a new instrumentation run.\n          probe='com.quransafeguard.hifz.preview.ProcessDeathPersistenceInstrumentedTest#processDeathProbePhase'\n          runner='com.quransafeguard.hifz.test/androidx.test.runner.AndroidJUnitRunner'\n          adb shell am instrument -w -r -e class "$probe" -e hifz_process_phase prepare "$runner" | tee process-death-prepare.txt\n          grep -q 'OK (1 test)' process-death-prepare.txt\n\n          adb shell am start -W -n com.quransafeguard.hifz/com.quransafeguard.hifz.preview.MainActivity > process-death-before-start.txt\n          before_pid="$(adb shell pidof com.quransafeguard.hifz | tr -d '\\r')"\n          test -n "$before_pid"\n          adb shell am force-stop com.quransafeguard.hifz\n          sleep 1\n          stopped_pid="$(adb shell pidof com.quransafeguard.hifz 2>/dev/null | tr -d '\\r' || true)"\n          test -z "$stopped_pid"\n\n          adb shell am start -W -n com.quransafeguard.hifz/com.quransafeguard.hifz.preview.MainActivity > process-death-relaunch.txt\n          after_pid=''\n          for i in $(seq 1 20); do\n            after_pid="$(adb shell pidof com.quransafeguard.hifz 2>/dev/null | tr -d '\\r' || true)"\n            [ -n "$after_pid" ] && break\n            sleep 1\n          done\n          test -n "$after_pid"\n          test "$after_pid" != "$before_pid"\n\n          adb shell am instrument -w -r -e class "$probe" -e hifz_process_phase verify "$runner" | tee process-death-verify.txt\n          grep -q 'OK (1 test)' process-death-verify.txt\n          printf 'FORCE_STOP_OK\\nBEFORE_PID=%s\\nAFTER_PID=%s\\nRELAUNCH_OK\\nSTATE_RESTORE_OK\\n' "$before_pid" "$after_pid" | tee process-death-proof.txt\n'''
          text = text.replace(needle, gate, 1)
          upload_needle = '            emulator.log\n'
          if text.count(upload_needle) != 1:
              raise SystemExit('official workflow: artifact insertion point not unique')
          text = text.replace(upload_needle, upload_needle + '            process-death-prepare.txt\n            process-death-before-start.txt\n            process-death-relaunch.txt\n            process-death-verify.txt\n            process-death-proof.txt\n', 1)
          workflow.write_text(text)
          PY

          cat > hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/ProcessDeathPersistenceInstrumentedTest.java <<'EOF'
          package com.quransafeguard.hifz.preview;

          import android.content.Context;
          import android.os.Bundle;

          import androidx.test.core.app.ApplicationProvider;
          import androidx.test.platform.app.InstrumentationRegistry;

          import com.quransafeguard.hifz.core.VerseRef;

          import org.junit.Assume;
          import org.junit.Test;

          import java.time.LocalDate;
          import java.util.List;

          import static org.junit.Assert.assertEquals;
          import static org.junit.Assert.assertNotNull;
          import static org.junit.Assert.assertTrue;
          import static org.junit.Assert.fail;

          /**
           * Two-phase probe driven by CI around a real `adb shell am force-stop` boundary.
           * The bulk instrumentation suite skips it unless the explicit phase argument is supplied.
           */
          public final class ProcessDeathPersistenceInstrumentedTest {
              private static final String EXPECTED = "hifz_process_death_expected";

              @Test public void processDeathProbePhase() {
                  Bundle args = InstrumentationRegistry.getArguments();
                  String phase = args.getString("hifz_process_phase", "");
                  Assume.assumeTrue("Explicit process-death phase required", !phase.isEmpty());
                  if ("prepare".equals(phase)) {
                      prepare();
                  } else if ("verify".equals(phase)) {
                      verify();
                  } else {
                      fail("Unknown process-death phase: " + phase);
                  }
              }

              private void prepare() {
                  Context context = ApplicationProvider.getApplicationContext();
                  assertTrue(context.getSharedPreferences("quran_hifz_preview_v1", Context.MODE_PRIVATE)
                      .edit().clear().commit());
                  assertTrue(context.getSharedPreferences(EXPECTED, Context.MODE_PRIVATE)
                      .edit().clear().commit());

                  HifzPrefs prefs = new HifzPrefs(context);
                  GeometryRepository geometry = GeometryRepository.get(context);
                  prefs.reconcileAnchoringQueue(geometry);
                  List<AnchoringQueue.Entry> queue = prefs.anchoringQueue();
                  assertTrue("Anchoring queue must exist for process-death proof", !queue.isEmpty());
                  int index = prefs.anchoringQueueIndex(queue.size());
                  AnchoringQueue.Entry entry = queue.get(index);
                  VerseRef start = GeometryRepository.parseVerse(entry.start);
                  VerseRef end = GeometryRepository.parseVerse(entry.end);

                  assertTrue(prefs.advanceItqanBlock(1, start, end, LocalDate.now().toString(),
                      "process-death-probe"));
                  assertTrue(prefs.setItqanProgress(17, 2, 1, start, end));

                  assertTrue(context.getSharedPreferences(EXPECTED, Context.MODE_PRIVATE).edit()
                      .putInt("queueIndex", index)
                      .putString("start", entry.start)
                      .putString("end", entry.end)
                      .putString("protocol", entry.protocol.name())
                      .putInt("rep", 17)
                      .putInt("block", 1)
                      .putInt("assisted", 2)
                      .putInt("finalReveals", 1)
                      .commit());

                  assertEquals(17, prefs.itqanRep());
                  assertEquals(1, prefs.itqanBlockIndex());
                  assertEquals(start, prefs.itqanUnitStart());
                  assertEquals(end, prefs.itqanUnitEnd());
              }

              private void verify() {
                  Context context = ApplicationProvider.getApplicationContext();
                  android.content.SharedPreferences expected =
                      context.getSharedPreferences(EXPECTED, Context.MODE_PRIVATE);
                  String expectedStart = expected.getString("start", "");
                  String expectedEnd = expected.getString("end", "");
                  String expectedProtocol = expected.getString("protocol", "");
                  assertTrue("Prepare phase evidence missing", !expectedStart.isEmpty() && !expectedEnd.isEmpty());

                  HifzPrefs prefs = new HifzPrefs(context);
                  List<AnchoringQueue.Entry> queue = prefs.anchoringQueue();
                  assertTrue("Anchoring queue lost across process death", !queue.isEmpty());
                  int expectedIndex = expected.getInt("queueIndex", -1);
                  assertEquals(expectedIndex, prefs.anchoringQueueIndex(queue.size()));

                  AnchoringQueue.Entry inProgress = prefs.inProgressAnchoringEntry();
                  assertNotNull("In-progress anchoring identity lost across process death", inProgress);
                  assertEquals(expectedStart, inProgress.start);
                  assertEquals(expectedEnd, inProgress.end);
                  assertEquals(expectedProtocol, inProgress.protocol.name());
                  assertEquals(expected.getInt("rep", -1), prefs.itqanRep());
                  assertEquals(expected.getInt("block", -1), prefs.itqanBlockIndex());
                  assertEquals(expected.getInt("assisted", -1), prefs.itqanAssisted());
                  assertEquals(expected.getInt("finalReveals", -1), prefs.itqanFinalReveals());
                  assertEquals(GeometryRepository.parseVerse(expectedStart), prefs.itqanUnitStart());
                  assertEquals(GeometryRepository.parseVerse(expectedEnd), prefs.itqanUnitEnd());
              }
          }
          EOF

          git rm .github/workflows/hifz-finalize-autopatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/hifz-test-app.yml \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/StudyReaderActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java \
                  hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/J10ReviewPlannerInstrumentedTest.java \
                  hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/ProcessDeathPersistenceInstrumentedTest.java
          git diff --cached --check
          git commit -m 'fix: close final UI and process-death gates'
          git push origin HEAD:work/hifz-0.7.3-claude-all-fixes

      - name: Dispatch official final candidate CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hifz-test-app.yml --ref work/hifz-0.7.3-claude-all-fixes
