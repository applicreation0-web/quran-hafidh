name: Haafidh 1.17.9 all 279 approved pairs — isolated Android shards (NO RELEASE)
on:
  push:
    branches: [audit/haafidh-1179-catalogue-279-android-20261031]
permissions:
  contents: read
jobs:
  qcf-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - { surface: phone, size: 1080x1920, density: 420, shard: 0 }
          - { surface: phone, size: 1080x1920, density: 420, shard: 1 }
          - { surface: phone, size: 1080x1920, density: 420, shard: 2 }
          - { surface: phone, size: 1080x1920, density: 420, shard: 3 }
          - { surface: boox, size: 1404x1872, density: 226, shard: 0 }
          - { surface: boox, size: 1404x1872, density: 226, shard: 1 }
          - { surface: boox, size: 1404x1872, density: 226, shard: 2 }
          - { surface: boox, size: 1404x1872, density: 226, shard: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Pin SDK, authentic 604 QCF pages, and emulator KVM
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Complete independent catalog shard, never publish or sign an APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run_1179_finalisation_android_audit.sh ${{ matrix.surface }} ${{ matrix.size }} ${{ matrix.density }} catalogue ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-1179-catalogue-${{ matrix.surface }}-${{ matrix.shard }}-NO-APK
          path: |
            hifz-app/build/atlas-comparison-audit/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14
