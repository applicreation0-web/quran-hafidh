name: Quran Haafidh 1.17.17 ONE-SHOT v2 metadata signer — no APK or assets
on:
  push:
    branches:
      - release-stage/haafidh-11717-v2-digest-20261114
    paths:
      - signing-input/signed_data_11717.b64
permissions:
  contents: read

jobs:
  sign-v2-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restrict signing to the independently qualified 1.17.17 digest
        run: |
          set -euo pipefail
          test "$(base64 -d signing-input/signed_data_11717.b64 | sha256sum | cut -d' ' -f1)" = "b334a1b322a347ab069ab5fcef666d91a21017826ea4430e2021163c53b421cd"
          test "$(base64 -d signing-input/signed_data_11717.b64 | wc -c)" -eq 1449
          test ! -d hifz-app/src/private114/assets/atlas_private
      - name: Restore official historical signer only in ephemeral runner
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HIFZ_KEYSTORE_BASE64"
          printf '%s' "$HIFZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/official.jks"
          chmod 600 "$RUNNER_TEMP/official.jks"
      - name: Sign only fixed Android-v2 metadata (no APK, corpus or user data)
        env:
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/OneShotSign.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.Base64;
          public final class OneShotSign {
            static String sha(byte[] b)throws Exception{
              byte[] v=MessageDigest.getInstance("SHA-256").digest(b);
              StringBuilder s=new StringBuilder();
              for(byte x:v)s.append(String.format("%02x", x&255));
              return s.toString();
            }
            public static void main(String[] args)throws Exception {
              byte[] data=Base64.getMimeDecoder().decode(Files.readString(Path.of(args[0])).trim());
              if(data.length!=1449||!sha(data).equals("b334a1b322a347ab069ab5fcef666d91a21017826ea4430e2021163c53b421cd"))
                throw new SecurityException("Unexpected signedData; refuse historical signing");
              KeyStore ks=KeyStore.getInstance(Path.of(args[1]).toFile(),
                System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
              String alias=System.getenv("HIFZ_KEY_ALIAS");
              Certificate c=ks.getCertificate(alias);
              if(c==null||!sha(c.getEncoded()).equals("66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14"))
                throw new SecurityException("Historical signature certificate mismatch");
              PrivateKey key=(PrivateKey)ks.getKey(alias,System.getenv("HIFZ_KEY_PASSWORD").toCharArray());
              Signature s=Signature.getInstance("SHA256withRSA");
              s.initSign(key);s.update(data);byte[] sig=s.sign();
              Signature check=Signature.getInstance("SHA256withRSA");
              check.initVerify(c);check.update(data);
              if(sig.length!=512||!check.verify(sig))throw new SecurityException("RSA signature verification failed");
              Files.writeString(Path.of(args[2]),Base64.getEncoder().encodeToString(sig)+"\n");
              System.out.println("PASS historical certificate, exactly 1449 bytes signedData, RSA-4096 signature, zero private APK/assets");
              System.out.println("signature_sha256="+sha(sig));
            }
          }
          JAVA
          javac "$RUNNER_TEMP/OneShotSign.java"
          java -cp "$RUNNER_TEMP" OneShotSign signing-input/signed_data_11717.b64 "$RUNNER_TEMP/official.jks" "$RUNNER_TEMP/offline_signature_11717.b64"
          install -m 0644 "$RUNNER_TEMP/offline_signature_11717.b64" offline_signature_11717.b64
          shred -fu "$RUNNER_TEMP/official.jks" || rm -f "$RUNNER_TEMP/official.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: haafidh-11717-historical-v2-signature-only
          path: offline_signature_11717.b64
          retention-days: 1
          if-no-files-found: error
