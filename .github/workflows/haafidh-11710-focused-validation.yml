name: Haafidh 1.17.10 focused screens recovery reboot NO APK
on:
  push:
    branches: [audit/haafidh-11710-independent-20261102]
    paths:
      - 'hifz-app/src/androidTest/java/com/quransafeguard/hifz/preview/Independent11710*'
      - 'scripts/run_11710_independent_surfaces.sh'
      - '.github/workflows/haafidh-11710-focused-validation.yml'
permissions:
  contents: read
concurrency:
  group: haafidh-11710-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-screens-recovery-reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: phone
            size: 1080x1920
            density: 420
          - surface: boox
            size: 1404x1872
            density: 226
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install pinned build inputs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: Emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual masks, recovery, general screens and Android reboot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            bash scripts/run_11710_independent_surfaces.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haafidh-11710-focused-${{ matrix.surface }}-NO-APK
          path: |
            hifz-app/build/independent-surfaces/
            hifz-app/build/independent-quick-results/
            hifz-app/build/atlas-comparison-audit/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/androidTests/
          retention-days: 14

