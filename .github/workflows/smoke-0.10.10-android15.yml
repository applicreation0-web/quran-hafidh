name: 0.10.10 Android 15 minimal smoke

on:
  push:
    branches:
      - "smoke/0.10.10-android15-boot"

permissions:
  contents: read
  actions: read

env:
  BASELINE_RUN_ID: "34096699893"
  BASELINE_ARTIFACT: "quran-safeguard-0.10.8-unsigned"
  APP_SOURCE_SHA: "24640a22a828409bb98fcab76dc49eadf967339b"

concurrency:
  group: quran-safeguard-01010-smoke-android15
  cancel-in-progress: true

jobs:
  android15-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact application candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_SOURCE_SHA }}
          fetch-depth: 1

      - name: Prove source provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SOURCE_SHA"
          git show -s --format='%H %s' HEAD

      - name: Restore only the audited 0.10.8 Mushaf required to build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASELINE_RUN_ID }}
          path: baseline-apks

      - name: Extract only Light Mushaf assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          apks=list(Path('baseline-apks').rglob('*.apk'))
          light=[p for p in apks if 'plus' not in p.name.lower()]
          if len(light) != 1:
              raise SystemExit(f'Expected exactly one Light baseline APK, got: {apks}')
          count=0
          with zipfile.ZipFile(light[0]) as z:
              for info in z.infolist():
                  name=info.filename
                  if info.is_dir() or not name.startswith('assets/mushaf/'):
                      continue
                  dest=Path('app/src/main')/name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, dest.open('wb') as out:
                      shutil.copyfileobj(src,out)
                  count += 1
          print(f'Extracted Mushaf files: {count}')
          if count < 604:
              raise SystemExit(f'Incomplete Mushaf extraction: {count}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK only
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build Light debug APK only
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleLightDebug --stacktrace
          test -s app/build/outputs/apk/light/debug/app-light-debug.apk

      - name: Prepare Android 15 diagnostic script
        run: |
          cat > android15-smoke-runtime.sh <<'SH'
          #!/usr/bin/env bash
          set -u
          PACKAGE=com.applicreation0.quransafeguard
          COMPONENT=com.applicreation0.quransafeguard/.DashboardActivity
          adb wait-for-device
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" || exit 10
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "35" || exit 11
          adb install -r app/build/outputs/apk/light/debug/app-light-debug.apk || exit 12
          adb shell pm path "$PACKAGE" | tee android15-smoke-package.txt
          adb shell cmd package resolve-activity --brief -c android.intent.category.LAUNCHER "$PACKAGE" | tee android15-smoke-resolve.txt || true
          adb shell am force-stop "$PACKAGE" || true
          adb logcat -c || true
          set +e
          adb shell am start -W -n "$COMPONENT" > android15-smoke-start.txt 2>&1
          START_RC=$?
          set -e
          cat android15-smoke-start.txt
          sleep 8
          adb shell pidof "$PACKAGE" > android15-smoke-pid.txt 2>&1 || true
          adb shell dumpsys activity activities > android15-smoke-activity.txt 2>&1 || true
          adb shell dumpsys package "$PACKAGE" > android15-smoke-dumpsys-package.txt 2>&1 || true
          adb logcat -d -v threadtime -t 1500 > android15-smoke-logcat.txt 2>&1 || true
          echo "PID=$(cat android15-smoke-pid.txt 2>/dev/null || true)"
          grep -E 'mResumedActivity|topResumedActivity|com\.applicreation0\.quransafeguard' android15-smoke-activity.txt | tail -n 40 || true
          grep -E 'FATAL EXCEPTION|Process: com\.applicreation0\.quransafeguard|ANR in com\.applicreation0\.quransafeguard|AndroidRuntime|ActivityTaskManager' android15-smoke-logcat.txt | tail -n 120 || true
          if [ "$START_RC" -ne 0 ]; then
            echo "Android 15 explicit launcher start failed rc=$START_RC" >&2
            exit 20
          fi
          if grep -Eq 'FATAL EXCEPTION|ANR in com\.applicreation0\.quransafeguard' android15-smoke-logcat.txt; then
            echo 'Android 15 app crash/ANR evidence detected' >&2
            exit 21
          fi
          if [ ! -s android15-smoke-pid.txt ]; then
            echo 'Android 15 app process is not alive after successful explicit launch' >&2
            exit 22
          fi
          if ! grep -Eq 'com\.applicreation0\.quransafeguard/.DashboardActivity|com\.applicreation0\.quransafeguard/com\.applicreation0\.quransafeguard\.DashboardActivity' android15-smoke-activity.txt; then
            echo 'DashboardActivity not present in activity state after launch' >&2
            exit 23
          fi
          echo 'ANDROID15_SMOKE_PASS'
          SH
          chmod +x android15-smoke-runtime.sh

      - name: Reclaim runner space before Android 15 AVD
        run: |
          set -euo pipefail
          rm -rf baseline-apks ~/.gradle/caches ~/.android/avd
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: Boot Android 15, install and diagnose Light launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android15-smoke-runtime.sh

      - name: Upload Android 15 launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-smoke-diagnostics-${{ env.APP_SOURCE_SHA }}
          path: |
            android15-smoke-*.txt
            app/build/outputs/apk/light/debug/app-light-debug.apk
          if-no-files-found: warn
          retention-days: 14
