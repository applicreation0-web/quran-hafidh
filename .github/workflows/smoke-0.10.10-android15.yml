name: 0.10.10 Android 15 minimal smoke

on:
  push:
    branches:
      - "smoke/0.10.10-android15-boot"

permissions:
  contents: read

concurrency:
  group: quran-safeguard-01010-smoke-android15
  cancel-in-progress: true

jobs:
  android15-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact smoke candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Record source provenance
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git show -s --format='%H %s' HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK only
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build Light debug APK only
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleLightDebug --stacktrace
          test -s app/build/outputs/apk/light/debug/app-light-debug.apk

      - name: Reclaim runner space before Android 15 AVD
        run: |
          set -euo pipefail
          rm -rf ~/.gradle/caches ~/.android/avd
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: Boot Android 15, install and launch Light
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb install -r app/build/outputs/apk/light/debug/app-light-debug.apk
            adb shell pm path com.applicreation0.quransafeguard
            adb shell am force-stop com.applicreation0.quransafeguard
            adb shell monkey -p com.applicreation0.quransafeguard -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof com.applicreation0.quransafeguard
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com\.applicreation0\.quransafeguard'
            if adb logcat -d -t 400 | grep -E 'FATAL EXCEPTION.*com\.applicreation0\.quransafeguard|Process: com\.applicreation0\.quransafeguard.*FATAL EXCEPTION'; then
              echo 'Fatal exception detected after launch' >&2
              exit 1
            fi
            echo 'ANDROID15_SMOKE_PASS'
