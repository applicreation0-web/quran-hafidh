name: Export Android signing tools

on:
  push:
    branches:
      - "release/0.10.8-reader"

jobs:
  export-signing-tools:
    if: github.event.head_commit.message == 'Export Android signing tools for local release'
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0"

      - name: Stage signing tools
        shell: bash
        run: |
          set -euo pipefail
          src="${ANDROID_HOME}/build-tools/36.0.0"
          dst="${RUNNER_TEMP}/android-signing-tools-36.0.0"
          mkdir -p "${dst}/lib" "${dst}/lib64"
          cp "${src}/apksigner" "${dst}/apksigner"
          cp "${src}/lib/apksigner.jar" "${dst}/lib/apksigner.jar"
          cp "${src}/zipalign" "${dst}/zipalign"
          if [ -f "${src}/lib64/libc++.so" ]; then cp "${src}/lib64/libc++.so" "${dst}/lib64/libc++.so"; fi
          chmod +x "${dst}/apksigner" "${dst}/zipalign"

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36.0.0
          path: ${{ runner.temp }}/android-signing-tools-36.0.0/
          if-no-files-found: error
          retention-days: 1
