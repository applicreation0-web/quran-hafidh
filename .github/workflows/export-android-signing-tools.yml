name: Export Android signing tools

on:
  push:
    branches:
      - tooling/hifz-local-signing-tools

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Build Tools 36.0.0
        run: sdkmanager "build-tools;36.0.0"
      - name: Stage signing tools
        run: |
          set -euo pipefail
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt2" signing-tools/
          sha256sum signing-tools/lib/apksigner.jar signing-tools/zipalign signing-tools/aapt2 > signing-tools/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-36.0.0
          path: signing-tools
          if-no-files-found: error
          retention-days: 1
