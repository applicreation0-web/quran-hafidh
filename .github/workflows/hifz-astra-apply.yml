name: Quran Hifz Astra source patch

on:
  push:
    branches:
      - work/hifz-0.7.3-astra-fix-all
    paths:
      - scripts/apply_hifz_astra_fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact source patches
        run: python3 scripts/apply_hifz_astra_fixes.py
      - name: Commit patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quran-hifz-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(hifz): apply complete Claude audit corrections"
          git push origin HEAD:work/hifz-0.7.3-astra-fix-all
