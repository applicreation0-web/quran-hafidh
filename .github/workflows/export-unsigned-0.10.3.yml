name: Export unsigned Quran Safeguard 0.10.3

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.event.head_commit.message == 'Prepare local signing artifact for Quran Safeguard 0.10.3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up Python audit parser
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Re-audit and build exact 0.10.3 sources
        run: |
          set -euo pipefail
          gradle --no-daemon :app:verifyReleaseAudit :app:testLightDebugUnitTest
          python3 scripts/verify_0103_update.py
          python3 scripts/audit_hikam_translation_against_islamicpearls.py
          gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease
          python3 scripts/verify_light_apk_no_tafsir.py \
            app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_plus_apk_tafsir.py \
            app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk

      - name: Prepare temporary signing input
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/qsg-signing-input/apks"
          mkdir -p "${RUNNER_TEMP}/qsg-signing-input/android-build-tools"
          cp app/build/outputs/apk/light/release/app-light-release-unsigned.apk \
            "${RUNNER_TEMP}/qsg-signing-input/apks/"
          cp app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk \
            "${RUNNER_TEMP}/qsg-signing-input/apks/"
          cp -a "${ANDROID_HOME}/build-tools/36.0.0/." \
            "${RUNNER_TEMP}/qsg-signing-input/android-build-tools/"
          printf '%s\n' "${GITHUB_SHA}" > "${RUNNER_TEMP}/qsg-signing-input/source-commit.txt"

      - name: Upload temporary signing input
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-0.10.3-local-signing-input
          path: ${{ runner.temp }}/qsg-signing-input/
          if-no-files-found: error
          retention-days: 1
