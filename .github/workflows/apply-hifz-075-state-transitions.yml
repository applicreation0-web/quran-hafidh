name: Apply Hifz 0.7.5 state transitions

on:
  push:
    branches: [ "work/hifz-0.7.5-retention-j10" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staged parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "01d47865dcefa15a76cddc5e4148577d72f8f090"
          test "$(git branch --show-current)" = "work/hifz-0.7.5-retention-j10"

      - name: Apply minimal product GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_hifz_075_state_transitions.py
          grep -q 'public enum ProgressState' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          grep -q 'transitionV6Lines' hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java
          grep -q 'HifzV6StateTransitionsInstrumentedTest' .github/workflows/hifz-075-tdd.yml

      - name: Commit product patch and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-hifz-075-state-transitions.yml
          rm scripts/apply_hifz_075_state_transitions.py
          git config user.name "applicreation0-web"
          git config user.email "applicreation0@gmail.com"
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzPrefs.java .github/workflows/hifz-075-tdd.yml .github/workflows/apply-hifz-075-state-transitions.yml scripts/apply_hifz_075_state_transitions.py
          git diff --cached --check
          git commit -m "feat: enforce schema6 progression transitions"
          git push origin HEAD:work/hifz-0.7.5-retention-j10
