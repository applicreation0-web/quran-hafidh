name: Apply evening Murajaah wiring

on:
  push:
    branches:
      - feature/hifz-evening-murajaah-0.7

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact bounded wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  print(f'{path}: already patched')
                  return
              assert count == 1, f'{path}: expected one match, found {count}'
              p.write_text(text.replace(old, new, 1))
              print(f'{path}: patched')

          # Runtime: one pass through current recent Sabqi, capped at 30 min.
          path = 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java'
          old = '''    private void renderRecentMurajaah() {
              List<HifzPrefs.RecentSabqi> recent=prefs.recentSabqi();
              long elapsed=clock.elapsedMs();
              if(recent.isEmpty() || elapsed>=PreviewConfig.MURAJAAH_RECENT_SABQI_MINUTES_WORKING*60_000L){
                  transitionToBlockB(elapsed);return;
              }
              int reviewIndex=(recentLinesDone/PreviewConfig.SABQI_LINES)%recent.size();
'''
          new = '''    private void renderRecentMurajaah() {
              List<HifzPrefs.RecentSabqi> recent=prefs.recentSabqi();
              long elapsed=clock.elapsedMs();
              int totalRecentLines=recentLineCount(recent);
              if(recent.isEmpty() || PreviewConfig.recentMurajaahComplete(recentLinesDone,totalRecentLines,elapsed)){
                  transitionToBlockB(elapsed);return;
              }
              int reviewIndex=(recentLinesDone/PreviewConfig.SABQI_LINES)%recent.size();
'''
          replace_once(path, old, new)

          old = '''    private void reviewRecent(boolean difficult) {
              if (!takeRepLock()) return;
              if (prefs.recentSabqi().isEmpty()) { transitionToBlockB(clock.elapsedMs()); return; }
              recentLinesDone+=PreviewConfig.SABQI_LINES;
              long elapsed=clock.elapsedMs();
              prefs.setMurajaahRuntime("A",null,recentLinesDone,elapsed,0L);
              if (elapsed>=PreviewConfig.MURAJAAH_RECENT_SABQI_MINUTES_WORKING*60_000L) transitionToBlockB(elapsed);
              else renderMode();
          }

          private void transitionToBlockB(long elapsed) {
'''
          new = '''    private void reviewRecent(boolean difficult) {
              if (!takeRepLock()) return;
              List<HifzPrefs.RecentSabqi> recent=prefs.recentSabqi();
              if (recent.isEmpty()) { transitionToBlockB(clock.elapsedMs()); return; }
              recentLinesDone+=PreviewConfig.SABQI_LINES;
              long elapsed=clock.elapsedMs();
              prefs.setMurajaahRuntime("A",null,recentLinesDone,elapsed,0L);
              if (PreviewConfig.recentMurajaahComplete(recentLinesDone,recentLineCount(recent),elapsed)) transitionToBlockB(elapsed);
              else renderMode();
          }

          private int recentLineCount(List<HifzPrefs.RecentSabqi> recent) {
              int total=0;
              for(HifzPrefs.RecentSabqi item:recent) total+=Math.max(0,item.endLine-item.startLine+1);
              return total;
          }

          private void transitionToBlockB(long elapsed) {
'''
          replace_once(path, old, new)

          # Home: Tue/Thu primary remains Itqan; after validation the Today card opens evening Murajaah.
          path = 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java'
          old = '''    private void openToday() {
              LocalDate date = LocalDate.now();
              ScheduledSession scheduled = HifzSchedule.INSTANCE.scheduled(date, prefs.programStartDate(), date);
              if (scheduled == null) return;
              switch (scheduled.getType()) {
'''
          new = '''    private void openToday() {
              LocalDate date = LocalDate.now();
              ScheduledSession scheduled = HifzSchedule.INSTANCE.scheduled(date, prefs.programStartDate(), date);
              if (scheduled == null) return;
              String todayKey = date.toString();
              boolean eveningMurajaah = HifzSchedule.INSTANCE.hasEveningMurajaah(date.getDayOfWeek());
              if (eveningMurajaah && todayKey.equals(prefs.lastItqanDate()) && !todayKey.equals(prefs.lastMurajaahDate())) {
                  openMode(HifzSessionActivity.MURAJAAH);
                  return;
              }
              switch (scheduled.getType()) {
'''
          replace_once(path, old, new)

          old = '''        String detail;
          try {
              SessionType kind = scheduled.getType();
'''
          new = '''        String detail;
          try {
              String todayKey = date.toString();
              boolean eveningMurajaah = HifzSchedule.INSTANCE.hasEveningMurajaah(date.getDayOfWeek());
              if (eveningMurajaah && todayKey.equals(prefs.lastItqanDate())) {
                  detail = todayKey.equals(prefs.lastMurajaahDate())
                      ? "Itqān ✓ · Murājaʿah ✓"
                      : "Soir · Murājaʿah · Bloc " + prefs.murajaahPhase();
                  today.setText(detail);
                  todayAction.setEnabled(true);
                  return;
              }
              SessionType kind = scheduled.getType();
'''
          replace_once(path, old, new)

          # Dashboard: add Tue/Thu evening projection using the same global Murajaah cursor.
          path = 'hifz-app/src/main/java/com/quransafeguard/hifz/preview/WeeklyDashboardPlanner.java'
          old = '''    private final HifzPrefs prefs;
              private final GeometryRepository geometry;
              private final DashboardLedger ledger;
'''
          new = '''    private static final class MurajaahProjection {
              final String recent;
              final String old;
              final VerseRef nextCursor;
              MurajaahProjection(String recent,String old,VerseRef nextCursor){
                  this.recent=recent;this.old=old;this.nextCursor=nextCursor;
              }
          }

              private final HifzPrefs prefs;
              private final GeometryRepository geometry;
              private final DashboardLedger ledger;
'''
          replace_once(path, old, new)

          old = '''            String type=modeFor(scheduled.getType());
              DashboardLedger.Record actual=ledger.find(date,type);
              if(actual!=null){
                  out.add(new Row(date,day(date),"✓ "+compact(actual.label),eveningForActual(type,actual.label),"Validée"));
                  continue;
              }
              if(date.isBefore(today)){
                  String state=date.isBefore(ledger.started())?"Historique pré-0.7 non enregistré":"Non validée";
                  out.add(new Row(date,day(date),"—","—",state));
                  continue;
              }
'''
          new = '''            String type=modeFor(scheduled.getType());
              boolean hasEveningMurajaah=HifzSchedule.INSTANCE.hasEveningMurajaah(date.getDayOfWeek());
              DashboardLedger.Record actual=ledger.find(date,type);
              DashboardLedger.Record eveningActual=hasEveningMurajaah?ledger.find(date,HifzSessionActivity.MURAJAAH):null;
              if(actual!=null && !hasEveningMurajaah){
                  out.add(new Row(date,day(date),"✓ "+compact(actual.label),eveningForActual(type,actual.label),"Validée"));
                  continue;
              }
              if(date.isBefore(today)){
                  if(hasEveningMurajaah){
                      String morning=actual==null?"—":"✓ "+compact(actual.label);
                      String evening=eveningActual==null?"—":"✓ "+compact(eveningActual.label);
                      String state=actual!=null&&eveningActual!=null?"Validées":"Non validée";
                      out.add(new Row(date,day(date),morning,evening,state));
                  }else{
                      String state=date.isBefore(ledger.started())?"Historique pré-0.7 non enregistré":"Non validée";
                      out.add(new Row(date,day(date),"—","—",state));
                  }
                  continue;
              }
'''
          replace_once(path, old, new)

          old = '''            }else if(scheduled.getType()==SessionType.ITQAN){
                  if(!corpus.contains(itqanCursor)){out.add(new Row(date,day(date),"Itqān · curseur hors corpus","—","À vérifier"));continue;}
                  GeometryRepository.VerseUnit unit;
                  int rep=date.equals(today)?prefs.itqanRep():0;
                  VerseRef savedStart=date.equals(today)?prefs.itqanUnitStart():null,savedEnd=date.equals(today)?prefs.itqanUnitEnd():null;
                  if(rep>0&&savedStart!=null&&savedEnd!=null){
                      unit=new GeometryRepository.VerseUnit(geometry.pageForVerse(savedStart),savedStart,savedEnd,
                          geometry.versesForRange(savedStart,savedEnd),geometry.lineIdsForVerseRange(savedStart,savedEnd));
                  }else unit=geometry.eligiblePageUnit(itqanCursor,corpus);
                  String state=rep>=PreviewConfig.ITQAN_TOTAL_REPS?"✓ À valider":rep>0?"En cours "+(rep+1)+"/"+PreviewConfig.ITQAN_TOTAL_REPS:"À faire";
                  out.add(new Row(date,day(date),"Itqān ×"+PreviewConfig.ITQAN_TOTAL_REPS+" · "+range(unit.start,unit.end),"—",state));
                  itqanCursor=corpus.next(unit.end);
              }else{
                  String recentRange=recentRange(projectedRecent);
                  int recentLines=recentLineCount(projectedRecent);
                  double secondsA=Math.min(PreviewConfig.MURAJAAH_RECENT_SABQI_MINUTES_WORKING*60.0,
                      recentLines*prefs.recentSecondsPerLine());
                  double availableBSeconds=PreviewConfig.MURAJAAH_ITQAN_MINUTES_WORKING*60.0+
                      Math.max(0.0,PreviewConfig.MURAJAAH_RECENT_SABQI_MINUTES_WORKING*60.0-secondsA);
                  int lines=(int)Math.floor(availableBSeconds/prefs.murajaahSecondsPerLine());lines=Math.max(1,lines);
                  String old;
                  if(corpus.contains(murajaahCursor)){
                      GeometryRepository.EligibleLinePlan plan=geometry.planEligibleLines(murajaahCursor,lines,corpus);
                      old=range(plan.start,plan.actualPlannedEnd)+" · ~"+Math.round(availableBSeconds/60.0)+" min";
                      murajaahCursor=corpus.next(plan.actualPlannedEnd);
                  }else old="curseur à repositionner";
                  String morning="Murājaʿah A · "+(recentRange.isEmpty()?"aucun Sabqi récent":recentRange);
                  String evening="Murājaʿah B · "+old;
                  String state=date.equals(today)?("B".equals(prefs.murajaahPhase())?"En cours · Bloc B":"En cours · Bloc A"):"À faire";
                  out.add(new Row(date,day(date),morning,evening,state));
              }
'''
          new = '''            }else if(scheduled.getType()==SessionType.ITQAN){
                  String morning;
                  String state;
                  if(actual!=null){
                      morning="✓ "+compact(actual.label);
                      state=eveningActual!=null?"Validées":"Soir à faire";
                  }else{
                      if(!corpus.contains(itqanCursor)){out.add(new Row(date,day(date),"Itqān · curseur hors corpus","—","À vérifier"));continue;}
                      GeometryRepository.VerseUnit unit;
                      int rep=date.equals(today)?prefs.itqanRep():0;
                      VerseRef savedStart=date.equals(today)?prefs.itqanUnitStart():null,savedEnd=date.equals(today)?prefs.itqanUnitEnd():null;
                      if(rep>0&&savedStart!=null&&savedEnd!=null){
                          unit=new GeometryRepository.VerseUnit(geometry.pageForVerse(savedStart),savedStart,savedEnd,
                              geometry.versesForRange(savedStart,savedEnd),geometry.lineIdsForVerseRange(savedStart,savedEnd));
                      }else unit=geometry.eligiblePageUnit(itqanCursor,corpus);
                      state=rep>=PreviewConfig.ITQAN_TOTAL_REPS?"✓ À valider":rep>0?"En cours "+(rep+1)+"/"+PreviewConfig.ITQAN_TOTAL_REPS:"À faire";
                      morning="Itqān ×"+PreviewConfig.ITQAN_TOTAL_REPS+" · "+range(unit.start,unit.end);
                      itqanCursor=corpus.next(unit.end);
                  }
                  String evening="—";
                  if(hasEveningMurajaah){
                      if(eveningActual!=null){
                          evening="✓ "+compact(eveningActual.label);
                      }else{
                          MurajaahProjection projection=projectMurajaah(projectedRecent,murajaahCursor,corpus);
                          evening="Murājaʿah · "+projection.recent+" · "+projection.old;
                          murajaahCursor=projection.nextCursor;
                      }
                  }
                  out.add(new Row(date,day(date),morning,evening,state));
              }else{
                  MurajaahProjection projection=projectMurajaah(projectedRecent,murajaahCursor,corpus);
                  murajaahCursor=projection.nextCursor;
                  String morning="Murājaʿah A · "+projection.recent;
                  String evening="Murājaʿah B · "+projection.old;
                  String state=date.equals(today)?("B".equals(prefs.murajaahPhase())?"En cours · Bloc B":"En cours · Bloc A"):"À faire";
                  out.add(new Row(date,day(date),morning,evening,state));
              }
'''
          replace_once(path, old, new)

          old = '''    private int currentSabqiCursor(){
'''
          new = '''    private MurajaahProjection projectMurajaah(List<HifzPrefs.RecentSabqi> recent,VerseRef cursor,EligibleCorpus corpus){
              String recentRange=recentRange(recent);
              int recentLines=recentLineCount(recent);
              double secondsA=Math.min(PreviewConfig.MURAJAAH_RECENT_SABQI_MINUTES_WORKING*60.0,
                  recentLines*prefs.recentSecondsPerLine());
              double availableBSeconds=PreviewConfig.MURAJAAH_ITQAN_MINUTES_WORKING*60.0+
                  Math.max(0.0,PreviewConfig.MURAJAAH_RECENT_SABQI_MINUTES_WORKING*60.0-secondsA);
              int lines=(int)Math.floor(availableBSeconds/prefs.murajaahSecondsPerLine());lines=Math.max(1,lines);
              String old;
              VerseRef next=cursor;
              if(corpus.contains(cursor)){
                  GeometryRepository.EligibleLinePlan plan=geometry.planEligibleLines(cursor,lines,corpus);
                  old=range(plan.start,plan.actualPlannedEnd)+" · ~"+Math.round(availableBSeconds/60.0)+" min";
                  next=corpus.next(plan.actualPlannedEnd);
              }else old="curseur à repositionner";
              String recentLabel=recentRange.isEmpty()?"aucun Sabqi récent":recentRange+" · ~"+Math.round(secondsA/60.0)+" min";
              return new MurajaahProjection(recentLabel,old,next);
          }

              private int currentSabqiCursor(){
'''
          replace_once(path, old, new)

          # Wiring assertions: fail loudly if any intended path is absent.
          session=Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java').read_text()
          main=Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java').read_text()
          planner=Path('hifz-app/src/main/java/com/quransafeguard/hifz/preview/WeeklyDashboardPlanner.java').read_text()
          assert session.count('recentMurajaahComplete') >= 2
          assert main.count('hasEveningMurajaah') >= 2
          assert planner.count('hasEveningMurajaah') >= 1
          PY
      - name: Commit bounded wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hifz-app/src/main/java/com/quransafeguard/hifz/preview/HifzSessionActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/MainActivity.java \
                  hifz-app/src/main/java/com/quransafeguard/hifz/preview/WeeklyDashboardPlanner.java
          git commit -m "feat: wire Tue Thu evening Murajaah rotation"
          git push origin HEAD:feature/hifz-evening-murajaah-0.7
