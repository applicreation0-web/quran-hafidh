name: Haafidh 1.17.12 FINAL historical APKv2 signature — exact offline candidate metadata only
on:
  push:
    branches: [signing/haafidh-11712-official-20261106]
    paths:
      - 'signing-input/signed_data_11712_final.b64'
      - '.github/workflows/haafidh-11712-official-v2-metadata-only-sign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-signed-data-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Historical official keystore signs ONLY the exact verified APKv2 SignedData, never APK/assets
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${HIFZ_KEYSTORE_BASE64:-}"
          test -n "${HIFZ_KEYSTORE_PASSWORD:-}"
          test -n "${HIFZ_KEY_ALIAS:-}"
          test -n "${HIFZ_KEY_PASSWORD:-}"
          cat > "$RUNNER_TEMP/Sign11712Official.java" <<'JAVA'
          import java.security.*;
          import java.security.cert.Certificate;
          import java.nio.file.*;
          import java.util.*;
          public final class Sign11712Official {
            static String sha(byte[] data) throws Exception {
              byte[] hash=MessageDigest.getInstance("SHA-256").digest(data);
              StringBuilder out=new StringBuilder();
              for(byte b:hash)out.append(String.format("%02x",b&0xff));
              return out.toString();
            }
            public static void main(String[] a) throws Exception {
              final String expectedCert="66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14";
              final String expectedData="637764d5cf72b31373a4a032e31319862a61d1c9a90740beba1b2e0bac314672";
              byte[] signedData=Base64.getMimeDecoder().decode(Files.readString(Path.of("signing-input/signed_data_11712_final.b64")));
              if(signedData.length!=1449 || !sha(signedData).equals(expectedData))
                throw new SecurityException("Refuse any SignedData other than the audited offline private 1.17.12 candidate digest");
              Path temp=Path.of(a[0],"haafidh-official-11712.jks");
              try {
                Files.write(temp,Base64.getMimeDecoder().decode(System.getenv("HIFZ_KEYSTORE_BASE64")));
                KeyStore store=KeyStore.getInstance(temp.toFile(),System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
                String alias=System.getenv("HIFZ_KEY_ALIAS");
                Certificate cert=store.getCertificate(alias);
                if(cert==null || !sha(cert.getEncoded()).equals(expectedCert))
                  throw new SecurityException("Historical signer certificate mismatch");
                Signature sig=Signature.getInstance("SHA256withRSA");
                sig.initSign((PrivateKey)store.getKey(alias,System.getenv("HIFZ_KEY_PASSWORD").toCharArray()));
                sig.update(signedData);
                byte[] signature=sig.sign();
                if(signature.length!=512)throw new SecurityException("Unexpected RSA-4096 signature length");
                Signature verifier=Signature.getInstance("SHA256withRSA");
                verifier.initVerify(cert);verifier.update(signedData);
                if(!verifier.verify(signature))throw new SecurityException("Self-verification failure");
                Files.writeString(Path.of(a[0],"signature_11712_final.b64"),Base64.getEncoder().encodeToString(signature)+"\n");
                Files.writeString(Path.of(a[0],"attestation.txt"),
                  "CERT_OK="+expectedCert+"\nSIGNED_DATA_SHA256="+sha(signedData)+"\nSIGNATURE_SHA256="+sha(signature)+"\n");
                System.out.println("CERT_OK="+expectedCert);
                System.out.println("SIGNED_DATA_SHA256="+sha(signedData));
                System.out.println("SIGNATURE_SHA256="+sha(signature));
                System.out.println("PASS official v2 signature only; NO APK/private assets uploaded.");
              } finally {
                Files.deleteIfExists(temp);
              }
            }
          }
          JAVA
          java "$RUNNER_TEMP/Sign11712Official.java" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: haafidh-11712-FINAL-OFFICIAL-V2-SIGNATURE-ONLY-NO-APK
          path: |
            ${{ runner.temp }}/signature_11712_final.b64
            ${{ runner.temp }}/attestation.txt
          if-no-files-found: error
          retention-days: 2
