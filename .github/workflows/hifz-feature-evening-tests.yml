name: Hifz evening Murajaah feature tests

on:
  push:
    branches:
      - feature/hifz-evening-murajaah-0.7

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Run Hifz unit tests
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest --stacktrace
