name: Quran Haafidh 1.17.18 private offline source gate — NO APK
on:
  push:
    branches:
      - release-candidate/haafidh-11718-private-offline-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify private signer fail-closed guard without any key or private source
        run: |
          python3 -m unittest -v scripts/test_build_11718_private_offline.py
          python3 scripts/test_build_11717_private_offline.py
      - name: Install Android SDK and Gradle
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Exact Android candidate version and private package identity
        run: |
          grep -q 'applicationId = "com.quransafeguard.hifz"' hifz-app/build.gradle.kts
          grep -q 'versionCode = 56' hifz-app/build.gradle.kts
          grep -q 'versionName = "1.17.18"' hifz-app/build.gradle.kts
      - name: Hifz engine, UI, backup and corpus source regressions
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest --stacktrace
      - name: Compile production private-flag Java ONLY, forbid APK
        env:
          AYAH_THEMES_PRIVATE_114: '1'
          HIFZ_PRIVATE_RELEASE_UPGRADE: '1'
        run: |
          gradle --no-daemon -I scripts/no_apk.init.gradle :hifz-app:compileReleaseJavaWithJavac --stacktrace
          test -z "$(find hifz-app -name '*.apk' -print)"
