name: Quran Hifz signed release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hifz-release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Decode release keystore
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HIFZ_KEYSTORE_BASE64"
          echo "$HIFZ_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hifz-release.jks"
          test -s "$RUNNER_TEMP/hifz-release.jks"

      - name: Run Quran Hifz JVM tests (core + app)
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest --stacktrace

      - name: Run Quran Hifz source contracts
        run: gradle --no-daemon :hifz-app:sourceContractTest --stacktrace

      - name: Assemble signed release APK
        env:
          HIFZ_KEYSTORE_PATH: ${{ runner.temp }}/hifz-release.jks
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        run: gradle --no-daemon :hifz-app:assembleRelease --stacktrace

      - name: Locate and verify release APK is actually signed
        id: apk
        run: |
          set -euo pipefail
          apk="$(find hifz-app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-hifz-release-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish signed release APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="hifz-release-${{ github.sha }}"
          gh release create "$tag" "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --title "Quran Hifz release APK ($tag)" \
            --notes "Signed release build for personal installation on the ${{ github.ref_name }} branch. Same signing key as future releases: keep it to allow in-place upgrades."

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quran-hifz-release-test-results-${{ github.sha }}
          path: |
            hifz-core/build/test-results/
            hifz-core/build/reports/tests/
            hifz-app/build/test-results/
            hifz-app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
