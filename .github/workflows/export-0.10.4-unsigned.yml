name: Export audited unsigned Quran Safeguard 0.10.4

on:
  push:
    branches:
      - build/0.10.4-unsigned-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare 0.10.4 Android version metadata
        run: python3 scripts/prepare_0104_version.py

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up Python corpus tools
        run: python3 -m pip install --disable-pip-version-check pymupdf==1.26.7 beautifulsoup4

      - name: Fetch pinned private tafsir sources
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/tafsir-src"
          mkdir -p "${src}"
          curl --fail --location --retry 3 -o "${src}/lataif.pdf" "https://www.altafsir.com/Books/lataif.pdf"
          base="https://archive.org/download/tafsir-al-qurtubi-4.-Volumes/Tafseer%20Al-Qurtubi"
          for n in 1 2 3 4; do
            curl --fail --location --retry 3 -o "${src}/qurtubi-v${n}.pdf" "${base}/Tafsir%20al-Qurtubi%20Vol.%20${n}.pdf"
          done
          python3 scripts/prepare_multitafsir_assets.py --source-dir "${src}" --assets-dir app/src/plus/assets/tafsir --work-dir "${RUNNER_TEMP}/tafsir-work"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Full 0.10.4 audit, tests and release build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_0104_hikam_freeze.py
          python3 scripts/verify_hikam_translation_separation.py
          python3 scripts/audit_hikam_translation_against_islamicpearls.py
          python3 scripts/verify_0104_update.py
          python3 scripts/verify_0104_taddabur.py
          gradle --no-daemon :app:verifyReleaseAudit :app:testLightDebugUnitTest :app:testPlusDebugUnitTest
          gradle --no-daemon :app:assembleLightRelease :app:assemblePlusRelease
          python3 scripts/verify_light_apk_no_tafsir.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_light_apk_no_taddabur.py app/build/outputs/apk/light/release/app-light-release-unsigned.apk
          python3 scripts/verify_plus_apk_multitafsir.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk
          python3 scripts/verify_plus_apk_taddabur.py app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk

      - name: Stage unsigned APK export
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/quran-safeguard-0.10.4-unsigned"
          mkdir -p "${out}"
          cp app/build/outputs/apk/light/release/app-light-release-unsigned.apk "${out}/Quran-Safeguard-0.10.4-Light-unsigned.apk"
          cp app/build/outputs/apk/plus/release/app-plus-release-unsigned.apk "${out}/Quran-Safeguard-Plus-0.10.4-unsigned.apk"
          sha256sum "${out}"/*.apk > "${out}/SHA256SUMS.txt"

      - name: Upload audited unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: quran-safeguard-0.10.4-audited-unsigned
          path: ${{ runner.temp }}/quran-safeguard-0.10.4-unsigned/
          if-no-files-found: error
          retention-days: 7
