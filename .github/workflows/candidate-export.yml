name: Temporary candidate export

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  export:
    if: github.head_ref == 'codex/0.10.1-cumulative-presence-stress'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Medina Mushaf pages
        run: bash scripts/fetch_mushaf_pages.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build audited unsigned release
        run: gradle --no-daemon :app:assembleRelease

      - name: Export candidate as temporary unreferenced blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          parts_dir="$(mktemp -d)"
          split -b 2M -d -a 3 "$apk" "$parts_dir/chunk-"
          echo "APK_META $(stat -c %s "$apk") $(sha256sum "$apk" | cut -d' ' -f1)"
          for part in "$parts_dir"/chunk-*; do
            payload="$parts_dir/payload.json"
            PART_PATH="$part" python3 - <<'PY' > "$payload"
          import base64
          import json
          import os

          path = os.environ["PART_PATH"]
          with open(path, "rb") as handle:
              content = base64.b64encode(handle.read()).decode("ascii")
          print(json.dumps({"content": content, "encoding": "base64"}))
          PY
            response="$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/blobs" --input "$payload")"
            blob_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' \
              <<< "$response")"
            echo "APK_CHUNK $(basename "$part") $(stat -c %s "$part") $(sha256sum "$part" | cut -d' ' -f1) $blob_sha"
          done
