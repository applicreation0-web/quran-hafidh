name: Quran Hifz 0.7.5 Claude fix verification

on:
  push:
    branches:
      - work/hifz-0.7.5-claude-no-go-fixes
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  targeted-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore immutable Hifz 0.7.4 release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline074
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            https://api.github.com/repos/applicreation0-web/quran-unlock-android/releases/assets/564818126 \
            -o baseline074/hifz074.apk
          echo 'c0007102e2e2f8ef69f303f141d148b416ae5f312a354f3f0a23fc2a70995ccc  baseline074/hifz074.apk' | sha256sum -c -
          rm -rf baseline074/extracted && mkdir -p baseline074/extracted
          unzip -q baseline074/hifz074.apk 'assets/mushaf/*' 'assets/reader109/geometry.json' 'assets/tafsir/*' -d baseline074/extracted
          rm -rf app/src/main/assets/mushaf app/src/main/assets/reader109
          mkdir -p app/src/main/assets app/src/main/assets/reader109
          cp -a baseline074/extracted/assets/mushaf app/src/main/assets/
          cp baseline074/extracted/assets/reader109/geometry.json app/src/main/assets/reader109/geometry.json
          rm -rf hifz-app/build/generated/hifzTafsir
          mkdir -p hifz-app/build/generated/hifzTafsir
          cp -a baseline074/extracted/assets/tafsir/. hifz-app/build/generated/hifzTafsir/
          test "$(find app/src/main/assets/mushaf/hafs/kfqc/svg-br -maxdepth 1 -name '[0-9][0-9][0-9].svg.br' | wc -l | tr -d ' ')" = 604
          test -s app/src/main/assets/reader109/geometry.json
          test -n "$(find hifz-app/build/generated/hifzTafsir -maxdepth 1 -type f -print -quit)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run targeted JVM and source-contract regressions
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :hifz-app:testDebugUnitTest \
            :hifz-app:sourceContractTest \
            -x :hifz-app:prepareHifzTafsirRelease \
            --continue \
            --stacktrace

      - name: Record targeted test counts
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for label, pattern in [
              ('BEHAVIOR_JVM','hifz-app/build/test-results/testDebugUnitTest/**/*.xml'),
              ('SOURCE_CONTRACT','hifz-app/build/test-results/sourceContractTest/**/*.xml'),
          ]:
              t=f=e=s=0
              for file in glob.glob(pattern, recursive=True):
                  root=ET.parse(file).getroot()
                  t+=int(root.attrib.get('tests',0)); f+=int(root.attrib.get('failures',0)); e+=int(root.attrib.get('errors',0)); s+=int(root.attrib.get('skipped',0))
              print(f'{label} tests={t} failures={f} errors={e} skipped={s}')
          PY

  targeted-instrumented:
    needs: targeted-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore immutable Hifz 0.7.4 release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline074
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            https://api.github.com/repos/applicreation0-web/quran-unlock-android/releases/assets/564818126 \
            -o baseline074/hifz074.apk
          echo 'c0007102e2e2f8ef69f303f141d148b416ae5f312a354f3f0a23fc2a70995ccc  baseline074/hifz074.apk' | sha256sum -c -
          rm -rf baseline074/extracted && mkdir -p baseline074/extracted
          unzip -q baseline074/hifz074.apk 'assets/mushaf/*' 'assets/reader109/geometry.json' 'assets/tafsir/*' -d baseline074/extracted
          rm -rf app/src/main/assets/mushaf app/src/main/assets/reader109
          mkdir -p app/src/main/assets app/src/main/assets/reader109
          cp -a baseline074/extracted/assets/mushaf app/src/main/assets/
          cp baseline074/extracted/assets/reader109/geometry.json app/src/main/assets/reader109/geometry.json
          rm -rf hifz-app/build/generated/hifzTafsir
          mkdir -p hifz-app/build/generated/hifzTafsir
          cp -a baseline074/extracted/assets/tafsir/. hifz-app/build/generated/hifzTafsir/
          test -n "$(find hifz-app/build/generated/hifzTafsir -maxdepth 1 -type f -print -quit)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Claude NO-GO device regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            gradle --no-daemon :hifz-app:connectedDebugAndroidTest
            -x :hifz-app:prepareHifzTafsirRelease
            -Pandroid.testInstrumentationRunnerArguments.class=com.quransafeguard.hifz.preview.ClaudeNoGoRegressionInstrumentedTest
            --stacktrace
