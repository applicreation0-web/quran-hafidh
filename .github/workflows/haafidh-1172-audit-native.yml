name: Haafidh 1.17.2 audit - no publication
on:
  workflow_dispatch:
  push:
    branches: [work/haafidh-1171-atlas-only-pre20-mask]
    paths:
      - '.github/workflows/haafidh-1172-audit-native.yml'
      - 'hifz-app/src/**'
      - 'hifz-app/build.gradle.kts' # native regression must re-run for a candidate version change
      - 'scripts/verify_backup_schema_import_delta.py'
permissions:
  contents: read
concurrency:
  group: haafidh-1172-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: '' # SDK manager 'tools' is retired; mirror passing Atlas-only CI
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: SDK and immutable QCF
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          bash scripts/fetch_mushaf_pages.sh
      - name: JVM and source contracts
        run: gradle --no-daemon :hifz-core:test :hifz-app:testDebugUnitTest :hifz-app:sourceContractTest
      - name: Enable KVM for isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual WebView and backup stores
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis # avoid corrupted default x86_64 system-image mirror observed in audit run
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon :hifz-app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.quransafeguard.hifz.preview.BackupSchemaRejectedInstrumentedTest,com.quransafeguard.hifz.preview.MushafPendingCommandsInstrumentedTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-1172-test-evidence
          path: |
            hifz-core/build/test-results/
            hifz-app/build/test-results/
            hifz-app/build/outputs/androidTest-results/
            hifz-app/build/reports/
          retention-days: 14
