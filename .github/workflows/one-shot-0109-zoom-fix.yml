name: One-shot 0.10.9 native zoom gesture fix

on:
  push:
    branches: [release/0.10.9-work]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.10.9-work
          fetch-depth: 0
      - name: Patch native zoom truth into reader gesture gate
        shell: python
        run: |
          from pathlib import Path
          def once(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f"{path}: expected exactly 1 match, got {n}")
              p.write_text(s.replace(old,new,1))

          once(
            "app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt",
            "WebView(context).apply {\n                            web = this",
            '''object : WebView(context) {\n                            override fun onScaleChanged(oldScale: Float, newScale: Float) {\n                                super.onScaleChanged(oldScale, newScale)\n                                val zoomed = kotlin.math.abs(newScale - 1f) > 0.03f\n                                post { evaluateJavascript(\"window.nativeZoomChanged && window.nativeZoomChanged($zoomed);\", null) }\n                            }\n                        }.apply {\n                            web = this'''
          )
          once(
            "app/src/main/assets/reader109/reader.js",
            "let pointer=null,multi=false;",
            "let pointer=null,multi=false,nativeZoomed=false;window.nativeZoomChanged=value=>{nativeZoomed=!!value;if(nativeZoomed)pointer=null};"
          )
          once(
            "app/src/main/assets/reader109/reader.js",
            "Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&(state.zoom||1)===1&&occlusion===0",
            "Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&!nativeZoomed&&(state.zoom||1)===1&&occlusion===0"
          )
      - name: Remove one-shot workflow
        run: git rm .github/workflows/one-shot-0109-zoom-fix.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/quranunlock/guard/FreeQuranReaderActivity.kt app/src/main/assets/reader109/reader.js
          git commit -m "Make page swipe honor native WebView pinch zoom [auto-patch-done]"
          git push origin HEAD:release/0.10.9-work
