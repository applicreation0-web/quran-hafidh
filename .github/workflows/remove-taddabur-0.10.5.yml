name: Remove Taddabur from 0.10.5 runtime

on:
  push:
    branches:
      - "release/0.10.5-stability-core"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stability branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Taddabur runtime and stale release hooks
        run: python3 scripts/clean_taddabur_0105.py

      - name: Commit deterministic cleanup if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Taddabur cleanup already applied."
            exit 0
          fi
          git commit -m "Remove Taddabur from 0.10.5 runtime"
          git push origin HEAD:release/0.10.5-stability-core
