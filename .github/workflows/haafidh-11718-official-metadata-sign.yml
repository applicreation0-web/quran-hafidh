name: Haafidh 1.17.18 pinned official APKv2 metadata signer ONLY
on:
  push:
    branches: [release/1.17.18-private-offline-sign]
    paths:
      - .github/workflows/haafidh-11718-official-metadata-sign.yml
      - signing-input/signed_data_11718.b64
permissions:
  contents: read
jobs:
  sign-pinned-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign exactly the approved 1449-byte APKv2 signedData, NEVER the private APK
        env:
          HIFZ_KEYSTORE_BASE64: ${{ secrets.HIFZ_KEYSTORE_BASE64 }}
          HIFZ_KEYSTORE_PASSWORD: ${{ secrets.HIFZ_KEYSTORE_PASSWORD }}
          HIFZ_KEY_ALIAS: ${{ secrets.HIFZ_KEY_ALIAS }}
          HIFZ_KEY_PASSWORD: ${{ secrets.HIFZ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${HIFZ_KEYSTORE_BASE64:-}"
          test -n "${HIFZ_KEYSTORE_PASSWORD:-}"
          test -n "${HIFZ_KEY_ALIAS:-}"
          test -n "${HIFZ_KEY_PASSWORD:-}"
          cat > "$RUNNER_TEMP/SignOfficial11718.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.util.*;
          public final class SignOfficial11718 {
            static String sha(byte[] d) throws Exception {
              byte[] h=MessageDigest.getInstance("SHA-256").digest(d);
              StringBuilder b=new StringBuilder();
              for(byte x:h)b.append(String.format("%02x",x&255));
              return b.toString();
            }
            public static void main(String[] args) throws Exception {
              final String approvedData="74d88db12d3216132bd160d8f18574f2586815c01b9b5eab9175e0d887f109ee";
              final String approvedCert="66adc4f0dcf70d716a8050fd4b0195266307576aa2f9bd54c9cbf2851a330e14";
              byte[] data=Base64.getMimeDecoder().decode(Files.readString(Path.of("signing-input/signed_data_11718.b64")));
              if(data.length!=1449 || !sha(data).equals(approvedData))
                throw new SecurityException("Refusing unapproved digest or length");
              Path key=Path.of(args[0],"haafidh-11718-official.jks");
              try {
                Files.write(key,Base64.getMimeDecoder().decode(System.getenv("HIFZ_KEYSTORE_BASE64")));
                KeyStore ks=KeyStore.getInstance(key.toFile(),System.getenv("HIFZ_KEYSTORE_PASSWORD").toCharArray());
                String alias=System.getenv("HIFZ_KEY_ALIAS");
                Certificate cert=ks.getCertificate(alias);
                if(cert==null || !sha(cert.getEncoded()).equals(approvedCert))
                  throw new SecurityException("Historical official signer certificate mismatch");
                Signature signature=Signature.getInstance("SHA256withRSA");
                signature.initSign((PrivateKey)ks.getKey(alias,System.getenv("HIFZ_KEY_PASSWORD").toCharArray()));
                signature.update(data);
                byte[] signed=signature.sign();
                if(signed.length!=512)throw new SecurityException("Expected RSA4096");
                Signature proof=Signature.getInstance("SHA256withRSA");
                proof.initVerify(cert);proof.update(data);
                if(!proof.verify(signed))throw new SecurityException("Official metadata signature did not self-verify");
                Files.writeString(Path.of(args[0],"signature_11718.b64"),Base64.getEncoder().encodeToString(signed)+"\n");
                Files.writeString(Path.of(args[0],"attestation_11718.txt"),
                  "SIGNED_DATA_SHA256="+approvedData+"\nCERT_SHA256="+approvedCert+"\nSIGNATURE_SHA256="+sha(signed)+"\n");
                System.out.println("PINNED_METADATA_ONLY_OFFICIAL_SIGN_PASS "+approvedData);
              } finally {
                Files.deleteIfExists(key);
              }
            }
          }
          JAVA
          java "$RUNNER_TEMP/SignOfficial11718.java" "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: haafidh-11718-official-v2-metadata-signature-only-no-apk
          path: |
            ${{ runner.temp }}/signature_11718.b64
            ${{ runner.temp }}/attestation_11718.txt
          retention-days: 2
          if-no-files-found: error
