            [[ -n "${name}" ]] || continue
            target="${parts_dir}/${name}"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob_sha}" --jq '.content' \
              | tr -d '\n' \
              | base64 --decode \
              | base64 --decode > "${target}"
            [[ "$(stat -c '%s' "${target}")" == "${size}" ]]
            printf '%s  %s\n' "${expected_sha}" "${target}" | sha256sum --check --status
