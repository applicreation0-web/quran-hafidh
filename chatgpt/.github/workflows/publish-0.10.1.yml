          printf '%s  %s\n' "${APK_SHA256}" "${APK_NAME}" > "${release_dir}/Quran-Safeguard-0.10.1-release-SHA256.txt"

      - name: Publier la release privée
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/quran-safeguard-release"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "La release ${RELEASE_TAG} existe déjà."
            exit 0
          fi

          cat > "${release_dir}/release-notes.md" <<'NOTES'
          ## Quran Safeguard 0.10.1

          Cette mise à jour consolide le fonctionnement quotidien de Safeguard :

          - le seuil de 15 minutes repose sur le temps cumulé passé dans toutes les applications cibles ;
          - le palier de 90 minutes repose sur le même cumul et prime en cas de chevauchement ;
          - le filtre matinal guide la lecture des 20 pages avec navigation par glissement et temporisation fiable ;
          - les limites de Hizb et de Juz suivent les versets réels, même lorsqu'elles commencent ou finissent au milieu d'une page ;
          - la lecture peut se poursuivre librement après l'atteinte du quota ;
          - les Hikam sont affichées seules, sans commentaires ;
          - après un déblocage ou un joker, Safeguard revient immédiatement à l'application cible et conserve son écran lorsque Android le permet ;
          - les transitions, l'ergonomie et les parcours de protection ont été harmonisés.

          ### Vérifications

          - 115 tests unitaires réussis ;
          - audit contradictoire et stress tests réussis ;
          - build release Android validé ;
          - APK signé avec les schémas v2 et v3, un seul signataire RSA 4096 bits ;
          - SHA-256 de l'APK : `43c3d61e96ee23eb2c289266d99ff6dcb2da7898a92c88aa30dc0283b1c3a1f2` ;
          - empreinte SHA-256 du certificat : `6C:70:6F:4E:A4:4E:F6:67:D0:B9:69:8C:07:A3:9E:92:9B:1E:28:6D:23:97:66:55:04:41:1D:ED:B3:74:57:AC`.

          ### Limitation Android connue

          Certaines applications bancaires peuvent refuser de s'ouvrir dès qu'un service d'accessibilité tiers est actif. Safeguard ne compte et ne bloque que les applications cibles configurées, mais ne peut pas contourner la politique de sécurité propre à la banque. Dans ce cas, désactivez temporairement Safeguard ou utilisez l'application bancaire sur un autre appareil.
          NOTES

