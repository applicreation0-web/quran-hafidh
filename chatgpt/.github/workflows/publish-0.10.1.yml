name: Publish Quran Safeguard 0.10.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Release Quran Safeguard 0.10.1')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.10.1
      APK_NAME: Quran-Safeguard-0.10.1-release.apk
      APK_SIZE: "71981397"
      APK_SHA256: 43c3d61e96ee23eb2c289266d99ff6dcb2da7898a92c88aa30dc0283b1c3a1f2
