      - name: Reconstituer et vérifier le paquet signé
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${RUNNER_TEMP}/quran-safeguard-release"
          parts_dir="${release_dir}/parts"
          mkdir -p "${parts_dir}"

